# Local-only overlay for the independently served Ant Design V6 application.
# Production deployments must supply their own HTTPS origin, strong auth key,
# shared runtime dependencies, and Secure cookie configuration.
application:
  mode: dev
  origin: http://localhost:8001
auth:
  sessionEnabled: true
  browserSession:
    enabled: true
    secure: false
    sameSite: lax
    webSocketTicketTTL: 30s
    # V5 can continue to use its compatibility WebSocket credential while both
    # independently deployed frontends are under local migration validation.
    legacyWebSocketQueryTokenEnabled: true
