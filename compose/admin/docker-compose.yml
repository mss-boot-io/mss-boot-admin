name: mss-boot-admin-v6

services:
  frontend:
    image: ${MSS_FRONTEND_V6_IMAGE:-mss-boot-admin-antd-v6:local}
    build:
      context: ../../web/antd-v6
      dockerfile: Dockerfile
    ports:
      - "${MSS_FRONTEND_V6_PORT:-8001}:80"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
