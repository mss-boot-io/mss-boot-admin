server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  etag on;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain text/xml;

  # The local compose profile keeps the browser on the V6 origin while the Go
  # backend runs on the host. Production uses the same /admin/ ingress boundary
  # with an immutable V6 image digest and an environment-owned upstream.
  location /admin/ {
    proxy_pass http://host.docker.internal:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /healthz {
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"status":"ok","application":"mss-boot-admin-antd-v6"}';
  }

  location ~* "\.[0-9a-f]{8,}(?:\.[a-z0-9_-]+)*\.(?:css|js|json|svg|png|jpe?g|gif|webp|woff2?)$" {
    try_files $uri @hashed_asset_not_found;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location @hashed_asset_not_found {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location ~* /(?:service-worker|sw)\.js$ {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location = /release.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}
