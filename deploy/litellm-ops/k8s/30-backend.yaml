apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-ops-admin
  namespace: litellm-ops
  labels: { app: litellm-ops-admin }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: litellm-ops-admin }
  template:
    metadata:
      labels: { app: litellm-ops-admin }
      annotations:
        release.flypool.io/revision: RELEASE_REVISION_REQUIRED
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: registry.invalid/litellm-ops/admin:RELEASE_TAG_REQUIRED
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          env:
            - name: MSS_ADMIN_INITIAL_PASSWORD
              valueFrom: { secretKeyRef: { name: litellm-ops-admin-init, key: password } }
          volumeMounts:
            - { name: config, mountPath: /app/config/application.yml, subPath: application.yml, readOnly: true }
            - { name: db, mountPath: /data }
            - { name: logs, mountPath: /app/logs }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: admin
          image: registry.invalid/litellm-ops/admin:RELEASE_TAG_REQUIRED
          imagePullPolicy: IfNotPresent
          args: ["server"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: LITELLMOPS_LITELLM_BASE_URL
              valueFrom: { secretKeyRef: { name: litellmops-env, key: LITELLMOPS_LITELLM_BASE_URL } }
            - name: LITELLMOPS_LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-masterkey, key: masterkey } }
            - name: LITELLMOPS_BILLS_DSN
              valueFrom: { secretKeyRef: { name: litellmops-env, key: LITELLMOPS_BILLS_DSN } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 1m, memory: 48Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /app/config/application.yml, subPath: application.yml, readOnly: true }
            - { name: db, mountPath: /data }
            - { name: logs, mountPath: /app/logs }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: litellm-ops-admin-config, defaultMode: 0444 }
        - name: db
          persistentVolumeClaim: { claimName: litellm-ops-admin-db }
        - name: logs
          emptyDir: { sizeLimit: 128Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-ops-admin
  namespace: litellm-ops
spec:
  selector: { app: litellm-ops-admin }
  ports:
    - { name: http, port: 8080, targetPort: http }
