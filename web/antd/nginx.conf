server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  etag on;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  # Umi emits content-hashed assets. They can be cached indefinitely while the
  # HTML shell and service worker must always be revalidated after a release.
  location ~* "\.[0-9a-f]{8,}(?:\.[a-z0-9_-]+)*\.(?:css|js|json|map|svg|png|jpe?g|gif|webp|woff2?)$" {
    try_files $uri @hashed_asset_not_found;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location @hashed_asset_not_found {
    expires off;
    add_header Cache-Control "no-store" always;
    return 404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location ~* /(?:service-worker|sw)\.js$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
