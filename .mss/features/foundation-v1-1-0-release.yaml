apiVersion: mss.io/v1alpha1
kind: Feature
metadata:
  name: foundation-v1-1-0-release
  displayName: Develop first, then qualify and publish v1.1.0
  description: >-
    Governs the single public train from the published v1.0.0 baseline to v1.1.0. Internal
    development waves remain untagged; concentrated conformance and publication evidence begin
    only after feature freeze.
  owner: release-engineering
  labels:
    domain: release-governance
    current-stable: v1.0.0
    target-version: v1.1.0
    release-status: development
    strategy: development-first
spec:
  problem: >-
    The earlier roadmap treated v1.0.x and v1.1 prereleases as a sequence of public exits, forcing
    full release evidence into every small implementation slice. That interrupts the Generator,
    Blueprint, and Storage Runtime architecture work and also makes checkpoint acceptance,
    feature-freeze qualification, and publication authority indistinguishable to automation.
  goals:
    - Accumulate small, reviewable implementation waves without publishing v1.0.x or public prerelease tags.
    - Preserve fast changed-scope checks and known security invariants while development continues.
    - Freeze one v1.1.0 candidate commit before running the explicitly selected new-behavior command and manual evidence.
    - Publish Framework and root v1.1.0 only after phase-scoped evidence for the same frozen commit passes.
    - Carry forward accepted stable checkpoints without adversarial replay and keep ObjectStore or RustFS evidence optional and non-blocking.
  nonGoals:
    - Treat an internal checkpoint, branch, Actions artifact, alpha name, or changelog entry as a public release.
    - Run every real-provider matrix, soak, external consumer, artifact, and recovery check on every development commit.
    - Skip focused tests, compilation, contract validation, permission negatives, or known security regression checks while developing.
    - Rewrite .mss/project.yaml or .mss/lock.yaml to resemble the public target version.
    - Publish a breaking reusable Framework API as v1.1.0 merely to preserve the roadmap label.
  actors:
    - id: maintainer
      displayName: Foundation maintainer
      description: Lands coherent development waves and preserves changed-path correctness.
    - id: release-manager
      displayName: Release manager
      description: Selects the feature-freeze commit and controls public component publication.
    - id: security-owner
      displayName: Security owner
      description: Can require an emergency patch policy change when delaying a public fix is unacceptable.
  modules:
    - name: development-train
      kind: infrastructure
      operation: extend
      description: Internal checkpoint sequencing and minimum merge checks.
    - name: release-policy
      kind: infrastructure
      operation: create
      description: Machine-readable public version and component tag policy.
    - name: release-evidence
      kind: infrastructure
      operation: extend
      description: Feature-freeze and publication evidence scoped by phase and exact commit.
  requirements:
    - id: keep-checkpoints-internal
      title: Keep development waves untagged
      description: Internal milestone names identify scope and dependency order but never create a Git tag, GitHub Release, or versioned package.
      priority: must
      actor: release-manager
      module: release-policy
      rules:
        - Public v1.0.1 through v1.0.x versions and public v1.1.0 prerelease tags are rejected by the checked-in policy.
        - The next reviewed public version is v1.1.0 for root, Framework, and any standalone frontend release that is explicitly requested.
        - Publication workflows remain disabled in the checked-in policy throughout feature development; a successful bootstrap readiness run emits only a run-bound checkpoint attestation and is not release authority.
        - Changing the public target for an emergency security patch requires a reviewed release-policy change and cannot be a workflow bypass.
    - id: preserve-development-safety
      title: Keep a small merge-safety floor
      description: Deferring complete release qualification does not permit broken builds or known security and data-integrity regressions in changed code.
      priority: must
      actor: maintainer
      module: development-train
      rules:
        - Each coherent change validates affected FeatureSpecs, compiles the affected component, and runs exact focused tests for the changed behavior.
        - Framework checks use GOWORK=off; concurrent and lifecycle changes use focused race detection.
        - Generator changes retain dry-run, path confinement, stable ordering, unsupported-before-write, and checked-in golden drift checks as soon as the golden fixture exists.
        - Security fixes for Challenge, Kafka marking, upload admission, provider fallback, secret redaction, permissions, and ownership remain permanent regression sentinels.
    - id: freeze-before-qualification
      title: Freeze before complete qualification
      description: Complete release qualification starts only after the v1.1.0 implementation and public contract surface are frozen on one exact commit.
      priority: must
      actor: release-manager
      module: release-evidence
      rules:
        - Feature freeze stops new features and public API, configuration, schema, and generated-contract churn.
        - The manual readiness workflow requires v1.1.0, the checked-out full commit SHA, an explicit feature-freeze confirmation, one declared phase, and an explicit publication-authority decision.
        - A successful run uploads one strict attestation named by its workflow run ID and bound to the schema, target version, full commit, phase, current policy SHA-256, run ID, canonical run URL, and publication-authority boolean.
        - Phase evidence execution, artifact attestation, protected write jobs, and tag rules are completed before selecting the frozen candidate and changing publicationWorkflowsReady to true.
        - publicationWorkflowsReady means the machinery can enforce authority; it is not itself approval to tag or publish.
        - Any implementation change after freeze creates a new candidate commit and invalidates candidate evidence affected by that change.
    - id: qualify-frozen-candidate
      title: Run concentrated validation on the frozen candidate
      description: The frozen commit must pass the scoped v1.1.0 release machinery plus exact Supplier, Generator, Blueprint, and provider-evidence-validator checks, with browser and external rehearsal evidence bound to that commit.
      priority: must
      actor: release-manager
      module: release-evidence
      rules:
        - Required exact tests must have nonzero run and pass evidence and no skip, cached-only, or no-tests-to-run result.
        - The checked-in qualification contract selects only this release Feature; every other Feature has an explicit carry-forward decision and is not replayed as command evidence.
        - Supplier authorization, backend, migration, audit, frontend, and release delivery use only the exact commands declared by the feature-freeze acceptance criteria.
        - The Codex in-app Browser result and external Blueprint 0.1-to-0.2 rehearsal each name the full frozen SHA and a concrete evidence reference in the qualification-decision artifact.
        - The new provider-evidence validator runs exact contract and CLI tests; it does not start providers or promote a provider from absent evidence.
        - Exact-tag external GOWORK=off Framework resolution belongs only to pre-root authority and is not counted as feature-freeze evidence.
        - ObjectStore and RustFS conformance are optional and non-blocking for v1.1.0; absent evidence does not auto-promote them.
    - id: publish-exact-v110
      title: Publish the exact qualified v1.1.0 commit
      description: Public component tags, artifacts, Releases, and post-publication truth must identify the same reviewed commit and version.
      priority: must
      actor: release-manager
      module: release-evidence
      rules:
        - Framework v1.1.0 publishes first and is resolved from an external GOWORK=off consumer before root publication.
        - Each publishing workflow verifies one specifically selected release-readiness run ID and its run-named artifact; another successful run for the same commit cannot substitute for the selected pre-framework or pre-root authority.
        - The root tag, Framework tag, Admin dependency, archives, checksums, images, documentation, and evidence issue identify one commit.
        - Post-publication reconciliation closes the issue only after installation, runtime, recovery, changelog, capability, and release-state facts agree.
  constraints:
    - id: no-public-development-tags
      type: operations
      statement: Internal waves use branch and commit identities only; alpha, beta, and rc tags are public SemVer prereleases and remain disabled by policy.
    - id: emergency-patch-exception
      type: security
      statement: If delaying a remotely exploitable or data-loss fix is unacceptable, release engineering changes and reviews the target policy for an emergency patch before creating any tag.
    - id: semver-truth
      type: compatibility
      statement: Public reusable Go API removals or incompatible signature changes require a truthful major-version decision or an explicitly non-authoritative bridge.
    - id: development-lock-truth
      type: data
      statement: Project and lock files keep their real Blueprint and generated-development identity until deterministic identity sync writes an exact downstream snapshot.
  acceptance:
    - id: checkpoint-public-version-policy
      requirement: keep-checkpoints-internal
      statement: Policy-negative tests reject every public v1.0.x checkpoint and v1.1.0 prerelease tag while permitting only the reviewed v1.1.0 qualification target.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest tools/release/test_check_release_policy.py
        - type: report
          value: Policy-negative report covering root, Framework, frontend, and container tag entrypoints
    - id: checkpoint-policy-and-fast-feedback
      requirement: preserve-development-safety
      statement: A development wave passes policy validation, FeatureSpec validation, affected compilation, focused exact tests, and changed-scope verification without running complete release qualification.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest tools/release/test_check_release_policy.py
        - type: command
          value: go run ./cmd/mss verify --changed --plan --format json
        - type: report
          value: Changed-scope CI and exact focused test reports for the implementation wave
    - id: checkpoint-exact-run-attestation-contract
      requirement: freeze-before-qualification
      statement: The strict readiness helper binds checkpoint metadata to one exact run and rejects a changed schema, target, commit, phase, policy digest, run ID, run URL, or authority; the disabled publication policy rejects every publication intent.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: path
          value: tools/release/release_readiness_attestation.py
        - type: path
          value: tools/release/verify_readiness_run.sh
        - type: command
          value: python3 -m unittest discover -s tools/release -p 'test_*.py'
    - id: checkpoint-phase-command-runner-contract
      requirement: freeze-before-qualification
      statement: The qualification scope explicitly selects or excludes every Feature, and the phase runner plans checked-in command evidence without a shell while retaining manual, report, and non-exact evidence as visible release-manager review items.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: path
          value: .mss/release-qualification.json
        - type: path
          value: tools/release/release_phase_evidence.py
        - type: command
          value: python3 -m unittest tools/release/test_release_phase_evidence.py
    - id: feature-freeze-candidate-authority
      requirement: freeze-before-qualification
      statement: Manual readiness records v1.1.0, the checked-out full commit SHA, feature-freeze confirmation, the feature-freeze phase, and a non-authoritative exact-run attestation before complete qualification starts.
      level: manual
      phase: feature-freeze
      required: true
      evidence:
        - type: path
          value: .github/workflows/release-readiness.yml
        - type: report
          value: .mss/reports/release-readiness-metadata.json
        - type: report
          value: release-readiness-attestation-<run-id> artifact retained from the selected successful workflow run
        - type: manual
          value: Confirm the exact v1.1.0 target, full candidate SHA, feature-freeze state, feature-freeze phase, and publicationAuthority=false in the manual readiness invocation
    - id: feature-freeze-release-machinery
      requirement: qualify-frozen-candidate
      statement: The frozen commit passes the release-policy, readiness, phase-runner, qualification-decision, release-build, and delivery-smoke contracts without replaying unrelated Feature suites.
      level: integration
      phase: feature-freeze
      required: true
      evidence:
        - type: path
          value: .github/workflows/release-readiness.yml
        - type: path
          value: tools/release/release_qualification_decision.py
        - type: command
          value: python3 -m unittest discover -s tools/release -p 'test_*.py'
        - type: command
          value: pnpm --dir web/antd build:release
        - type: command
          value: pnpm --dir web/antd delivery:smoke
    - id: feature-freeze-supplier-exact-evidence
      requirement: qualify-frozen-candidate
      statement: Only the new Supplier authorization, backend, provider migration, audit, and frontend contracts rerun from the frozen commit with exact test names and no required skip.
      level: integration
      phase: feature-freeze
      required: true
      evidence:
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory admin --package ./modules/supplier
            --run '^(TestSupplierEveryDeclaredOperationIsBackendAuthorized|TestSupplierAdminAuthorizerPermissionMatrix|TestSupplierAdminAuthorizerRequiresExplicitComposition|TestSupplierAuthorizationMigrationProjectsExactPolicy|TestSupplierAuthorizationMigrationFailureRollsBackAllProjectedTruth|TestSupplierAuthorizationMigrationIdentityIsComplete|TestSupplierDescriptorProjectsAuthorizationMetadataWithoutInferringComposition)$'
            --count 1 --race --go-work off
            --require TestSupplierEveryDeclaredOperationIsBackendAuthorized
            --require TestSupplierAdminAuthorizerPermissionMatrix
            --require TestSupplierAdminAuthorizerRequiresExplicitComposition
            --require TestSupplierAuthorizationMigrationProjectsExactPolicy
            --require TestSupplierAuthorizationMigrationFailureRollsBackAllProjectedTruth
            --require TestSupplierAuthorizationMigrationIdentityIsComplete
            --require TestSupplierDescriptorProjectsAuthorizationMetadataWithoutInferringComposition
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory admin --package ./modules/supplier
            --run '^(TestSupplierServiceCRUDQueryExportAndPostCommitEvents|TestSupplierRegisterRoutesFailsClosedWithoutAuthorizer|TestSupplierHTTPAuthorizationValidationAndDeclaredOperations|TestSupplierOperationContractMatchesSpecification)$'
            --count 1 --race --go-work off
            --require TestSupplierServiceCRUDQueryExportAndPostCommitEvents
            --require TestSupplierRegisterRoutesFailsClosedWithoutAuthorizer
            --require TestSupplierHTTPAuthorizationValidationAndDeclaredOperations
            --require TestSupplierOperationContractMatchesSpecification
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory admin --package ./modules/supplier
            --run '^TestSupplierMigration(MySQLIntegration|PostgresIntegration|MySQLRejectsCheckAndIndexDrift|PostgresRejectsCheckAndIndexDrift)$'
            --count 1 --race --go-work off
            --require TestSupplierMigrationMySQLIntegration
            --require TestSupplierMigrationPostgresIntegration
            --require TestSupplierMigrationMySQLRejectsCheckAndIndexDrift
            --require TestSupplierMigrationPostgresRejectsCheckAndIndexDrift
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory admin --package ./cmd/server
            --run '^TestSupplierProductionCompositionAuditsAcceptedAndRejectedMutationsWithoutSecrets$'
            --count 10 --race
            --require TestSupplierProductionCompositionAuditsAcceptedAndRejectedMutationsWithoutSecrets
        - type: command
          value: cd admin && go vet ./cmd/server
        - type: command
          value: pnpm --dir web/antd jest --runInBand src/modules/supplier/contracts.test.ts
        - type: command
          value: pnpm --dir web/antd lint:js
        - type: command
          value: pnpm --dir web/antd tsc
    - id: feature-freeze-generator-blueprint-exact-evidence
      requirement: qualify-frozen-candidate
      statement: The new Supplier projection remains deterministic and the exact Blueprint upgrade transaction tests cover customization preservation, conflict reporting, and atomic failure before the external rehearsal is accepted.
      level: integration
      phase: feature-freeze
      required: true
      evidence:
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory . --package ./internal/mss/generator
            --run '^TestGenerateReportsCompleteDocsAndBrowserE2EOutputs$'
            --count 1 --race --go-work off
            --require TestGenerateReportsCompleteDocsAndBrowserE2EOutputs
        - type: command
          value: go run ./cmd/mss module generate .mss/modules/example-supplier.yaml --check --format json
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory . --package ./internal/mss/blueprint
            --run '^(TestUpgradeAppliesFoundationChangesAndPreservesCustomization|TestUpgradeDetectsConcurrentFoundationAndDownstreamChanges|TestUpgradeFailureBeforeSnapshotCommitRetainsPreviousSnapshotPair|TestUpgradeApplyRejectsCurrentFileChangedAfterPlan)$'
            --count 1 --race --go-work off
            --require TestUpgradeAppliesFoundationChangesAndPreservesCustomization
            --require TestUpgradeDetectsConcurrentFoundationAndDownstreamChanges
            --require TestUpgradeFailureBeforeSnapshotCommitRetainsPreviousSnapshotPair
            --require TestUpgradeApplyRejectsCurrentFileChangedAfterPlan
        - type: command
          value: pnpm --dir docs build
    - id: feature-freeze-provider-validator-exact-evidence
      requirement: qualify-frozen-candidate
      statement: The new provider-evidence schema, deterministic evaluator, and CLI reject incomplete required evidence while optional rows remain non-blocking; no provider is started or promoted by this gate.
      level: contract
      phase: feature-freeze
      required: true
      evidence:
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory . --package ./internal/mss/provider
            --run '^(TestLoadProviderEvidenceAcceptsStrictPinnedReport|TestLoadProviderEvidenceRejectsInvalidIdentityAndUnknownFields|TestEvaluateRequiredProviderEvidenceAcceptsFreshQualifiedFixtures|TestEvaluateRequiredProviderEvidenceRejectsZeroHitSkipAndCachedOnly|TestEvaluateOptionalProviderEvidenceDoesNotBlockRequiredGate|TestProviderEvidenceReportJSONIsDeterministic)$'
            --count 1 --race --go-work off
            --require TestLoadProviderEvidenceAcceptsStrictPinnedReport
            --require TestLoadProviderEvidenceRejectsInvalidIdentityAndUnknownFields
            --require TestEvaluateRequiredProviderEvidenceAcceptsFreshQualifiedFixtures
            --require TestEvaluateRequiredProviderEvidenceRejectsZeroHitSkipAndCachedOnly
            --require TestEvaluateOptionalProviderEvidenceDoesNotBlockRequiredGate
            --require TestProviderEvidenceReportJSONIsDeterministic
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory . --package ./internal/mss/app
            --run '^(TestRootRegistersProviderEvidenceHelp|TestProviderEvidenceCommandPassesRequiredAndWritesJSON|TestProviderEvidenceCommandWritesNegativeReportBeforeReturningError)$'
            --count 1 --race --go-work off
            --require TestRootRegistersProviderEvidenceHelp
            --require TestProviderEvidenceCommandPassesRequiredAndWritesJSON
            --require TestProviderEvidenceCommandWritesNegativeReportBeforeReturningError
    - id: feature-freeze-sha-bound-manual-evidence
      requirement: qualify-frozen-candidate
      statement: The Codex in-app Browser Supplier flow and external Blueprint upgrade rehearsal each pass against the exact frozen commit and are retained in one qualification-decision artifact; ObjectStore and RustFS remain explicitly optional.
      level: manual
      phase: feature-freeze
      required: true
      evidence:
        - type: path
          value: tools/release/release_qualification_decision.py
        - type: report
          value: .mss/reports/release-qualification-decision.json
        - type: manual
          value: Supply concrete browser and Blueprint evidence references whose full evidence commits equal the frozen workflow SHA.
    - id: pre-framework-authority
      requirement: publish-exact-v110
      statement: The open evidence issue approves the frozen v1.1.0 commit, SemVer decision, candidate artifacts, recovery plan, complete qualification, and protected write paths, and the selected pre-framework run grants exact publication authority before any public component tag is created.
      level: manual
      phase: pre-framework
      required: true
      evidence:
        - type: manual
          value: Approved open exact-commit evidence issue with policy hash and feature-freeze reports
        - type: path
          value: .mss/release-policy.yaml
        - type: report
          value: release-readiness-attestation-<run-id> artifact whose exact pre-framework run ID is selected by RELEASE_READINESS_RUN_ID
        - type: command
          value: bash tools/release/verify_readiness_run.sh --repository <owner/repository> --run-id <run-id> --target-version v1.1.0 --commit <full-sha> --phase pre-framework --policy .mss/release-policy.yaml
    - id: pre-root-authority
      requirement: publish-exact-v110
      statement: The public mss-boot/v1.1.0 release, Admin dependency, checksum, and external GOWORK=off resolution match the frozen commit, and a separately selected pre-root run grants exact publication authority before root v1.1.0 publication.
      level: integration
      phase: pre-root
      required: true
      evidence:
        - type: path
          value: .github/workflows/framework-release.yml
        - type: report
          value: External framework resolution and consumer report attached to the open evidence issue
        - type: report
          value: release-readiness-attestation-<run-id> artifact whose exact pre-root run ID is selected by RELEASE_READINESS_RUN_ID or the manual readiness_run_id input
        - type: command
          value: bash tools/release/verify_readiness_run.sh --repository <owner/repository> --run-id <run-id> --target-version v1.1.0 --commit <full-sha> --phase pre-root --policy .mss/release-policy.yaml
    - id: post-publication-truth
      requirement: publish-exact-v110
      statement: Root and Framework Releases, archives, checksums, images, installation smoke, recovery, docs, changelog, and capability state reconcile to the frozen commit before the evidence issue closes.
      level: integration
      phase: post-publication
      required: true
      evidence:
        - type: path
          value: .github/workflows/release.yml
        - type: manual
          value: Final post-publication reconciliation comment and closed evidence issue
  risks:
    - id: delayed-public-security-fixes
      description: Development-first scheduling delays already implemented security fixes from reaching v1.0.0 users.
      severity: high
      mitigation: Keep fixes enabled and tested on the development branch, assess exploitability continuously, and change the reviewed public target for an emergency patch when delay is unacceptable.
    - id: late-integration-discovery
      description: Deferring complete matrices can reveal cross-provider, cross-database, or browser defects late in the train.
      severity: high
      mitigation: Preserve focused integration tests and optional nightly signals during development, freeze with schedule margin, and restart affected candidate evidence after fixes.
    - id: accidental-public-checkpoint
      description: A v1.0.x or prerelease tag could publish a component or image before qualification.
      severity: critical
      mitigation: Keep publicationWorkflowsReady false during development, enforce the checked-in policy and one exact run-named attestation in every publishing workflow, require a protected release environment for write jobs, and restrict tag creation with repository rulesets.
  validation:
    changed: go run ./cmd/mss verify --changed
    all: python3 tools/release/release_phase_evidence.py run --target-version v1.1.0 --commit <full-sha> --phase feature-freeze --output .mss/reports/release-phase-command-evidence.json
    custom:
      - python3 -m unittest tools/release/test_release_qualification_decision.py tools/release/test_release_readiness_workflow.py tools/release/test_release_phase_evidence.py
      - go run ./cmd/mss spec validate .mss/features/foundation-v1-1-0-release.yaml --format json
  rollout:
    strategy: phased
    migration: >-
      Carry accepted stable checkpoints forward without replay. Run the scoped release Feature on the
      selected v1.1.0 commit, attach Codex in-app Browser and external Blueprint rehearsal references
      whose full evidence commits equal that SHA, and retain the run-named qualification decision.
      Then select and verify distinct pre-framework and pre-root authority run IDs before
      post-publication reconciliation.
    rollback: >-
      Before publication, abandon a candidate by recording the failed evidence and selecting a new
      commit; no tag needs mutation. After any component publication, never move or reuse a tag:
      keep the evidence issue open and forward-repair with the next valid synchronized version.
