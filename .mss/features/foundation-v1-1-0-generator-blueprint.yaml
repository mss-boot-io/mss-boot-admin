  risks:
    - id: generated-security-theater
      description: Descriptor-only permissions or menus can look complete while backend routes remain unauthorized or overprivileged.
      severity: critical
      mitigation: Require backend enforcement and exact owner/role positive and negative tests before accepting generated UI or descriptors.
    - id: identity-conflation
      description: Reusing one version for Foundation, Blueprint, generator, and downstream snapshot can misroute upgrades and make generated provenance false.
      severity: high
      mitigation: Give all four identities independent sources and cross-check the snapshot's lock and manifest representations with binary, tag, digest, and commit in external output.
    - id: migration-corruption
      description: Truncated or duplicate migration IDs and process exits can partially upgrade downstream databases or hide a failed step.
      severity: critical
      mitigation: Use lossless identifiers, duplicate fail-fast, returned errors, transactions where supported, and three-database failure tests.
    - id: canonical-email-schema-drift
      description: Enabling registration or OAuth provisioning against an unmigrated or manually altered database can bypass model intent or turn safe conflicts into ambiguous ownership.
      severity: critical
      mitigation: Verify canonical data and exact dialect metadata at migration time and server readiness, fail closed, and rerun both real database tests on the selected freeze SHA with zero skip.
    - id: path-split
      description: Competing root-level and admin/modules/name defaults can generate uncompiled, unverified, or unowned files.
      severity: high
      mitigation: Enforce one canonical path now and require a versioned Blueprint migration before changing it.
    - id: scaffold-claimed-complete
      description: File-count, compile, or fresh-schema checks can promote a scaffold while operations, permissions, migrations, frontend, and upgrade behavior are absent.
      severity: high
      mitigation: Generate one committed golden slice and require field projection, authorization, E2E, migration, and upgrade evidence.
