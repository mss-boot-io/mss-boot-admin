  rollout:
    strategy: phased
    migration: >-
      Keep Generator/Blueprint and Storage Runtime as parallel axes. First establish independent
      version identities, canonical path, strict schema/projection checks, and a safe migration
      engine. The supplier golden backend, explicit forward migration, authorized API, OpenAPI,
      and typed post-commit events are checked in at 5a60ad6; d92458c adds the separate
      authorization migration, default-role policies, menu metadata, and exact role matrix while
      retaining complete false. Next add the typed client and frontend in untagged development waves, then feature-freeze the public
      contracts and run the complete three-database, browser, external-app, and Blueprint 0.1-to-0.2
      upgrade matrices on one candidate commit. The canonical-email checkpoint must retain its
      fail-closed server schema readiness and rerun both real database integrations from that
      exact commit with both DSNs and zero skip. The same exact tracked-clean commit must complete
      `mss verify --all`, including standalone next-Foundation generation and upgrade, all four
      identities and digests, CLI/MCP/doctor parity, deterministic conflict output, preserved
      customization, an empty second upgrade, and evals. An external review or release ledger must
      record the full commit, `trackedClean=true`, exact command, report digest, and result; this
      exact-clean local evidence replaces the retired foundation-compatibility workflow but does not
      authorize publication by itself. Do not start a second generated domain until this
      slice is complete. If target public APIs require a breaking change, make a truthful SemVer
      decision without changing the target generated structure.
    rollback: >-
      Stop generation or upgrade at the first unsupported field, conflict, migration, permission,
      or drift failure. Dry-run leaves the tree untouched; a failed write restores only files owned
      by that operation from the recorded plan and never overwrites user-owned content. A failed
      downstream upgrade retains the old lock and manifest, preserves the conflict report, and
      uses an idempotent forward fix. Database recovery follows the same-point backup policy and
      never edits migration identifiers or version rows manually.
