apiVersion: mss.io/v1alpha1
kind: Feature
metadata:
  name: foundation-v1-3-7-release
  displayName: Foundation v1.3.7 complete release recovery
  description: >-
    Records the complete package-first Admin Distribution published as v1.3.7
    after v1.3.6 became immutable partial, including explicit reusable-container
    preview mode, credentialless npm Trusted Publishing, reviewed stable aliases,
    and final current-stable reconciliation.
  owner: release-engineering
  labels:
    domain: release-recovery
    target-version: v1.3.7
    release-status: stable
    current-stable: v1.3.7
    release-commit: 77b53d41092741eac62fa6418c0bdbf87413c7cd
    published-date: "2026-08-31"
spec:
  problem: >-
    v1.3.6 published Framework, Admin, Admin Web, and Root releases from commit
    b1fe47a3a83209574e09d53526b122dd2cbc5277, but its preview omitted the Root
    OCI artifact, its Root container workflow failed, official npm publication
    failed with ENEEDAUTH, and Docs was not created. Those public Distribution
    identities cannot be completed from repaired source. A new v1.3.7
    merged-main commit must prove the Distribution corrections and rerun its
    complete coordinated ledger; Docs follows independently as a website publication.
  goals:
    - Record v1.3.7 as the current stable Distribution after the complete candidate, npm, and stable-alias ledger succeeded.
    - Separate human-facing guidance from executable Agent contracts and validate each documentation change on its own path without making Docs evidence a Root candidate-preview prerequisite.
    - Make reusable Root-image preview behavior depend on an explicit validated caller input.
    - Bind npm Trusted Publishing exactly to npm-release.yml and npm-auto without a stored npm token.
    - Requalify the complete package-first tools, Go modules, Admin Web package, images, external Thin Host, presentation configuration, migrations, authorization, and rollback from one new merged-main commit.
    - Keep behavioral, dependency, contract, and browser qualification in a self-bound complete local verifier, while PR checks retain only lightweight server-side governance, security analysis, ordinary Admin tests, and an ordinary independent Framework test when applicable.
    - Publish immutable candidate tags only after one successful non-publishing preview, complete the Root, component, image, and package distribution ledger without moving mutable aliases, and authorize stable promotion later from an exact reviewed version and commit.
    - Publish the documentation website asynchronously from its own docs/v* tag; Docs absence or failure never blocks a Distribution component, stable alias, current-stable policy, or adopter availability.
  nonGoals:
    - Continue, repair, rerun, or append artifacts to v1.3.5 or v1.3.6.
    - Create a v1.3.7 release-candidate tag or any other public prerelease while publicPrereleases remains false.
    - Restore NPM_TOKEN or NODE_AUTH_TOKEN in repository, organization, or environment secrets.
    - Bypass or erase the completed Distribution ledger, reviewed stable promotion, and final current-stable policy reconciliation that authorized v1.3.7 adoption.
    - Reintroduce runtime dynamic-model, virtual CRUD, browser code generation, or remote executable presentation configuration.
  actors:
    - id: release-operator
      displayName: Release operator
      description: lwnmengjing froze the exact merged-main commit, ran the preview, created tags in order, and dispatched the reviewed stable promotion from the exact Root tag.
    - id: independent-reviewer
      displayName: Independent reviewer
      description: SullivanPrime reviews the repair pull request and exact Head evidence but does not create release identities.
    - id: thin-host-adopter
      displayName: Thin Host adopter
      description: May consume v1.3.7 because every required Distribution surface and stable identity reconciles; Docs may remain pending.
  modules:
    - name: release-governance
      kind: infrastructure
      operation: extend
      description: New-version selection, explicit reusable-workflow inputs, immutable candidate tags, delayed mutable aliases, and exact public reconciliation.
    - name: npm-trusted-publishing
      kind: infrastructure
      operation: extend
      description: OIDC publication bound to one package, repository, workflow filename, and environment.
    - name: package-first-distribution
      kind: infrastructure
      operation: extend
      description: Checksummed tools, Go modules, Admin Web package, images, and external Thin Host qualification; the Docs website is tracked independently.
  requirements:
    - id: select-unused-v137
      title: Select and preserve one exact release identity
      description: v1.3.7 was the sole active candidate and is now current stable; every partial or stable predecessor remains immutable.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - Remote Root, Framework, Admin, Admin Web, npmjs, image, Go Proxy, and preview ledgers are checked for conflicting v1.3.7 identities before Distribution qualification and publication; Docs identity is checked only before its own website tag.
        - The source is one clean exact commit already merged into current origin/main through a reviewed pull request.
        - v1.3.7 is current stable; v1.3.5 and v1.3.6 remain non-adoptable immutable partial trains.
        - publicPrereleases remains false, so v1.3.7 uses the exact stable-form version only and no rc tag or public prerelease is created.
        - A failed Distribution gate requires another pull request, another merged-main commit, and a new unused patch version after any immutable v1.3.7 core public identity exists. The sole exception is the Docs website pointer, which may be deleted and recreated under its separate contract without changing Distribution identity.
    - id: pass-root-image-preview-mode
      title: Make Root image preview explicit
      description: Reusable workflow behavior is selected by a typed caller contract instead of inherited event context.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - container.yml declares a required boolean release_preview workflow_call input.
        - release.yml passes release_preview true together with the exact candidate version.
        - Authorization, build metadata, multi-platform build, staging, and artifact upload test the explicit input.
        - Workflow contract tests reject github.event_name == workflow_call as a reusable-preview selector.
        - The successful Root preview contains and verifies the exact Root image artifact before any formal tag.
    - id: use-credentialless-npm-publishing
      title: Restore exact npm Trusted Publishing identity
      description: Official npm publication uses GitHub Actions OIDC and provenance without a reusable token.
      priority: must
      actor: release-operator
      module: npm-trusted-publishing
      rules:
        - npmjs package @mss-boot-io/admin-web trusts owner mss-boot-io, repository mss-boot-admin, workflow filename npm-release.yml, and environment npm-auto exactly, including case.
        - npm-release.yml grants id-token write, uses the supported npm CLI, and is dispatched from the exact Root tag only after a reviewed policy binds stablePromotionVersion and stablePromotionCommit.
        - The first official npmjs publication reuses the previously qualified tarball and invokes npm publish with --provenance and --tag latest through OIDC.
        - The publish step removes NPM_TOKEN and NODE_AUTH_TOKEN before invoking npm publish.
        - Repository, organization, and npm-auto environment state contains no replacement npm publication token.
        - The exact Trusted Publisher identity is recorded and rechecked before the Root tag; a mismatch stops release before any public identity is created.
        - GitHub Latest moves only after npmjs version, gitHead, integrity, provenance, and latest identity all match the reviewed promotion.
    - id: reuse-one-v137-preview
      title: Reuse one artifact-only non-publishing preview
      description: Formal tags publish exact candidate bytes from one focused-through-PR and fully qualified merged-main commit without repeating broad quality suites.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - The pull-request Head passes mss verify --changed, focused checks selected by its impact plan, affected Codex in-app Browser acceptance, and the lightweight required pull-request checks before merge; broad Agent, Admin, Framework, frontend, Thin Host, container, and multi-database matrices do not block the PR.
        - Human-facing Docs explain use and maintenance while AGENTS.md, .mss, .agents/skills, and .codex remain the executable Agent contract; documentation checks qualify documentation changes but never authorize or block Distribution publication.
        - The final preparation pull request enables publicationWorkflowsReady while stable promotion remains disabled and unbound to any commit.
        - After merge, the frozen exact origin/main commit performs the only complete suite by passing mss verify --all --release-evidence --expect-commit with a report that binds the full commit and true trackedCleanBefore/After values.
        - An external review or release ledger records the self-bound report digest and result before preview.
        - The manual Root workflow accepts only v1.3.7 from main, never publishes, and never moves GitHub Latest, npm latest, or another mutable alias.
        - The Root preview builds and verifies only exact publication binaries, archives, packages, SBOMs, checksums, portable delivery, candidate Thin Host composition, and multi-platform images; it does not rerun Go, dependency, lint, unit, or Playwright suites.
        - Framework, Admin, and Admin Web tags are annotated and created in order before Root.
        - The first irreversible Framework publication performs one cheap exact preview lookup; Admin does not repeat it and still resolves and tests the exact public Framework with GOWORK off through the public Go proxy.
        - The Root tag starts Root assets and the Root image from the same preview evidence but leaves GitHub Latest unchanged and does not start official npm publication.
        - Docs is an asynchronous website-only publication after the base Root Release exists. It may complete before or after stable promotion and current-stable reconciliation, and its failure or absence does not invalidate the Distribution ledger.
        - A docs/v* tag is a replaceable website deployment pointer. It is not a Distribution component tag, adopter-availability signal, npm prerequisite, or stable-alias authority.
    - id: publish-docs-site-asynchronously
      title: Publish the documentation website independently
      description: Docs uses its own replaceable tag and deployment ledger without joining the Distribution dependency graph.
      priority: should
      actor: release-operator
      module: package-first-distribution
      rules:
        - Docs publication may start only after its base Root Release exists, but no Distribution component, image, npm publication, stable alias, current-stable update, or adopter path waits for Docs.
        - A docs/vX.Y.Z tag identifies the website publication for that version; it does not certify the Distribution or change package availability.
        - The Docs workflow retains exact-tag resolution, Root-ancestor and merged-source checks, protected deployment, replacement Release assets, checksums, release.json identity, and browser reconciliation.
        - The authorized operator may delete the current stable Docs Release and tag, prove both are absent, and recreate the same docs/vX.Y.Z tag at a later qualified merged-main commit; direct force-update is prohibited.
        - A Docs failure is recorded as website deployment pending and repaired only through the Docs path; it does not stop, roll back, or invalidate the Distribution release.
    - id: reconcile-complete-v137-ledger
      title: Prove the complete adopter boundary
      description: Stable promotion is blocked until every immutable Distribution surface and external-consumer path is public and exact; official npm and stable aliases are then reconciled in a separately authorized promotion without waiting for Docs.
      priority: must
      actor: thin-host-adopter
      module: package-first-distribution
      rules:
        - Before promotion, Root tools, Framework, Admin, Admin Web, Root and frontend images, checksums, provenance, and Release notes resolve to the same version and release commit; official npmjs is deliberately absent from this pre-promotion Distribution ledger, and Docs is outside it.
        - Empty-directory installers and external Thin Hosts reject local replacements, copied Foundation source, mixed versions, and mutable image references.
        - Fresh and previous-stable upgrade migrations, authorization positive and negative cases, browser states, presentation recovery mode, and matching-pair rollback pass from release artifacts.
        - After the immutable Root, component, and image Distribution ledger is complete, a separate reviewed pull request sets stablePromotionReady and binds stablePromotionVersion v1.3.7 plus the exact release commit; this authorization never depends on a Docs tag, Release, deployment, credential, or public site response.
        - The exact Root-tag workflow_dispatch publishes or reconciles official npmjs latest through OIDC first, verifies its immutable identity and provenance, and only then promotes the matching Root Release to GitHub Latest.
        - The post-promotion adopter ledger adds official npmjs and proves Root tools, Framework, Admin, Admin Web, npmjs, both images, checksums, provenance, and Release notes agree on v1.3.7 and the reviewed release commit.
        - A subsequent reviewed reconciliation atomically updates currentStableVersion, currentStableCommit, adopter availability, and checked-in human and Agent source guidance as soon as the Distribution ledger and stable aliases are exact; it does not wait for Docs publication.
        - Docs tag, Release, deployment, and public-site truth are reconciled separately from checked-in source guidance. A missing or failed website deployment is recorded as pending without changing Distribution stability. Any later site update uses the controlled delete-then-recreate path for the same current-stable Docs tag.
  constraints:
    - id: merged-main-only
      type: operations
      statement: Preview and every formal tag resolve to one clean commit contained in current origin/main.
    - id: immutable-partial-trains
      type: compatibility
      statement: v1.3.5 and v1.3.6 identities remain unchanged and cannot authorize or receive later publication.
    - id: credentialless-npm
      type: security
      statement: npm Trusted Publishing and OIDC replace long-lived npm publication tokens.
    - id: matched-distribution
      type: compatibility
      statement: Framework, Admin, Admin Web, Root tools, images, and npmjs use one v1.3.7 version and exact commit; mixed Distribution patch versions are unsupported. Docs publishes a separately reconciled website identity.
    - id: docs-site-non-blocking
      type: operations
      statement: A docs/v* tag identifies only website publication. Docs credentials, workflow status, Release, and public site state never gate Distribution components, npm, GitHub Latest, currentStable, or adopter availability.
    - id: no-public-prerelease
      type: compatibility
      statement: publicPrereleases is false and no v1.3.7 rc tag, prerelease Release, prerelease package, or prerelease image is part of this train.
    - id: staged-stable-aliases
      type: operations
      statement: Candidate publication does not move mutable stable aliases; reviewed exact promotion moves npm latest before GitHub Latest, and later current-stable policy reconciliation closes the Distribution contract independently of Docs.
  acceptance:
    - id: v137-policy-and-vacancy
      requirement: select-unused-v137
      statement: Policy records exact v1.3.7 current stable with public prereleases disabled, publication workflows ready, consumed stable promotion disabled, and no conflicting remote identity.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest tools/release/test_check_release_policy.py
        - type: report
          value: Sanitized Root, component, npmjs, image, Go Proxy, and preview vacancy ledger for v1.3.7; Docs vacancy is checked separately only before a Docs website tag.
    - id: v137-root-image-contract
      requirement: pass-root-image-preview-mode
      statement: Workflow tests and the exact preview prove that reusable invocation uploads the required Root image artifact.
      level: integration
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest tools.release.test_container_workflow tools.release.test_root_release_workflow
        - type: report
          value: Exact successful v1.3.7 Root preview artifact inventory.
    - id: v137-npm-oidc-contract
      requirement: use-credentialless-npm-publishing
      statement: Live npm settings and workflow tests prove the exact Trusted Publisher identity, absence of token-based publication, reviewed exact-tag dispatch, npm latest identity verification, and npm-before-GitHub alias ordering.
      level: security
      phase: checkpoint
      required: true
      evidence:
        - type: report
          value: Authenticated npm package-access evidence for npm-release.yml and npm-auto, with no credential value recorded.
        - type: command
          value: python3 -m unittest tools.release.test_npm_release_workflow
    - id: v137-complete-preview
      requirement: reuse-one-v137-preview
      statement: Human and Agent documentation boundaries, focused PR evidence, and one complete exact-main local pass qualify behavior, while one alias-free candidate-only run builds and verifies the exact tools, packages, archives, and images later published from the same merged-main commit.
      level: e2e
      phase: checkpoint
      required: true
      evidence:
        - type: report
          value: Human and Agent audience-map review plus a self-bound exact-clean merged-main mss verify --all --release-evidence report containing the full commit and true trackedCleanBefore/After values and its digest; lightweight required PR checks, affected runtime Codex in-app Browser acceptance evidence, and successful alias-free v1.3.7 Root artifact preview with checksums. Docs build and site-browser evidence belong only to the asynchronous Docs publication ledger.
    - id: v137-public-reconciliation
      requirement: reconcile-complete-v137-ledger
      statement: Every immutable Distribution surface and repository-external consumer probe succeeds before a separate reviewed policy authorizes exact stable promotion; npm latest then GitHub Latest converge, the complete adopter ledger adds official npm, and later exact current-stable policy reconciliation closes adoption without waiting for Docs.
      level: integration
      phase: post-publication
      required: true
      evidence:
        - type: report
          value: Exact Framework, Admin, Admin Web, Root, image, Go Proxy, installer, and external Thin Host pre-promotion Distribution ledger; reviewed stablePromotionVersion and stablePromotionCommit; OIDC npm latest identity and provenance; subsequent GitHub Latest identity; complete post-promotion adopter ledger; and final current-stable policy evidence. Docs publication evidence is recorded separately and is non-blocking.
    - id: v137-docs-site-follow-up
      requirement: publish-docs-site-asynchronously
      statement: When the website is published, the same stable docs/vX.Y.Z tag is a replaceable website pointer. Replacement must delete the previous Docs Release and tag before recreating the same name at a newer qualified merged-main commit; direct tag movement is forbidden. Root ancestry, merged source, forward-only deployment, protected deployment, Release assets, release.json, and browser reconciliation remain required without gating the Distribution.
      level: integration
      phase: post-publication
      required: false
      evidence:
        - type: report
          value: Independent Docs workflow, Release assets and checksums, public release.json, and browser evidence, or an explicit source-updated / deployment-pending status.
  risks:
    - id: reusable-event-context
      description: A called workflow could inherit workflow_dispatch and silently skip preview-only image work.
      severity: critical
      mitigation: Use a required boolean input, validate it explicitly, and assert the caller passes true.
    - id: npm-publisher-drift
      description: A renamed environment or workflow could make npm OIDC fail after public component tags exist.
      severity: critical
      mitigation: Verify the exact live Trusted Publisher identity before the Root tag and fail closed without a token fallback.
    - id: repeated-partial-train
      description: Publishing tags before the complete preview and credential audit could create another irreversible partial train.
      severity: critical
      mitigation: Freeze one locally and through-PR qualified merged-main commit, finish the artifact preview and live-governance gates, and stop before the first tag on any failure.
    - id: premature-mutable-alias
      description: Root or npm candidate publication could expose v1.3.7 as stable before the complete candidate ledger and reviewed promotion authority exist.
      severity: critical
      mitigation: Keep preview and candidate publication alias-free, bind stablePromotionVersion and stablePromotionCommit in a later reviewed pull request, publish npm latest through exact Root-tag OIDC dispatch, verify npm identity, and move GitHub Latest only afterward.
  validation:
    changed: mss verify --changed
    all: mss verify --all --release-evidence --expect-commit <full-sha>
    custom:
      - python3 -m unittest discover -s tools/release -p 'test_*.py'
      - GOWORK=off go test ./internal/mss/...
      - cd mss-boot && GOWORK=off go test ./...
      - cd admin && GOWORK=off go test ./...
      - corepack pnpm@10.34.5 --dir web/antd-v6 lint
      - corepack pnpm@10.34.5 --dir web/antd-v6 test:ci
      - corepack pnpm@10.34.5 --dir web/antd-v6 build:release
  rollout:
    strategy: phased
    migration: >-
      Merge the final preparation through a reviewed pull request that corrects
      the npm Trusted Publisher to npm-release.yml plus npm-auto without creating
      a token, enables publicationWorkflowsReady, and leaves stable promotion
      disabled. Complete mss verify --changed and selected focused Distribution
      checks on the exact PR Head, merge only after required checks pass,
      then freeze the clean exact origin/main commit and run the only complete
      suite with mss verify --all --release-evidence --expect-commit using that
      full SHA. Record the self-bound report digest, run one non-publishing and
      alias-free v1.3.7 Root artifact preview, and inspect every expected artifact.
      As lwnmengjing, create annotated Framework, Admin, Admin Web, and Root tags
      in order and reconcile both images and package surfaces without moving
      stable aliases. After that complete Distribution ledger, merge another
      reviewed pull request that enables exact v1.3.7
      promotion and binds its release commit. Dispatch npm-release.yml from the
      exact Root tag so OIDC publishes or reconciles npm latest first; verify its
      version, gitHead, integrity, and provenance before promoting GitHub Latest.
      Finally merge a subsequent policy reconciliation pull request to advance
      current stable and adopter availability while atomically aligning checked-in
      human and Agent source guidance, without requiring a Docs tag, Release,
      deployment, or public-site evidence. Docs may publish before or after
      those steps from its own docs/v* website tag and never delays them. Before
      any Docs publication, independently verify its exact tag, Root ancestor,
      merged source, protected deployment, Release assets, checksums, public
      release.json, and browser state. If later content must replace the website,
      qualify the new merged-main Docs source, verify Docs governance, delete the
      old Docs Release and tag, prove both are absent, and recreate the same
      current-stable docs/vX.Y.Z tag at the recorded source. Do not create a
      +docs.N identity or force-update the tag.
    rollback: >-
      Stop before the next Distribution tag on any Distribution gate failure.
      A Docs failure stops only the website publication and is recorded for
      asynchronous follow-up; it never rolls back or invalidates published
      Distribution components, stable aliases, currentStable, or adopter
      availability. Existing adopters use
      the matching v1.3.7 Admin, frontend, configuration, and lock. Never move a
      core public tag, complete v1.3.5 or v1.3.6, mix patch versions, or restore a
      stored npm publication token.
