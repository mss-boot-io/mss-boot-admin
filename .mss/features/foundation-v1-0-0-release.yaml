apiVersion: mss.io/v1alpha1
kind: Feature
metadata:
  name: foundation-v1-0-0-release
  displayName: Publish the consolidated Foundation v1.0.0 safely
  description: >-
    Defines the component order, status semantics, compatibility disclosures, migration evidence,
    artifact identity, and recovery gates required before the consolidated foundation's first
    stable 1.0 release can be called stable.
  owner: release-engineering
  labels:
    domain: foundation-release
    target-version: v1.0.0
    release-status: stable
    published-date: 2026-08-09
    compatibility: breaking
spec:
  problem: >-
    The v1.0.0 release combined a nested framework module, a split Admin module, a consolidated
    frontend and documentation tree, security-sensitive database migrations, breaking API changes,
    and removed runtime capabilities. A branch or locally passing workspace can hide an unpublished
    framework dependency, incomplete migration evidence, or artifacts that do not identify the tag.
    This machine-validated declarative contract, together with exact-commit workflows and evidence,
    prevented preview work from being mistaken for the stable release and
    remains the historical acceptance boundary for commit ee800262c035c5f4242aca1841d077554481d2c4.
  goals:
    - Keep planned, preview, release-candidate, and stable states unambiguous in every human and machine-readable contract.
    - Publish and externally resolve mss-boot/v1.0.0 before creating the root v1.0.0 tag that requires it.
    - Disclose every material Go module, API, authentication, authorization, configuration, migration, and removed-capability change from v0.7.x.
    - Require reproducible artifacts whose reported version and deployment endpoint contract match the published tag.
    - Require database backup, preflight, fresh/upgrade/idempotency evidence, post-upgrade verification, and an executable recovery decision.
    - Prefer forward-fix after migration while defining the narrow conditions for code rollback or full snapshot restoration.
  nonGoals:
    - Create either v1.0.0 tag or publish any GitHub Release from this feature specification.
    - Mark layered theme settings or other planned capabilities stable before their independent acceptance gates pass.
    - Reintroduce Admin runtime dynamic models, virtual CRUD, or browser-facing template code generation.
    - Invent a release commit, lock-file upgrade record, module proxy result, artifact digest, or test result before it exists.
  actors:
    - id: release-manager
      displayName: Release manager
      description: Freezes the release commit, reviews evidence, publishes component tags in order, and declares the final status.
    - id: operator
      displayName: Admin operator
      description: Backs up and upgrades an existing v0.7 installation, verifies behavior, and executes recovery when required.
    - id: downstream-maintainer
      displayName: Downstream maintainer
      description: Updates the consolidated Go module path and proves the nested framework resolves outside the source workspace.
  modules:
    - name: framework-release
      operation: extend
      description: Nested mss-boot module tagging, independent verification, and external resolution.
    - name: foundation-release
      operation: extend
      description: Root Admin, Agent tooling, contracts, documentation, artifacts, and container publication.
    - name: release-documentation
      operation: extend
      description: Changelogs, compatibility, upgrade, rollback, migration, and status contracts.
  requirements:
    - id: honest-release-state
      title: Preview cannot impersonate stable
      description: Every contract distinguishes release preparation from an immutable published tag and verified artifacts.
      priority: must
      actor: release-manager
      module: release-documentation
      rules:
        - Unreleased, planned, preview, a release branch, or a local go.work replacement is never described as stable.
        - Stable requires a tag on the reviewed commit, a published release, resolvable component modules, and linked validation evidence.
        - v1.0.0 is the consolidated foundation's first stable 1.0 boundary; it is not a relabeling of the unpublished v0.8.0 release candidate.
        - The v1.0.0 preparation commit does not rewrite .mss/lock.yaml to 1.0.0/stable or add an upgrade record before publication.
        - Any v0.8.0 candidate archive, digest, workflow run, smoke result, or release note is historical preparation evidence only and must be regenerated for the exact v1.0.0 release commit.
        - After the root tag exists, a deterministic supported process records the real foundation version, commit, and channel; unsupported lock fields are not invented manually.
    - id: framework-before-root
      title: Framework is published and externally resolvable first
      description: The nested framework dependency is available to consumers before a root Admin version requiring it is tagged.
      priority: must
      actor: downstream-maintainer
      module: framework-release
      rules:
        - Publish mss-boot/v1.0.0 from the reviewed release commit before root v1.0.0.
        - Resolve github.com/mss-boot-io/mss-boot-admin/mss-boot@v1.0.0 from a clean external module with GOWORK=off.
        - Verify the resolved module version and commit, then compile and test an external consumer without a local replace.
        - Any proxy, checksum, module-path, or commit mismatch blocks the root tag.
    - id: complete-compatibility-contract
      title: Breaking changes and compatibility windows are explicit
      description: v0.7 operators and downstream maintainers can identify every required client, module, permission, and configuration change before upgrading.
      priority: must
      actor: downstream-maintainer
      module: release-documentation
      rules:
        - Document the root, admin, and nested framework module paths and supported Go, Node, pnpm, database, and Redis boundaries.
        - Document PAT and OAuth method changes, role and theme ETag semantics, root invariants, upload and configuration secret permissions, and removed runtime routes.
        - Document which compatibility windows remain and which legacy behaviors return 403, 405, 412, 422, or not found.
        - Planned capabilities remain planned even when their implementation is included in a stable foundation release.
    - id: migration-evidence
      title: Upgrade is backup-first and migration-gated
      description: The release has reproducible fresh, upgrade, repeat, failure, and restore evidence for every supported database.
      priority: must
      actor: operator
      module: foundation-release
      rules:
        - Capture a consistent database, configuration, object-storage, artifact, and deployment snapshot and prove it can be restored before migration.
        - Preflight default-role ambiguity, duplicate OAuth identities, OAuth password recovery, PAT automation, custom retired-tool menus, and application credentials.
        - Drain all v0.7 writers before applying migrations because old writers do not advance v1.0.0 authorization or configuration revisions.
        - Verify SQLite, MySQL 8.4, and PostgreSQL 17 fresh, v0.7 upgrade, repeat, and transactional failure behavior.
        - Never edit migration version rows or claim PAT plaintext and sanitized credentials can be reconstructed by code rollback.
    - id: artifact-identity
      title: Published artifacts identify and implement the release contract
      description: Users can prove which source and endpoint contract each binary, archive, static bundle, and image implements.
      priority: must
      actor: release-manager
      module: foundation-release
      rules:
        - Admin and Agent binaries report the published version and source revision rather than an embedded historical fallback.
        - A portable formal frontend artifact contains no unapproved localhost, alpha, or beta API endpoint and passes the delivery smoke test.
        - Release archives have checksums; containers record immutable digests and OCI source/version/revision metadata.
        - The GitHub Release is not finalized while any advertised archive, frontend artifact, container, documentation, or validation dependency has failed.
    - id: security-release-gates
      title: Security migrations and authorization boundaries are reverified
      description: Credential cleanup and least-privilege changes are proven without reopening unsafe historical behavior.
      priority: must
      actor: release-manager
      module: foundation-release
      rules:
        - Provider-side rotation or revocation and repository secret scanning confirm historical built-in OAuth credentials are no longer usable.
        - PAT raw values are one-time only, persisted values are digests, rotation and revocation are owner-scoped, and old bearers fail immediately.
        - Current root, user, role, enabled state, and permissions come from authoritative storage; root bypass remains while destructive system invariants are protected.
        - Positive and negative tests cover registration/default role, role authorization, static and dynamic routes, SystemConfig, AppConfig secrets, uploads, and audit redaction.
    - id: executable-recovery
      title: Recovery uses forward-fix or a complete compatible snapshot
      description: Operators can respond to a failed rollout without mixing incompatible binaries, migration versions, and credential state.
      priority: must
      actor: operator
      module: release-documentation
      rules:
        - Stop all writers and preserve the failed state before any repair or restoration.
        - Prefer a new narrow idempotent forward migration or compatible code fix after a successful v1.0.0 migration.
        - Use a previous binary against the upgraded database only after an isolated compatibility rehearsal proves every required read and write boundary.
        - Full rollback restores database, configuration, storage metadata, and artifacts from one pre-upgrade point and accepts the documented RPO.
        - Never restore revoked provider credentials, revoked PATs, unsafe local-password provenance, or state-changing GET routes.
  constraints:
    - id: semantic-version-order
      type: dependency
      statement: Root v1.0.0 cannot be published before mss-boot/v1.0.0 resolves externally at the expected commit.
    - id: no-false-lock-state
      type: compatibility
      statement: The development FoundationLock remains a real generated baseline until a supported deterministic process can record the published release.
    - id: no-mixed-writers
      type: data
      statement: v0.7 and v1.0.0 writers cannot overlap during revisioned authorization and configuration migration.
    - id: credential-one-way-cleanup
      type: security
      statement: Cleared PAT plaintext, disabled untrusted OAuth-era local passwords, and revoked provider credentials are not reconstructed during rollback.
    - id: removed-runtime-boundary
      type: compatibility
      statement: Historical developer-tool data can remain inert, but removed runtime routes, menus, policies, and framework packages are not compatibility surfaces.
    - id: atomic-publication
      type: operations
      statement: A stable Release cannot advertise an artifact or image that has not completed publication and immutable identity verification.
  acceptance:
    - id: feature-contract-valid
      requirement: honest-release-state
      statement: The v1.0.0 release FeatureSpec passes schema and semantic validation.
      level: contract
      required: true
      evidence:
        - type: command
          value: go run ./cmd/mss spec validate .mss/features/foundation-v1-0-0-release.yaml --format json
    - id: published-release-proof
      requirement: honest-release-state
      statement: The public root and framework Releases, exact commit, and closed evidence issue prove the stable v1.0.0 publication.
      level: manual
      required: true
      evidence:
        - type: manual
          value: Root Release https://github.com/mss-boot-io/mss-boot-admin/releases/tag/v1.0.0 published 2026-08-09 from ee800262c035c5f4242aca1841d077554481d2c4.
        - type: manual
          value: Framework Release https://github.com/mss-boot-io/mss-boot-admin/releases/tag/mss-boot/v1.0.0 published first from the same commit.
        - type: report
          value: Exact-commit evidence issue https://github.com/mss-boot-io/mss-boot-admin/issues/471 is closed.
    - id: release-docs-build
      requirement: complete-compatibility-contract
      statement: Release, upgrade, compatibility, and rollback documents are linked and compile in the documentation site.
      level: integration
      required: true
      evidence:
        - type: command
          value: corepack pnpm@9.15.9 --dir docs build
    - id: external-module-probe
      requirement: framework-before-root
      statement: A clean module outside the repository resolves and tests the exact nested mss-boot/v1.0.0 tag without workspace replacement.
      level: integration
      required: true
      evidence:
        - type: manual
          value: Attach GOWORK=off go list -m -json and go test output from an external temporary module to the release evidence.
    - id: database-upgrade-matrix
      requirement: migration-evidence
      statement: Current fresh/failure suites and v0.7 upgrade/repeat suites jointly cover SQLite, MySQL 8.4, and PostgreSQL 17 on the exact release commit.
      level: migration
      required: true
      evidence:
        - type: report
          value: Attach the exact release-commit v0.7 Upgrade Integration and Theme Settings Database Integration workflow runs, database versions, and release-readiness report.
    - id: security-matrix
      requirement: security-release-gates
      statement: Credential, OAuth, default-role, root, permission, configuration-secret, upload, and audit positive/negative checks all pass.
      level: security
      required: true
      evidence:
        - type: command
          value: go run ./cmd/mss verify --all
        - type: command
          value: corepack pnpm@9.15.9 --dir web/antd audit:release && corepack pnpm@9.15.9 --dir docs audit:release
    - id: versioned-artifact-smoke
      requirement: artifact-identity
      statement: Every formal binary, archive, static bundle, and image reports or records the exact tag/revision and passes its installation smoke test.
      level: e2e
      required: true
      evidence:
        - type: manual
          value: Attach binary version output, archive checksums, endpoint scan, image digest, OCI labels, and no-cache smoke results.
    - id: release-evals-pass
      requirement: honest-release-state
      statement: Strict environment checks, complete verification, and all Agent evaluations pass on the exact release commit.
      level: integration
      required: true
      evidence:
        - type: command
          value: go run ./cmd/mss doctor --strict && go run ./cmd/mss verify --all && go run ./cmd/mss eval run --all
    - id: recovery-rehearsed
      requirement: executable-recovery
      statement: An isolated restore proves the backup is usable and records the selected forward-fix and full-restore decision points.
      level: manual
      required: true
      evidence:
        - type: manual
          value: Attach the dated, sanitized restore-rehearsal record; docs/docs/releases/v1-0-0-rollback.md is guidance and is not itself proof of execution.
    - id: oauth-provider-revocation
      requirement: security-release-gates
      statement: Historical built-in OAuth credentials are revoked at the provider and the exact release commit has no open secret-scanning alert.
      level: manual
      required: true
      evidence:
        - type: manual
          value: Attach provider-side rotation or revocation attestation plus the exact GitHub secret-scanning result; repository tests cannot prove external revocation.
  risks:
    - id: workspace-hides-missing-tag
      description: The repository go.work replacement can make Admin compile while the required nested framework tag is absent from external module resolution.
      severity: critical
      mitigation: Publish framework first and require an external GOWORK=off resolution and test report before the root tag.
    - id: preview-marked-stable
      description: Changelog headings, branch names, or generated documentation could be interpreted as proof that v1.0.0 is already stable.
      severity: high
      mitigation: Keep candidates preview; after publication reconcile every contract to the public tag, exact commit, artifacts, module resolution, and evidence issue.
    - id: unsafe-direct-rollback
      description: Replacing only the binary after PAT, OAuth, permission, or default-role migration can mix incompatible code and persisted security state.
      severity: critical
      mitigation: Stop writers, preserve evidence, prefer forward-fix, and permit snapshot restore only as one consistent recovery point.
    - id: ambiguous-role-migration
      description: Historical root and default role topology can make automatic least-privilege conversion unsafe.
      severity: critical
      mitigation: Run the read-only preflight, stop migration on ambiguity, classify users and roles manually, and rerun the idempotent migration.
    - id: incomplete-artifact-set
      description: An independently published GitHub Release can advertise a container or frontend bundle that failed or embeds a development endpoint.
      severity: high
      mitigation: Gate final publication on every advertised artifact, scan the static bundle, record digests, and run no-cache installation smoke tests.
    - id: nested-tag-release-notes
      description: Unfiltered previous-tag discovery can use a web or framework nested tag as the previous root release and generate an incomplete change range.
      severity: medium
      mitigation: Resolve the previous root vX.Y.Z tag explicitly and keep component changelogs scoped to their own namespaces.
  validation:
    changed: go run ./cmd/mss verify --changed
    all: go run ./cmd/mss verify --all
    custom:
      - go run ./cmd/mss spec validate .mss/features/foundation-v1-0-0-release.yaml --format json
      - corepack pnpm@9.15.9 --dir docs build
      - cd mss-boot && GOWORK=off go test ./...
      - cd mss-boot && GOWORK=off go vet ./...
  rollout:
    strategy: phased
    migration: >-
      Freeze one reviewed commit and retain preview status. Back up and rehearse restore, run the
      database and security preflights, drain v0.7 writers, and complete the exact-commit validation
      matrix. Publish mss-boot/v1.0.0 first. From outside the repository resolve and test the nested
      module with GOWORK=off; stop on any mismatch. Re-run the root gates, publish root v1.0.0 only
      after all advertised artifacts and the container succeed, then perform no-cache installation
      smoke tests. Publish the optional frontend tag only after its independent artifact contract passes.
    rollback: >-
      Before migration, withdraw the candidate without data changes. After migration, stop all writers,
      preserve the current state, and prefer a narrow idempotent forward-fix. Use a previous binary on
      the upgraded database only after isolated compatibility proof. If full recovery is required,
      restore database, configuration, storage metadata, and artifacts from the same pre-upgrade point
      and accept the recorded RPO. Never restore revoked PATs, provider credentials, untrusted OAuth-era
      passwords, removed mutation routes, or manually altered migration version rows.
