apiVersion: mss.io/v1alpha1
kind: Feature
metadata:
  name: foundation-v1-3-5-release-recovery
  displayName: Foundation v1.3.5 immutable partial-train recovery
  description: >-
    Records the stopped v1.3.5 distribution, permanently closes every v1.3.5
    publication path, repairs future release governance, and removes incomplete
    adopter instructions without selecting another version.
  owner: release-engineering
  labels:
    domain: release-recovery
    target-version: v1.3.5
    release-status: immutable-partial
    release-commit: 396f60615cdfa589353b16ef9d3531e249e65432
    evidence-issue: "537"
spec:
  problem: >-
    Framework, Admin, and Admin Web v1.3.5 were published from commit
    396f60615cdfa589353b16ef9d3531e249e65432. Protected Root promotion then
    created the exact annotated v1.3.5 tag but rejected Git's canonical trailing
    newline in its post-push message check. The naturally triggered Root
    candidate and container runs were cancelled before Root assets, the Root
    Release, Docs, official npmjs, or the Root image were published. Go Proxy
    and SumDB have indexed the Root tag, so v1.3.5 cannot be deleted, moved,
    recreated, reused, or completed by appending missing artifacts.
  goals:
    - Preserve the exact v1.3.5 public identities and failed or cancelled workflow evidence as an immutable audit record.
    - Permanently reject qualification and publication for every v1.3.5 Root, component, Docs, npm, and tag identity.
    - Reduce every future release to one successful exact-commit preview followed by lwnmengjing pushing the coordinated formal tags, with no second publish dispatch or run-ID input.
    - Keep Docs independent so a later docs tag can publish corrected documentation without blocking Root packages, images, tools, or npmjs.
    - Restrict release preview and tag creation to lwnmengjing while SullivanPrime remains the independent pull-request reviewer.
    - Replace incomplete operational onboarding with truthful v1.3.2 stable and v1.3.5 immutable-partial status pages.
  nonGoals:
    - Delete, move, recreate, reuse, or append publication authority to any v1.3.5 tag, Release, package, image, checksum, or workflow evidence.
    - Select, qualify, tag, publish, or deploy another distribution or Docs revision in this recovery change.
    - Initialize or refactor mss-shop from v1.3.5 or from local Foundation artifacts.
    - Change any already published Framework, Admin, Admin Web, or frontend-image artifact.
    - Move, overwrite, delete, or reuse an immutable v1.3.4, v1.3.3, or v1.3.2 public identity.
  actors:
    - id: release-operator
      displayName: Release operator
      description: lwnmengjing is the only human account allowed to initiate release authority or create component and Docs tags.
    - id: independent-reviewer
      displayName: Independent pull-request reviewer
      description: SullivanPrime reviews the merged source change but is not a second manual action in the tag-driven release path.
    - id: documentation-reader
      displayName: Documentation reader
      description: Sees the current stable boundary and stopped v1.3.5 facts without unavailable commands.
  modules:
    - name: release-governance
      kind: infrastructure
      operation: extend
      description: Permanent policy denial, exact tag rules, one preview authority, tag-driven publication, and downstream release lineage.
    - name: documentation
      kind: infrastructure
      operation: extend
      description: Immutable-partial release records and fail-closed adopter guidance.
  requirements:
    - id: record-immutable-partial-v135
      title: Record the stopped public boundary
      description: v1.3.5 facts distinguish published components, the indexed Root tag, cancelled runs, and absent public artifacts.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - Framework mss-boot/v1.3.5, Admin admin/v1.3.5, and Admin Web web/antd-v6/v1.3.5 remain bound to commit 396f60615cdfa589353b16ef9d3531e249e65432.
        - Root tag object e2cd54d27371061849f505f6af1b75e6e49bdf3f peels to the same commit and remains public Go Proxy and SumDB evidence.
        - Root promotion run 33024175158 and cancelled natural runs 33024710413 and 33024710547 remain failure evidence, not publication authority.
        - Root Release, Root tools, Root image, Docs v1.3.5, and official npmjs 1.3.5 remain explicitly absent.
    - id: freeze-v135-publication
      title: Permanently close every v1.3.5 publication path
      description: Software policy and server-side tag rules deny both reuse and late creation of stopped identities.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - Release policy marks v1.3.5 stopped and rejects both qualify and publish even if publicationWorkflowsReady is later changed to true.
        - Exact immutable stopped refs cover Root, Framework, Admin, Admin Web, Docs, and the official npm package identity.
        - The active v1.3.5-stopped-tags-never-create ruleset has no bypass and blocks creation of the exact Root, Framework, Admin, v6 frontend, legacy frontend, and Docs tag refs.
        - Existing release tags remain protected from update, deletion, and non-fast-forward changes with no bypass.
        - Docs revision publication stays disabled until a later pull request binds one exact revision, the current-stable baseline, and a fresh merged-main source.
    - id: simplify-future-tag-publication
      title: Make future formal releases tag-driven
      description: One successful preview authorizes later formal tags for an explicitly selected unused version.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - A manual Release workflow dispatch accepts only the target version, runs from main, performs the full candidate build and validation, and never publishes.
        - Every formal component, Root, image, and npm publication is triggered by an exact tag push from lwnmengjing and requires a successful candidate run for the same version and merged-main commit.
        - No formal publication accepts a manually selected run ID, publish boolean, evidence URL, protected Root promotion, DeployKey, or second publish dispatch.
        - Framework, Admin, and Admin Web are completed in order before the Root tag; Root publication performs one immediate same-commit identity check rather than another validation loop.
        - One Root tag starts Root assets, the Root image, and official npmjs publication independently and in parallel; none waits on another, and all rely on the same successful preview. Docs is a later independent docs-tag action.
        - Root Release and official npm publication are serialized across versions, are safe to rerun against exact existing public state, and never move a latest pointer backward.
        - The simplified lineage cannot authorize, resume, or append artifacts to v1.3.5.
    - id: enforce-release-operator-separation
      title: Enforce one release operator without a second publish action
      description: Pull-request review remains independent while release preview, tag creation, and automated publication have one accountable operator.
      priority: must
      actor: independent-reviewer
      module: release-governance
      rules:
        - Every release preview and component, Root, npm, or Docs tag workflow requires both GITHUB_ACTOR and GITHUB_TRIGGERING_ACTOR to equal lwnmengjing before checkout, secrets, or writes.
        - One controlled-creation ruleset covers component, Root, and Docs tag namespaces and contains exactly lwnmengjing with no second user, Team, App, Integration, DeployKey, or administrator authority.
        - New release-auto, release-v6-auto, npm-auto, and prod environments retain exact tag policies but have no required reviewers; Docs consumes the organization-managed CF_API_TOKEN shared with this repository, repository and environment overrides remain absent, and the environment-bound workflow checks effective availability before deployment. Retired release and release-v6 environments allow no ref and cannot revive old workflows.
        - The obsolete Root promotion workflow, write-enabled DeployKey, promotion secret, promotion environment, and root-only creation ruleset are absent.
    - id: publish-truthful-status-documentation
      title: Disable incomplete adopter onboarding
      description: Active documentation reports availability without presenting unavailable v1.3.5 commands.
      priority: must
      actor: documentation-reader
      module: documentation
      rules:
        - Current stable remains v1.3.2 and v1.3.5 is labeled immutable-partial throughout active entry pages.
        - Active status pages contain no version-specific v1.3.5 installer invocation, Admin upgrade, official npmjs install, Root-image pull or run, or Root-tool go-install path.
        - Version-specific unavailable commands and unqualified current-adoption claims are rejected across every active non-archive documentation page, including direct deep links; explicitly labeled source-only and future-contract development guidance remains allowed.
        - Source documentation may be merged without claiming that the public Docs site has moved from v1.3.2+docs.1.
        - mss-shop remains blocked until a later unused version has complete public tool, package, image, Docs, and external-consumer evidence.
  constraints:
    - id: merged-main-only
      type: operations
      statement: Every future publication change must first merge through a pull request to main and freeze the new exact remote-main tip.
    - id: no-version-selection
      type: compatibility
      statement: This recovery does not infer or assign the next distribution or Docs revision version.
    - id: preserve-public-identities
      type: compatibility
      statement: Every existing v1.3.5, v1.3.4, v1.3.3, and v1.3.2 public identity and digest remains unchanged.
    - id: separated-authority
      type: security
      statement: SullivanPrime independently reviews the pull request; after merge, only lwnmengjing may run the preview or create release tags, and workflows publish automatically from those tags.
    - id: no-adopter-observation
      type: privacy
      statement: Policy, documentation, tests, and recovery evidence perform no adopter telemetry or registration.
  acceptance:
    - id: root-promotion-recovery-ledger
      requirement: record-immutable-partial-v135
      statement: "Issue #537 records the stopped v1.3.5 promotion, immutable public boundary, and absent Root publications before another version is selected."
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: report
          value: "GitHub issue #537 records readiness run 33023478981, both attempts of promotion run 33024175158, Root tag object e2cd54d27371061849f505f6af1b75e6e49bdf3f, cancelled runs 33024710413 and 33024710547, Go Proxy and SumDB identity, and absent Root GHCR, candidate, Release, Docs, and npmjs state."
    - id: permanent-policy-denial
      requirement: freeze-v135-publication
      statement: v1.3.5 qualify and publish requests remain rejected under every publication-ready switch state.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest tools/release/test_check_release_policy.py
    - id: future-workflow-repair
      requirement: simplify-future-tag-publication
      statement: Candidate-only dispatch and tag-driven component, Root, image, npm, and later Docs publication are covered without authorizing v1.3.5.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest discover -s tools/release -p 'test_*.py'
    - id: remote-governance-separation
      requirement: enforce-release-operator-separation
      statement: Live tag rules, environments, and retired promotion resources match the one-operator, tag-only, no-bypass stopped-tag contract.
      level: integration
      phase: checkpoint
      required: true
      evidence:
        - type: report
          value: Live governance verification confirms lwnmengjing as the sole release-tag creator, zero required environment reviewers, exact environment policies, the v1.3.5 no-bypass stop rule, and absence of Root promotion resources.
    - id: immutable-partial-documentation
      requirement: publish-truthful-status-documentation
      statement: Source Docs build and Codex in-app Browser validation show the v1.3.2 stable and v1.3.5 immutable-partial status pages, package and tooling availability, mss-shop blocking state, navigation, narrow layout, and representative refreshed deep links without version-specific dead v1.3.5 installer, Admin-upgrade, official-npmjs, Root-image, or Root-tool adoption paths, while clearly labeled source-only and future-contract development guidance remains available.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 tools/docs/check_current_docs.py
        - type: command
          value: corepack pnpm@9.15.9 --dir docs build
        - type: report
          value: Codex in-app Browser desktop, narrow-layout, deep-link refresh, navigation, console, and failed-request evidence for home, adopter status, package status, tooling status, mss-shop status, and v1.3.5.
  risks:
    - id: public-supply-chain-rewrite
      description: Deleting or recreating indexed v1.3.5 identities would split public module and checksum history.
      severity: critical
      mitigation: Preserve every identity and enforce independent software and server-side permanent-denial layers.
    - id: rerun-actor-bypass
      description: A second account could rerun only a failed write job if triggering_actor is not checked independently.
      severity: high
      mitigation: Gate both actor and triggering actor in the first step of every publication authority and write job.
    - id: stale-deep-link-guidance
      description: A cleaned home page could still leave unavailable v1.3.5 commands on searchable deep pages.
      severity: high
      mitigation: Scan all active non-archive documentation, build the site, and verify representative deep links in the in-app Browser.
    - id: premature-version-selection
      description: Treating this workflow repair as a new release could repeat the incomplete train under an unreviewed version.
      severity: critical
      mitigation: Keep publication disabled and require a later explicit version decision plus fresh merged-main qualification.
  validation:
    changed: mss verify --changed
    all: mss verify --all
    custom:
      - python3 -m unittest discover -s tools/release -p 'test_*.py'
      - python3 -m unittest tools/docs/test_check_current_docs.py
      - python3 tools/docs/check_current_docs.py
      - corepack pnpm@9.15.9 --dir docs build
      - bash -n tools/release/verify_remote_release_governance.sh
      - bash tools/release/verify_remote_release_governance.sh --repository mss-boot-io/mss-boot-admin --release-actor-login lwnmengjing
  rollout:
    strategy: phased
    migration: >-
      Merge the recovery through the existing pull request. Then, as
      lwnmengjing, create the exact stopped-tag ruleset, consolidate component,
      Root, and Docs tag authority under lwnmengjing, remove release-environment
      reviewer pauses, and retire the Root promotion environment, secret,
      DeployKey, workflow authority, and root-only ruleset. Verify the live
      contract and stop before any version, tag, artifact, package, image, Docs
      deployment, or mss-shop initialization is selected.
    rollback: >-
      Revert source corrections through a follow-up pull request and repair live
      governance only toward the same or narrower authority. Never delete,
      update, move, or reuse a public release identity.
