apiVersion: mss.io/v1alpha1
kind: Feature
metadata:
  name: foundation-v1-3-6-release
  displayName: Foundation v1.3.6 immutable partial release
  description: >-
    Historical release contract that freezes the exact v1.3.6 publication ledger after the coordinated train
    published its component and Root releases but failed the Root image and
    official npm publication paths, with Docs never created. v1.3.7 is now current stable.
  owner: release-engineering
  labels:
    domain: release-recovery
    target-version: v1.3.6
    release-status: immutable-partial
    release-commit: b1fe47a3a83209574e09d53526b122dd2cbc5277
    current-stable-now: v1.3.7
spec:
  problem: >-
    The exact merged-main commit b1fe47a3a83209574e09d53526b122dd2cbc5277
    passed preview and published the Framework, Admin, Admin Web, and Root
    releases. The preview nevertheless omitted the Root OCI artifact because a
    reusable workflow tested github.event_name for workflow_call instead of an
    explicit caller input. The later container run could not download that
    artifact. Official npm publication failed with ENEEDAUTH because the npm
    Trusted Publisher still named the retired release-v6 environment while the
    workflow used npm-auto. Docs was never tagged. Existing v1.3.6 tags and
    Releases are immutable, so new source cannot append the missing surfaces.
  goals:
    - Preserve every successful v1.3.6 component and Root identity at the exact release commit.
    - Record failed and absent surfaces precisely instead of presenting v1.3.6 as complete or wholly unpublished.
    - Permanently prevent v1.3.6 qualification, continuation, late publication, and mixed-version adoption.
    - At this checkpoint, carry the workflow and Trusted Publisher corrections into a new v1.3.7 candidate through a reviewed pull request; that candidate has since reconciled as current stable.
    - Record that v1.3.2 was the only current stable and rollback baseline at the v1.3.6 failure checkpoint; active guidance now uses v1.3.7.
  nonGoals:
    - Delete, move, recreate, reuse, or append artifacts to any v1.3.6 tag, Release, package, image, checksum, or run.
    - Publish the missing v1.3.6 npm package, Root image, or Docs from repaired source.
    - Restore or create a long-lived NPM_TOKEN or NODE_AUTH_TOKEN.
    - Describe a public v1.3.6 component as a complete or supported Thin Host distribution.
    - Change any v1.3.5, v1.3.4, v1.3.3, or v1.3.2 identity.
  actors:
    - id: release-operator
      displayName: Release operator
      description: lwnmengjing created the v1.3.6 tags; no operator may continue the stopped train.
    - id: independent-reviewer
      displayName: Independent reviewer
      description: Reviews the recovery and new-candidate pull request without becoming a second release operator.
    - id: documentation-reader
      displayName: Documentation reader
      description: Sees the exact partial ledger and is directed to the current v1.3.7 stable baseline, with v1.3.2 retained as historical previous-stable evidence.
  modules:
    - name: release-ledger
      kind: infrastructure
      operation: extend
      description: Immutable public, failed, and absent v1.3.6 release evidence.
    - name: documentation
      kind: infrastructure
      operation: extend
      description: Fail-closed adopter guidance and historical release records.
  requirements:
    - id: freeze-v136-ledger
      title: Freeze the exact public ledger
      description: Every v1.3.6 surface is recorded against one merged-main commit and exact workflow evidence.
      priority: must
      actor: release-operator
      module: release-ledger
      rules:
        - Candidate preview run 33075770677 succeeded for commit b1fe47a3a83209574e09d53526b122dd2cbc5277 but contained no Root image artifact.
        - Framework run 33078214740, Admin run 33078370221, and Admin Web run 33078525148 succeeded for the same commit.
        - Root run 33079323437 succeeded and published the immutable Root Release and assets for the same commit.
        - Container run 33079323174 failed because the required Root image preview artifact was absent; no Root image v1.3.6 exists.
        - Official npm run 33079323187 failed with ENEEDAUTH; @mss-boot-io/admin-web@1.3.6 does not exist on npmjs.
        - No docs/v1.3.6 tag, Docs Release, or production Docs deployment was created.
    - id: explain-v136-failures
      title: Preserve actionable root-cause evidence
      description: Recovery distinguishes workflow defects from credentials that should not exist.
      priority: must
      actor: independent-reviewer
      module: release-ledger
      rules:
        - The reusable container workflow selected preview-only work through github.event_name == workflow_call even though reusable workflows retain caller event context.
        - The npm workflow correctly requested id-token write, used npm publish --provenance, and removed NPM_TOKEN and NODE_AUTH_TOKEN from the publish process.
        - npm Trusted Publisher identity must match owner mss-boot-io, repository mss-boot-admin, workflow npm-release.yml, and environment npm-auto exactly.
        - ENEEDAUTH is repaired by correcting that Trusted Publisher binding for a future version, not by restoring a repository or environment npm token.
    - id: close-v136-continuation
      title: Close every continuation path
      description: Published Root and component identities make v1.3.6 an immutable partial train.
      priority: must
      actor: release-operator
      module: release-ledger
      rules:
        - Release policy accepts only the newly selected active candidate and rejects v1.3.6 qualify and publish intents.
        - Existing release-tag protection prevents update or deletion of v1.3.6 Root and component refs.
        - No rerun, manual publish, repaired workflow, token, or Trusted Publisher change authorizes a late v1.3.6 artifact.
        - A source repair uses a new version and a new exact merged-main preview.
    - id: publish-truthful-v136-docs
      title: Publish truthful partial-release documentation
      description: Current-facing pages keep stable, partial, and candidate identities distinct.
      priority: must
      actor: documentation-reader
      module: documentation
      rules:
        - At the v1.3.6 checkpoint, v1.3.2 remained current stable and rollback evidence; v1.3.7 is now current stable.
        - v1.3.5 and v1.3.6 are both immutable partial trains and are not installation or upgrade targets.
        - At this checkpoint v1.3.7 was a candidate only and exposed no adopter installation, creation, or upgrade commands before complete reconciliation; it is now current stable and adoptable.
        - At this checkpoint the public Docs site remained separately deployment-pending; the current Docs site uses the independently replaceable docs/v1.3.7 pointer.
  constraints:
    - id: exact-release-commit
      type: operations
      statement: Every v1.3.6 success, failure, and absence is bound to b1fe47a3a83209574e09d53526b122dd2cbc5277.
    - id: preserve-public-identities
      type: compatibility
      statement: No v1.3.6 public tag, Release, package, image, checksum, or run is deleted, moved, recreated, reused, or completed.
    - id: no-long-lived-npm-token
      type: security
      statement: Official npm publication uses Trusted Publishing and OIDC; no NPM_TOKEN or NODE_AUTH_TOKEN is restored.
    - id: no-mixed-distribution
      type: compatibility
      statement: Public v1.3.6 components cannot be combined with v1.3.2 or a later repair to manufacture a complete distribution.
  acceptance:
    - id: exact-v136-run-ledger
      requirement: freeze-v136-ledger
      statement: The immutable record names the exact commit, successful publication and preview runs, both failed Root-tag child workflows, and the absent Docs identity.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: report
          value: GitHub run and public-registry audit for commit b1fe47a3a83209574e09d53526b122dd2cbc5277.
    - id: v136-root-cause-review
      requirement: explain-v136-failures
      statement: Workflow and npm configuration evidence explains both failures without introducing a stored npm credential.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: report
          value: Root preview artifact inventory, failed container and npm logs, workflow source, and npm Trusted Publisher identity review.
    - id: v136-policy-denial
      requirement: close-v136-continuation
      statement: v1.3.6 is rejected after v1.3.7 becomes the sole active target and immutable public tag rules remain enforced.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest tools/release/test_check_release_policy.py
    - id: v136-documentation-ledger
      requirement: publish-truthful-v136-docs
      statement: Historical checkpoint evidence labeled v1.3.6 partial, v1.3.7 candidate, and v1.3.2 stable without candidate adoption commands; current source labels v1.3.7 stable.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 tools/docs/check_current_docs.py
        - type: command
          value: corepack pnpm@9.15.9 --dir docs build
  risks:
    - id: partial-train-top-up
      description: A rerun or repaired publisher could append a missing artifact to the already-public v1.3.6 identity.
      severity: critical
      mitigation: Deny v1.3.6 in policy and documentation and require every repair to use v1.3.7 from a new merged-main commit.
    - id: token-regression
      description: Treating ENEEDAUTH as a missing secret could restore a broad, long-lived npm credential.
      severity: critical
      mitigation: Keep token variables absent and correct the exact npm Trusted Publisher binding for the future candidate.
    - id: misleading-component-availability
      description: Public v1.3.6 Go modules or Releases could be mistaken for a complete supported distribution.
      severity: high
      mitigation: Present a per-surface matrix and point current adopters only to the complete v1.3.7 stable train; retain v1.3.2 as historical previous-stable evidence.
  validation:
    changed: mss verify --changed
    all: mss verify --all
    custom:
      - python3 -m unittest tools/release/test_check_release_policy.py
      - python3 tools/docs/check_current_docs.py
      - corepack pnpm@9.15.9 --dir docs build
  rollout:
    strategy: phased
    migration: >-
      Do not continue v1.3.6. Merge the recovery through a pull request, select
      v1.3.7 as the only candidate, repair the reusable container contract, and
      correct the npm Trusted Publisher binding before freezing a new exact
      merged-main commit.
    rollback: >-
      At this checkpoint existing adopters remained on the complete matching v1.3.2 distribution; current adopters use the complete matching v1.3.7 distribution.
      Never combine public v1.3.6 components with another patch or restore a
      stored npm token to complete the stopped train.
