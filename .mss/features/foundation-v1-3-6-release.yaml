apiVersion: mss.io/v1alpha1
kind: Feature
metadata:
  name: foundation-v1-3-6-release
  displayName: Foundation v1.3.6 complete package-first release
  description: >-
    Qualifies the first complete package-first Admin Distribution after the
    permanently stopped v1.3.5 partial train, using one merged-main Root preview
    and automatic tag-driven publication from the same exact commit.
  owner: release-engineering
  labels:
    domain: release
    target-version: v1.3.6
    release-status: candidate
spec:
  problem: >-
    v1.3.5 published immutable component identities and an indexed Root tag but
    did not complete Root tools, the Root Release, the backend image, Docs, or
    official npmjs. The repaired workflows must be exercised under an unused
    version, while package-first tools, Thin Host generation and upgrade,
    presentation configuration, migrations, authorization, and rollback are
    qualified together from one exact merged-main commit.
  goals:
    - Publish a coordinated v1.3.6 Root, Framework, Admin, and Admin Web distribution without moving or completing any v1.3.5 identity.
    - Make one non-publishing Root preview the reusable qualification source for every later formal component and Root tag.
    - Deliver checksummed cross-platform mss and mss-mcp tools with an embedded Blueprint so adopters create, set up, verify, run, and upgrade Thin Hosts without cloning the Foundation.
    - Ship the governed presentation-configuration management surface with additive schema, explicit backend authorization, immutable history, conflict control, and recovery mode.
    - Keep v1.3.2 as the rollback baseline until every v1.3.6 public surface has reconciled, and publish Docs independently after the package train.
  nonGoals:
    - Delete, move, recreate, reuse, or append authority to a v1.3.5 tag, Release, package, image, checksum, or workflow run.
    - Mark v1.3.6 current stable, expose adopter download commands, or claim mss-shop completion before public reconciliation succeeds.
    - Reintroduce runtime dynamic-model, virtual CRUD, or browser code-generation capabilities.
    - Grant presentation permissions to existing non-root roles automatically or make presentation configuration active on business pages by default.
  actors:
    - id: release-operator
      displayName: Release operator
      description: lwnmengjing runs the one preview and creates formal annotated tags after independent pull-request review.
    - id: thin-host-adopter
      displayName: Thin Host adopter
      description: Installs immutable tools and exact public Go and npm dependencies without a Foundation checkout.
    - id: presentation-administrator
      displayName: Presentation administrator
      description: Uses explicitly authorized APIs and UI actions to validate, publish, inspect, roll back, or recover presentation profiles.
  modules:
    - name: release-governance
      kind: infrastructure
      operation: extend
      description: Unused-version policy, exact merged-main preview, lightweight tag publication, and immutable public reconciliation.
    - name: package-first-tools
      kind: infrastructure
      operation: extend
      description: Cross-platform tools, embedded Blueprint, deterministic Thin Host lifecycle, and external-consumer qualification.
    - name: presentation-configuration
      kind: infrastructure
      operation: extend
      description: Additive Admin schema, service, API, permissions, menu, frontend route, immutable revisions, and recovery behavior.
  requirements:
    - id: select-unused-v136
      title: Select one unused active target
      description: Release policy activates only v1.3.6 while preserving v1.3.5 as permanently stopped and v1.3.2 as current stable.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - Root, Framework, Admin, frontend, Docs, npmjs, Go Proxy, and preview ledgers are checked before qualification and again before publication.
        - immutableStoppedVersion and every immutableStoppedPublicRef remain exactly v1.3.5.
        - The candidate source must be a clean exact commit already merged into origin/main through a reviewed pull request.
    - id: qualify-once-publish-by-tag
      title: Reuse one exact candidate preview
      description: Full validation and artifact assembly run once before tags; formal tag jobs reuse exact successful evidence and do only identity, publication, and reconciliation work.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - The manual Root workflow accepts only version v1.3.6, runs from main, and never publishes.
        - Candidate Admin checks use the same checkout's go.work Framework because mss-boot/v1.3.6 cannot exist before Framework publication.
        - Formal tags are annotated and created in Framework, Admin, frontend, then Root order by lwnmengjing.
        - Formal Admin publication still resolves the exact public Framework with GOWORK off after the Framework Release exists.
        - Root assets, Root image, and official npmjs publication start from the Root tag and reconcile the exact preview bytes independently.
        - Docs remains an independent later tag and never blocks package or image publication.
    - id: ship-package-first-distribution
      title: Complete the package-first adopter path
      description: Released tools and dependencies support the full Thin Host lifecycle from an empty directory without Foundation source.
      priority: must
      actor: thin-host-adopter
      module: package-first-tools
      rules:
        - Linux, macOS, and Windows amd64 and arm64 archives contain mss, mss-mcp, BUILD-INFO, and LICENSE with immutable checksums and source provenance.
        - Shell and PowerShell installers verify checksums, archive boundaries, requested version, and source identity before installation.
        - mss new app, setup, dev, verify, and upgrade use the version-matched embedded Blueprint and exact Admin, Framework, and Admin Web dependencies.
        - A generated Thin Host preserves business-owned backend modules, frontend routes, locale files, and configuration through reviewed three-way upgrades.
        - Candidate and post-publication external-consumer tests start outside the repository and reject local replacements, copied Foundation source, and mixed versions.
    - id: migrate-presentation-safely
      title: Apply additive presentation schema and authorization
      description: Presentation configuration remains data-only, explicitly authorized, auditable, conflict-safe, and dormant for business pages until a capability is registered.
      priority: must
      actor: presentation-administrator
      module: presentation-configuration
      rules:
        - Migration adds mss_boot_presentation_profiles and mss_boot_presentation_revisions with unique identity, aggregate version, revision, and idempotency constraints without changing existing business rows.
        - Deployment runs migrate first, then one server -a synchronization, then the long-running service.
        - The /presentation-config menu, three action nodes, and ten API permission nodes grant no compatibility access to ordinary roles; backend RBAC remains authoritative.
        - Accepted documents are strictly data-only and cannot carry JavaScript, HTML, SQL, URLs, permissions, executable components, or dynamic code.
        - Strong ETags, hashed idempotency keys, capability-hash revalidation, immutable revisions, and redacted audits prevent stale or secret-bearing writes.
        - Production capability registration remains empty, so existing business pages keep compiled defaults after upgrade.
    - id: preserve-bootstrap-security
      title: Keep initial administrator secrets out of durable state
      description: Fresh initialization removes the legacy password flag and uses an interactive hidden prompt or one-use environment injection.
      priority: must
      actor: thin-host-adopter
      module: package-first-tools
      rules:
        - migrate rejects --password, -p, and any default administrator password.
        - Interactive mss setup reads the initial secret without echo; automation exposes MSS_ADMIN_INITIAL_PASSWORD only to the one initialization job.
        - Route synchronization and long-running services never retain the initialization secret, and an already initialized database does not recreate the administrator.
    - id: prove-rollback-and-public-state
      title: Rehearse rollback and reconcile publication
      description: Candidate evidence covers rollback before publication and exact public installation after publication.
      priority: must
      actor: release-operator
      module: release-governance
      rules:
        - A normal binary rollback first enables presentation.recoveryMode, verifies compiled defaults, and redeploys only a matching v1.3.2 Admin, frontend, configuration, and lock while retaining the live database.
        - Normal rollback preserves the forward-compatible schema and data, additive presentation tables, immutable history, permission metadata, audit evidence, and business writes; no down migration deletes state.
        - Restoring the full v1.3.2 database backup is disaster recovery only and discards every write after the backup time; whenever current storage remains readable, post-backup audit and business data are exported and preserved outside the target database before restore.
        - The final ledger proves exact component commits, Release assets, npmjs package, images, installers, Go modules, checksums, and release notes before v1.3.6 can become current stable.
        - mss-shop begins only after the complete public v1.3.6 ledger succeeds and is verified as an external single-tenant consumer.
  constraints:
    - id: merged-main-only
      type: operations
      statement: Candidate preview and every formal tag must resolve to the same clean commit already contained in current origin/main.
    - id: immutable-v135
      type: compatibility
      statement: Every v1.3.5 public or stopped identity remains unchanged and permanently unauthorized for continuation.
    - id: matched-distribution
      type: compatibility
      statement: Framework, Admin, Admin Web, Root tools, and images use one v1.3.6 identity; mixed patch versions are unsupported.
    - id: no-release-secret-persistence
      type: security
      statement: Release credentials and initial administrator secrets are never committed, packaged, logged, or retained outside their bounded jobs.
  acceptance:
    - id: policy-and-vacancy
      requirement: select-unused-v136
      statement: Policy validates v1.3.6 for qualify and publish intents, permanently rejects v1.3.5, and the fresh remote ledger has no conflicting v1.3.6 identity.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest tools/release/test_check_release_policy.py
        - type: report
          value: Sanitized remote tag, Release, preview, npmjs, and Go Proxy vacancy ledger for v1.3.6.
    - id: simplified-preview-contract
      requirement: qualify-once-publish-by-tag
      statement: Workflow tests prove one candidate-only dispatch, repository-workspace Admin dependency resolution before publication, and lightweight preview-backed formal tags.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: command
          value: python3 -m unittest discover -s tools/release -p 'test_*.py'
    - id: external-thin-host
      requirement: ship-package-first-distribution
      statement: Tool installation and external Thin Host creation, setup, lifecycle, verification, upgrade, no-op, build, and browser checks pass from candidate archives without a Foundation checkout.
      level: integration
      phase: feature-freeze
      required: true
      evidence:
        - type: command
          value: bash tools/compatibility/test-standalone-mss-consumer.sh --lifecycle --upgrade
        - type: command
          value: bash tools/compatibility/test-thin-host-external-consumer.sh
    - id: presentation-migration-auth
      requirement: migrate-presentation-safely
      statement: Fresh, repeated, and v1.3.2 upgrade migrations preserve existing rows; ordinary roles receive 403 while explicitly authorized roles can manage data-only profiles and immutable history.
      level: integration
      phase: feature-freeze
      required: true
      evidence:
        - type: command
          value: cd admin && go test ./presentation ./models ./service ./apis ./middleware ./cmd/migrate/migration/system ./internal/cmd/migrate ./router
    - id: secure-bootstrap
      requirement: preserve-bootstrap-security
      statement: Installer, setup, migration, redaction, argument-rejection, and process-boundary tests expose no reusable initial password.
      level: security
      phase: feature-freeze
      required: true
      evidence:
        - type: command
          value: bash tools/install/test-install-mss.sh
    - id: browser-and-rollback
      requirement: prove-rollback-and-public-state
      statement: The in-app Browser covers permission denial, empty, draft, invalid, publish, conflict, history, rollback, recovery, direct refresh, console, and failed-request states; the normal v1.3.2 matching-pair binary rollback drill preserves the live forward-compatible schema, data, and history.
      level: e2e
      phase: feature-freeze
      required: true
      evidence:
        - type: report
          value: Candidate artifact browser evidence and rollback drill attached to the exact successful Root preview.
  risks:
    - id: prepublication-public-framework-cycle
      description: Candidate Admin dependency setup could try to download v1.3.6 Framework before its tag exists.
      severity: critical
      mitigation: Use the exact candidate checkout's go.work during preview and retain public GOWORK-off resolution only after Framework publication.
    - id: mixed-version-adoption
      description: Partial or out-of-order tags could create an unsupported mixed Distribution.
      severity: critical
      mitigation: Publish sequentially, reconcile each immutable component before the next tag, and create Root only after all component Releases match the preview commit.
    - id: stale-permission-or-presentation-write
      description: A stale client or changed capability set could publish unauthorized or non-data configuration.
      severity: high
      mitigation: Enforce backend RBAC, strong ETags, idempotency, schema validation, and in-transaction capability-hash revalidation.
    - id: premature-stable-docs
      description: Candidate source documentation could expose downloads before public artifacts exist.
      severity: high
      mitigation: Keep current stable at v1.3.2 and reject v1.3.6 stable or installation claims until post-publication Docs reconciliation.
  validation:
    changed: mss verify --changed
    all: mss verify --all
    custom:
      - python3 -m unittest discover -s tools/release -p 'test_*.py'
      - GOWORK=off go test ./internal/mss/...
      - cd mss-boot && GOWORK=off go test ./...
      - cd admin && go test ./...
      - corepack pnpm@10.34.5 --dir web/antd-v6 lint
      - corepack pnpm@10.34.5 --dir web/antd-v6 test:ci
      - corepack pnpm@10.34.5 --dir web/antd-v6 build:release
      - python3 tools/docs/check_current_docs.py
  rollout:
    strategy: phased
    migration: >-
      Before deployment, verify a v1.3.2 database backup, record its time,
      rehearse disaster recovery, and document how readable post-backup audit
      and business data will be exported and preserved. Merge the release
      preparation through normal review, freeze the new clean origin/main
      commit, run one non-publishing v1.3.6 Root preview, complete artifact and
      Browser acceptance, then create annotated Framework, Admin, frontend, and
      Root tags in order as lwnmengjing. Reconcile every public identity before
      continuing. Publish corrected Docs later from an independent tag, then
      update currentStableVersion through another pull request only after the
      complete public ledger passes.
    rollback: >-
      Stop before the next tag when any component fails. Before deployment
      rollback, enable presentation recoveryMode and confirm compiled defaults,
      then redeploy only the matching v1.3.2 Admin, frontend, configuration, and
      lock while keeping the live forward-compatible database schema and data.
      Full database-backup restore is disaster recovery only and discards every
      write after the backup time; export and preserve readable post-backup
      audit and business data outside the target database first. Never run a
      destructive down migration, delete or move a public tag, or mix versions.
