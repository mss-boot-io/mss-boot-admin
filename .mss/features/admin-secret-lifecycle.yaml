apiVersion: mss.io/v1alpha1
kind: Feature
metadata:
  name: admin-secret-lifecycle
  displayName: Admin PAT and OAuth identity lifecycle hardening
  description: >-
    Makes personal access tokens one-time secrets with irreversible storage and
    keeps OAuth provider credentials server-side while hardening identity ownership
    and local-password recovery.
  owner: admin-platform
  labels:
    domain: identity
    sensitivity: secret
    phase: p1a
spec:
  problem: >-
    Personal access tokens are currently persisted and returned as complete JWTs,
    PAT rotation can accidentally issue an interactive session token, and OAuth
    provider access tokens are persisted in localStorage and can become Admin login
    or local-password material. These behaviors amplify database, browser, log, and
    XSS exposure in production and conflict with the declared one-time PAT contract.
  goals:
    - Show a PAT secret only in a successful create or rotate response and never return it from a list endpoint.
    - Persist only a versioned digest and safe fingerprint for each PAT while preserving existing token IDs, routes, ownership, expiry, and revocation behavior.
    - Make PAT rotation invalidate the previous bearer token atomically and ensure rotated credentials remain non-refreshable PATs.
    - Complete OAuth login and account binding on the server without returning provider access or refresh tokens to browser code.
    - Prevent provider tokens from becoming Admin JWT claims, local passwords, or provider-error log content, and enforce one active Admin owner per provider identity.
    - Remove legacy GitHub and Lark provider-token keys from browser storage without changing dynamic menus or runtime language resources.
  nonGoals:
    - Move every primary Admin session flow from localStorage to an HttpOnly cookie in this atomic change; existing password, email, mobile, registration, and refresh flows retain their compatibility behavior.
    - Redesign WebSocket authentication or introduce a WebSocket ticket endpoint in this atomic change.
    - Add PAT scopes, last-used tracking, opaque PAT wire format, or a second authentication system.
    - Persist long-lived OAuth provider refresh tokens for background jobs.
    - Change dynamic menu generation, Casbin permission inheritance, or runtime language caching.
  actors:
    - id: account-user
      displayName: Interactive account user
      description: Creates and rotates PATs, signs in with OAuth, and binds providers.
    - id: automation-client
      displayName: Automation client
      description: Calls authorized Admin APIs with a PAT and must stop working immediately after rotation or revocation.
    - id: operator
      displayName: Deployment operator
      description: Applies the forward migration and verifies that legacy plaintext credentials were removed without printing them.
  modules:
    - name: personal-access-token
      operation: extend
      description: Legacy Admin PAT model, APIs, authentication checks, migration, frontend management, and documentation.
    - name: oauth-authentication
      operation: extend
      description: OAuth authorization, callback, login, binding, identity ownership, and browser callback state.
    - name: frontend-security
      operation: extend
      description: One-time secret UI, OAuth completion states, legacy storage purge, locale synchronization, and guard tests.
  requirements:
    - id: pat-one-time-secret
      title: PAT secrets are shown once
      description: Create and rotate return a secret-bearing response once, while list and all persistent models expose metadata only.
      priority: must
      actor: account-user
      module: personal-access-token
      rules:
        - The create and rotate response may contain the raw PAT and must carry no-store cache directives.
        - The list response must omit token, token hash, legacy plaintext, and all other recoverable secret material.
        - The frontend keeps the raw PAT only in component memory and clears it when the one-time dialog closes.
    - id: pat-irreversible-storage
      title: PAT storage is irreversible
      description: Existing and new PAT rows retain only a versioned SHA-256 digest and a short fingerprint because the signed JWT is a high-entropy bearer credential.
      priority: must
      actor: operator
      module: personal-access-token
      rules:
        - The legacy token column remains schema-compatible for one release but is always empty after migration and new writes.
        - Existing non-empty tokens are hashed in process with parameterized updates and are never logged.
        - Rows without plaintext or a digest fail closed and are revoked.
        - Migration execution is idempotent on fresh and upgraded schemas.
    - id: pat-atomic-rotation
      title: PAT rotation invalidates the old credential
      description: A rotate request issues a PAT for the same record ID and replaces the digest with a compare-and-swap update.
      priority: must
      actor: account-user
      module: personal-access-token
      rules:
        - Rotated JWT claims include refreshTokenDisabled and the existing personAccessToken record ID.
        - Authentication compares the raw bearer digest in constant time after selecting the record by its signed PAT ID claim.
        - Two concurrent rotations produce exactly one successful usable response.
        - Rotation and revocation races cannot leave more than one valid credential.
    - id: oauth-provider-confinement
      title: OAuth provider tokens remain server-side
      description: OAuth callbacks exchange provider codes and finish login or binding without serializing provider access or refresh tokens to the browser.
      priority: must
      actor: account-user
      module: oauth-authentication
      rules:
        - OAuth callback code and state are submitted to the Admin API in a POST body and scrubbed from the callback page URL immediately.
        - Login callback responses may contain only the Admin session result, provider, intent, and non-secret attempt metadata.
        - The Admin JWT returned by an OAuth login is held only in current-document memory and never in Web Storage; reloading or closing the document requires authentication again.
        - Binding is committed server-side for the state-bound interactive user and the browser only receives completion status.
        - Provider exchange errors and response bodies are not logged.
        - Provider access tokens are cleared before Admin JWT creation and are never used as local-password material.
        - Active GitHub and Lark identities have a normalized, database-enforced identity key with exactly one Admin owner; concurrent duplicate binding returns conflict.
    - id: legacy-browser-purge
      title: Legacy browser provider credentials are removed
      description: Application bootstrap and logout remove historical GitHub and Lark token and state keys, and product code no longer reads or writes them.
      priority: must
      actor: account-user
      module: frontend-security
      rules:
        - github.token, lark.token, github.state, lark.state, and bindingType are removed during bootstrap.
        - OAuth completion state is delivered without localStorage or sessionStorage provider-token persistence.
        - Chinese and English loading, failure, expiry, copy, revoke, and one-time-secret messages remain synchronized.
    - id: oauth-local-password-migration
      title: Legacy OAuth-linked local credentials fail closed
      description: OAuth-created accounts never derive a local password from a provider token, and legacy accounts with OAuth history require an explicit password reset before local login.
      priority: must
      actor: operator
      module: oauth-authentication
      rules:
        - New OAuth-created users receive an internal random credential and local_password_disabled is true.
        - Migration disables local-password login for every ever-linked account, including local-then-bound and soft-deleted or unbound history, because legacy rows cannot identify how the account originated.
        - OAuth login remains available; password reset or administrator-assisted recovery writes a new hash and salt and clears local_password_disabled.
        - MySQL 8.4 and PostgreSQL 17 upgrade tests prove backfill, idempotency, unchanged legacy hash material, and password-reset recovery.
  constraints:
    - id: route-compatibility
      type: compatibility
      statement: Existing PAT route paths and ownership rules remain stable; the OAuth callback GET may remain only as an explicit 405 compatibility route after POST becomes canonical.
    - id: database-compatibility
      type: data
      statement: Migrations are additive before cleanup, tolerate fresh and legacy schemas, preserve PAT IDs and validity metadata, fail on duplicate active OAuth identities, and are safe to rerun after partial MySQL or PostgreSQL DDL application.
    - id: no-secret-logging
      type: security
      statement: Raw PATs, provider access tokens, refresh tokens, authorization codes, and hashes must not be written to application or migration logs.
    - id: secret-response-cache
      type: privacy
      statement: Responses that contain a PAT or Admin login token use no-store cache directives and frontend state is cleared after use.
    - id: mixed-version-window
      type: operations
      statement: Old instances must be drained before migrations and new security semantics are relied upon because legacy refresh, OAuth login, and binding paths do not enforce the hardened contracts.
    - id: production-auth-key
      type: security
      statement: Production must inject a unique random auth.key of at least 32 bytes; startup rejects the public development default, and key rotation intentionally invalidates Admin JWTs.
    - id: ui-continuity
      type: ux
      statement: Account settings and OAuth flows expose explicit loading, empty, failure, expiry, retry, revoke confirmation, and one-time copy states on desktop and mobile layouts.
    - id: unaffected-runtime-features
      type: compatibility
      statement: Dynamic menu resolution and cached runtime language resources are outside the changed data flow and must pass regression checks unchanged.
  acceptance:
    - id: pat-lifecycle-tests
      requirement: pat-atomic-rotation
      statement: Focused backend tests prove create, authenticate, list, rotate, revoke, owner isolation, malformed digest, and concurrency semantics without plaintext persistence.
      level: security
      required: true
      evidence:
        - type: test
          value: admin/models/user_auth_token_test.go
        - type: test
          value: admin/apis/user_auth_token_test.go
    - id: pat-upgrade-tests
      requirement: pat-irreversible-storage
      statement: Fresh, legacy, empty-secret, revoked, expired, and two-run migration fixtures complete with a zero plaintext count.
      level: migration
      required: true
      evidence:
        - type: test
          value: admin/cmd/migrate/migration/system/user_auth_token_hash_test.go
        - type: test
          value: admin/cmd/migrate/migration/system/user_auth_token_hash_integration_test.go
    - id: oauth-server-tests
      requirement: oauth-provider-confinement
      statement: Login, binding, mismatch, expiry, replay, and provider failure tests prove that callback JSON never contains provider credential fields.
      level: security
      required: true
      evidence:
        - type: test
          value: admin/apis/oauth_test.go
        - type: test
          value: admin/apis/oauth_binding_concurrency_test.go
        - type: test
          value: admin/middleware/auth_secret_test.go
        - type: test
          value: admin/models/user_github_test.go
        - type: test
          value: admin/models/user_lark_oauth_test.go
        - type: test
          value: admin/cmd/migrate/migration/system/oauth_local_password_disable_integration_test.go
        - type: test
          value: admin/cmd/migrate/migration/system/oauth_identity_key_test.go
        - type: test
          value: admin/cmd/migrate/migration/system/oauth_identity_key_integration_test.go
    - id: oauth-local-password-upgrade-tests
      requirement: oauth-local-password-migration
      statement: Fresh, upgraded, and repeated migrations disable every account with OAuth history while preserving never-linked local accounts and an explicit password-reset recovery path on each supported database.
      level: migration
      required: true
      evidence:
        - type: test
          value: admin/cmd/migrate/migration/system/oauth_local_password_disable_test.go
        - type: test
          value: admin/cmd/migrate/migration/system/oauth_local_password_disable_integration_test.go
        - type: test
          value: admin/apis/user_password_reset_test.go
    - id: frontend-secret-tests
      requirement: pat-one-time-secret
      statement: Jest tests prove the PAT secret is displayed once, list cards never expose it, OAuth callback credentials stay out of Web Storage, and authenticated HTTP requests can use the document-scoped Admin JWT.
      level: integration
      required: true
      evidence:
        - type: test
          value: web/antd-v6/src/modules/account/api.test.ts
        - type: test
          value: web/antd-v6/src/modules/account/contracts.test.ts
        - type: test
          value: web/antd-v6/src/shared/auth/oauthRedirect.test.ts
        - type: test
          value: web/antd-v6/src/shared/auth/session.test.ts
        - type: test
          value: web/antd-v6/src/shared/auth/redirect.test.ts
        - type: test
          value: web/antd-v6/src/shared/api/client.test.ts
        - type: test
          value: web/antd-v6/src/shared/auth/SessionRefreshBridge.test.tsx
    - id: browser-ui-regression
      requirement: legacy-browser-purge
      statement: In-app browser verification confirms account settings, OAuth completion, dynamic menus, and language management have no newly introduced credential-flow warnings, errors, or indefinite spinners; unrelated baseline framework warnings are recorded separately.
      level: manual
      required: true
      evidence:
        - type: manual
          value: http://localhost:8001/account/settings and affected navigation paths
    - id: changed-verification
      statement: The change-aware repository verifier completes without failed required checks.
      level: integration
      required: true
      evidence:
        - type: command
          value: go run ./cmd/mss verify --changed
  risks:
    - id: plaintext-migration-loss
      description: A migration bug could clear the legacy token before a valid digest is stored and revoke otherwise usable automation credentials.
      severity: critical
      mitigation: Compute and validate the digest first, update digest and plaintext atomically per row, fail on mismatches, test upgrades twice, and back up the database before production execution.
    - id: rotation-race
      description: Concurrent refresh requests could return two responses while only the last digest remains valid, surprising clients and weakening rotation guarantees.
      severity: high
      mitigation: Use an owner-scoped digest compare-and-swap update and return a secret only when exactly one row was updated.
    - id: callback-contract-drift
      description: Backend callback, generated TypeScript types, and the login and binding frontend flows could diverge during rollout.
      severity: high
      mitigation: Introduce explicit response DTOs, update services and typings together, and add backend JSON and focused Jest contract tests.
  validation:
    changed: go run ./cmd/mss verify --changed
    all: go run ./cmd/mss verify --all
    custom:
      - cd admin && GOWORK=off go test ./apis ./middleware ./models ./cmd/migrate/migration/system
      - cd admin && GOWORK=off go test -race ./apis ./middleware ./models ./pkg
      - cd web/antd-v6 && corepack pnpm@10.34.5 lint && corepack pnpm@10.34.5 tsc
      - cd web/antd-v6 && corepack pnpm@10.34.5 test:ci
      - pnpm --dir docs build
  rollout:
    strategy: phased
    migration: >-
      Back up the database, inventory ever-linked accounts and duplicate provider
      identities, provide a tested password-reset or administrator-recovery path,
      drain old instances, inject a unique random auth.key of at least 32 bytes, and
      apply the PAT digest, local-password-disable, and OAuth identity-key migrations.
      Verify zero plaintext PATs and zero duplicate active provider identities without
      printing secrets, deploy backend and frontend together, then perform PAT plus
      OAuth login and binding smoke tests. Multi-replica OAuth state requires shared Redis.
    rollback: >-
      Raw PAT values cannot and must not be restored. The legacy token column remains
      present but empty for schema compatibility. Added local_password_disabled and
      identity_key columns may remain during application rollback; do not repopulate
      legacy PAT or provider-token material. Disable PAT create/rotate and OAuth binding,
      clear pending OAuth state, revert application code, and reissue PATs after
      returning to the hardened version. Users disabled by the migration recover only
      through OAuth login or an explicit password reset/admin-assisted recovery.
