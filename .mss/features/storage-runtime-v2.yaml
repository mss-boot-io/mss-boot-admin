  risks:
    - id: event-missed
      description: Best-effort broadcast can miss an invalidation event and leave a replica temporarily stale.
      severity: high
      mitigation: Carry authoritative revisions, reload from the database, and run periodic reconciliation independent of event delivery.
    - id: migration-half-owned
      description: Mixing global and named clients during rollout can double-close a Redis client or leave an unowned goroutine running.
      severity: critical
      mitigation: Migrate one scope at a time behind one composition root and use lifecycle leak tests before removing each old path.
    - id: provider-promotion-drift
      description: Documentation or a version milestone can promote a provider while its required integration evidence remains skipped.
      severity: high
      mitigation: Generate the matrix from exact-commit conformance results and make required skips fail the promotion gate.
    - id: queue-contract-confusion
      description: Treating revision broadcast as durable work can either lose jobs or force unnecessary queue semantics into cache reconciliation.
      severity: critical
      mitigation: Keep EventBus and WorkQueue interfaces, configuration, metrics, failure policies, and capability states separate.
    - id: semver-misclassification
      description: A clean target design may require public Go API removal that cannot truthfully ship as a v1.1 minor release.
      severity: high
      mitigation: Keep the architecture clean, then add a non-authoritative bridge or select the next major module version before publishing artifacts.
