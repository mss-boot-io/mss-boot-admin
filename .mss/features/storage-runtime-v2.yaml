  rollout:
    strategy: phased
    migration: >-
      Treat the target model as authoritative without using historical compatibility as a design
      constraint. Strict configuration, the resource owner, the additive named Redis resource,
      the public Challenge runtime, and its Admin composition are development checkpoints; next
      land scoped caches and EventBus plus reconciliation. Runtime configuration remains an immutable
      startup snapshot and changes require restart. ObjectStore plus Delivery
      maturity work moves to an optional post-v1.1 wave, followed by
      provider-by-provider promotion in untagged development waves. Migrate Admin scopes independently
      with focused failure checks at every boundary, then run the complete conformance, leak,
      real-provider, and failure-injection matrix on the feature-freeze commit. Keep WorkQueue and
      distributed lock at their provider-specific non-production evidence states unless their own
      conformance passes. Before publishing v1.1.0,
      decide whether any public removal requires a
      framework major-version release; do not hide a breaking API under a minor tag.
    rollback: >-
      Stop listeners and consumers, close the owned runtime in reverse order, and preserve authoritative
      database, challenge, queue, and object metadata. Roll back one migrated scope only after proving
      the prior path will not restore unsafe fallback, early acknowledgement, weak challenges, or
      process termination. Prefer an idempotent forward repair. Never switch object providers silently,
      reset queue offsets without an explicit recovery plan, or reconstruct security state from caches.
