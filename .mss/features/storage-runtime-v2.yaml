apiVersion: mss.io/v1alpha1
kind: Feature
metadata:
  name: storage-runtime-v2
  displayName: Build storage capabilities from explicit owned runtime resources
  description: >-
    Defines the clean target architecture, provider maturity gates, conformance evidence, and
    rollout boundary for cache, challenge state, events, work queues, locks, Redis, and object storage.
  owner: framework-platform
  labels:
    domain: storage-runtime
    target-version: v1.1.0
    release-status: planned
    compatibility: target-design-unconstrained
    evidence-enforcement: declarative-until-infrastructure-planner-and-runner
spec:
  problem: >-
    The current mss-boot/pkg/config/storage directory is not an object-storage package: it combines
    cache, Redis globals, one-time verification state, queues, and locks, while the sibling
    mss-boot/pkg/config/storage.go owns S3 construction. Consumers receive broad adapters or raw
    clients, resource ownership is implicit, optional providers can control the process, security
    state shares failure semantics with disposable caches, and Admin uses a general queue mostly as
    a Casbin broadcast channel. A coherent runtime must separate authority and delivery semantics,
    make every resource named and owned, and graduate providers only from conformance evidence.
  goals:
    - Build a typed runtime resource graph with strict configuration, named dependencies, ordered startup, readiness, cancellation, and reverse-order close.
    - Give derived caches, one-time challenges, event broadcast, durable work, distributed locks, and object storage separate contracts and failure semantics.
    - Construct one Redis client per named resource and expose only scoped consumer interfaces with automatic namespaces.
    - Replace verification-code cache helpers with an atomic cryptographic ChallengeStore.
    - Replace the Admin Casbin queue use with a revisioned EventBus plus database reconciliation.
    - Define an ObjectStore that owns opaque object identity and a separate Delivery boundary for proxy or signed access.
    - Validate every provider through one provider-specific maturity matrix and reusable conformance suite.
    - Keep S3 configuration bootstrap independent from application object-storage runtime ownership.
  nonGoals:
    - Preserve historical package names, exported interfaces, global clients, configuration shapes, or fallback behavior in the target design.
    - Promise storage hot reload in v1.1.0; runtime configuration is an immutable startup snapshot.
    - Deliver a general durable job platform or claim Kafka, NSQ, or Redis work queues stable without full retry and dead-letter evidence.
    - Use a distributed lock as a substitute for database transactions, optimistic concurrency, or a documented fencing design.
    - Add CDN orchestration, malware scanning, image transforms, resumable multipart upload, or cross-cloud replication.
    - Make Redis authoritative for database configuration, authorization policy, or other reconstructable application records.
    - Reintroduce removed runtime developer tools, dynamic models, virtual CRUD, or browser code generation.
    - Require application ObjectStore promotion, a RustFS container, or the complete Local/S3-compatible provider matrix before publishing v1.1.0; those remain optional post-v1.1 maturity work by explicit maintainer scope decision.
  actors:
    - id: application-author
      displayName: Application author
      description: Selects scoped capabilities without depending on provider clients or process globals.
    - id: platform-maintainer
      displayName: Platform maintainer
      description: Owns runtime composition, provider contracts, conformance fixtures, and package boundaries.
    - id: runtime-operator
      displayName: Runtime operator
      description: Supplies secrets, observes health and degradation, and performs controlled rollout or recovery.
    - id: release-reviewer
      displayName: Release reviewer
      description: Promotes only providers whose exact-commit evidence satisfies their maturity gate.
  modules:
    - name: bootstrap-source
      operation: extend
      description: Pre-runtime S3 configuration-source bootstrap with independent ownership.
    - name: challenge-store
      operation: create
      description: Purpose-scoped atomic one-time challenge issuance and verification.
    - name: derived-cache
      operation: extend
      description: Database-authoritative scoped caches and explicit opt-in query caching.
    - name: distributed-lock
      operation: extend
      description: Explicitly deferred lock capability with no maturity inherited from Redis or the runtime.
    - name: event-bus
      operation: create
      description: Best-effort revision notifications with deterministic reconciliation.
    - name: object-store
      operation: extend
      description: Private opaque objects and separate delivery policies.
    - name: provider-governance
      operation: create
      description: Provider maturity records, conformance suites, and exact evidence.
    - name: redis-resource
      operation: create
      description: Named Redis clients with strict standalone, Sentinel, cluster, and TLS profiles.
    - name: resource-runtime
      operation: create
      description: Typed resource graph, lifecycle ownership, readiness, and shutdown.
    - name: runtime-config
      operation: create
      description: Strict discriminated configuration and immutable normalized profiles.
    - name: work-queue
      operation: extend
      description: Durable at-least-once delivery isolated from event broadcast.
  requirements:
    - id: bind-resource-lifecycle
      title: Bind resources to one application lifecycle
      description: The composition root must start required resources before listeners and close every acquired resource in reverse dependency order.
      priority: must
      actor: platform-maintainer
      module: resource-runtime
      rules:
        - Decode and validate complete before Build, and Build starts no goroutine or network loop.
        - Start and required health checks complete synchronously before HTTP or gRPC listeners can serve.
        - Long-running workers inherit the application context and one owner performs idempotent deadline-bound close.
        - Partial startup failure closes acquired resources in reverse topological order and returns the original and cleanup errors.
    - id: classify-providers-by-evidence
      title: Classify each provider independently
      description: A provider maturity state must be derived from named, reproducible evidence and cannot be inherited from a package or release version.
      priority: must
      actor: release-reviewer
      module: provider-governance
      rules:
        - Blocked providers with a known security or data-loss path are not enabled in production defaults.
        - Experimental, beta, and stable have explicit test, deployment, observability, soak, upgrade, and rollback requirements.
        - A skipped required integration test fails promotion and every report identifies provider, version, commit, fixture, and result.
        - The report conforms to a checked-in machine schema and the release verifier rejects a missing provider, missing test, or zero-test match.
    - id: constrain-object-storage
      title: Separate object authority from delivery
      description: Object storage must use opaque server-owned identity, strict private providers, and an explicit proxy or signed-delivery layer.
      priority: must
      actor: application-author
      module: object-store
      rules:
        - Put, Open, Stat, and Delete operate on opaque ObjectRef values and return checksummed metadata.
        - Put is create-only and concurrent writes to the same ObjectRef return a typed conflict without replacing committed bytes.
        - The original filename is metadata only; keys are random, no-clobber, and never include a user-controlled path.
        - Local uses a fixed root, temporary write plus atomic publish, path and symlink confinement, and identical conformance semantics to S3-compatible providers.
        - Provider outage returns unavailable and never falls back; public URLs are not built by concatenating an endpoint and object key.
        - Admin persists authoritative owner, tenant, purpose, profile, checksum, size, detected type, state, revision, and original-name metadata through a forward migration.
        - Open, signed delivery, and delete enforce backend permission plus cross-user and cross-tenant negative authorization; ObjectRef possession grants no access.
        - For v1.1.0 this is a post-release provider-maturity target rather than a foundation release prerequisite; Local and S3-compatible remain Legacy/Blocked and incomplete production Delivery stays unavailable.
    - id: own-named-resources
      title: Own one client per named Redis resource
      description: Redis consumers must resolve explicit resource references and receive only a namespace-scoped capability interface.
      priority: must
      actor: platform-maintainer
      module: redis-resource
      rules:
        - Standalone, Sentinel, and cluster are strict mutually exclusive modes with validated TLS and SecretRef credentials.
        - One resource name creates one client, one health state, one metrics identity, and exactly one close by its owner.
        - Cache, query, session, OAuth state, challenge, event, and realtime scopes cannot read or delete outside their prefixes.
        - Cluster mode rejects nonzero database selection and every mode rejects incomplete endpoints, credentials, or certificate pairs.
    - id: defer-distributed-lock-promotion
      title: Keep distributed locking deferred without a fenced consumer
      description: A Redis lock adapter with no production consumer or fencing proof must remain disabled and cannot inherit Redis resource maturity.
      priority: must
      actor: release-reviewer
      module: distributed-lock
      rules:
        - The current adapter remains legacy and disabled by default while Admin has no production consumer.
        - A future promotion names the protected write, propagates a monotonically increasing fencing token, and proves renewal, lease loss, cancellation, partition, and stale-owner rejection.
        - Database transactions or optimistic concurrency remain preferred unless evidence shows they cannot satisfy the concrete use case.
    - id: redact-runtime-observability
      title: Make diagnostics useful without exposing secrets
      description: Health, metrics, logs, traces, doctor output, and evidence must identify resources and failure class without sensitive values.
      priority: must
      actor: runtime-operator
      module: resource-runtime
      rules:
        - Diagnostics expose resource name, provider kind, state, latency, retries, and a sanitized endpoint identity.
        - Raw credentials, secret values, challenge subjects or codes, signed URLs, message payloads, and multipart bodies are never emitted.
        - SecretRef diagnostics show only source kind and a nonreversible fingerprint when needed for rotation checks.
    - id: scope-derived-cache
      title: Keep cache derived from an authoritative source
      description: A cache must declare its authority, namespace, TTL, payload bound, failure mode, and reconstruction behavior.
      priority: must
      actor: application-author
      module: derived-cache
      rules:
        - Database-authoritative cache failure bypasses to the database and cannot change the result of an already committed write.
        - Session snapshots fall back to their session or database authority while OAuth and challenge state never use cache-style fallback.
        - Generic query caching remains opt-in beta and preserves not-found, RowsAffected, preload, scan, datasource, and table-generation semantics.
        - Active database transactions bypass shared QueryCache unless a snapshot-bound design later proves isolation, rollback, and read-your-writes semantics.
        - Bounded payloads, singleflight, namespace isolation, generation races, and cross-instance datasource identity are tested explicitly.
    - id: secure-one-time-challenges
      title: Provide an atomic ChallengeStore
      description: One-time authentication state must have security-specific issuance and verification operations rather than generic cache calls.
      priority: must
      actor: application-author
      module: challenge-store
      rules:
        - crypto/rand generates the code and only a fixed-length HMAC or equivalent verifier is stored under normalized subject and purpose.
        - The verifier uses a versioned high-entropy pepper SecretRef, constant-time comparison, and bounded dual-key rotation.
        - BeginIssue atomically enforces resend eligibility, rolling quota, expiry, and one versioned pending reservation; Verify never accepts pending values.
        - Successful delivery commits the matching pending version, replaces the prior active verifier, and starts cooldown; failed delivery aborts only that version, preserves the prior active verifier, and keeps the rolling-quota charge.
        - Stale delivery completion cannot commit or abort a newer concurrent Issue.
        - Pending state has a short lease independent from active expiry; BeginIssue atomically reclaims an expired lease after process crash or hung delivery without extending the prior active verifier.
        - Verify atomically compares, increments attempts, locks at the bound, and consumes exactly once on success.
        - Redis outage fails closed, typed outcomes avoid account enumeration, and code or subject never enters observability data.
        - Redis Cluster uses a single atomic key or explicit same-slot hash tag and proves CROSSSLOT rejection plus failover behavior.
    - id: separate-bootstrap-storage
      title: Keep configuration bootstrap independent
      description: An S3-backed configuration source must initialize before runtime configuration and cannot depend on or share hidden ownership with application ObjectStore.
      priority: should
      actor: runtime-operator
      module: bootstrap-source
      rules:
        - Bootstrap uses a minimal strict profile and returns errors without Fatal or global mutation.
        - Bootstrap credentials and client lifecycle are independent from named application object stores.
        - Bootstrap diagnostics are sanitized and do not imply application object-storage readiness.
    - id: split-events-from-work
      title: Separate broadcast events from durable work
      description: EventBus and WorkQueue must expose different delivery guarantees, failure behavior, reconciliation, and maturity.
      priority: must
      actor: platform-maintainer
      module: event-bus
      rules:
        - Casbin uses a typed revision event whose subscriber reloads authoritative database policy; delivery scope is provider-specific and never treated as the authority.
        - Casbin policy mutation and its monotonic revision commit in one database transaction; a crash between commit and publish is repaired by reconciliation.
        - Periodic revision reconciliation repairs missed, duplicate, or out-of-order events.
        - Memory and Redis EventBus providers use best-effort fan-out and explicit degraded health rather than work-queue acknowledgement semantics.
        - Each Kafka, NSQ, and Redis durable-work provider retains its own evidence state until acknowledgement-after-success, retry, dead-letter, cancellation, rebalance, idempotency, real-provider, and lifecycle conformance pass. Kafka remains legacy/Blocked after the internal D0 MarkMessage-order checkpoint.
    - id: strict-runtime-config
      title: Decode a strict discriminated configuration
      description: Runtime configuration must reject ambiguous provider shapes and resolve typed secret references before side effects.
      priority: must
      actor: runtime-operator
      module: runtime-config
      rules:
        - Unknown fields, unknown providers, multiple provider branches, empty addresses, invalid durations, and incomplete TLS or credentials are errors.
        - Configuration is normalized once into an immutable startup snapshot and Build never mutates decoded input.
        - AppConfig may select a predeclared object-storage profile and non-secret policy but cannot store raw provider credentials.
  constraints:
    - id: clean-target-boundary
      type: compatibility
      statement: Historical APIs and configuration are not architecture inputs; any temporary release bridge is outside the target interfaces and cannot preserve unsafe semantics.
    - id: explicit-authority
      type: data
      statement: Every stateful capability declares its authoritative source and whether failure means bypass, degrade, retry, or fail closed.
    - id: no-hidden-global
      type: dependency
      statement: Runtime consumers receive named scoped dependencies and cannot create, replace, or close a process-global provider client.
    - id: readiness-before-listen
      type: operations
      statement: Required resource health is established before network listeners accept requests; sibling concurrent Runnables are insufficient ordering.
    - id: secret-reference-only
      type: security
      statement: Production provider credentials enter runtime profiles through typed SecretRef values and are never persisted as raw Admin application configuration.
    - id: semver-release-check
      type: compatibility
      statement: If implementation removes or changes existing public Go APIs, release engineering must publish the framework under a compatible major-version decision rather than mislabel a breaking build as SemVer minor.
    - id: required-test-execution
      type: operations
      statement: Required Go tests are parsed from go test -json and must show at least one exact test start and pass; no-tests warnings, package skips, and required fixture skips fail promotion.
    - id: v110-object-provider-scope
      type: operations
      statement: By explicit maintainer scope decision, v1.1.0 does not start RustFS or require complete application ObjectStore provider or authorization conformance; when object-storage implementation changes, validation is limited to affected compilation, existing focused owner/configuration tests, and one basic fail-closed or Local smoke, while absent optional evidence cannot block the Foundation release.
    - id: declarative-bootstrap-boundary
      type: operations
      statement: At the v1.0.0 baseline, spec validate proves only structure and references; feature plan cannot yet plan cross-cutting modules and verify does not execute acceptance or custom evidence, so this target is not reported as implemented until the infrastructure planner and evidence runner land.
  acceptance:
    - id: admin-integration-gate
      statement: Admin integration proves readiness ordering, bounded shutdown, challenge outage failure, and Casbin reconciliation for the v1.1.0 in-scope runtime.
      level: e2e
      phase: feature-freeze
      required: true
      evidence:
        - type: test
          value: TestApplicationResourcesReadyBeforeHTTP
        - type: test
          value: TestChallengeOutageFailsClosed
        - type: test
          value: TestCasbinRevisionReconcilesCommitPublishCrash
        - type: report
          value: Required-test JSON report proving every named Admin integration test ran and passed under race detection.
    - id: object-v110-change-scope-check
      requirement: constrain-object-storage
      statement: >-
        This optional check applies only when the v1.1.0 candidate changes object-storage
        implementation paths. Compile the affected packages, select the already existing focused
        owner and configuration tests, and perform one basic fail-closed or Local smoke. Do not
        start RustFS and do not interpret this check as provider promotion.
      level: integration
      phase: feature-freeze
      required: false
      evidence:
        - type: command
          value: Compile affected object-storage packages and run the existing focused owner/configuration tests selected by the candidate diff.
        - type: manual
          value: Record one basic fail-closed or development-Local smoke only when object-storage implementation changed.
    - id: challenge-conformance-gate
      requirement: secure-one-time-challenges
      statement: One hundred concurrent issue, delivery commit/abort, and verify attempts produce at most one active issue and one verification success, preserve the prior verifier on failed delivery, reclaim crash or hung-sender pending leases without extending active expiry, reject stale delivery completion, and prove cooldown, charged failure quota, attempts, expiry, Admin purpose isolation, anti-enumeration, pepper rotation, constant-time verification, CROSSSLOT/failover behavior, outage, and redaction.
      level: security
      phase: feature-freeze
      required: true
      evidence:
        - type: test
          value: ChallengeStore security and concurrency conformance suite
        - type: test
          value: TestChallengePendingLeaseCrashRecovery
        - type: command
          value: cd mss-boot && GOWORK=off go test -race ./runtime/challenge/...
    - id: strict-runtime-config-checkpoint-evidence
      requirement: strict-runtime-config
      statement: Strict YAML and JSON decoding, discriminated Redis deployment modes, typed SecretRef resolution, redaction, immutable normalization, and side-effect-free Build are proven locally; this checkpoint does not construct or qualify a Redis provider client.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: test
          value: TestStrictDecodeRejectsUnknownFieldsAndMalformedDocuments
        - type: test
          value: TestStrictDecodeRejectsCaseVariantFieldsBeforeSecretResolution
        - type: test
          value: TestRuntimeStrictConfigurationNegativeMatrix
        - type: test
          value: TestRedisDeploymentModesNormalize
        - type: test
          value: TestRuntimeConfigSecretResolutionAndRedaction
        - type: test
          value: TestRuntimeConfigNormalizeAndBuildAreImmutableAndSideEffectFree
        - type: test
          value: TestEnvSecretResolverHonorsContextAndRedactsMissingReference
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory mss-boot --package ./runtime/config
            --run '^(TestStrictDecodeRejectsUnknownFieldsAndMalformedDocuments|TestStrictDecodeRejectsCaseVariantFieldsBeforeSecretResolution|TestRuntimeStrictConfigurationNegativeMatrix|TestRedisDeploymentModesNormalize|TestRuntimeConfigSecretResolutionAndRedaction|TestRuntimeConfigNormalizeAndBuildAreImmutableAndSideEffectFree|TestEnvSecretResolverHonorsContextAndRedactsMissingReference)$'
            --count 20 --race --go-work off
            --require TestStrictDecodeRejectsUnknownFieldsAndMalformedDocuments
            --require TestStrictDecodeRejectsCaseVariantFieldsBeforeSecretResolution
            --require TestRuntimeStrictConfigurationNegativeMatrix
            --require TestRedisDeploymentModesNormalize
            --require TestRuntimeConfigSecretResolutionAndRedaction
            --require TestRuntimeConfigNormalizeAndBuildAreImmutableAndSideEffectFree
            --require TestEnvSecretResolverHonorsContextAndRedactsMissingReference
        - type: report
          value: Exact single-package JSON evidence proving all seven required tests ran and passed twenty uncached race-detected times with no skip, including rejection of case-variant shadow fields before any secret resolver call.
    - id: configuration-negative-gate
      requirement: strict-runtime-config
      statement: The frozen candidate repeats the strict negative matrix and proves the normalized plans construct named Redis clients for standalone, Sentinel, cluster, and TLS fixtures without configuration fallback.
      level: contract
      phase: feature-freeze
      required: true
      evidence:
        - type: test
          value: Runtime strict configuration negative matrix
        - type: command
          value: cd mss-boot && GOWORK=off go test ./runtime/config/...
    - id: resource-graph-lifecycle-checkpoint-evidence
      requirement: bind-resource-lifecycle
      statement: >-
        The domain-neutral resource graph proves deterministic preflight and topological startup,
        required readiness before dependent start, reverse rollback and close, graph-owned Run
        cancellation, concurrent idempotent caller-bounded close with retry after failure, and redacted lifecycle
        diagnostics while preserving typed causes. This checkpoint exercises state-machine and
        owned-handle behavior with hermetic resources; it does not prove real goroutine or
        file-descriptor leak bounds, provider health, or Admin listener composition.
      level: contract
      phase: checkpoint
      required: true
      evidence:
        - type: test
          value: TestGraphStartsTopologicallyAndClosesInReverse
        - type: test
          value: TestGraphPreflightRejectsInvalidMissingAndCyclicDefinitionsWithoutSideEffects
        - type: test
          value: TestGraphStartupFailureRollsBackInReverseAndJoinsErrors
        - type: test
          value: TestGraphCancellationAndCloseDeadlineReleaseOwnership
        - type: test
          value: TestGraphConcurrentRepeatedCloseIsIdempotentAndRejectsStart
        - type: test
          value: TestGraphConcurrentCloseSharesFailedGenerationBeforeRetry
        - type: test
          value: TestGraphReadinessFailureRollsBackBeforeDependentStart
        - type: test
          value: TestGraphHealthAndReadyJoinRedactedDiagnostics
        - type: test
          value: TestGraphRunCancelsPeersAndJoinsSanitizedDiagnostics
        - type: test
          value: TestGraphCloseCancelsRunBeforeReverseResourceClose
        - type: test
          value: TestGraphProviderErrorsPreserveExpiredCallerDeadline
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory mss-boot --package ./runtime/resource
            --run '^(TestGraphStartsTopologicallyAndClosesInReverse|TestGraphPreflightRejectsInvalidMissingAndCyclicDefinitionsWithoutSideEffects|TestGraphStartupFailureRollsBackInReverseAndJoinsErrors|TestGraphCancellationAndCloseDeadlineReleaseOwnership|TestGraphConcurrentRepeatedCloseIsIdempotentAndRejectsStart|TestGraphConcurrentCloseSharesFailedGenerationBeforeRetry|TestGraphReadinessFailureRollsBackBeforeDependentStart|TestGraphHealthAndReadyJoinRedactedDiagnostics|TestGraphRunCancelsPeersAndJoinsSanitizedDiagnostics|TestGraphCloseCancelsRunBeforeReverseResourceClose|TestGraphProviderErrorsPreserveExpiredCallerDeadline)$'
            --count 20 --race --go-work off
            --require TestGraphStartsTopologicallyAndClosesInReverse
            --require TestGraphPreflightRejectsInvalidMissingAndCyclicDefinitionsWithoutSideEffects
            --require TestGraphStartupFailureRollsBackInReverseAndJoinsErrors
            --require TestGraphCancellationAndCloseDeadlineReleaseOwnership
            --require TestGraphConcurrentRepeatedCloseIsIdempotentAndRejectsStart
            --require TestGraphConcurrentCloseSharesFailedGenerationBeforeRetry
            --require TestGraphReadinessFailureRollsBackBeforeDependentStart
            --require TestGraphHealthAndReadyJoinRedactedDiagnostics
            --require TestGraphRunCancelsPeersAndJoinsSanitizedDiagnostics
            --require TestGraphCloseCancelsRunBeforeReverseResourceClose
            --require TestGraphProviderErrorsPreserveExpiredCallerDeadline
        - type: report
          value: >-
            Implementation commit d90b4c7 plus terminal evidence repair c830b5f have exact
            single-package JSON evidence proving all eleven required top-level tests ran and
            passed twenty uncached race-detected times with no skip.
    - id: named-redis-resource-checkpoint-evidence
      requirement: own-named-resources
      statement: >-
        One additive named Redis resource consumes the strict Runtime v2 profile and resource
        graph, constructs exactly one owned client for standalone, Sentinel, or cluster topology,
        lends stable resource-and-scope-prefixed capabilities without exposing the client or
        Close, propagates caller deadlines through lifecycle and command operations, rejects
        detached lease work, closes one tracked generation exactly once, and exposes only
        redacted provider-neutral errors. Hermetic construction matrices, a real stalled socket,
        and standalone miniredis prove this development boundary; they do not prove real Sentinel,
        cluster, TLS, Admin composition, or goroutine/file-descriptor conformance.
      level: integration
      phase: checkpoint
      required: true
      evidence:
        - type: test
          value: TestBuildIsPureAndStartConstructsOneOwnedClient
        - type: test
          value: TestBuildTopologyCredentialAndTLSMatrix
        - type: test
          value: TestDefaultFactoryConstructsTopologySpecificGoRedisClients
        - type: test
          value: TestDefaultFactoryEnablesContextTimeoutsForEveryTopology
        - type: test
          value: TestBuildRejectsNonRedisAndScopeRejectsUnsafeNames
        - type: test
          value: TestErrorsAndFormattingRedactProfileAndProviderData
        - type: test
          value: TestRealStalledPipeHonorsCallerDeadlines
        - type: test
          value: TestOneNamedResourceSharesOneClientAcrossIsolatedScopes
        - type: test
          value: TestDifferentNamedResourcesCannotSharePhysicalScopePrefix
        - type: test
          value: TestClusterPortableMultiKeyCommandsArePartitionedBySlot
        - type: test
          value: TestScopeUseContextBoundsBackgroundCommand
        - type: test
          value: TestScopeUseCancelsAndRejectsDetachedCommandAtCallbackReturn
        - type: test
          value: TestLeaseCommandsUseCallerContextAndRedactProviderErrors
        - type: test
          value: TestStandaloneDefaultClientAgainstMiniredis
        - type: test
          value: TestGetMissingReturnsProviderNeutralNotFound
        - type: test
          value: TestStartFailureCleansUpExactlyOnce
        - type: test
          value: TestReadyHealthAndCallerCancellation
        - type: test
          value: TestCloseDeadlineDrainsLeaseAndPermanentlyRejectsUse
        - type: test
          value: TestCloseDeadlineBoundsProviderCloseAndRetryJoinsGeneration
        - type: test
          value: TestResourceRejectsScopeCreationAfterCloseBegins
        - type: test
          value: TestConcurrentCloseAndUseNeverCommandsAfterClientClose
        - type: test
          value: TestResourceGraphIntegration
        - type: command
          value: >-
            go run ./cmd/mss test evidence --directory mss-boot --package ./runtime/redisresource
            --run '^(TestBuildIsPureAndStartConstructsOneOwnedClient|TestBuildTopologyCredentialAndTLSMatrix|TestDefaultFactoryConstructsTopologySpecificGoRedisClients|TestDefaultFactoryEnablesContextTimeoutsForEveryTopology|TestBuildRejectsNonRedisAndScopeRejectsUnsafeNames|TestErrorsAndFormattingRedactProfileAndProviderData|TestRealStalledPipeHonorsCallerDeadlines|TestOneNamedResourceSharesOneClientAcrossIsolatedScopes|TestDifferentNamedResourcesCannotSharePhysicalScopePrefix|TestClusterPortableMultiKeyCommandsArePartitionedBySlot|TestScopeUseContextBoundsBackgroundCommand|TestScopeUseCancelsAndRejectsDetachedCommandAtCallbackReturn|TestLeaseCommandsUseCallerContextAndRedactProviderErrors|TestStandaloneDefaultClientAgainstMiniredis|TestGetMissingReturnsProviderNeutralNotFound|TestStartFailureCleansUpExactlyOnce|TestReadyHealthAndCallerCancellation|TestCloseDeadlineDrainsLeaseAndPermanentlyRejectsUse|TestCloseDeadlineBoundsProviderCloseAndRetryJoinsGeneration|TestResourceRejectsScopeCreationAfterCloseBegins|TestConcurrentCloseAndUseNeverCommandsAfterClientClose|TestResourceGraphIntegration)$'
            --count 20 --race --go-work off
            --require TestBuildIsPureAndStartConstructsOneOwnedClient
            --require TestBuildTopologyCredentialAndTLSMatrix
            --require TestDefaultFactoryConstructsTopologySpecificGoRedisClients
            --require TestDefaultFactoryEnablesContextTimeoutsForEveryTopology
            --require TestBuildRejectsNonRedisAndScopeRejectsUnsafeNames
            --require TestErrorsAndFormattingRedactProfileAndProviderData
            --require TestRealStalledPipeHonorsCallerDeadlines
            --require TestOneNamedResourceSharesOneClientAcrossIsolatedScopes
            --require TestDifferentNamedResourcesCannotSharePhysicalScopePrefix
            --require TestClusterPortableMultiKeyCommandsArePartitionedBySlot
            --require TestScopeUseContextBoundsBackgroundCommand
            --require TestScopeUseCancelsAndRejectsDetachedCommandAtCallbackReturn
            --require TestLeaseCommandsUseCallerContextAndRedactProviderErrors
            --require TestStandaloneDefaultClientAgainstMiniredis
            --require TestGetMissingReturnsProviderNeutralNotFound
            --require TestStartFailureCleansUpExactlyOnce
            --require TestReadyHealthAndCallerCancellation
            --require TestCloseDeadlineDrainsLeaseAndPermanentlyRejectsUse
            --require TestCloseDeadlineBoundsProviderCloseAndRetryJoinsGeneration
            --require TestResourceRejectsScopeCreationAfterCloseBegins
            --require TestConcurrentCloseAndUseNeverCommandsAfterClientClose
            --require TestResourceGraphIntegration
        - type: report
          value: >-
            Implementation commit 86c0e8a, together with resource error-chain repair
            c57ffc8, has exact single-package JSON evidence proving all twenty-two required
            top-level tests ran and passed twenty uncached race-detected times with no skip.
    - id: challenge-runtime-checkpoint-evidence
      requirement: secure-one-time-challenges
      statement: >-
        Commit 1faa9ef adds the public runtime/challenge API over one named Redis Scope and
        an internal opaque same-slot Redis bridge with sealed scripts. Begin, delivery
        Commit/Abort, and Verify keep provider clients, physical keys, arbitrary evaluation,
        and Close outside the consumer surface. Operation replay at the caller/global rate
        boundary is idempotent, every syntactically valid Verify path performs the same fixed
        read/completion script count plus comparison work, and the D0 exported surface remains
        source-compatible and deprecated. This checkpoint does not prove Admin composition or
        real Redis Cluster/failover behavior and does not promote a capability to Stable.
      level: security
      phase: checkpoint
      required: true
      evidence:
