    - id: challenge-admin-composition-checkpoint-evidence
      requirement: secure-one-time-challenges
      statement: >-
        Commit 3e9ca94 composes the public Challenge API into Admin over the named Redis
        resource main and Scope challenge.email. Admin starts and readies the candidate
        graph before publishing it and before later business-route/listener assembly;
        Config is the sole runtime owner and withdraws the capability before a bounded
        close. Optional invalid or unavailable configuration leaves the application up
        but every Challenge flow returns the fixed unavailable response with no legacy
        global Redis fallback, while required configuration failure blocks setup.
        FakeCaptcha now performs BeginIssue, SMTP delivery, then Commit or Abort, and the
        login, registration, and password-reset consumers use VerifyOutcome. Runtime
        configuration remains an immutable startup snapshot, so changes require restart.
        This development checkpoint does not replace browser, frozen-SHA lifecycle, or
        real Redis Cluster/failover gates and does not promote a capability to Stable.
      level: integration
      phase: checkpoint
      required: true
      evidence:
        - type: test
          value: TestChallengeRuntimeStartsAndReadiesBeforePublicationThenCloses
        - type: test
          value: TestOptionalChallengeRuntimeInvalidOrUnavailableDegradesWithoutLegacyFallback
        - type: test
          value: TestRuntimeChallengeAccessIsSafeDuringConcurrentPublication
