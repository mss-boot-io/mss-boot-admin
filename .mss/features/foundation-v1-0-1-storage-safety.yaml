  rollout:
    strategy: phased
    migration: >-
      Land the safety changes as independently reviewable commits, starting with challenge and queue
      correctness, then upload admission and object-provider failure behavior, then focused changed-path
      lifecycle and capability evidence. General provider lifecycle continues in later development
      waves. No database migration is planned for this checkpoint and no v1.0.x tag is created.
