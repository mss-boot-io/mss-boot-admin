apiVersion: mss.io/v1alpha1
kind: ReleasePolicy
metadata:
  name: foundation-v1-1-0-development-first
spec:
  mode: development-first
  releaseBranch: main
  requireMergedPullRequestSource: true
  currentStableVersion: v1.0.0
