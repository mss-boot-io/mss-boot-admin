apiVersion: mss.io/v1alpha1
kind: AdminModule
metadata:
  name: supplier
  displayName: 供应商管理
  description: 管理供应商基础信息、信用等级、联系人和启用状态。
  labels:
    domain: procurement
    example: "true"
spec:
  entity:
    goName: Supplier
    table: biz_suppliers
    idType: uuid
    timestamps: true
    softDelete: true
    fields:
      - name: code
        column: code
        goName: Code
        displayName: 供应商编码
        displayNameEn: Code
        type: string
        required: true
        unique: true
        searchable: true
        sortable: true
        validation:
          minLength: 2
          maxLength: 64
          pattern: "^[A-Z0-9_-]+$"
        ui:
          component: input
          width: 180

      - name: name
        column: name
        goName: Name
        displayName: 供应商名称
        displayNameEn: Name
        type: string
        required: true
        searchable: true
        sortable: true
        validation:
          minLength: 2
          maxLength: 200
        ui:
          component: input
          width: 240

      - name: country
        column: country
        goName: Country
        displayName: 国家或地区
        displayNameEn: Country
        type: string
        filterable: true
        validation:
          maxLength: 100
        ui:
          component: input

      - name: contactName
        column: contact_name
        goName: ContactName
        displayName: 联系人
        displayNameEn: Contact Name
        type: string
        required: true
        searchable: true
        validation:
          maxLength: 100
        ui:
          component: input

      - name: contactEmail
        column: contact_email
        goName: ContactEmail
        displayName: 联系邮箱
        displayNameEn: Contact Email
        type: string
        validation:
          format: email
          maxLength: 254
        ui:
          component: input

      - name: creditLevel
        column: credit_level
        goName: CreditLevel
        displayName: 信用等级
        displayNameEn: Credit Level
        type: enum
        required: true
        filterable: true
        default: normal
        enumValues:
          - value: preferred
            label: 优先
            labelEn: Preferred
            color: green
          - value: normal
            label: 正常
            labelEn: Normal
            color: blue
          - value: restricted
            label: 限制
            labelEn: Restricted
            color: orange
          - value: blocked
            label: 禁用
            labelEn: Blocked
            color: red
        ui:
          component: select

      - name: enabled
        column: enabled
        goName: Enabled
        displayName: 启用状态
        displayNameEn: Enabled
        type: bool
        required: true
        filterable: true
        default: true
        ui:
          component: switch

    indexes:
      - name: idx_biz_suppliers_name
        fields: [name]
      - name: idx_biz_suppliers_country_enabled
        fields: [country, enabled]

  api:
    basePath: /suppliers
    version: v1
    operations: [list, get, create, update, delete, export]

  permissions:
    - action: list
      displayName: 查看供应商列表
      defaultRoles: [admin, procurement, finance]
    - action: read
      displayName: 查看供应商详情
      defaultRoles: [admin, procurement, finance]
    - action: create
      displayName: 创建供应商
      defaultRoles: [admin, procurement]
    - action: update
      displayName: 编辑供应商
      defaultRoles: [admin, procurement]
    - action: delete
      displayName: 删除供应商
      defaultRoles: [admin]
    - action: export
      displayName: 导出供应商
      defaultRoles: [admin, procurement, finance]

  ownership:
    mode: none
    adminBypass: true

  menu:
    path: /suppliers
    displayName: 供应商管理
    displayNameEn: Suppliers
    icon: shop
    parent: /procurement
    parentIcon: shop
    parentDisplayName: 采购管理
    parentDisplayNameEn: Procurement
    order: 20
    hidden: false

  ui:
    list: true
    form: true
    detail: true
    mobile: true
    batchDelete: false
    export: true
    import: false

  presentation:
    pageKey: supplier.list
    definitionVersion: "2"
    title:
      zh-CN: 供应商管理
      en-US: Suppliers
    dataSource: list
    list:
      density: large
      pageSize: 20
      defaultSort: []
      fields:
        - { field: code, component: text, order: 10, width: 180 }
        - { field: name, component: text, order: 20, width: 240 }
        - { field: country, component: text, order: 30 }
        - { field: contactName, component: text, order: 40 }
        - { field: contactEmail, component: text, order: 50 }
        - { field: creditLevel, component: tag, order: 60 }
        - { field: enabled, component: boolean, order: 70 }
    search:
      collapsedByDefault: false
      fields:
        - { field: code, component: input, order: 10 }
        - { field: country, component: input, order: 20 }
        - { field: creditLevel, component: select, order: 30 }
        - { field: enabled, component: boolean-filter, order: 40 }
    form:
      columns: 1
      fields:
        - { field: code, component: input, order: 10, span: 24 }
        - { field: name, component: input, order: 20, span: 24 }
        - { field: country, component: input, order: 30, span: 24 }
        - { field: contactName, component: input, order: 40, span: 24 }
        - { field: contactEmail, component: email-input, order: 50, span: 24 }
        - { field: creditLevel, component: select, order: 60, span: 24 }
        - { field: enabled, component: switch, order: 70, span: 24 }
    detail:
      columns: 1
      fields:
        - { field: id, component: copyable-code, allowedComponents: [copyable-code], order: 5, span: 24 }
        - { field: code, component: text, order: 10, span: 24 }
        - { field: name, component: text, order: 20, span: 24 }
        - { field: country, component: text, order: 30, span: 24 }
        - { field: contactName, component: text, order: 40, span: 24 }
        - { field: contactEmail, component: text, order: 50, span: 24 }
        - { field: creditLevel, component: tag, order: 60, span: 24 }
        - { field: enabled, component: boolean, order: 70, span: 24 }
        - { field: createdAt, component: date-time, order: 80, span: 24 }
        - { field: updatedAt, component: date-time, order: 90, span: 24 }
    actions:
      - action: export
        label: { zh-CN: 导出, en-US: Export }
        placement: toolbar
        order: 10
      - action: create
        label: { zh-CN: 新建, en-US: Create }
        placement: toolbar
        order: 20
      - action: read
        label: { zh-CN: 详情, en-US: Details }
        placement: row
        order: 30
      - action: update
        label: { zh-CN: 编辑, en-US: Edit }
        placement: row
        order: 40
      - action: delete
        label: { zh-CN: 删除, en-US: Delete }
        placement: row
        order: 50
        confirm:
          zh-CN: 确认删除该供应商？
          en-US: Delete this supplier?

  events:
    - name: procurement.supplier.created
      when: created
    - name: procurement.supplier.updated
      when: updated

  tests:
    unit: true
    api: true
    e2e: true
    permissionMatrix: true
    ownershipIsolation: false
    migrationUpgrade: true

  generation:
    migrationID: "20260810160000"
    authorizationMigrationID: "20260821093000"
    backend: true
    frontend: true
    frontendTargets: [antd-v6]
    docs: true
    tests: true
