apiVersion: mss.io/v1alpha1
kind: AdminModule
metadata:
  name: supplier
  displayName: 供应商管理
  description: 管理供应商基础信息、信用等级、联系人和启用状态。
  labels:
    domain: procurement
    example: "true"
spec:
  entity:
    goName: Supplier
    table: biz_suppliers
    idType: uuid
    timestamps: true
    softDelete: true
    fields:
      - name: code
        column: code
        goName: Code
        displayName: 供应商编码
        type: string
        required: true
        unique: true
        searchable: true
        sortable: true
        validation:
          minLength: 2
          maxLength: 64
          pattern: "^[A-Z0-9_-]+$"
        ui:
          component: input
          width: 180

      - name: name
        column: name
        goName: Name
        displayName: 供应商名称
        type: string
        required: true
        searchable: true
        sortable: true
        validation:
          minLength: 2
          maxLength: 200
        ui:
          component: input
          width: 240

      - name: country
        column: country
        goName: Country
        displayName: 国家或地区
        type: string
        filterable: true
        validation:
          maxLength: 100
        ui:
          component: input

      - name: contactName
        column: contact_name
        goName: ContactName
        displayName: 联系人
        type: string
        required: true
        searchable: true
        validation:
          maxLength: 100
        ui:
          component: input

      - name: contactEmail
        column: contact_email
        goName: ContactEmail
        displayName: 联系邮箱
        type: string
        validation:
          format: email
          maxLength: 254
        ui:
          component: input

      - name: creditLevel
        column: credit_level
        goName: CreditLevel
        displayName: 信用等级
        type: enum
        required: true
        filterable: true
        default: normal
        enumValues:
          - value: preferred
            label: 优先
            labelEn: Preferred
            color: green
          - value: normal
            label: 正常
            labelEn: Normal
            color: blue
          - value: restricted
            label: 限制
            labelEn: Restricted
            color: orange
          - value: blocked
            label: 禁用
            labelEn: Blocked
            color: red
        ui:
          component: select

      - name: enabled
        column: enabled
        goName: Enabled
        displayName: 启用状态
        type: bool
        required: true
        filterable: true
        default: true
        ui:
          component: switch

    indexes:
      - name: idx_biz_suppliers_name
        fields: [name]
      - name: idx_biz_suppliers_country_enabled
        fields: [country, enabled]

  api:
    basePath: /suppliers
    version: v1
    operations: [list, get, create, update, delete, export]

  permissions:
    - action: list
      displayName: 查看供应商列表
      defaultRoles: [admin, procurement, finance]
    - action: read
      displayName: 查看供应商详情
      defaultRoles: [admin, procurement, finance]
    - action: create
      displayName: 创建供应商
      defaultRoles: [admin, procurement]
    - action: update
      displayName: 编辑供应商
      defaultRoles: [admin, procurement]
    - action: delete
      displayName: 删除供应商
      defaultRoles: [admin]
    - action: export
      displayName: 导出供应商
      defaultRoles: [admin, procurement, finance]

  ownership:
    mode: none
    adminBypass: true

  menu:
    path: /suppliers
    displayName: 供应商管理
    displayNameEn: Suppliers
    icon: shop
    parent: /procurement
    order: 20
    hidden: false

  ui:
    list: true
    form: true
    detail: true
    mobile: true
    batchDelete: false
    export: true
    import: false

  events:
    - name: procurement.supplier.created
      when: created
    - name: procurement.supplier.updated
      when: updated

  tests:
    unit: true
    api: true
    e2e: true
    permissionMatrix: true
    ownershipIsolation: false
    migrationUpgrade: true

  generation:
    migrationID: "20260810160000"
    authorizationMigrationID: "20260811120000"
    backend: true
    frontend: true
    docs: true
    tests: true
