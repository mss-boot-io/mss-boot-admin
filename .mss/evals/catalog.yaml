apiVersion: mss.io/v1alpha1
kind: AgentEvaluationCatalog
metadata:
  project: mss-boot-admin
  version: 0.3.0
spec:
  cases:
    - id: project-onboarding
      title: Agent can discover the repository without conversational context
      description: Validates the project contract, canonical commands, repository Skills, and required local toolchain.
      tags: [onboarding, context, skills]
      checks:
        - type: project-context
        - type: skills-contract
          minimum: 8
        - type: doctor-required

    - id: supplier-module-contract
      title: Agent can validate and plan a complete management module
      description: Uses the checked-in supplier example as a representative full-stack AdminModule contract.
      tags: [module, generator, permissions]
      checks:
        - type: module-spec
          path: .mss/modules/example-supplier.yaml
        - type: module-generation-plan
          path: .mss/modules/example-supplier.yaml
          minimum: 12

    - id: supplier-feature-contract
      title: Agent can validate a cross-module Feature and executable acceptance contract
      description: Ensures goals, non-goals, actors, modules, requirements, security constraints, risks, rollout, and required evidence remain machine-readable and reference-safe.
      tags: [acceptance, feature, security]
      checks:
        - type: feature-spec
          path: .mss/features/example-supplier-onboarding.yaml
        - type: feature-plan
          path: .mss/features/example-supplier-onboarding.yaml
          minimum: 12

    - id: downstream-application-blueprint
      title: Agent can plan a complete standalone management-system repository
      description: Validates the versioned Blueprint, Git-tracked file selection, project identity rewrites, Foundation Lock, and three-way upgrade baseline.
      tags: [application, blueprint, upgrade]
      checks:
        - type: application-blueprint-plan
          minimum: 500

    - id: full-verification-plan
      title: Agent can derive the complete repository validation plan
      description: Ensures the verifier exposes all major backend, framework, frontend, docs, and tooling checks.
      tags: [ci, verification]
      checks:
        - type: validation-plan
          mode: all
          minimum: 8

    - id: mcp-project-tools
      title: Codex-compatible project tools remain discoverable
      description: Ensures the stdio MCP server exposes project context, Feature planning, module generation, validation, application Blueprint, and foundation upgrade tools.
      tags: [codex, mcp, tools]
      checks:
        - type: mcp-tools
          minimum: 13
