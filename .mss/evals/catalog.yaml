apiVersion: mss.io/v1alpha1
kind: AgentEvaluationCatalog
metadata:
  project: mss-boot-admin
  version: 0.1.0
spec:
  cases:
    - id: project-onboarding
      title: Agent can discover the repository without conversational context
      description: Validates the project contract, canonical commands, repository Skills, and required local toolchain.
      tags: [onboarding, context, skills]
      checks:
        - type: project-context
        - type: skills-contract
          minimum: 8
        - type: doctor-required

    - id: supplier-module-contract
      title: Agent can validate and plan a complete management module
      description: Uses the checked-in supplier example as a representative full-stack AdminModule contract.
      tags: [module, generator, permissions]
      checks:
        - type: module-spec
          path: .mss/modules/example-supplier.yaml
        - type: module-generation-plan
          path: .mss/modules/example-supplier.yaml
          minimum: 12

    - id: full-verification-plan
      title: Agent can derive the complete repository validation plan
      description: Ensures the verifier exposes all major backend, framework, frontend, docs, and tooling checks.
      tags: [verification, ci]
      checks:
        - type: validation-plan
          mode: all
          minimum: 8

    - id: mcp-project-tools
      title: Codex-compatible project tools remain discoverable
      description: Ensures the stdio MCP server exposes the stable context, generation, and validation tool set.
      tags: [mcp, codex, tools]
      checks:
        - type: mcp-tools
          minimum: 7
