apiVersion: mss.io/v1alpha1
kind: AdminPresentationPageInventory
metadata:
  name: admin-presentation-pages
  revision: "1"
  baselineBranch: codex/page-presentation-complete-design
  baselineCommit: 1b855d0b71e2884d7b743d49edc73f4dcd853787
  routeSources:
    - web/antd-v6/package/core-routes.cjs
    - web/antd-v6/config/routes.generated.ts
    - web/antd-v6/src/generated/routes.ts
spec:
  objective: >-
    Classify every compiled Admin route and define the complete target set of table-oriented
    management pages that must consume governed runtime presentation without allowing stored
    profiles to define transport, authorization, mutations, executable components, or sensitive
    subflows.
  coveragePolicy:
    closureRule: >-
      Every route declaration from every listed route source must match exactly one route record
      by declaration identity; a new, removed, duplicate, or unclassified compiled route fails
      the route-closure gate.
    includedRule: >-
      Every included page owns one stable page key, one reviewed machine source, matching backend
      and frontend definition identities, a compiled runtime consumer, disabled-by-default
      adoption, and exact-Head acceptance evidence before activation.
    excludedRule: >-
      Excluded routes remain compiled and are recorded with a durable security or product reason;
      exclusion is intentional classification rather than missing implementation.
    pairedGeneratedRouteRule: >-
      The generated Umi route configuration and packaged generated route-registration index are
      paired projections of the same generated declaration identity; their ordered path sets must
      match each other and one generated inventory record rather than being double-counted.
    defaultAdoptionMode: disabled
    activationRule: >-
      Pages advance independently through disabled, isolated shadow, and exact allowlisted active
      states; wildcard or implicit all-page activation is prohibited and recovery mode overrides
      every page.
  facetPolicies:
    full-table:
      - title.localized
      - list.columns
      - list.labels
      - list.order
      - list.visibility
      - list.width
      - list.components
      - list.density
      - list.pageSize
      - list.defaultSort
      - search.fields
      - search.labels
      - search.order
      - search.visibility
      - search.components
      - search.collapsedByDefault
      - form.fields
      - form.labels
      - form.order
      - form.visibility
      - form.components
      - form.span
      - form.columns
      - detail.fields
      - detail.labels
      - detail.order
      - detail.visibility
      - detail.components
      - detail.span
      - detail.columns
      - actions.visibility
      - actions.order
      - actions.placement
      - actions.labels
      - actions.confirmation
      - conditions.safe
    limited-table:
      - title.localized
      - list.columns
      - list.labels
      - list.order
      - list.visibility
      - list.width
      - list.density
      - list.pageSize
      - search.fields
      - search.labels
      - search.order
      - search.visibility
      - search.collapsedByDefault
