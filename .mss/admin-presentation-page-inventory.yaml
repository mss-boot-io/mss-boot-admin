      dataClass: business
      rootOnly: false
      requiredPermissions: [/suppliers]
      implementationState: generated
      adoptionState: disabled
      acceptanceState: pending
      rolloutWave: wave-1
      facetPolicy: full-table
      protectedCapabilities:
        - Routes, API operations, query encoding, permission requirements, component implementations, and action handlers remain compiled.
        - Profiles cannot create fields, actions, data sources, validators, workflows, or mutations.
      runtimeConsumer: web/antd-v6/src/generated/modules/supplier/SupplierPage.tsx
      definitionIdentity:
        state: matching
        backendHash: sha256:20979dbd25719ae69c07e383627849910d8a7fb8beb95b023362d56a4c4d72c7
        frontendHash: sha256:20979dbd25719ae69c07e383627849910d8a7fb8beb95b023362d56a4c4d72c7
