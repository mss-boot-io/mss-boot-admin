apiVersion: mss.io/v1alpha1
kind: ApplicationBlueprint
metadata:
  name: management-system
  displayName: Agent-Native Management System
  version: 0.6.1
spec:
  sourceMode: git-tracked
  templateRoot: templates/application
  sourceModule: github.com/mss-boot-io/mss-boot-admin
  sourceProjectName: mss-boot-admin
  distribution:
    name: mss-boot-admin
    version: v1.3.5
    backend:
      module: github.com/mss-boot-io/mss-boot-admin/admin
      version: v1.3.5
    frontend:
      package: "@mss-boot-io/admin-web"
      version: 1.3.5
  defaultOutputDirectory: .mss/output
  manifestPath: .mss/blueprint-manifest.json
  lockPath: .mss/lock.yaml
  requiredFiles:
    - README.md
    - AGENTS.md
    - go.mod
    - go.sum
    - cmd/server/main.go
    - internal/modules/registry.go
    - internal/modules/all/generated.go
    - internal/modules/custom/modules.go
    - Makefile
    - Dockerfile
    - .dockerignore
    - .mss/project.yaml
    - .mss/capabilities.yaml
    - .mss/commands.yaml
    - .mss/dev.yaml
    - .mss/evals/catalog.yaml
    - .agents/skills/mss-thin-host/SKILL.md
    - .agents/skills/mss-add-module/SKILL.md
    - .agents/skills/mss-add-field/SKILL.md
    - .agents/skills/mss-add-permission/SKILL.md
    - .agents/skills/mss-debug-fullstack/SKILL.md
    - .agents/skills/mss-review-change/SKILL.md
    - .agents/skills/mss-upgrade-foundation/SKILL.md
    - web/package.json
    - web/pnpm-lock.yaml
    - web/.npmrc
    - web/tsconfig.json
    - web/mss-admin.config.ts
    - web/config/config.ts
    - web/config/business-routes.ts
    - web/config/business-routes.generated.ts
    - web/src/app.tsx
    - web/src/access.ts
    - web/src/route-registrations.ts
    - web/src/business/routes.config.ts
    - web/src/business/route-registrations.ts
    - web/src/business/locales/zh-CN.ts
    - web/src/business/locales/en-US.ts
    - web/src/generated/routes.ts
    - web/src/locales/zh-CN.ts
    - web/src/locales/en-US.ts
  excludePrefixes:
    - .mss/reports/
    - .mss/run/
    - .mss/logs/
    - .mss/cache/
    - .mss/output/
  textExtensions:
    - .cjs
    - .css
    - .go
    - .graphql
    - .html
    - .js
    - .json
    - .jsx
    - .less
    - .md
    - .mjs
    - .mod
    - .proto
    - .sh
    - .sql
    - .sum
    - .toml
    - .ts
    - .tsx
    - .txt
    - .work
    - .yaml
    - .yml
  textNames:
    - Dockerfile
    - LICENSE
    - Makefile
    - CNAME
    - .dockerignore
    - .editorconfig
    - .eslintignore
    - .eslintrc.js
    - .gitignore
    - .golangci.yml
    - .nvmrc
    - .npmrc
    - .prettierignore
    - .prettierrc.js
