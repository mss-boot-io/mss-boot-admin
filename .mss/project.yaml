apiVersion: mss.io/v1alpha1
kind: Project
metadata:
  name: mss-boot-admin
  displayName: mss-boot Complete Admin Distribution
  repository: mss-boot-io/mss-boot-admin
spec:
  mission: >-
    Complete, agent-native management-system foundation with a reusable Go framework,
    importable Admin application, packaged React frontend, deterministic generation,
    verification, and customization-preserving upgrades.
  foundationVersion: 0.1.0
  distribution:
    name: mss-boot-admin
    version: v1.3.1
    backend:
      module: github.com/mss-boot-io/mss-boot-admin/admin
      version: v1.3.1
    frontend:
      package: "@mss-boot-io/admin-web"
      version: 1.3.1
  repositoryLayout:
    kind: foundation
    backend: admin
    framework: mss-boot
    frontend: web/antd-v6
    documentation: docs
    modules: admin/modules
    generated: web/antd-v6/src/generated
    businessRoutes: web/antd-v6/config/routes.generated.ts
    specifications: .mss
    skills: .agents/skills
    templates: templates
    reports: .mss/reports
  backend:
    language: go
    goVersion: "1.26.6"
    module: github.com/mss-boot-io/mss-boot-admin/admin
    frameworkModule: github.com/mss-boot-io/mss-boot-admin/mss-boot
    httpFramework: gin
    orm: gorm
    cli: cobra
    authorization: casbin
    contract: openapi
  frontend:
    language: typescript
    nodeVersion: ">=24 <25"
    packageManager: pnpm
    packageManagerVersion: "10.34.5"
    framework: react
    applicationFramework: umi
    componentLibrary: ant-design
    defaultApplication: antd-v6
    applications:
      - id: antd-v6
        path: web/antd-v6
        role: primary
        nodeVersion: ">=24 <25"
        packageManager: pnpm
        packageManagerVersion: "10.34.5"
        developmentPort: 8001
        releaseTagTemplate: web/antd-v6/{version}
        image: mss-boot-admin-antd-v6
  documentation:
    framework: dumi
    packageManager: pnpm
  database:
    local: sqlite
    supported:
      - mysql
      - postgresql
      - sqlite
  localDependencies:
    required: []
    optional:
      - redis
      - mysql
      - postgresql
  conventions:
    newBusinessModuleLayout: vertical
    legacyBusinessModuleLayout: horizontal
    specificationFirst: true
    deterministicGeneration: true
    generatedFilesMustBeIdempotent: true
    writesDefaultToDryRun: true
    productionCredentialsRequiredForDevelopment: false
  entrypoints:
    admin: cd admin && go run .
    mss: go run ./cmd/mss
  validation:
    changed: go run ./cmd/mss verify --changed
    all: go run ./cmd/mss verify --all
    reports:
      json: .mss/reports/verify.json
      markdown: .mss/reports/verify.md
