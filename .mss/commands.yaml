apiVersion: mss.io/v1alpha1
kind: CommandCatalog
metadata:
  project: mss-boot-admin
spec:
  conventions:
    shell: sh
    workingDirectory: repository-root
    nonInteractive: true
    productionCredentialsRequired: false
  commands:
    context:
      command: go run ./cmd/mss context
      description: Print the normalized project and capability context.
      outputFormats: [text, json]
      category: agent

    doctor:
      command: go run ./cmd/mss doctor
      description: Check toolchain, repository, ports, and optional local dependencies.
      outputFormats: [text, json]
      category: environment

    setup:
      command: go run ./cmd/mss setup
      description: Install repository dependencies and create safe local development state.
      category: environment
      idempotent: true

    admin-api-registry-sync:
      command: cd admin && STAGE=local go run . server -a
      description: One-shot synchronization of mounted Admin routes into the API registry required by menu API binding.
      category: environment
      idempotent: true

    dev-start:
      command: go run ./cmd/mss dev --detach
      description: Start the canonical backend and frontend development services.
      outputFormats: [text, json]
      category: environment
      idempotent: true

    dev-status:
      command: go run ./cmd/mss dev status
      description: Inspect managed development process state and HTTP readiness.
      outputFormats: [text, json]
      category: environment

    dev-stop:
      command: go run ./cmd/mss dev stop
      description: Stop managed development process trees in reverse dependency order.
      outputFormats: [text, json]
      category: environment
      idempotent: true

    dev-logs:
      command: go run ./cmd/mss dev logs
      description: Read or follow one managed development service log.
      category: environment

    new-app-plan:
      command: go run ./cmd/mss new app <name> --module <go-module> --format json
      description: Build a conflict-aware dry-run plan for a complete downstream management-system repository.
      outputFormats: [text, json]
      category: blueprint
      dryRunByDefault: true
      idempotent: true

    new-app-write:
      command: go run ./cmd/mss new app <name> --module <go-module> --write --format json
      description: Write a conflict-free downstream application and its upgrade baseline.
      outputFormats: [text, json]
      category: blueprint
      idempotent: true

    upgrade-status:
      command: go run ./cmd/mss upgrade status --format json
      description: Print the downstream application's recorded foundation baseline.
      outputFormats: [text, json]
      category: upgrade

    upgrade-plan:
      command: go run ./cmd/mss upgrade plan --foundation <checkout> --format json
      description: Perform a read-only three-way comparison against a newer foundation checkout.
      outputFormats: [text, json]
      category: upgrade
      dryRunByDefault: true
      idempotent: true

    upgrade-apply:
      command: go run ./cmd/mss upgrade apply --foundation <checkout> --yes --format json
      description: Apply a reviewed conflict-free foundation upgrade and commit the new baseline last.
      outputFormats: [text, json]
      category: upgrade
      idempotent: true

    skills-list:
      command: go run ./cmd/mss skills list
      description: List repository-local Agent Skills.
      outputFormats: [text, json]
      category: agent

    skills-validate:
      command: go run ./cmd/mss skills validate
      description: Validate Agent Skill metadata, portability, and command references.
      outputFormats: [text, json]
      category: agent

    backend-build:
      command: make build
      description: Build the admin backend.
      category: backend

    backend-test:
      command: make test
      description: Run root backend tests and write coverage.out.
      category: backend

    framework-test:
      command: make test-framework
      description: Run reusable framework tests.
      category: framework

    go-test-all:
      command: make test-all
      description: Run root backend and framework tests.
      category: backend

    go-test-evidence:
      command: "go run ./cmd/mss test evidence --directory <module-dir> --package ./<single-package> --run '^(TestOne|TestTwo)$' --count <n> --go-work off --require TestOne --require TestTwo"
      description: Run one repository-local Go package and reject external or multi-package selection plus missing, skipped, failed, cached, or inexact JSON evidence.
      outputFormats: [json]
      category: verification

    provider-evidence:
      command: go run ./cmd/mss provider evidence --required --format json
      description: Validate provider-specific exact-commit fixture evidence and reject empty, zero-hit, skipped, failed, partial, or cached-only required results.
      outputFormats: [text, json]
      category: verification

    backend-lint:
      command: make lint
      description: Run Go lint checks.
      category: backend

    frontend-install:
      command: make web-install
      description: Install the primary Ant Design 6 frontend dependencies with its frozen lockfile.
      category: frontend

    frontend-lint:
      command: make web-lint
      description: Run Biome and TypeScript checks for the primary Ant Design 6 frontend.
      category: frontend

    frontend-test:
      command: make web-test
      description: Run Vitest for the primary Ant Design 6 frontend.
      category: frontend

    frontend-build:
      command: make web-build
      description: Build and validate the primary Ant Design 6 release profile.
      category: frontend

    frontend-v6-install:
      command: make web-v6-install
      description: Install the independent Ant Design 6 frontend from its frozen lockfile.
      category: frontend

    frontend-v6-lint:
      command: make web-v6-lint
      description: Run Biome and TypeScript checks for the independent Ant Design 6 frontend.
      category: frontend

    frontend-v6-test:
      command: make web-v6-test
      description: Run Vitest for the independent Ant Design 6 frontend.
      category: frontend

    frontend-v6-build:
      command: make web-v6-build
      description: Build and validate the independently releasable Ant Design 6 frontend.
      category: frontend

    docs-install:
      command: make docs-install
      description: Install documentation dependencies with the frozen lockfile.
      category: docs

    docs-build:
      command: make docs-build
      description: Build the documentation site.
      category: docs

    verify-changed:
      command: go run ./cmd/mss verify --changed
      description: Compute and execute the minimum development-checkpoint checks for the current Git diff; this never authorizes a release.
      outputFormats: [text, json]
      category: verification

    verify-all:
      command: go run ./cmd/mss verify --all
      description: Execute the complete repository validation suite after feature freeze or when explicitly requested for diagnosis.
      outputFormats: [text, json]
      category: verification

    release-policy-check:
      command: python3 tools/release/check_release_policy.py --component <root|framework|frontend> --version <version> --tag <tag> --intent <qualify|publish>
      description: Validate the reviewed target and namespace; qualify permits unpublished candidate work, while publish also requires publication workflow readiness and is not itself phase approval.
      outputFormats: [text]
      category: release

    release-source-verify:
      command: python3 tools/release/verify_release_source.py --repository <owner/repository> --commit <full-sha> [--tag <tag>]
      description: Fail closed unless the clean exact checkout is contained in fresh origin/main, is the final merge or squash commit produced by a merged PR targeting main, and any supplied remote tag peels exactly to that commit.
      outputFormats: [text]
      category: release
      idempotent: true

    release-phase-evidence-plan:
      command: python3 tools/release/release_phase_evidence.py plan --target-version v1.2.3 --commit <full-sha> --phase <checkpoint|feature-freeze|pre-framework|pre-root|post-publication> --output .mss/reports/release-phase-plan.json
      description: Resolve the explicitly selected v1.2.3 Feature contracts into a shell-free, phase-scoped command plan while retaining manual, report, and non-exact evidence as release-manager review items.
      outputFormats: [json]
      category: release
      idempotent: true

    release-phase-evidence-run:
      command: python3 tools/release/release_phase_evidence.py run --target-version v1.2.3 --commit <full-sha> --phase feature-freeze --output .mss/reports/release-phase-command-evidence.json
      description: On one clean frozen commit, execute the scoped release Feature commands without a shell, retain per-command digests and logs, and fail when a selected command fails, times out, or still uses non-exact named Go test evidence.
      outputFormats: [json]
      category: release

    release-qualification-decision:
      command: python3 tools/release/release_qualification_decision.py --target-version v1.2.3 --commit <full-sha> --phase feature-freeze --browser-evidence-commit <full-sha> --browser-evidence-ref <reference> --blueprint-evidence-commit <full-sha> --blueprint-evidence-ref <reference> --output .mss/reports/release-qualification-decision.json
      description: Bind the Codex in-app Browser and external Blueprint rehearsal evidence to the exact frozen SHA while recording carry-forward and optional ObjectStore/RustFS decisions.
      outputFormats: [json]
      category: release
      idempotent: true

    release-readiness-attestation-create:
      command: python3 tools/release/release_readiness_attestation.py create --output <attestation.json> --policy .mss/release-policy.yaml --target-version v1.2.3 --commit <full-sha> --phase <checkpoint|feature-freeze|pre-framework|pre-root> --workflow-run-id <run-id> --workflow-run-url <run-url> --publication-authority <true|false>
      description: Create the strict readiness metadata for one exact workflow run; the checked-in development policy permits checkpoint qualification only and cannot grant publication authority.
      outputFormats: [text]
      category: release

    release-readiness-attestation-verify:
      command: python3 tools/release/release_readiness_attestation.py verify --attestation <attestation.json> --policy .mss/release-policy.yaml --target-version v1.2.3 --commit <full-sha> --phase <checkpoint|feature-freeze|pre-framework|pre-root> --workflow-run-id <run-id> --workflow-run-url <run-url> --intent <qualify|publish>
      description: Reject an attestation unless its exact schema, version, commit, phase, policy digest, selected run identity, URL, and authority match the requested intent.
      outputFormats: [text]
      category: release
      idempotent: true

    release-readiness-run-verify:
      command: bash tools/release/verify_readiness_run.sh --repository <owner/repository> --run-id <run-id> --target-version v1.2.3 --commit <full-sha> --phase <pre-framework|pre-root> --policy .mss/release-policy.yaml
      description: Read the specifically selected successful release-readiness workflow run and its run-named artifact, then require an exact publication attestation before a publishing workflow writes externally.
      outputFormats: [text]
      category: release
      idempotent: true

    direct-verify-all:
      command: make verify-all
      description: Compatibility fallback before the mss verifier is available.
      category: verification

    module-spec-validate:
      command: go run ./cmd/mss spec validate
      description: Validate an AdminModuleSpec against schema and semantic rules.
      category: generation

    module-generate:
      command: go run ./cmd/mss module generate
      description: Generate or synchronize a vertical admin module for the only supported antd-v6 frontend target.
      category: generation
      dryRunByDefault: true
      idempotent: true

    module-generate-v6:
      command: go run ./cmd/mss module generate --frontend-target antd-v6
      description: Generate or drift-check the isolated Ant Design 6 projection declared by an AdminModule specification.
      category: generation
      dryRunByDefault: true
      idempotent: true

    eval-list:
      command: go run ./cmd/mss eval list
      description: List repository Agent evaluation cases.
      outputFormats: [text, json]
      category: eval

    eval-run:
      command: go run ./cmd/mss eval run
      description: Execute selected Agent evaluation cases; the complete --all matrix is a feature-freeze and release-readiness activity.
      outputFormats: [text, markdown, json]
      category: eval

    eval-report:
      command: go run ./cmd/mss eval report
      description: Read the latest persisted Agent evaluation report.
      outputFormats: [text, markdown, json]
      category: eval
