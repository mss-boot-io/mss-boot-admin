      guidance: >-
        Treat Unreleased, planned, preview, branches, and local workspace replacements as non-stable.
        Published historical versions remain immutable and their candidate evidence is not reusable.
        v1.3.2 remains the immutable current stable train, and v1.3.3 remains immutable
        partial-publication evidence that cannot authorize a later repair. v1.3.4 is also immutable
        partial-publication evidence: Framework, Admin, and Admin Web were published from
        d9b210d6672800f84f6403496a3ae871fb2aea9f, while Root, Docs, and npmjs were not published after
        the Thin Host frozen lock discarded the frontend tarball URL; the correction merged in
        99a4f1ad157b934841786be031e7c55b8e25f5b5. v1.3.5 and its exact Root, Framework,
        Admin, frontend, Docs, and npm public refs are permanently stopped; existing refs or artifacts
        remain immutable and may not authorize continuation, deletion, movement, or recreation. A
        v1.3.6 published Framework, Admin, Admin Web, and Root from
        b1fe47a3a83209574e09d53526b122dd2cbc5277, but its Root image and official npm workflows
        failed and Docs was never created. It is an immutable partial train and must not be continued;
        npm recovery uses the exact Trusted Publisher binding and never restores NPM_TOKEN. The
        reviewed active v1.3.7 version must be built from one exact clean merged-main commit and
        first pass the candidate-only Release preview. Formal Framework, Admin, frontend, and Root
        tags created by lwnmengjing then publish automatically; the Root tag also starts the image
        and official npm workflows, while Docs follows later from its independent tag. Reconcile
        public Go, npm, GitHub Release, image, Docs, and installed-consumer probes. Any repair
        requires a follow-up PR and a new merged-main commit; no workflow may mutate an already-public
        Release or reuse historical evidence.
