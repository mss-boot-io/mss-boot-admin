    - id: agent.module-generator
      displayName: Deterministic Admin Module Scaffold Generator
      status: beta
      owners: [agent-infrastructure]
      paths:
        - .mss/schemas/admin-module.schema.json
        - .mss/features/foundation-v1-1-0-generator-blueprint.yaml
        - docs/docs/releases/v1-1-0-d3-supplier-backend.md
        - internal/mss/generator
        - templates/module
      guidance: >-
        D3 now covers deterministic backend specification projection, dry-run/check, path confinement,
        stable ordering, obsolete generated-file cleanup, explicit SQLite/MySQL/PostgreSQL forward DDL,
        validated DTO/service/API/OpenAPI/export, typed post-commit events, and fail-closed injected
        backend authorization. Commit d92458c adds a separate lossless-ID authorization migration,
        exact default-role Casbin policies, MENU/COMPONENT/API metadata, role/global revisions, and
        the AdminAuthorizer permission matrix. The Supplier plan intentionally remains phase
        backend-checkpoint and complete false with 19 deferred frontend, documentation, and E2E
        projections. Beta does not imply typed frontend client, UI/browser acceptance, generated
        module docs, downstream upgrade completeness, or frozen-SHA release evidence.

    - id: agent.fullstack-module-generator
      displayName: Full-Stack Upgradeable Module Generator
      status: planned
      owners: [agent-infrastructure, backend, frontend]
      paths:
        - .mss/features/foundation-v1-1-0-generator-blueprint.yaml
        - .mss/features/example-supplier-onboarding.yaml
        - .mss/modules/example-supplier.yaml
        - admin/modules/supplier
        - docs/docs/releases/v1-1-0-d3-supplier-backend.md
        - internal/mss/blueprint
        - internal/mss/generator
        - templates/module
      guidance: >-
        Commit 5a60ad6 delivers the checked-in Supplier backend slice with explicit forward migration,
        DTO/service/API/OpenAPI/export, typed post-commit events, fail-closed authorizer injection,
        deterministic drift checks, and SQLite/MySQL/PostgreSQL development evidence. Commit d92458c
        projects the separate authorization migration, exact admin/procurement/finance policies,
        persisted menu metadata, and positive/negative Admin authorization matrix. The capability
        stays Planned and the machine plan stays complete false until D5 adds the typed client,
        frontend states, UI/browser E2E, generated docs, and the customization-preserving three-way
        upgrade, followed by exact frozen-SHA reruns. Do not expand to a second domain first.

