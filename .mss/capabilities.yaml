        - internal/mss/generator
        - templates/module
      guidance: >-
        Current maturity covers deterministic scaffold planning, dry-run, path confinement, stable
        ordering, and basic idempotency only. It does not imply real forward migration, permission
        persistence/enforcement, default roles, menu registration, OpenAPI/client, full frontend,
        events, export, or downstream upgrade completeness.

