      guidance: >-
        A validated AdminModule now projects a complete vertical backend, forward migrations,
        permission and menu metadata, typed Ant Design 6 client/page/routes/locales, generated module
        documentation, and semantic browser E2E. The Supplier plan is complete with zero deferred
        projections and is exercised through repository-external Thin Host generation, build,
        authorization, browser, upgrade, preservation, and two-run idempotency gates. Exact
        v1.3.7 public Go and npm consumption plus the package-first mss-shop exemplar are the current
        qualification target. Keep the capability beta until that second
        representative domain proves the schema without weakening deterministic or
        generated/custom ownership boundaries.

    - id: foundation.admin-distribution
      displayName: Complete Admin Distribution and Thin Business Hosts
      status: beta
      owners: [agent-infrastructure, backend, frontend, release-engineering, security]
      paths:
        - .mss/features/complete-admin-distribution-thin-host.yaml
        - .mss/features/foundation-v1-3-4-release-recovery.yaml
        - .mss/features/foundation-v1-3-5-release-recovery.yaml
        - .mss/features/foundation-v1-3-6-release.yaml
        - .mss/features/foundation-v1-3-7-release.yaml
        - .mss/project.yaml
        - .mss/lock.yaml
        - .mss/blueprints/management-system.yaml
        - admin/app
        - admin/business
        - admin/modules/supplier
        - web/antd-v6
        - templates/application
        - internal/mss/app
        - internal/mss/blueprint
        - internal/mss/generator
        - internal/mss/project
        - internal/mss/verify
        - docs/adr/2026-08-19-complete-admin-distribution-and-thin-business-host.md
        - docs/docs/architecture/complete-admin-distribution-and-thin-business-host.zh-CN.md
      guidance: >-
        Keep one complete Admin backend and one complete V6 frontend. External business repositories
        consume them through coordinated versioned dependencies and add only compile-time modules and
        pages. The external Supplier host has passed GOWORK=off backend, local npm tarball,
        one-runtime, deterministic Thin Host generation and upgrade, authorization, and browser E2E
        gates; v1.3.0-rc.6 and stable v1.3.2 remain immutable historical evidence. The v1.3.3
        partial train stopped before root, Docs, and npmjs publication and cannot be reused. The
        v1.3.4 partial train published Framework, Admin, and Admin Web from
        d9b210d6672800f84f6403496a3ae871fb2aea9f, but Root, Docs, and npmjs remained unpublished
        after the Thin Host frozen lock lost the exact frontend tarball URL. Its correction merged
        in 99a4f1ad157b934841786be031e7c55b8e25f5b5. The v1.3.5 train is permanently
        stopped after partial publication and cannot be continued. v1.3.6 then published Framework,
        Admin, Admin Web, and Root from b1fe47a3a83209574e09d53526b122dd2cbc5277, while the
        Root image and npm publication failed and Docs was never created; it is also an immutable
        partial train. The active v1.3.7 target removes
        the Foundation-checkout dependency from application creation and Distribution upgrade, and
        requires public Go/npm resolution plus post-publication reconciliation. The capability
        remains beta until a
        second representative domain and a later stable-to-stable Thin Host upgrade prove the
        extension and upgrade boundaries again.
        Do not add runtime plugins, micro-frontends, core feature selection, telemetry, import records,
        or adopter registration.

