apiVersion: mss.io/v1alpha1
kind: CapabilityCatalog
metadata:
  project: mss-boot-admin
spec:
  statuses:
    stable: supported for new production modules
    beta: usable with explicit validation and compatibility review
    legacy: maintained for compatibility, not recommended for new modules
    planned: part of the approved roadmap but not yet implemented
  capabilities:
    - id: identity.authentication
      displayName: Authentication
      status: stable
      owners: [backend, frontend]
      backendPaths:
        - admin/middleware/auth.go
        - admin/models/user.go
        - admin/apis/user.go
      frontendPaths:
        - web/antd/src/pages/User/Login
        - web/antd/src/access.ts
      guidance: >-
        Reuse the existing JWT and OAuth2 flows; do not create a parallel login
        system, and never serialize provider access or refresh tokens to browser
        code or persist them in browser storage.

    - id: identity.personal-access-token
      displayName: Personal Access Token
      status: stable
      owners: [backend, frontend]
      backendPaths:
        - admin/models/user_auth_token.go
        - admin/apis/user_auth_token.go
      frontendPaths:
        - web/antd/src/pages/Account/Settings/components/AccessToken.tsx
      guidance: >-
        Return raw PAT values only from create or rotate, persist only a
        versioned digest and safe fingerprint, and use owner-scoped atomic
        rotation and revocation so old bearer values fail immediately.

    - id: authorization.rbac
      displayName: Casbin RBAC
      status: stable
      owners: [backend, frontend]
      backendPaths:
        - admin/models/role.go
        - admin/models/menu.go
        - admin/apis/role.go
        - admin/middleware/auth.go
      frontendPaths:
        - web/antd/src/access.ts
        - web/antd/src/pages/Role
        - web/antd/src/pages/Menu
      guidance: Enforce permissions on the backend; frontend checks are advisory only.

    - id: organization.directory
      displayName: User, Department, Post, and Role Directory
      status: stable
      owners: [backend, frontend]
      backendPaths:
        - admin/models/user.go
        - admin/models/department.go
        - admin/models/post.go
        - admin/models/role.go
      frontendPaths:
        - web/antd/src/pages/User
        - web/antd/src/pages/Department
        - web/antd/src/pages/Post
        - web/antd/src/pages/Role
      guidance: Reuse existing organization entities for management applications.

    - id: governance.audit
      displayName: Audit and Login Logs
      status: stable
      owners: [backend]
      backendPaths:
        - admin/middleware/audit.go
        - admin/models/audit_log.go
        - admin/service/audit.go
      guidance: Redact secrets and sensitive request bodies before persistence.

    - id: platform.configuration
      displayName: Application and System Configuration
      status: stable
      owners: [backend, frontend]
      paths:
        - .mss/features/admin-config-cache-consistency.yaml
        - docs/docs/admin/config-cache-consistency.md
      backendPaths:
        - admin/config/config.go
        - admin/apis/app_config.go
        - admin/apis/system_config.go
        - admin/models/app_config.go
        - admin/service/app_config.go
        - admin/service/config_revision.go
        - admin/service/user_config.go
      frameworkPaths:
        - mss-boot/pkg/config/storage/cache
      frontendPaths:
        - web/antd/src/pages/AppConfig
        - web/antd/src/pages/SystemConfig
      guidance: >-
        Prefer typed configuration and secret references over raw unvalidated values. Keep the database
        authoritative: cache keys bind every query parameter, application writes commit before best-effort
        invalidation, and personal snapshots use owner-isolated database revisions. Never cache opaque
        SystemConfig content or Auth=true application secrets. Revisioned configuration reads fall back to the
        database when Redis fails; generic query caching is disabled by default and requires a stale-tolerant allowlist.

    - id: platform.theme-settings
      displayName: Layered Application and Personal Theme Settings
      status: planned
      owners: [backend, frontend]
      paths:
        - .mss/features/admin-theme-settings-precedence.yaml
        - .github/workflows/theme-settings-integration.yml
        - docs/adr/2026-08-07-layered-theme-settings-precedence.md
        - docs/docs/admin/theme-settings-precedence.md
      backendPaths:
        - admin/apis/app_config.go
        - admin/apis/theme_http.go
        - admin/apis/user_config.go
        - admin/dto/theme.go
        - admin/models/config_revision.go
        - admin/service/app_config.go
        - admin/service/config_revision.go
        - admin/service/theme.go
        - admin/service/user_config.go
        - admin/cmd/migrate/migration/system/20260807130000_app_config_theme_permissions.go
        - admin/cmd/migrate/migration/system/20260807150000_config_revisions.go
      frontendPaths:
        - web/antd/config/defaultSettings.ts
        - web/antd/src/app.tsx
        - web/antd/src/components/MssBoot/ThemeRuntimeBridge.tsx
        - web/antd/src/components/MssBoot/theme.tsx
        - web/antd/src/pages/AppConfig
        - web/antd/src/pages/Account/Settings
        - web/antd/src/services/admin/themeSettings.ts
        - web/antd/src/utils/themeSession.ts
        - web/antd/src/utils/themeSettings.ts
        - web/antd/src/utils/themeSync.ts
      guidance: >-
        Resolve immutable code defaults with sparse application and then sparse current-user overrides.
        Reuse one scope-aware editor; omission means no mutation, null restores inheritance, and false is explicit.
        Application reads and writes require config:read and config:write, while personal routes are authenticated-self.
        A save is atomic, revisioned through a composite-key database resource, conditionally written with a strong
        ETag, and returned as the canonical flat sparse resource plus _meta. Database-revisioned public-profile caches,
        identity-bound snapshots, and schema-versioned cross-tab events are derived state only. This capability remains
        planned until the external MySQL/PostgreSQL upgrade matrix and the complete browser E2E acceptance suite pass.

    - id: platform.cache-lock-queue
      displayName: Cache, Distributed Lock, and Queue Adapters
      status: stable
      owners: [framework]
      frameworkPaths:
        - mss-boot/pkg/config/cache.go
        - mss-boot/pkg/config/locker.go
        - mss-boot/pkg/config/queue.go
        - mss-boot/pkg/config/storage
      guidance: Keep adapters domain-neutral and test fallback behavior.

    - id: platform.storage
      displayName: Local and S3-Compatible Object Storage
      status: beta
      owners: [backend, framework]
      backendPaths:
        - admin/service/storage.go
      frameworkPaths:
        - mss-boot/pkg/config/storage.go
      guidance: Validate size, content type, path confinement, and credential handling.

    - id: operations.task
      displayName: Scheduled and On-Demand Tasks
      status: beta
      owners: [backend, framework]
      backendPaths:
        - admin/models/task.go
        - admin/models/task_run.go
        - admin/apis/task.go
        - admin/cmd/server/server.go
      frameworkPaths:
        - mss-boot/core/server/task
      guidance: >-
        Keep user-managed Task CRUD and persistence separate from immutable process-local system jobs.
        Always-on monitor and session-cleanup jobs are registered with the task server, ignore task.enable,
        and never write Task or TaskRun rows; the user-task reconciler is added only when task.enable is true.
        task.enable and task.spec are startup snapshots, so configuration changes require an Admin restart.

    - id: operations.notification
      displayName: Notices and Notification Channels
      status: beta
      owners: [backend, frontend]
      backendPaths:
        - admin/models/notice.go
        - admin/service/notification_channel.go
      frontendPaths:
        - web/antd/src/pages/Notice
      guidance: Treat channel credentials as secrets and test failure paths.

    - id: operations.monitoring
      displayName: Process and Host Monitoring
      status: beta
      owners: [backend, frontend]
      backendPaths:
        - admin/service/monitor.go
        - admin/service/monitor_sampler.go
        - admin/apis/monitor.go
        - admin/cmd/server/server.go
      frameworkPaths:
        - mss-boot/core/server/task
      frontendPaths:
        - web/antd/src/hooks/useMonitorData.ts
        - web/antd/src/components/MonitorTrend
        - web/antd/src/pages/Monitor
        - web/antd/src/pages/Welcome.tsx
      guidance: >-
        Sample through the task server's immutable built-in system-job lane and serve bounded instance-local history;
        monitoring is not a user Task and is not a replacement for external observability.

    - id: integration.websocket
      displayName: WebSocket Events
      status: beta
      owners: [backend, frontend]
      backendPaths:
        - admin/apis/ws.go
        - admin/center/websocket
      frontendPaths:
        - web/antd/src/hooks/useWebSocket.ts
      guidance: Reuse the current event path and validate clustered Redis behavior when enabled.

    - id: integration.kubernetes
      displayName: Kubernetes Client and Resource Actions
      status: beta
      owners: [backend, framework]
      backendPaths:
        - admin/config/clusters.go
      frameworkPaths:
        - mss-boot/pkg/config/k8s
        - mss-boot/pkg/response/actions/k8s
      guidance: Avoid process-wide exits and broad credentials for optional cluster integrations.

    - id: internationalization.runtime
      displayName: Runtime Internationalization Resources
      status: stable
      owners: [backend, frontend]
      backendPaths:
        - admin/models/language.go
        - admin/apis/language.go
      frontendPaths:
        - web/antd/src/locales
        - web/antd/src/pages/Language
      guidance: Keep zh-CN and en-US user-facing keys synchronized.

    - id: agent.project-contract
      displayName: Machine-Readable Project Contract
      status: beta
      owners: [agent-infrastructure]
      paths:
        - AGENTS.md
        - .mss/project.yaml
        - .mss/capabilities.yaml
        - .mss/commands.yaml
      guidance: Keep machine-readable facts synchronized with code and validation.

    - id: agent.cli
      displayName: Unified mss CLI
      status: planned
      owners: [agent-infrastructure]
      paths:
        - cmd/mss
        - internal/mss
      guidance: CLI is the source of truth for deterministic operations used by Skills, CI, and MCP.

    - id: agent.module-generator
      displayName: Deterministic Admin Module Generator
      status: planned
      owners: [agent-infrastructure]
      paths:
        - .mss/schemas/admin-module.schema.json
        - internal/mss/generator
        - templates/module
      guidance: Require dry-run, path confinement, stable ordering, golden tests, and two-run idempotency.

    - id: agent.skills
      displayName: Repository Agent Skills
      status: planned
      owners: [agent-infrastructure]
      paths:
        - .agents/skills
      guidance: Skills orchestrate the CLI and must not duplicate generator or verifier logic.

    - id: agent.mcp
      displayName: mss MCP Server
      status: planned
      owners: [agent-infrastructure]
      paths:
        - cmd/mss-mcp
      guidance: Thin protocol adapter over stable CLI packages; write tools default to dry-run.

    - id: agent.evals
      displayName: Agent Task Evaluations
      status: planned
      owners: [agent-infrastructure, dev-test]
      paths:
        - .mss/evals
        - internal/mss/eval
      guidance: Measure correctness, authorization, idempotency, unrelated changes, and upgrade behavior.

    - id: foundation.upgrade
      displayName: Blueprint and Downstream Upgrade System
      status: planned
      owners: [agent-infrastructure]
      paths:
        - .mss/lock.yaml
        - internal/mss/upgrader
        - tools/codemods
      guidance: Preserve downstream customizations and emit an explicit conflict and migration report.

    - id: foundation.versioned-release
      displayName: Versioned Foundation Release Governance
      status: planned
      owners: [release-engineering, agent-infrastructure]
      paths:
        - .mss/features/foundation-v0-8-release.yaml
        - CHANGELOG.md
        - mss-boot/CHANGELOG.md
        - web/antd/CHANGELOG.md
        - docs/docs/releases
        - Dockerfile
        - admin/cmd/cobra.go
        - admin/cmd/migrate/migration/system/v0_7_upgrade_state_integration_test.go
        - admin/pkg/version
        - admin/pkg/version.go
        - cmd/mss-mcp/main.go
        - internal/mss/buildinfo
        - internal/mss/verify
        - mss-boot/Makefile
        - tools/release
        - tools/security
        - web/antd/Dockerfile
        - web/antd/config/config.prod.release.ts
        - web/antd/scripts/check-release-api.mjs
        - .github/workflows/container.yml
        - .github/workflows/docs.yml
        - .github/workflows/release.yml
        - .github/workflows/release-draft.yml
        - .github/workflows/release-readiness.yml
        - .github/workflows/framework-release.yml
        - .github/workflows/frontend-release.yml
        - .github/workflows/theme-settings-integration.yml
        - .github/workflows/v0.7-upgrade-integration.yml
      guidance: >-
        Treat Unreleased, planned, preview, branches, and local workspace replacements as non-stable.
        Publish a required nested framework tag first, prove external GOWORK=off resolution, then publish
        the root tag from the same reviewed commit. Finalize a stable release only after migrations,
        security checks, versioned artifacts, containers, documentation, installation smoke tests, and
        recovery evidence pass. Keep .mss/lock.yaml on its real development/generated baseline until a
        supported deterministic process can record the exact published foundation version and commit.
