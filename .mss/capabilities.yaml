    - id: foundation.versioned-release
      displayName: Versioned Foundation Release Governance
      status: beta
      owners: [release-engineering, agent-infrastructure]
      paths:
        - .mss/features/foundation-v1-0-0-release.yaml
        - .mss/features/foundation-v1-0-1-storage-safety.yaml
        - .mss/features/foundation-v1-1-0-release.yaml
        - .mss/release-policy.yaml
        - CHANGELOG.md
        - mss-boot/CHANGELOG.md
        - web/antd/CHANGELOG.md
        - docs/docs/releases
        - Dockerfile
        - admin/cmd/cobra.go
        - admin/cmd/migrate/migration/system/v0_7_upgrade_state_integration_test.go
        - admin/pkg/version
        - admin/pkg/version.go
        - cmd/mss-mcp/main.go
        - internal/mss/buildinfo
        - internal/mss/verify
        - mss-boot/Makefile
        - tools/release
        - tools/security
        - web/antd/Dockerfile
        - web/antd/config/config.prod.release.ts
        - web/antd/scripts/check-release-api.mjs
        - .github/workflows/container.yml
        - .github/workflows/docs.yml
        - .github/workflows/release.yml
        - .github/workflows/release-draft.yml
        - .github/workflows/release-readiness.yml
        - .github/workflows/framework-release.yml
        - .github/workflows/frontend-release.yml
        - .github/workflows/theme-settings-integration.yml
        - .github/workflows/v0.7-upgrade-integration.yml
      guidance: >-
        Treat Unreleased, planned, preview, branches, and local workspace replacements as non-stable.
        Root v1.0.0 and mss-boot/v1.0.0 were published from
        ee800262c035c5f4242aca1841d077554481d2c4 on 2026-08-09, with exact-commit evidence in
        GitHub issue 471. The standalone web/antd/v1.0.0 tag was not published. Regenerate
        exact-commit artifacts and evidence for every later release; historical candidate or
        previous-version evidence is not reusable.
        The reviewed development-first policy advances directly to v1.1.0: v1.0.x and public
        alpha, beta, or RC tags are forbidden while internal waves accumulate on branches and
        commits. Complete release readiness begins only after one v1.1.0 feature-freeze commit is
        selected. An emergency patch requires a reviewed policy target change rather than a bypass.
        Publish a required nested framework tag first, prove external GOWORK=off resolution, then publish
        the root tag from the same reviewed commit. Finalize a stable release only after migrations,
        security checks, versioned artifacts, containers, documentation, installation smoke tests, and
        recovery evidence pass. This governance remains beta until post-release truth reconciliation,
        deterministic Foundation release/Blueprint/generator/downstream-snapshot identity with atomic
        lock and manifest records, and drift checks are enforced. Keep
        .mss/lock.yaml on its real development/generated baseline until that process records the exact
        published foundation version and commit.
