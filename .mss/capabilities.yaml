      frontendPaths:
        - web/antd-v6/src/modules/operations/NoticeCenter.tsx
      guidance: Treat channel credentials as secrets and test failure paths.

    - id: operations.monitoring
      displayName: Process and Host Monitoring
      status: beta
      owners: [backend, frontend]
      backendPaths:
        - admin/service/monitor.go
        - admin/service/monitor_sampler.go
        - admin/apis/monitor.go
        - admin/cmd/server/server.go
      frameworkPaths:
        - mss-boot/core/server/task
      frontendPaths:
        - web/antd-v6/src/modules/monitor
        - web/antd-v6/src/pages/Workplace
      guidance: >-
        Sample through the task server's immutable built-in system-job lane and serve bounded instance-local history;
        monitoring is not a user Task and is not a replacement for external observability.

    - id: integration.websocket
      displayName: WebSocket Events
      status: beta
      owners: [backend, frontend]
      backendPaths:
        - admin/apis/ws.go
        - admin/center/websocket
      frontendPaths:
        - web/antd-v6/src/shared/realtime/socket.ts
      guidance: >-
        The single-instance event path is beta. At v1.0.0 no SetRedisClient call wires the
        clustered Redis pub/sub path, so do not claim multi-replica delivery. Migrate it to an
        explicit named realtime scope and pass clustered fan-out, outage, cancellation, and close
        tests before promoting that deployment mode; it is never a durable WorkQueue.

    - id: integration.kubernetes
