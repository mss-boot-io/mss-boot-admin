# Foundation-contributor Codex configuration. Thin Hosts use the installed
# mss-mcp command generated by the v1.3.5 Blueprint instead of copying this file.
# This file intentionally contains no credentials.

[mcp_servers.mss]
command = "go"
args = ["run", "./cmd/mss-mcp", "--root", "."]
cwd = "."
enabled = true
required = false
default_tools_approval_mode = "writes"
startup_timeout_sec = 60
tool_timeout_sec = 900

[mcp_servers.mss.tools.mss_generate_module]
approval_mode = "writes"

[mcp_servers.mss.tools.mss_run_validation]
approval_mode = "writes"
