# Repository-local Codex configuration. This file intentionally contains no
# credentials and only starts the checked-in stdio MCP server.

[mcp_servers.mss]
command = "go"
args = ["run", "./cmd/mss-mcp", "--root", "."]
cwd = "."
enabled = true
required = false
default_tools_approval_mode = "writes"
startup_timeout_sec = 60
tool_timeout_sec = 900

[mcp_servers.mss.tools.mss_generate_module]
approval_mode = "writes"

[mcp_servers.mss.tools.mss_run_validation]
approval_mode = "writes"
