name: One-shot web lockfile finalization

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-web-lockfile-finalization
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            web/antd/workers-site/pnpm-lock.yaml

      - name: Verify pinned toolchain
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = '9.15.9'
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 22) process.exit(1)"

      - name: Finish local mock type migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = "import { Request, Response } from 'express';"
          new = "import type { MockRequest as Request, MockResponse as Response } from './types';"
          for name in ('user.ts', 'notices.ts'):
              path = Path('web/antd/mock') / name
              text = path.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit(f'unexpected mock type import in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Reject removed dependency usage
        run: |
          set -euo pipefail
          if grep -R --line-number \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            -E "braft-editor|from ['\"]immutable['\"]|from ['\"]express['\"]|umi-presets-pro" \
            web/antd/src web/antd/config web/antd/mock \
            --exclude-dir=node_modules --exclude-dir=dist; then
            echo 'Removed dependency usage remains in frontend source' >&2
            exit 1
          fi

      - name: Generate and deduplicate frontend lockfile
        working-directory: web/antd
        run: |
          set -euxo pipefail
          rm -rf node_modules .umi .umi-test
          pnpm install \
            --lockfile-only \
            --ignore-scripts \
            --config.strict-peer-dependencies=false
          pnpm dedupe \
            --config.ignore-scripts=true \
            --config.strict-peer-dependencies=false
          pnpm install \
            --lockfile-only \
            --ignore-scripts \
            --config.strict-peer-dependencies=false

      - name: Generate Workers Site lockfile
        working-directory: web/antd/workers-site
        run: |
          set -euxo pipefail
          rm -rf node_modules
          pnpm install \
            --lockfile-only \
            --ignore-scripts \
            --config.strict-peer-dependencies=false

      - name: Verify strict frozen installs are side-effect free
        run: |
          set -euxo pipefail
          before="$(git status --porcelain=v1)"
          rm -rf web/antd/node_modules web/antd/.umi web/antd/workers-site/node_modules
          pnpm --dir web/antd install \
            --frozen-lockfile \
            --ignore-scripts \
            --strict-peer-dependencies \
            --prefer-offline
          pnpm --dir web/antd/workers-site install \
            --frozen-lockfile \
            --ignore-scripts \
            --strict-peer-dependencies \
            --prefer-offline
          after="$(git status --porcelain=v1)"
          test "${before}" = "${after}"

      - name: Verify lockfile dedupe is idempotent
        working-directory: web/antd
        run: |
          set -euxo pipefail
          cp pnpm-lock.yaml "${RUNNER_TEMP}/pnpm-lock.before-dedupe.yaml"
          pnpm dedupe \
            --config.ignore-scripts=true \
            --config.strict-peer-dependencies=false
          cmp "${RUNNER_TEMP}/pnpm-lock.before-dedupe.yaml" pnpm-lock.yaml

      - name: Generate Umi files explicitly
        working-directory: web/antd
        run: pnpm setup

      - name: Format migrated dependency surfaces
        working-directory: web/antd
        run: pnpm prettier

      - name: Enforce dependency security policy
        working-directory: web/antd
        run: |
          set -euxo pipefail
          pnpm list --depth 0
          pnpm --dir workers-site list --depth 0
          pnpm audit --prod --audit-level high
          pnpm audit --audit-level critical
          pnpm --dir workers-site audit --prod --audit-level high

      - name: Validate frontend quality, tests, and build
        working-directory: web/antd
        run: |
          set -euxo pipefail
          pnpm lint:js
          pnpm lint:prettier
          pnpm tsc
          timeout 300s pnpm test:ci
          pnpm build:local

      - name: Remove temporary dependency migration machinery
        run: |
          rm -f \
            .github/workflows/web-lockfile-finalize.yml \
            .github/workflows/web-editor-usage.yml \
            scripts/remediate_web_deps.py \
            scripts/patch_web_pnpm_rules.py \
            scripts/web-deps-remediation-trigger.txt \
            web/antd/.deps-remediation-trigger \
            web/antd/pnpm-peer-policy.json \
            web/antd/scripts/check_peer_issues.py \
            web/antd/scripts/test_check_peer_issues.py

      - name: Commit finalized frontend dependency graph
        run: |
          set -euxo pipefail
          rm -rf \
            web/antd/node_modules \
            web/antd/.umi \
            web/antd/.umi-test \
            web/antd/dist \
            web/antd/workers-site/node_modules
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows scripts web/antd
          git diff --cached --stat
          git commit -m 'build(frontend): finalize deterministic dependency graph'
          git push origin HEAD:refactor/split-admin-module-and-coverage-r1
