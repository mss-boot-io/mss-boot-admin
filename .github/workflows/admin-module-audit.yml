name: One-shot admin module audit

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            mss-boot/go.sum

      - name: Build architecture and coverage inventory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/admin-module-audit"
          report="${RUNNER_TEMP}/admin-module-audit/report.txt"
          {
            echo '# Root entries'
            find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
            echo
            echo '# Admin and Agent source files'
            find apis center cmd config dto internal middleware models modules notice pkg router service \
              -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) \
              -print 2>/dev/null | sort
            echo
            echo '# Root packages and direct imports'
            go list -f '{{.ImportPath}}|{{.Dir}}|{{join .Imports ","}}|tests={{join .TestGoFiles ","}}|xtests={{join .XTestGoFiles ","}}' ./... | sort
            echo
            echo '# Packages importing Admin roots'
            grep -R --line-number --include='*.go' \
              -E 'github.com/mss-boot-io/mss-boot-admin/(apis|center|config|dto|middleware|models|modules|notice|pkg|router|service|cmd/(migrate|server))' \
              . --exclude-dir=.git --exclude-dir=vendor | sort || true
            echo
            echo '# Packages importing Agent roots'
            grep -R --line-number --include='*.go' \
              -E 'github.com/mss-boot-io/mss-boot-admin/(internal/mss|cmd/mss|modules/runtime|modules/all)' \
              . --exclude-dir=.git --exclude-dir=vendor | sort || true
          } > "${report}"

          go test -covermode=atomic -coverprofile="${RUNNER_TEMP}/admin-module-audit/root.coverage.out" ./...
          go tool cover -func="${RUNNER_TEMP}/admin-module-audit/root.coverage.out" \
            > "${RUNNER_TEMP}/admin-module-audit/root.coverage.txt"
          (
            cd mss-boot
            GOWORK=off go test -covermode=atomic -coverprofile="${RUNNER_TEMP}/admin-module-audit/framework.coverage.out" ./...
            GOWORK=off go tool cover -func="${RUNNER_TEMP}/admin-module-audit/framework.coverage.out" \
              > "${RUNNER_TEMP}/admin-module-audit/framework.coverage.txt"
          )

      - name: Upload audit
        uses: actions/upload-artifact@v7
        with:
          name: admin-module-audit
          path: ${{ runner.temp }}/admin-module-audit
          if-no-files-found: error
          retention-days: 7
