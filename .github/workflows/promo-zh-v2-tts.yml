name: Temporary Chinese promo neural narration

on:
  push:
    branches:
      - codex/promo-zh-v2-tts
    paths:
      - .github/workflows/promo-zh-v2-tts.yml

permissions:
  contents: read

jobs:
  synthesize:
    name: Generate natural Mandarin narration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install synthesis tools
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "edge-tts==7.2.7"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate scene narration
        shell: bash
        run: |
          cat > /tmp/synthesize.py <<'PY'
          import asyncio
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          import edge_tts

          OUT = Path("promo-zh-v2-voice")
          OUT.mkdir(parents=True, exist_ok=True)

          VOICE = "zh-CN-XiaoxiaoNeural"
          RATE = "+6%"
          PITCH = "-2Hz"
          VOLUME = "+0%"

          SCENES = [
              {
                  "id": 1,
                  "title": "从业务开始",
                  "text": "管理系统，不该每次都从登录、权限和菜单重新开始。MSS Boot Admin，是一套面向智能开发时代的 Go 管理系统基础设施。",
              },
              {
                  "id": 2,
                  "title": "传统脚手架的代价",
                  "text": "传统后台脚手架解决了起步，却常把框架源码和业务代码绑在一起。项目越做越大，升级、合并和安全修复，也就越困难。",
              },
              {
                  "id": 3,
                  "title": "轻量宿主架构",
                  "text": "MSS Boot Admin 采用轻量宿主架构。业务项目只保留组合代码和业务模块；核心能力通过明确的版本依赖引入，既能扩展，也能持续升级。",
              },
              {
                  "id": 4,
                  "title": "可验证的工程闭环",
                  "text": "它把开发过程变成可验证的工程闭环：先写清需求和验收标准，再生成代码，执行测试和自动评测，最后留下可追踪的发布证据。",
              },
              {
                  "id": 5,
                  "title": "安全由后端裁决",
                  "text": "安全，不是前端按钮的隐藏与显示。权限由后端最终裁决，并配合安全会话、跨站请求保护、访问令牌轮换，以及敏感信息脱敏审计。",
              },
              {
                  "id": 6,
                  "title": "完整的通用能力",
                  "text": "用户、部门、岗位、角色、配置、主题、任务、文件、实时通信和可观测性等通用能力，已经形成基础模块。业务团队可以直接从领域功能开始。",
              },
              {
                  "id": 7,
                  "title": "现代 Go 与 React 技术栈",
                  "text": "后端基于 Go、Gin、GORM 和 Casbin；前端采用 React 十九、Ant Design 六和 Umi。技术栈清晰，适合 Go 团队长期维护。",
              },
              {
                  "id": 8,
                  "title": "智能开发也要确定性验证",
                  "text": "单元测试、接口测试、浏览器端到端测试和发布检查，共同构成质量门禁。智能代理可以参与实现，但结果必须由确定性工具验证。",
              },
              {
                  "id": 9,
                  "title": "竞品对比",
                  "text": "和 Gin Vue Admin 相比，它更强调核心包与业务宿主的升级边界；和 RuoYi Vue Plus 相比，它为 Go 团队提供更轻的技术基座。三者各有所长，选择取决于团队技术栈和工程目标。",
              },
              {
                  "id": 10,
                  "title": "不是更大的模板",
                  "text": "MSS Boot Admin 的目标，不是堆出更大的后台模板，而是让业务扩展、框架升级和智能协作之间，始终保持清晰、可验证的边界。",
              },
              {
                  "id": 11,
                  "title": "从第一个业务模块开始",
                  "text": "当前稳定基线是 一点三点二；一点三点六 仍是候选版本。访问项目文档和 GitHub，从第一个业务模块开始，而不是重新搭建底座。",
              },
          ]

          def duration_seconds(path: Path) -> float:
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path),
                  ],
                  check=True,
                  text=True,
                  capture_output=True,
              )
              return round(float(result.stdout.strip()), 3)

          async def synthesize_one(scene: dict) -> dict:
              path = OUT / f"voice_{scene['id']:02d}.mp3"
              last_error = None
              for attempt in range(1, 4):
                  try:
                      communicate = edge_tts.Communicate(
                          scene["text"],
                          VOICE,
                          rate=RATE,
                          volume=VOLUME,
                          pitch=PITCH,
                      )
                      await communicate.save(str(path))
                      if path.stat().st_size < 4096:
                          raise RuntimeError(f"audio output too small: {path.stat().st_size}")
                      return {
                          **scene,
                          "file": path.name,
                          "duration": duration_seconds(path),
                          "bytes": path.stat().st_size,
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      }
                  except Exception as exc:  # noqa: BLE001
                      last_error = exc
                      if path.exists():
                          path.unlink()
                      await asyncio.sleep(attempt * 3)
              raise RuntimeError(f"failed to synthesize scene {scene['id']}: {last_error}")

          async def main() -> None:
              manifest = []
              for scene in SCENES:
                  manifest.append(await synthesize_one(scene))

              payload = {
                  "engine": "Microsoft Edge neural text-to-speech via edge-tts",
                  "voice": VOICE,
                  "rate": RATE,
                  "pitch": PITCH,
                  "volume": VOLUME,
                  "scene_count": len(manifest),
                  "speech_duration": round(sum(item["duration"] for item in manifest), 3),
                  "scenes": manifest,
              }
              (OUT / "voice-manifest.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              (OUT / "README.txt").write_text(
                  "mss-boot-admin 中文宣传片第二版神经网络旁白\n"
                  f"声线：{VOICE}\n"
                  f"语速：{RATE}\n"
                  f"纯旁白时长：{payload['speech_duration']} 秒\n",
                  encoding="utf-8",
              )

          asyncio.run(main())
          PY
          python /tmp/synthesize.py

      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: mss-boot-admin-zh-v2-neural-voice
          path: promo-zh-v2-voice/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
