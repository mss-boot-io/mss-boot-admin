name: One-time FeatureSpec CLI Integration

on:
  push:
    branches:
      - codex/agent-native-foundation
    paths:
      - '.github/workflows/agent-native-feature-spec-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-native-feature-spec-integration
  cancel-in-progress: false

jobs:
  patch-commit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: codex/agent-native-foundation
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate kind-aware spec CLI
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          app_path = Path("internal/mss/app/app.go")
          text = app_path.read_text(encoding="utf-8")

          validate_pattern = re.compile(
              r"func newSpecValidateCommand\(rootOverride \*string\) \*cobra\.Command \{.*?\n\}\n\nfunc newSpecInitCommand",
              re.S,
          )
          validate_replacement = r'''func newSpecValidateCommand(rootOverride *string) *cobra.Command {
          	var format string
          	command := &cobra.Command{
          		Use:   "validate <spec.yaml>",
          		Short: "Validate an AdminModule or Feature specification",
          		Args:  cobra.ExactArgs(1),
          		RunE: func(cmd *cobra.Command, args []string) error {
          			projectContext, err := loadProject(*rootOverride)
          			if err != nil {
          				return err
          			}
          			path, err := resolveInputPath(projectContext.Root, args[0])
          			if err != nil {
          				return err
          			}
          			document, err := spec.ValidateFile(path)
          			if err != nil {
          				return err
          			}
          			relativePath, relErr := filepath.Rel(projectContext.Root, path)
          			if relErr == nil {
          				document.Path = filepath.ToSlash(relativePath)
          			}
          			switch format {
          			case "json":
          				data, err := json.MarshalIndent(document, "", "  ")
          				if err != nil {
          					return err
          				}
          				return writeLine(cmd.OutOrStdout(), data)
          			case "text":
          				if _, err := fmt.Fprintf(cmd.OutOrStdout(), "validated %s specification: %s\n", document.Kind, document.Name); err != nil {
          					return err
          				}
          				if _, err := fmt.Fprintf(cmd.OutOrStdout(), "path: %s\n", document.Path); err != nil {
          					return err
          				}
          				summary, err := json.MarshalIndent(document.Summary, "", "  ")
          				if err != nil {
          					return err
          				}
          				_, err = fmt.Fprintf(cmd.OutOrStdout(), "summary:\n%s\n", summary)
          				return err
          			default:
          				return fmt.Errorf("unsupported output format %q", format)
          			}
          		},
          	}
          	command.Flags().StringVar(&format, "format", "text", "output format: text or json")
          	return command
          }

          func newSpecInitCommand'''
          text, count = validate_pattern.subn(validate_replacement, text, count=1)
          if count != 1:
              raise SystemExit("expected spec validate function was not found")

          init_pattern = re.compile(
              r"func newSpecInitCommand\(rootOverride \*string\) \*cobra\.Command \{.*?\n\}\n\nfunc newModuleCommand",
              re.S,
          )
          init_replacement = r'''func newSpecInitCommand(rootOverride *string) *cobra.Command {
          	var outputPath string
          	var displayName string
          	var owner string
          	var kind string
          	var write bool
          	command := &cobra.Command{
          		Use:   "init <name>",
          		Short: "Render an AdminModule or Feature starter specification",
          		Args:  cobra.ExactArgs(1),
          		RunE: func(cmd *cobra.Command, args []string) error {
          			projectContext, err := loadProject(*rootOverride)
          			if err != nil {
          				return err
          			}
          			var data []byte
          			switch kind {
          			case "module", "admin-module":
          				kind = "module"
          				data, err = spec.RenderModuleTemplate(args[0], displayName)
          			case "feature":
          				data, err = spec.RenderFeatureTemplate(args[0], displayName, owner)
          			default:
          				return fmt.Errorf("unsupported specification kind %q", kind)
          			}
          			if err != nil {
          				return err
          			}
          			if !write {
          				return writeLine(cmd.OutOrStdout(), data)
          			}
          			if outputPath == "" {
          				directory := "modules"
          				if kind == "feature" {
          					directory = "features"
          				}
          				outputPath = filepath.Join(projectContext.Root, ".mss", directory, args[0]+".yaml")
          			} else if !filepath.IsAbs(outputPath) {
          				outputPath = filepath.Join(projectContext.Root, filepath.FromSlash(outputPath))
          			}
          			if err := ensurePathInside(projectContext.Root, outputPath); err != nil {
          				return err
          			}
          			if _, err := os.Stat(outputPath); err == nil {
          				return fmt.Errorf("refusing to overwrite existing file %s", outputPath)
          			} else if !os.IsNotExist(err) {
          				return err
          			}
          			if err := os.MkdirAll(filepath.Dir(outputPath), 0o755); err != nil {
          				return err
          			}
          			if err := os.WriteFile(outputPath, data, 0o644); err != nil {
          				return err
          			}
          			relativePath, err := filepath.Rel(projectContext.Root, outputPath)
          			if err != nil {
          				return err
          			}
          			_, err = fmt.Fprintf(cmd.OutOrStdout(), "created %s specification %s\n", kind, filepath.ToSlash(relativePath))
          			return err
          		},
          	}
          	command.Flags().StringVar(&kind, "kind", "module", "specification kind: module or feature")
          	command.Flags().StringVar(&outputPath, "output", "", "output path; defaults to .mss/modules or .mss/features")
          	command.Flags().StringVar(&displayName, "display-name", "", "human-readable display name")
          	command.Flags().StringVar(&owner, "owner", "product-engineering", "Feature owner; ignored for module specifications")
          	command.Flags().BoolVar(&write, "write", false, "write the specification; default is stdout dry-run")
          	return command
          }

          func newModuleCommand'''
          text, count = init_pattern.subn(init_replacement, text, count=1)
          if count != 1:
              raise SystemExit("expected spec init function was not found")
          app_path.write_text(text, encoding="utf-8")

          feature_path = Path("internal/mss/spec/feature.go")
          feature = feature_path.read_text(encoding="utf-8")
          feature = feature.replace('\n\t"errors"', '')
          feature = feature.replace('\n// Ensure FeatureSpec\'s validator remains independently usable by callers.\nvar _ error = validationError{}\nvar _ = errors.New\n', '\n')
          feature_path.write_text(feature, encoding="utf-8")
          PY

          gofmt -w internal/mss/app/app.go internal/mss/spec
          rm -f .github/workflows/agent-native-feature-spec-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(spec): integrate Feature and acceptance contracts"
          git push origin HEAD:codex/agent-native-foundation

      - name: Test specification and CLI packages after commit
        run: go test ./internal/mss/spec ./internal/mss/app

      - name: Validate checked-in Feature specification
        run: go run ./cmd/mss spec validate .mss/features/example-supplier-onboarding.yaml --format json > /tmp/mss-feature.json

      - name: Render and validate a starter Feature specification
        run: |
          rm -f /tmp/example-feature.yaml
          go run ./cmd/mss spec init example-feature \
            --kind feature \
            --owner example-team \
            --output /tmp/example-feature.yaml \
            --write > /tmp/mss-feature-init.txt
          go run ./cmd/mss spec validate /tmp/example-feature.yaml --format json > /tmp/mss-feature-init.json

      - name: Upload FeatureSpec evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-native-feature-spec-validation
          path: |
            /tmp/mss-feature.json
            /tmp/mss-feature-init.txt
            /tmp/mss-feature-init.json
          if-no-files-found: warn
          retention-days: 7
