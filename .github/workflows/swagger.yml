name: Swagger

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - '!mss-boot/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/swagger.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swagger-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            mss-boot/go.sum

      - name: Install pinned Swagger generator
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Generate API documentation
        run: go generate ./...

      - name: Remove generated Go source from site artifact
        run: rm -f docs/docs.go

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    name: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
