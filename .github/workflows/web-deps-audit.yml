name: One-shot web dependency source inventory

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-shot-web-dependency-source-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout inventory branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1

      - name: Inventory frontend dependency usage
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/web-dependency-source-inventory"
          mkdir -p "${output}"

          grep -R --line-number \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' \
            -E "MssBoot/Editor|RichTextEditor|braft-editor|requestRecordMock|umi-presets-pro|requestRecord" \
            web/antd \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.umi --exclude-dir=.umi-test \
            > "${output}/legacy-usage.txt" || true

          python3 - <<'PY' > "${output}/imports.json"
          import json
          import re
          from pathlib import Path

          root = Path('web/antd')
          excluded = {'node_modules', 'dist', '.git', '.umi', '.umi-test', 'playwright-report', 'test-results'}
          imports = {}
          pattern = re.compile(r"(?:from\s+|import\s*\(|require\s*\()\s*['\"]([^'\"]+)['\"]")
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix not in {'.js', '.jsx', '.mjs', '.cjs', '.ts', '.tsx'}:
                  continue
              if any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for module in pattern.findall(text):
                  imports.setdefault(module, []).append(path.as_posix())
          print(json.dumps(imports, ensure_ascii=False, indent=2, sort_keys=True))
          PY

          find web/antd -maxdepth 2 -type f \
            \( -name 'check_login*' -o -name 'package.json' -o -name 'pnpm-lock.yaml' \
               -o -name 'pnpm-workspace.yaml' -o -name '.npmrc' \) \
            -print | sort > "${output}/dependency-files.txt"

          cat "${output}/legacy-usage.txt" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload source inventory
        uses: actions/upload-artifact@v7
        with:
          name: web-dependency-source-inventory
          path: ${{ runner.temp }}/web-dependency-source-inventory
          if-no-files-found: error
          retention-days: 7
