name: One-shot web dependency audit

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-shot-web-deps-audit
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            web/antd/workers-site/pnpm-lock.yaml

      - name: Install root graph without lifecycle scripts
        working-directory: web/antd
        run: pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies --prefer-offline

      - name: Audit direct dependency usage
        working-directory: web/antd
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/web-deps-usage"
          pnpm dlx depcheck@1.4.7 --json \
            > "${RUNNER_TEMP}/web-deps-usage/depcheck.json" \
            2> "${RUNNER_TEMP}/web-deps-usage/depcheck.err"
          echo $? > "${RUNNER_TEMP}/web-deps-usage/depcheck.exit"

          python3 - <<'PY' > "${RUNNER_TEMP}/web-deps-usage/direct-usage.json"
          import json
          from pathlib import Path

          root = Path('.')
          package = json.loads((root / 'package.json').read_text(encoding='utf-8'))
          dependencies = {
              **package.get('dependencies', {}),
              **package.get('devDependencies', {}),
          }
          allowed_suffixes = {
              '.js', '.jsx', '.mjs', '.cjs', '.ts', '.tsx', '.json', '.less',
              '.css', '.md', '.html', '.ejs', '.yaml', '.yml', '.toml', '.sh',
          }
          excluded = {'node_modules', 'dist', '.git', '.umi', '.umi-test', 'playwright-report', 'test-results'}
          files = []
          for path in root.rglob('*'):
              if not path.is_file() or path.name == 'pnpm-lock.yaml':
                  continue
              if any(part in excluded for part in path.parts):
                  continue
              if path.suffix.lower() not in allowed_suffixes and path.name not in {'Dockerfile'}:
                  continue
              try:
                  files.append((path, path.read_text(encoding='utf-8')))
              except UnicodeDecodeError:
                  pass

          usage = {}
          for name in sorted(dependencies):
              matches = []
              for path, text in files:
                  if name in text:
                      matches.append(path.as_posix())
              usage[name] = matches
          print(json.dumps(usage, indent=2, ensure_ascii=False))
          PY
          exit 0

      - name: Audit Workers Site dependency graph
        working-directory: web/antd/workers-site
        run: |
          set +e
          pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies \
            > "${RUNNER_TEMP}/web-deps-usage/workers-install.log" 2>&1
          echo $? > "${RUNNER_TEMP}/web-deps-usage/workers-install.exit"
          pnpm outdated --format json \
            > "${RUNNER_TEMP}/web-deps-usage/workers-outdated.json" \
            2> "${RUNNER_TEMP}/web-deps-usage/workers-outdated.err"
          echo $? > "${RUNNER_TEMP}/web-deps-usage/workers-outdated.exit"
          pnpm audit --prod --json \
            > "${RUNNER_TEMP}/web-deps-usage/workers-audit.json" \
            2> "${RUNNER_TEMP}/web-deps-usage/workers-audit.err"
          echo $? > "${RUNNER_TEMP}/web-deps-usage/workers-audit.exit"
          exit 0

      - name: Probe removal of legacy Umi preset
        run: |
          set -euo pipefail
          probe="${RUNNER_TEMP}/web-no-legacy-preset"
          mkdir -p "${probe}"
          rsync -a \
            --exclude node_modules \
            --exclude dist \
            --exclude .umi \
            --exclude .umi-test \
            --exclude playwright-report \
            --exclude test-results \
            web/antd/ "${probe}/"

          PROBE="${probe}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['PROBE'])
          path = root / 'package.json'
          package = json.loads(path.read_text(encoding='utf-8'))
          package.get('devDependencies', {}).pop('umi-presets-pro', None)
          package.get('scripts', {}).pop('record', None)
          path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          config = root / 'config/config.ts'
          text = config.read_text(encoding='utf-8')
          text = text.replace("  presets: ['umi-presets-pro'],\n", '')
          text = text.replace('  requestRecord: {},\n', '')
          config.write_text(text, encoding='utf-8')
          PY

          cd "${probe}"
          pnpm install --lockfile-only --ignore-scripts --strict-peer-dependencies \
            > "${RUNNER_TEMP}/web-deps-usage/no-legacy-lock.log" 2>&1
          pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies --prefer-offline \
            > "${RUNNER_TEMP}/web-deps-usage/no-legacy-install.log" 2>&1
          pnpm exec max setup \
            > "${RUNNER_TEMP}/web-deps-usage/no-legacy-setup.log" 2>&1
          pnpm lint:js > "${RUNNER_TEMP}/web-deps-usage/no-legacy-lint.log" 2>&1
          pnpm tsc > "${RUNNER_TEMP}/web-deps-usage/no-legacy-tsc.log" 2>&1
          MOCK=none timeout 180s pnpm test -- --runInBand \
            > "${RUNNER_TEMP}/web-deps-usage/no-legacy-test.log" 2>&1
          pnpm build:local > "${RUNNER_TEMP}/web-deps-usage/no-legacy-build.log" 2>&1

          set +e
          pnpm audit --prod --json \
            > "${RUNNER_TEMP}/web-deps-usage/no-legacy-audit-prod.json" \
            2> "${RUNNER_TEMP}/web-deps-usage/no-legacy-audit-prod.err"
          echo $? > "${RUNNER_TEMP}/web-deps-usage/no-legacy-audit-prod.exit"
          pnpm list --depth 0 --json \
            > "${RUNNER_TEMP}/web-deps-usage/no-legacy-top-level.json" \
            2> "${RUNNER_TEMP}/web-deps-usage/no-legacy-top-level.err"
          grep -c '^  [^ ].*:$' pnpm-lock.yaml \
            > "${RUNNER_TEMP}/web-deps-usage/no-legacy-lock-entry-count.txt"
          exit 0

      - name: Upload usage and migration probe
        uses: actions/upload-artifact@v7
        with:
          name: web-deps-usage
          path: ${{ runner.temp }}/web-deps-usage
          if-no-files-found: error
          retention-days: 7
