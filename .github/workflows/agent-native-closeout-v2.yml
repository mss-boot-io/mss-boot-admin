name: One-time Agent Foundation Closeout v2

on:
  pull_request:
    branches:
      - codex/monorepo-integration
    paths:
      - '.github/workflows/agent-native-closeout-v2.yml'
      - 'tools/agent_closeout.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-native-foundation-closeout-v2
  cancel-in-progress: true

jobs:
  closeout-commit-and-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply idempotent closeout
        run: python3 tools/agent_closeout.py

      - name: Format, mark executable, and commit before validation
        run: |
          set -euo pipefail
          gofmt -w \
            cmd/mss \
            cmd/mss-mcp \
            internal/mss \
            modules/runtime \
            modules/all \
            main.go \
            cmd/migrate/migrate.go
          chmod +x mss .codex/setup.sh
          git add -A
          git diff --cached --check
          git commit -m "chore(agent): complete Agent foundation closeout"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Test Agent infrastructure after commit
        run: go test ./internal/mss/... ./cmd/mss/... ./cmd/mss-mcp/... ./modules/runtime/...

      - name: Validate contracts, Feature planning, and MCP
        run: |
          set -euo pipefail
          ./mss context --format json > "${RUNNER_TEMP}/context.json"
          ./mss doctor --strict --format json > "${RUNNER_TEMP}/doctor.json"
          ./mss skills validate --format json > "${RUNNER_TEMP}/skills.json"
          ./mss spec validate .mss/modules/example-supplier.yaml --format json > "${RUNNER_TEMP}/module-spec.json"
          ./mss spec validate .mss/features/example-supplier-onboarding.yaml --format json > "${RUNNER_TEMP}/feature-spec.json"
          ./mss feature plan .mss/features/example-supplier-onboarding.yaml --format json > "${RUNNER_TEMP}/feature-plan.json"
          ./mss module generate .mss/modules/example-supplier.yaml --format json > "${RUNNER_TEMP}/module-plan.json"

          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"mss_plan_feature","arguments":{"path":".mss/features/example-supplier-onboarding.yaml"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}' \
            | go run ./cmd/mss-mcp --root . > "${RUNNER_TEMP}/mcp.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          responses = [
              json.loads(line)
              for line in (Path(os.environ['RUNNER_TEMP']) / 'mcp.json').read_text().splitlines()
              if line.strip()
          ]
          names = [tool['name'] for tool in responses[0]['result']['tools']]
          if len(names) < 13 or names != sorted(names):
              raise SystemExit(f'unexpected MCP tool catalog: {names}')
          required = {'mss_plan_feature', 'mss_validate_spec', 'mss_apply_foundation_upgrade'}
          if not required.issubset(names):
              raise SystemExit(f'required MCP tools are missing: {sorted(required - set(names))}')
          if responses[1]['result'].get('isError'):
              raise SystemExit(f'Feature MCP plan failed: {responses[1]}')
          PY

      - name: Run deterministic Agent evaluations
        run: ./mss eval run --all --format json > "${RUNNER_TEMP}/evals.json"

      - name: Build Agent documentation
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs build

      - name: Upload closeout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-native-closeout-v2-evidence
          path: |
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/doctor.json
            ${{ runner.temp }}/skills.json
            ${{ runner.temp }}/module-spec.json
            ${{ runner.temp }}/feature-spec.json
            ${{ runner.temp }}/feature-plan.json
            ${{ runner.temp }}/module-plan.json
            ${{ runner.temp }}/mcp.json
            ${{ runner.temp }}/evals.json
            .mss/reports/evals/latest.json
            .mss/reports/evals/latest.md
          if-no-files-found: warn
          retention-days: 14
