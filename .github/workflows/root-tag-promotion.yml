name: Root Tag Promotion

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact root release version to promote
        required: true
        type: string
      frozen_commit:
        description: Exact merged-main commit already qualified by pre-root readiness
        required: true
        type: string
      readiness_run_id:
        description: Successful publication-authority pre-root readiness run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: root-tag-promotion-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: protected-root-tag-promotion
    runs-on: ubuntu-24.04
    environment: root-promotion
    permissions:
      actions: write
      contents: write
      packages: read
    steps:
      - name: Require workflow dispatch from exact remote main tip
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "root promotion must be dispatched from refs/heads/main" >&2
            exit 1
          fi
          if [[ ! "${FROZEN_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "frozen_commit must be one full lowercase commit SHA" >&2
            exit 1
          fi
          remote_main="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${GITHUB_SHA}" != "${FROZEN_COMMIT}" || "${remote_main}" != "${FROZEN_COMMIT}" ]]; then
            echo "workflow SHA, frozen commit, and remote main tip must be identical" >&2
            printf 'workflow=%s frozen=%s remote-main=%s\n' \
              "${GITHUB_SHA}" "${FROZEN_COMMIT}" "${remote_main}" >&2
            exit 1
          fi

      - name: Checkout exact frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.frozen_commit }}
          fetch-depth: 0

      - name: Verify exact merged-main source and root policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
        run: |
          set -euo pipefail
          python3 tools/release/verify_release_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${FROZEN_COMMIT}" \
            --policy .mss/release-policy.yaml
          python3 tools/release/check_release_policy.py \
            --component root \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_VERSION}" \
            --intent publish

      - name: Require completed pre-root publication authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
          READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
        run: |
          bash tools/release/verify_readiness_run.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${READINESS_RUN_ID}" \
            --target-version "${RELEASE_VERSION}" \
            --commit "${FROZEN_COMMIT}" \
            --phase pre-root \
            --policy .mss/release-policy.yaml

      - name: Require exact public component releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag_name="$1"
            local object_type
            local object_sha
            local tag_object
            local depth=0

            tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}")"
            object_type="$(jq -r '.object.type' <<< "${tag_object}")"
            object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            while [[ "${object_type}" == "tag" ]]; do
              depth=$((depth + 1))
              if [[ "${depth}" -gt 5 ]]; then
                echo "tag ${tag_name} has too many annotation levels" >&2
                return 1
              fi
              tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "${tag_object}")"
              object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            done
            if [[ "${object_type}" != "commit" || ! "${object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "tag ${tag_name} does not resolve to one commit" >&2
              return 1
            fi
            printf '%s\n' "${object_sha}"
          }

          expected_prerelease=false
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            expected_prerelease=true
          fi
          while IFS='|' read -r component_tag workflow; do
            component_commit="$(resolve_tag_commit "${component_tag}")"
            if [[ "${component_commit}" != "${FROZEN_COMMIT}" ]]; then
              echo "${component_tag} resolves to ${component_commit}, not ${FROZEN_COMMIT}" >&2
              exit 1
            fi
            release="$(gh release view "${component_tag}" --json tagName,isDraft,isPrerelease)"
            jq -e \
              --arg tag "${component_tag}" \
              --argjson prerelease "${expected_prerelease}" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' \
              <<< "${release}" >/dev/null

            runs="$(gh api \
              --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f head_sha="${FROZEN_COMMIT}" \
              -f status=completed \
              -f per_page=20)"
            jq -e \
              --arg ref "${component_tag}" \
              --arg commit "${FROZEN_COMMIT}" \
              --arg path ".github/workflows/${workflow}" \
              '[.workflow_runs[] | select(
                .event == "push" and
                .head_branch == $ref and
                .head_sha == $commit and
                .path == $path and
                .conclusion == "success"
              )] | length >= 1' <<< "${runs}" >/dev/null
          done <<EOF
          mss-boot/${RELEASE_VERSION}|framework-release.yml
          admin/${RELEASE_VERSION}|admin-release.yml
          web/antd-v6/${RELEASE_VERSION}|frontend-v6-release.yml
          EOF

      - name: Require non-overlapping root-tag rule structure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rulesets="$(gh api "/repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true&per_page=100")"
          mapfile -t creation_names < <(
            while IFS= read -r ruleset_id; do
              ruleset="$(gh api "/repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}?includes_parents=true")"
              if jq -e 'any(.rules[]; .type == "creation")' <<< "${ruleset}" >/dev/null; then
                jq -r '.name' <<< "${ruleset}"
              fi
            done < <(jq -r '.[] | select(
              .target == "tag" and .enforcement == "active"
            ) | .id' <<< "${rulesets}")
          )
          mapfile -t creation_names < <(printf '%s\n' "${creation_names[@]}" | sort)
          if [[ "${#creation_names[@]}" -ne 2 \
            || "${creation_names[0]}" != "release-tags-controlled-creation" \
            || "${creation_names[1]}" != "root-release-tag-controlled-creation" ]]; then
            echo "exactly the component and root creation rulesets may create release tags" >&2
            printf 'creation rulesets: %s\n' "${creation_names[*]:-none}" >&2
            exit 1
          fi
          root_ids="$(jq -r '.[] | select(
            .name == "root-release-tag-controlled-creation" and
            .target == "tag" and
            .enforcement == "active"
          ) | .id' <<< "${rulesets}")"
          if [[ "$(wc -w <<< "${root_ids}")" -ne 1 ]]; then
            echo "exactly one active root-release-tag-controlled-creation ruleset is required" >&2
            exit 1
          fi

          root_ruleset="$(gh api "/repos/${GITHUB_REPOSITORY}/rulesets/${root_ids}?includes_parents=true")"
          jq -e '
            .target == "tag" and
            .enforcement == "active" and
            .conditions.ref_name.include == ["refs/tags/v*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] == ["creation"])
          ' <<< "${root_ruleset}" >/dev/null || {
            echo "root-tag creation ruleset is not active, root-only, and creation-only" >&2
            exit 1
          }

          controlled_id="$(jq -r '.[] | select(
            .name == "release-tags-controlled-creation" and
            .target == "tag" and
            .enforcement == "active"
          ) | .id' <<< "${rulesets}")"
          if [[ "$(wc -w <<< "${controlled_id}")" -ne 1 ]]; then
            echo "exactly one active release-tags-controlled-creation ruleset is required" >&2
            exit 1
          fi
          controlled_ruleset="$(gh api "/repos/${GITHUB_REPOSITORY}/rulesets/${controlled_id}?includes_parents=true")"
          jq -e '
            (.conditions.ref_name.include | index("refs/tags/v*") == null) and
            ([.rules[].type] | index("creation") != null)
          ' <<< "${controlled_ruleset}" >/dev/null || {
            echo "component tag authority must not overlap root tags" >&2
            exit 1
          }

          immutable_id="$(jq -r '.[] | select(
            .name == "release-tags-immutable" and
            .target == "tag" and
            .enforcement == "active"
          ) | .id' <<< "${rulesets}")"
          if [[ "$(wc -w <<< "${immutable_id}")" -ne 1 ]]; then
            echo "exactly one active release-tags-immutable ruleset is required" >&2
            exit 1
          fi
          immutable_ruleset="$(gh api "/repos/${GITHUB_REPOSITORY}/rulesets/${immutable_id}?includes_parents=true")"
          jq -e '
            (.conditions.ref_name.include | index("refs/tags/v*") != null) and
            (.conditions.ref_name.exclude == []) and
            ([.rules[].type] | sort == ["deletion", "non_fast_forward", "update"])
          ' <<< "${immutable_ruleset}" >/dev/null || {
            echo "immutable root-tag policy is missing or bypassable" >&2
            exit 1
          }

      - name: Create or resume the exact immutable root tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
        run: |
          set -euo pipefail
          if tag_ref="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" 2>/dev/null)"; then
            object_type="$(jq -r '.object.type' <<< "${tag_ref}")"
            object_sha="$(jq -r '.object.sha' <<< "${tag_ref}")"
            if [[ "${object_type}" != "tag" ]]; then
              echo "immutable root tag ${RELEASE_VERSION} exists but is not annotated" >&2
              exit 1
            fi
            tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
            if ! jq -e \
              --arg version "${RELEASE_VERSION}" \
              --arg commit "${FROZEN_COMMIT}" \
              '.tag == $version and .object.type == "commit" and .object.sha == $commit' \
              <<< "${tag_object}" >/dev/null; then
              echo "immutable root tag ${RELEASE_VERSION} is not the exact annotated release tag" >&2
              exit 1
            fi
            echo "Exact annotated root tag already exists; checking candidate runs."
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "${RELEASE_VERSION}" "${FROZEN_COMMIT}" -m "mss-boot-admin ${RELEASE_VERSION}"
            test "$(git rev-list -n 1 "${RELEASE_VERSION}")" = "${FROZEN_COMMIT}"
            git push origin "refs/tags/${RELEASE_VERSION}"
          fi

          remote_ready=false
          for attempt in $(seq 1 12); do
            if remote_ref="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" 2>/dev/null)" \
              && [[ "$(jq -r '.object.type' <<< "${remote_ref}")" == "tag" ]]; then
              remote_tag="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r '.object.sha' <<< "${remote_ref}")")"
              if jq -e \
                --arg version "${RELEASE_VERSION}" \
                --arg commit "${FROZEN_COMMIT}" \
                '.tag == $version and .object.type == "commit" and .object.sha == $commit' \
                <<< "${remote_tag}" >/dev/null; then
                remote_ready=true
                break
              fi
            fi
            echo "waiting for the exact annotated root tag to propagate (attempt ${attempt}/12)"
            if [[ "${attempt}" -lt 12 ]]; then sleep 5; fi
          done
          if [[ "${remote_ready}" != "true" ]]; then
            echo "exact annotated root tag did not become visible after bounded propagation checks" >&2
            exit 1
          fi

      - name: Dispatch exact-tag root image and candidate assembly
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
          READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
        run: |
          set -euo pipefail
          exact_run_state() {
            local workflow="$1"
            local title="$2"
            local runs
            runs="$(gh api \
              --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f event=workflow_dispatch \
              -f head_sha="${FROZEN_COMMIT}" \
              -f per_page=100)"
            jq -r \
              --arg branch "${RELEASE_VERSION}" \
              --arg commit "${FROZEN_COMMIT}" \
              --arg title "${title}" \
              '[.workflow_runs[] | select(
                .event == "workflow_dispatch" and
                .head_branch == $branch and
                .head_sha == $commit and
                .display_title == $title
              )] as $matches |
              if any($matches[]; .status != "completed" or .conclusion == "success") then
                "live-or-success"
              elif ($matches | length) > 0 then
                "failed"
              else
                "missing"
              end' <<< "${runs}"
          }

          image_title="Root Image publish ${RELEASE_VERSION}"
          image_state="$(exact_run_state container.yml "${image_title}")"
          case "${image_state}" in
            live-or-success)
              echo "Exact root image run is waiting, active, or successful; not dispatching it again."
              ;;
            failed)
              echo "An exact root image run already failed; inspect or rerun that run without creating a duplicate dispatch." >&2
              exit 1
              ;;
            missing)
              gh workflow run container.yml \
                --repo "${GITHUB_REPOSITORY}" \
                --ref "${RELEASE_VERSION}" \
                -f version="${RELEASE_VERSION}" \
                -f publish=true \
                -f readiness_run_id="${READINESS_RUN_ID}"
              ;;
            *)
              echo "unexpected root image run state: ${image_state}" >&2
              exit 1
              ;;
          esac

          release_title="Root Release candidate ${RELEASE_VERSION}"
          release_state="$(exact_run_state release.yml "${release_title}")"
          case "${release_state}" in
            live-or-success)
              echo "Exact root release candidate is waiting, active, or successful; not dispatching it again."
              ;;
            failed)
              echo "An exact root release candidate already failed; inspect or rerun that run without creating a duplicate dispatch." >&2
              exit 1
              ;;
            missing)
              gh workflow run release.yml \
                --repo "${GITHUB_REPOSITORY}" \
                --ref "${RELEASE_VERSION}" \
                -f version="${RELEASE_VERSION}" \
                -f feature_freeze_confirmed=true \
                -f publish=false \
                -f manual_evidence_complete=false \
                -f readiness_run_id="${READINESS_RUN_ID}"
              ;;
            *)
              echo "unexpected root release run state: ${release_state}" >&2
              exit 1
              ;;
          esac
