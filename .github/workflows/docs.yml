name: Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/security/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/security/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build documentation
        run: pnpm build

      - name: Audit release dependencies
        run: pnpm audit:release

      - name: Package deployment artifact
        if: github.event_name != 'pull_request'
        run: |
          tar --create --gzip --file docs-dist.tar.gz --directory dist .
          python3 ../tools/release/check_portable_paths.py dist docs-dist.tar.gz

      - name: Upload deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-dist
          path: docs/docs-dist.tar.gz
          if-no-files-found: error
          retention-days: 3

  deployment:
    name: deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod
    concurrency:
      group: cloudflare-docs-prod
      cancel-in-progress: false
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download documentation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-dist
          path: docs/.deployment-artifact

      - name: Extract documentation artifact
        run: |
          mkdir -p docs/dist
          tar --extract --gzip --file docs/.deployment-artifact/docs-dist.tar.gz --directory docs/dist

      - name: Deploy production documentation
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.cf_api_token }}
          packageManager: npm
          wranglerVersion: '4'
          workingDirectory: docs
          command: deploy --env prod
