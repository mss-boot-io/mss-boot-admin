name: Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/release/**'
      - 'tools/security/**'
      - '.github/workflows/docs.yml'
  push:
    branches:
      - main
    tags:
      - 'docs/v*.*.*'
    paths:
      - 'docs/**'
      - 'tools/release/**'
      - 'tools/security/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve docs version
        id: version
        if: startsWith(github.ref, 'refs/tags/docs/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#docs/}"
          resolved_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${resolved_commit}" = "${GITHUB_SHA}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify merged-main release source
        if: startsWith(github.ref, 'refs/tags/docs/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../tools/release/verify_release_source.py \
            --repository-root .. \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --tag "${GITHUB_REF_NAME}" \
            --policy ../.mss/release-policy.yaml

      - name: Enforce reviewed docs release target
        if: startsWith(github.ref, 'refs/tags/docs/v')
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 ../tools/release/check_release_policy.py \
            --policy ../.mss/release-policy.yaml \
            --component docs \
            --version "${DOCS_VERSION}" \
            --tag "${GITHUB_REF_NAME}"

      - name: Require the already-published matching root release
        if: startsWith(github.ref, 'refs/tags/docs/v')
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          root_tag="${DOCS_VERSION}"
          root_commit="$(git rev-parse "refs/tags/${root_tag}^{commit}")"
          if [[ "${root_commit}" != "${GITHUB_SHA}" ]]; then
            echo "root tag ${root_tag} resolves to ${root_commit}, not ${GITHUB_SHA}" >&2
            exit 1
          fi

          root_release="$(
            gh release view "${root_tag}" \
              --json tagName,isDraft,isPrerelease
          )"
          jq -e \
            --arg tag "${root_tag}" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false' \
            <<< "${root_release}" >/dev/null

          root_runs="$(gh api \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs" \
            -f head_sha="${GITHUB_SHA}" \
            -f status=completed \
            -f per_page=100)"
          jq -e \
            --arg commit "${GITHUB_SHA}" \
            --arg root_tag "${root_tag}" \
            --arg display_title "Root Release publish ${root_tag}" \
            '[.workflow_runs[] | select(
              .event == "workflow_dispatch" and
              .head_branch == $root_tag and
              .head_sha == $commit and
              .path == ".github/workflows/release.yml" and
              .display_title == $display_title and
              .status == "completed" and
              .conclusion == "success"
            )] | length >= 1' <<< "${root_runs}" >/dev/null

      - name: Refuse mutation of an existing docs release
        if: startsWith(github.ref, 'refs/tags/docs/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --json tagName >/dev/null 2>&1; then
            echo "docs release ${GITHUB_REF_NAME} already exists; refusing to mutate it" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build documentation
        run: pnpm build

      - name: Audit release dependencies
        run: pnpm audit:release

      - name: Embed docs release identity
        if: startsWith(github.ref, 'refs/tags/docs/v')
        env:
          DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jq -n \
            --arg application 'mss-boot-docs' \
            --arg version "${DOCS_VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            '{application: $application, version: $version, commit: $commit}' \
            > dist/release.json
          jq -e \
            --arg version "${DOCS_VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            '.application == "mss-boot-docs" and .version == $version and .commit == $commit' \
            dist/release.json >/dev/null
          {
            echo 'application=mss-boot-docs'
            echo "version=${DOCS_VERSION}"
            echo "commit=${GITHUB_SHA}"
          } > DOCS-BUILD-INFO.txt

      - name: Package deployment artifact
        if: startsWith(github.ref, 'refs/tags/docs/v')
        run: |
          set -euo pipefail
          tar --create --gzip --file docs-dist.tar.gz --directory dist .
          sha256sum docs-dist.tar.gz DOCS-BUILD-INFO.txt > SHA256SUMS.docs
          python3 ../tools/release/check_portable_paths.py \
            dist \
            docs-dist.tar.gz \
            DOCS-BUILD-INFO.txt \
            SHA256SUMS.docs

      - name: Upload deployment artifact
        if: startsWith(github.ref, 'refs/tags/docs/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-dist-release
          path: |
            docs/docs-dist.tar.gz
            docs/DOCS-BUILD-INFO.txt
            docs/SHA256SUMS.docs
          if-no-files-found: error
          retention-days: 7

  deployment:
    name: deployment
    if: startsWith(github.ref, 'refs/tags/docs/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: cloudflare-docs-prod
      cancel-in-progress: false
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download documentation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-dist-release
          path: docs/.deployment-artifact

      - name: Verify and extract documentation artifact
        env:
          DOCS_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd docs/.deployment-artifact
            sha256sum --check SHA256SUMS.docs
          )
          mkdir -p docs/dist
          tar --extract --gzip \
            --file docs/.deployment-artifact/docs-dist.tar.gz \
            --directory docs/dist
          python3 tools/release/check_portable_paths.py \
            docs/dist \
            docs/.deployment-artifact/docs-dist.tar.gz \
            docs/.deployment-artifact/DOCS-BUILD-INFO.txt \
            docs/.deployment-artifact/SHA256SUMS.docs
          jq -e \
            --arg version "${DOCS_VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            '.application == "mss-boot-docs" and .version == $version and .commit == $commit' \
            docs/dist/release.json >/dev/null

      - name: Deploy production documentation
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.cf_api_token }}
          packageManager: npm
          wranglerVersion: '4'
          workingDirectory: docs
          command: deploy --env prod

      - name: Verify production docs identity
        env:
          DOCS_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          identity="$(mktemp)"
          trap 'rm -f "${identity}"' EXIT
          for attempt in $(seq 1 24); do
            echo "production identity attempt ${attempt}/24"
            if curl --fail --silent --show-error \
              'https://docs.mss-boot-io.top/release.json' \
              --output "${identity}" && \
              jq -e \
                --arg version "${DOCS_VERSION}" \
                --arg commit "${GITHUB_SHA}" \
                '.application == "mss-boot-docs" and .version == $version and .commit == $commit' \
                "${identity}" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo 'production docs identity did not converge to the release commit' >&2
          exit 1

      - name: Publish immutable docs GitHub release
        env:
          DOCS_VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          trap 'rm -f "${notes}"' EXIT
          {
            echo '## Documentation site'
            echo
            echo 'https://docs.mss-boot-io.top/'
            echo
            echo "Version: \`${DOCS_VERSION}\`"
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo 'The protected Docs workflow verified the portable archive, checksum manifest, embedded release identity, Cloudflare deployment, and public /release.json before publishing this Release.'
          } > "${notes}"
          gh release create "${GITHUB_REF_NAME}" \
            docs/.deployment-artifact/docs-dist.tar.gz \
            docs/.deployment-artifact/DOCS-BUILD-INFO.txt \
            docs/.deployment-artifact/SHA256SUMS.docs \
            --verify-tag \
            --target "${GITHUB_SHA}" \
            --title "mss-boot Docs ${DOCS_VERSION}" \
            --notes-file "${notes}" \
            --latest=false
