name: One-time Agent-Native Go normalization

on:
  pull_request:
    branches:
      - codex/monorepo-integration
    paths:
      - '.github/workflows/agent-native-normalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-native-normalize
  cancel-in-progress: true

jobs:
  normalize-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Normalize committed Go sources
        run: |
          set -euo pipefail
          gofmt -w \
            cmd/mss \
            internal/mss \
            modules/runtime \
            modules/all \
            main.go \
            cmd/migrate/migrate.go
          rm -f .github/workflows/agent-native-normalize.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No normalization changes were required."
          else
            git commit -m "style(agent): normalize agent-native Go sources"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Test normalized agent infrastructure
        run: go test ./internal/mss/... ./cmd/mss/... ./modules/runtime/...

      - name: Exercise CLI contracts
        run: |
          go run ./cmd/mss context --format json >/tmp/mss-context.json
          go run ./cmd/mss doctor --format json >/tmp/mss-doctor.json
          go run ./cmd/mss spec validate .mss/modules/example-supplier.yaml --format json
          go run ./cmd/mss module generate .mss/modules/example-supplier.yaml --format json >/tmp/mss-generation.json
