name: One-shot dependency refresh

on:
  push:
    branches:
      - chore/consolidate-dependency-upgrades-r1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-dependency-refresh
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'
  GOTOOLCHAIN: local

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v7
        with:
          ref: chore/consolidate-dependency-upgrades-r1
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            mss-boot/go.sum
            compose/consul/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Upgrade Go modules
        run: |
          set -euxo pipefail
          go mod edit -replace=github.com/mss-boot-io/mss-boot-admin/mss-boot=./mss-boot
          go get \
            github.com/aws/aws-sdk-go-v2@v1.43.3 \
            github.com/aws/aws-sdk-go-v2/config@v1.32.27 \
            github.com/redis/go-redis/v9@v9.21.0 \
            google.golang.org/grpc@v1.83.0 \
            k8s.io/api@v0.36.3 \
            k8s.io/apimachinery@v0.36.3 \
            k8s.io/client-go@v0.36.3
          go mod tidy
          go mod edit -dropreplace=github.com/mss-boot-io/mss-boot-admin/mss-boot
          (
            cd mss-boot
            GOWORK=off go get \
              github.com/aws/aws-sdk-go-v2@v1.43.3 \
              github.com/aws/aws-sdk-go-v2/config@v1.32.27 \
              github.com/aws/aws-sdk-go-v2/feature/rds/auth@v1.6.34 \
              github.com/go-playground/validator/v10@v10.30.3 \
              github.com/redis/go-redis/v9@v9.21.0 \
              golang.org/x/crypto@v0.54.0 \
              google.golang.org/grpc@v1.83.0 \
              k8s.io/api@v0.36.3 \
              k8s.io/apimachinery@v0.36.3 \
              k8s.io/client-go@v0.36.3
            GOWORK=off go mod tidy
          )
          (
            cd compose/consul
            GOWORK=off go get github.com/hashicorp/consul/api@v1.34.4
            GOWORK=off go mod tidy
          )

      - name: Update npm manifests
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path: str):
              file = Path(path)
              return file, json.loads(file.read_text(encoding='utf-8'))

          docs_path, docs = load('docs/package.json')
          docs_dev = docs.setdefault('devDependencies', {})
          docs_dev.update({
              '@commitlint/cli': '^21.2.1',
              '@commitlint/config-conventional': '^21.2.0',
              'dumi': '^2.4.48',
              'lint-staged': '^17.3.0',
              'prettier': '^3.9.6',
          })
          docs_path.write_text(json.dumps(docs, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          web_path, web = load('web/antd/package.json')
          dependencies = web.setdefault('dependencies', {})
          dependencies['immutable'] = '4.3.9'
          dependencies['uuid'] = '^14.0.1'
          dev_dependencies = web.setdefault('devDependencies', {})
          dev_dependencies.pop('@types/history', None)
          dev_dependencies.pop('@umijs/fabric', None)
          dev_dependencies.update({
              '@testing-library/react': '^15.0.7',
              '@umijs/lint': '^4.6.84',
              '@umijs/max': '^4.6.84',
          })
          overrides = web.setdefault('pnpm', {}).setdefault('overrides', {})
          for dependency in (
              'braft-editor>immutable',
              'braft-utils>immutable',
              'draft-convert>immutable',
              'draft-js>immutable',
              'draftjs-utils>immutable',
          ):
              overrides[dependency] = '4.3.9'
          web_path.write_text(json.dumps(web, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          pnpm --dir docs install --lockfile-only --no-frozen-lockfile
          pnpm --dir web/antd install --lockfile-only --no-frozen-lockfile

      - name: Upgrade Actions and group Dependabot updates
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          replacements = {
              'actions/setup-go@v6': 'actions/setup-go@v7',
              'actions/setup-node@v6': 'actions/setup-node@v7',
              'pnpm/action-setup@v6': 'pnpm/action-setup@v6.0.9',
              'ossf/scorecard-action@v2.4.3': 'ossf/scorecard-action@v2.4.4',
          }
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r'github/codeql-action@v4(?:\.\d+\.\d+)?', 'github/codeql-action@v4.37.4', text)
              path.write_text(text, encoding='utf-8')
          PY
          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: gomod
              directory: /
              schedule: { interval: weekly }
              open-pull-requests-limit: 3
              groups:
                root-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/backend, type/security]
            - package-ecosystem: gomod
              directory: /mss-boot
              schedule: { interval: weekly }
              open-pull-requests-limit: 3
              groups:
                framework-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/backend, type/security]
              ignore:
                - dependency-name: github.com/casbin/gorm-adapter/v3
                  update-types: [version-update:semver-minor, version-update:semver-patch]
            - package-ecosystem: gomod
              directory: /cmd/tools/pr
              schedule: { interval: weekly }
              open-pull-requests-limit: 2
              groups:
                pr-tool-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/devops, type/security]
            - package-ecosystem: gomod
              directory: /compose/consul
              schedule: { interval: weekly }
              open-pull-requests-limit: 2
              groups:
                consul-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/devops, type/security]
            - package-ecosystem: gomod
              directory: /compose/kafka
              schedule: { interval: weekly }
              open-pull-requests-limit: 2
              groups:
                kafka-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/devops, type/security]
            - package-ecosystem: npm
              directory: /web/antd
              schedule: { interval: weekly }
              open-pull-requests-limit: 3
              groups:
                frontend-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/frontend, type/security]
            - package-ecosystem: npm
              directory: /docs
              schedule: { interval: weekly }
              open-pull-requests-limit: 3
              groups:
                docs-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/docs, type/security]
            - package-ecosystem: github-actions
              directory: /
              schedule: { interval: weekly }
              open-pull-requests-limit: 3
              groups:
                github-actions:
                  patterns: ['*']
              labels: [area/devops, type/security]
          YAML

      - name: Commit generated dependency update
        run: |
          set -euxo pipefail
          rm .github/workflows/dependency-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'build(deps): consolidate repository dependency upgrades'
          git push origin HEAD:chore/consolidate-dependency-upgrades-r1
