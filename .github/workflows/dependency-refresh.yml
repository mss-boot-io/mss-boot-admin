name: One-shot dependency refresh

on:
  push:
    branches:
      - chore/consolidate-dependency-upgrades-r1
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: 'true'
  HUSKY: '0'
  GOTOOLCHAIN: local

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v7
        with:
          ref: chore/consolidate-dependency-upgrades-r1
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            mss-boot/go.sum
            compose/consul/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Upgrade root Go module
        run: |
          set -euxo pipefail
          go get \
            github.com/aws/aws-sdk-go-v2@v1.42.1 \
            github.com/aws/aws-sdk-go-v2/config@v1.32.27 \
            github.com/redis/go-redis/v9@v9.21.0 \
            google.golang.org/grpc@v1.83.0 \
            k8s.io/api@v0.36.3 \
            k8s.io/apimachinery@v0.36.3 \
            k8s.io/client-go@v0.36.3
          go mod tidy

      - name: Upgrade mss-boot Go module
        working-directory: mss-boot
        env:
          GOWORK: 'off'
        run: |
          set -euxo pipefail
          go get \
            github.com/aws/aws-sdk-go-v2@v1.42.1 \
            github.com/aws/aws-sdk-go-v2/config@v1.32.27 \
            github.com/aws/aws-sdk-go-v2/feature/rds/auth@v1.6.34 \
            github.com/go-playground/validator/v10@v10.30.3 \
            github.com/redis/go-redis/v9@v9.21.0 \
            golang.org/x/crypto@v0.54.0 \
            google.golang.org/grpc@v1.83.0 \
            k8s.io/api@v0.36.3 \
            k8s.io/apimachinery@v0.36.3 \
            k8s.io/client-go@v0.36.3
          go mod tidy

      - name: Upgrade Consul compose module
        working-directory: compose/consul
        env:
          GOWORK: 'off'
        run: |
          set -euxo pipefail
          go get github.com/hashicorp/consul/api@v1.34.4
          go mod tidy

      - name: Upgrade documentation dependencies
        run: |
          set -euxo pipefail
          pnpm --dir docs add -D \
            @commitlint/cli@21.2.1 \
            @commitlint/config-conventional@21.2.0 \
            dumi@2.4.48 \
            lint-staged@17.3.0 \
            prettier@3.9.6

      - name: Upgrade frontend dependencies
        run: |
          set -euxo pipefail
          pnpm --dir web/antd remove -D @types/history @umijs/fabric
          pnpm --dir web/antd add immutable@4.3.9 --save-exact
          pnpm --dir web/antd add uuid@14.0.1
          pnpm --dir web/antd add -D \
            @testing-library/react@15.0.7 \
            @umijs/lint@4.6.84 \
            @umijs/max@4.6.84
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('web/antd/package.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          overrides = data.setdefault('pnpm', {}).setdefault('overrides', {})
          for dependency in (
              'braft-editor>immutable',
              'braft-utils>immutable',
              'draft-convert>immutable',
              'draft-js>immutable',
              'draftjs-utils>immutable',
          ):
              overrides[dependency] = '4.3.9'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          pnpm --dir web/antd install --lockfile-only

      - name: Upgrade GitHub Actions
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          replacements = {
              'actions/setup-go@v6': 'actions/setup-go@v7',
              'actions/setup-node@v6': 'actions/setup-node@v7',
              'pnpm/action-setup@v6': 'pnpm/action-setup@v6.0.9',
              'ossf/scorecard-action@v2.4.3': 'ossf/scorecard-action@v2.4.4',
          }
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r'github/codeql-action@v4(?:\.\d+\.\d+)?', 'github/codeql-action@v4.37.4', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Group future Dependabot updates
        run: |
          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: gomod
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 3
              groups:
                root-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/backend, type/security]
            - package-ecosystem: gomod
              directory: /mss-boot
              schedule:
                interval: weekly
              open-pull-requests-limit: 3
              groups:
                framework-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/backend, type/security]
              ignore:
                - dependency-name: github.com/casbin/gorm-adapter/v3
                  update-types: [version-update:semver-minor, version-update:semver-patch]
            - package-ecosystem: gomod
              directory: /cmd/tools/pr
              schedule:
                interval: weekly
              open-pull-requests-limit: 2
              groups:
                pr-tool-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/devops, type/security]
            - package-ecosystem: gomod
              directory: /compose/consul
              schedule:
                interval: weekly
              open-pull-requests-limit: 2
              groups:
                consul-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/devops, type/security]
            - package-ecosystem: gomod
              directory: /compose/kafka
              schedule:
                interval: weekly
              open-pull-requests-limit: 2
              groups:
                kafka-go-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/devops, type/security]
            - package-ecosystem: npm
              directory: /web/antd
              schedule:
                interval: weekly
              open-pull-requests-limit: 3
              groups:
                frontend-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/frontend, type/security]
            - package-ecosystem: npm
              directory: /docs
              schedule:
                interval: weekly
              open-pull-requests-limit: 3
              groups:
                docs-non-major:
                  patterns: ['*']
                  update-types: [minor, patch]
              labels: [area/docs, type/security]
            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: weekly
              open-pull-requests-limit: 3
              groups:
                github-actions:
                  patterns: ['*']
              labels: [area/devops, type/security]
          YAML

      - name: Validate upgraded Go modules
        run: |
          set -euxo pipefail
          go test -shuffle=on -count=1 ./...
          (
            cd mss-boot
            GOWORK=off go test -race -shuffle=on -count=1 ./...
            GOWORK=off go vet ./...
            GOWORK=off go mod tidy
            git diff --exit-code -- go.mod go.sum
          )
          (
            cd compose/consul
            GOWORK=off go test ./...
            GOWORK=off go mod tidy
            git diff --exit-code -- go.mod go.sum
          )
          go work vendor
          rm -rf vendor

      - name: Validate upgraded frontend
        run: |
          set -euxo pipefail
          pnpm --dir web/antd install --frozen-lockfile --prefer-offline
          pnpm --dir web/antd lint:js
          pnpm --dir web/antd tsc
          pnpm --dir web/antd test -- --runInBand
          pnpm --dir web/antd build:local

      - name: Validate upgraded documentation
        run: |
          set -euxo pipefail
          pnpm --dir docs install --frozen-lockfile --prefer-offline
          pnpm --dir docs build

      - name: Commit generated dependency update
        run: |
          set -euxo pipefail
          rm .github/workflows/dependency-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'build(deps): consolidate repository dependency upgrades'
          git push origin HEAD:chore/consolidate-dependency-upgrades-r1
