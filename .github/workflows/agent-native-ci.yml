name: Agent-Native Foundation CI

on:
  push:
    branches:
      - main
    paths:
      - '.mss/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'mss'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'cmd/mss/**'
      - 'cmd/mss-mcp/**'
      - 'internal/mss/**'
      - 'tools/ci/**'
      - 'tools/release/**'
      - 'admin/AGENTS.md'
      - 'admin/go.mod'
      - 'admin/go.sum'
      - 'admin/main.go'
      - 'admin/cmd/migrate/**'
      - 'admin/modules/**'
      - 'templates/module/**'
      - 'web/antd-v6/config/routes.custom.ts'
      - 'web/antd-v6/config/routes.generated.ts'
      - 'web/antd-v6/src/generated/locales/*.ts'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - '.mss/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'mss'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'cmd/mss/**'
      - 'cmd/mss-mcp/**'
      - 'internal/mss/**'
      - 'tools/ci/**'
      - 'tools/release/**'
      - 'admin/AGENTS.md'
      - 'admin/go.mod'
      - 'admin/go.sum'
      - 'admin/main.go'
      - 'admin/cmd/migrate/**'
      - 'admin/modules/**'
      - 'templates/module/**'
      - 'web/antd-v6/config/routes.custom.ts'
      - 'web/antd-v6/config/routes.generated.ts'
      - 'web/antd-v6/src/generated/locales/*.ts'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  contracts-and-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Reject disabled assistant integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          banned = ('copi' + 'lot').lower()
          scan = [
              Path('AGENTS.md'),
              Path('CLAUDE.md'),
              Path('README.md'),
              Path('README.zh-CN.md'),
              Path('.agents'),
              Path('.codex'),
              Path('.cursor'),
              Path('.mss'),
              Path('.github'),
              Path('admin/AGENTS.md'),
              Path('docs/AGENTS.md'),
              Path('docs/docs/agent'),
              Path('docs/docs/architecture/agent-native-foundation.zh-CN.md'),
              Path('mss-boot/AGENTS.md'),
              Path('web/antd-v6/AGENTS.md'),
          ]
          violations = []
          for item in scan:
              paths = [item] if item.is_file() else sorted(item.rglob('*')) if item.exists() else []
              for path in paths:
                  if not path.is_file():
                      continue
                  if path == Path('.github/workflows/agent-native-ci.yml'):
                      continue
                  if banned in path.as_posix().lower():
                      violations.append(f'{path}: disabled integration file')
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if banned in text.lower():
                      violations.append(f'{path}: disabled integration reference')
          if violations:
              raise SystemExit('\n'.join(violations))
          PY

      - name: Check executable entrypoints
        run: |
          test -x mss
          test -x .codex/setup.sh

      - name: Check Go formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l \
            cmd/mss \
            cmd/mss-mcp \
            internal/mss \
            admin/modules/runtime \
            admin/modules/all \
            admin/main.go \
            admin/cmd/migrate/migrate.go)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files require gofmt:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Test Agent infrastructure
        env:
          GOWORK: 'off'
        run: go test -shuffle=on -count=1 ./internal/mss/... ./cmd/mss/... ./cmd/mss-mcp/...

      - name: Build Agent executables
        env:
          GOWORK: 'off'
        run: go build ./cmd/mss ./cmd/mss-mcp

      - name: Load project context
        run: go run ./cmd/mss context --format json > "${RUNNER_TEMP}/mss-context.json"

      - name: Run strict Agent environment doctor
        run: go run ./cmd/mss doctor --strict --component agent --format json > "${RUNNER_TEMP}/mss-doctor.json"

      - name: Run strict Admin module doctor
        run: go run ./cmd/mss doctor --strict --component backend --format json > "${RUNNER_TEMP}/mss-admin-doctor.json"

      - name: Validate Agent Skills
        run: go run ./cmd/mss skills validate --format json > "${RUNNER_TEMP}/mss-skills.json"

      - name: Validate example specifications and Feature plan
        run: |
          set -euo pipefail
          go run ./cmd/mss spec validate \
            .mss/modules/example-supplier.yaml \
            --format json \
            > "${RUNNER_TEMP}/mss-module-spec.json"
          go run ./cmd/mss spec validate \
            .mss/features/example-supplier-onboarding.yaml \
            --format json \
            > "${RUNNER_TEMP}/mss-feature-spec.json"
          go run ./cmd/mss feature plan \
            .mss/features/example-supplier-onboarding.yaml \
            --format json \
            > "${RUNNER_TEMP}/mss-feature-plan.json"

      - name: Write, test, and drift-check a generated Admin module in an isolated worktree
        run: |
          set -euo pipefail
          worktree="${RUNNER_TEMP}/mss-generator-worktree"
          rm -rf "${worktree}"
          git worktree add --detach "${worktree}" HEAD
          trap 'git worktree remove --force "${worktree}" || true' EXIT
          (
            cd "${worktree}"
            go run ./cmd/mss module generate \
              .mss/modules/example-supplier.yaml \
              --frontend-target antd-v6 \
              --write \
              --format json \
              > "${RUNNER_TEMP}/mss-generation-v6-write.json"
            go test ./admin/modules/supplier/...
            go run ./cmd/mss module generate \
              .mss/modules/example-supplier.yaml \
              --frontend-target antd-v6 \
              --check \
              --format json \
              > "${RUNNER_TEMP}/mss-generation-v6-check.json"
          )

      - name: Plan changed-file verification
        run: go run ./cmd/mss verify --changed --plan --format json > "${RUNNER_TEMP}/mss-verification-plan.json"

      - name: Verify release and workflow governance
        run: |
          python3 -m unittest \
            tools/ci/test_detect_component_scope.py \
            tools/release/test_check_release_policy.py \
            tools/release/test_generate_admin_web_sbom.py \
            tools/release/test_npm_release_workflow.py \
            tools/release/test_release_phase_evidence.py \
            tools/release/test_release_qualification_decision.py \
            tools/release/test_release_readiness_attestation.py \
            tools/release/test_release_readiness_workflow.py \
            tools/release/test_verify_admin_web_package.py \
            tools/release/test_verify_release_source.py \
            tools/release/test_workflow_governance.py

      - name: Upload Agent reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-native-reports
          path: |
            ${{ runner.temp }}/mss-context.json
            ${{ runner.temp }}/mss-doctor.json
            ${{ runner.temp }}/mss-admin-doctor.json
            ${{ runner.temp }}/mss-skills.json
            ${{ runner.temp }}/mss-module-spec.json
            ${{ runner.temp }}/mss-feature-spec.json
            ${{ runner.temp }}/mss-feature-plan.json
            ${{ runner.temp }}/mss-generation-v6-write.json
            ${{ runner.temp }}/mss-generation-v6-check.json
            ${{ runner.temp }}/mss-verification-plan.json
            .mss/reports/verify.json
            .mss/reports/verify.md
          if-no-files-found: warn
          retention-days: 14

  cross-platform-agent-tools:
    name: Agent tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test portable Agent packages
        env:
          GOWORK: 'off'
          TMPDIR: ${{ runner.temp }}
        run: go test ./internal/mss/dev ./internal/mss/project ./internal/mss/spec ./internal/mss/blueprint ./internal/mss/mcp

      - name: Build portable Agent executables
        env:
          GOWORK: 'off'
        run: go build ./cmd/mss ./cmd/mss-mcp

  foundation-compatibility:
    needs:
      - contracts-and-go
      - cross-platform-agent-tools
    uses: ./.github/workflows/foundation-compatibility.yml
