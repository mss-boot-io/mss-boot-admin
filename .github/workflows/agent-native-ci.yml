name: Agent-Native Foundation CI

on:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.mss/**'
      - '.agents/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'cmd/mss/**'
      - 'cmd/mss-mcp/**'
      - 'internal/mss/**'
      - 'modules/**'
      - 'templates/module/**'
      - 'main.go'
      - 'cmd/migrate/migrate.go'
      - 'web/antd/config/routes.custom.ts'
      - 'web/antd/config/routes.generated.ts'
      - 'web/antd/src/locales/generated.*.ts'
      - 'web/antd/src/locales/*/custom.ts'
      - '.github/workflows/agent-native-ci.yml'
  pull_request:
    branches:
      - main
      - codex/monorepo-integration
    paths:
      - '.mss/**'
      - '.agents/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'cmd/mss/**'
      - 'cmd/mss-mcp/**'
      - 'internal/mss/**'
      - 'modules/**'
      - 'templates/module/**'
      - 'main.go'
      - 'cmd/migrate/migrate.go'
      - 'web/antd/config/routes.custom.ts'
      - 'web/antd/config/routes.generated.ts'
      - 'web/antd/src/locales/generated.*.ts'
      - 'web/antd/src/locales/*/custom.ts'
      - '.github/workflows/agent-native-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check Go formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l \
            cmd/mss \
            cmd/mss-mcp \
            internal/mss \
            modules/runtime \
            modules/all \
            main.go \
            cmd/migrate/migrate.go)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files require gofmt:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Test Agent infrastructure
        run: go test ./internal/mss/... ./cmd/mss/... ./cmd/mss-mcp/... ./modules/runtime/...

      - name: Build Agent executables
        run: go build ./cmd/mss ./cmd/mss-mcp

      - name: Load project context
        run: go run ./cmd/mss context --format json > /tmp/mss-context.json

      - name: Run environment doctor
        run: go run ./cmd/mss doctor --format json > /tmp/mss-doctor.json

      - name: Validate Agent Skills
        run: go run ./cmd/mss skills validate --format json > /tmp/mss-skills.json

      - name: Validate example module specification
        run: go run ./cmd/mss spec validate .mss/modules/example-supplier.yaml --format json > /tmp/mss-spec.json

      - name: Dry-run module generation
        run: go run ./cmd/mss module generate .mss/modules/example-supplier.yaml --format json > /tmp/mss-generation.json

      - name: Plan changed-file verification
        run: go run ./cmd/mss verify --changed --plan --format json > /tmp/mss-verification-plan.json

      - name: Run deterministic Agent evaluations
        run: go run ./cmd/mss eval run --all --format json > /tmp/mss-evals.json

      - name: Upload Agent reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-native-reports
          path: |
            /tmp/mss-context.json
            /tmp/mss-doctor.json
            /tmp/mss-skills.json
            /tmp/mss-spec.json
            /tmp/mss-generation.json
            /tmp/mss-verification-plan.json
            /tmp/mss-evals.json
            .mss/reports/verify.json
            .mss/reports/verify.md
            .mss/reports/evals/latest.json
            .mss/reports/evals/latest.md
          if-no-files-found: warn
          retention-days: 7
