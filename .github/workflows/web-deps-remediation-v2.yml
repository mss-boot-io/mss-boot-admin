name: One-shot deterministic web dependency remediation

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-deterministic-web-dependency-remediation
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1
          fetch-depth: 0

      - name: Detect completed remediation
        id: guard
        run: |
          if [[ -f web/antd/pnpm-workspace.yaml ]] && \
             ! grep -q 'umi-presets-pro' web/antd/package.json; then
            echo 'done=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'done=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.done != 'true'
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        if: steps.guard.outputs.done != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            web/antd/workers-site/pnpm-lock.yaml

      - name: Rewrite dependency and test contracts
        if: steps.guard.outputs.done != 'true'
        run: python3 scripts/remediate_web_deps.py

      - name: Generate strict shared lockfile
        if: steps.guard.outputs.done != 'true'
        working-directory: web/antd
        run: |
          set -euxo pipefail
          rm -rf node_modules workers-site/node_modules .umi .umi-test
          pnpm install --lockfile-only --ignore-scripts --strict-peer-dependencies
          pnpm dedupe
          rm -rf node_modules workers-site/node_modules
          pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies --prefer-offline

      - name: Validate dependency health and frontend behavior
        if: steps.guard.outputs.done != 'true'
        working-directory: web/antd
        run: |
          set -euxo pipefail
          pnpm setup
          pnpm list --depth 0
          pnpm --filter @mss-boot-admin/workers-site list --depth 0
          pnpm dedupe --check
          pnpm audit --prod --audit-level high
          pnpm lint:js
          pnpm tsc
          timeout 240s pnpm test:ci
          pnpm build:local
          git diff --check

      - name: Commit converged frontend dependency graph
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web/antd
          git diff --cached --stat
          git commit -m 'build(frontend): converge dependency graph and lockfile'
          git push origin HEAD:refactor/split-admin-module-and-coverage-r1
