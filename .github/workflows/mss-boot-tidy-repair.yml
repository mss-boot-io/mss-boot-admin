name: One-shot mss-boot module repair

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-mss-boot-module-repair
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: mss-boot/go.mod
          cache: true
          cache-dependency-path: mss-boot/go.sum

      - name: Reconcile mss-boot module metadata
        working-directory: mss-boot
        run: go mod tidy

      - name: Commit repaired metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mss-boot/go.mod mss-boot/go.sum
          if git diff --cached --quiet; then
            echo 'mss-boot module metadata is already clean'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'build(mss-boot): reconcile module checksums'
          git push origin HEAD:refactor/split-admin-module-and-coverage-r1
