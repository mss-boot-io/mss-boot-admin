name: One-time monorepo migration

on:
  push:
    branches:
      - codex/monorepo-integration
    paths:
      - '.github/workflows/monorepo-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mss-boot-admin-monorepo-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify destination paths are empty
        run: |
          set -euo pipefail
          for path in mss-boot web/antd docs; do
            if [[ -e "${path}" ]]; then
              echo "Destination already exists: ${path}" >&2
              exit 1
            fi
          done

      - name: Import mss-boot with full history
        run: |
          set -euo pipefail
          git remote add framework-source https://github.com/mss-boot-io/mss-boot.git
          git fetch --no-tags framework-source +refs/heads/main:refs/remotes/framework-source/main
          git subtree add --prefix=mss-boot framework-source main

      - name: Import mss-boot-admin-antd with full history
        run: |
          set -euo pipefail
          git remote add frontend-source https://github.com/mss-boot-io/mss-boot-admin-antd.git
          git fetch --no-tags frontend-source +refs/heads/main:refs/remotes/frontend-source/main
          git subtree add --prefix=web/antd frontend-source main

      - name: Import mss-boot-docs with full history
        run: |
          set -euo pipefail
          git remote add docs-source https://github.com/mss-boot-io/mss-boot-docs.git
          git fetch --no-tags docs-source +refs/heads/main:refs/remotes/docs-source/main
          git subtree add --prefix=docs docs-source main

      - name: Record imported revisions and remove bootstrap workflow
        run: |
          set -euo pipefail
          framework_sha="$(git rev-parse framework-source/main)"
          frontend_sha="$(git rev-parse frontend-source/main)"
          docs_sha="$(git rev-parse docs-source/main)"

          cat > MONOREPO_IMPORTS.md <<EOF
          # Monorepo source imports

          The following repositories were imported with \`git subtree\` without \`--squash\`, so their source commit histories remain reachable from this repository.

          | Destination | Source repository | Imported main revision |
          | --- | --- | --- |
          | \`mss-boot/\` | \`mss-boot-io/mss-boot\` | \`${framework_sha}\` |
          | \`web/antd/\` | \`mss-boot-io/mss-boot-admin-antd\` | \`${frontend_sha}\` |
          | \`docs/\` | \`mss-boot-io/mss-boot-docs\` | \`${docs_sha}\` |

          This file records the cutover boundary. New development after the migration is performed only in \`mss-boot-io/mss-boot-admin\`.
          EOF

          rm -f .github/workflows/monorepo-migration.yml
          git add -A
          git commit -m "chore: record monorepo source imports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
