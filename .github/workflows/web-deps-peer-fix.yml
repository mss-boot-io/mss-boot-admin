name: One-shot web peer dependency fix

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-web-peer-dependency-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1
          fetch-depth: 0

      - name: Declare Umi peer dependencies in remediation contract
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/web-deps-remediation.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "              'cross-env': '10.1.0',\n": "              'cross-env': '10.1.0',\n              'dva': '2.5.0-beta.2',\n",
              "              'prettier': '2.8.8',\n": "              'prettier': '2.8.8',\n              'styled-jsx': '5.1.6',\n",
              "              'typescript': '4.9.5',\n": "              'typescript': '4.9.5',\n              'webpack': '5.109.2',\n",
          }
          for source, target in replacements.items():
              if target in text:
                  continue
              if source not in text:
                  raise SystemExit(f'missing remediation marker: {source!r}')
              text = text.replace(source, target, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit peer dependency fix
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/web-deps-remediation.yml
          if git diff --cached --quiet; then
            echo 'peer dependencies are already explicit'
            exit 0
          fi
          git commit -m 'fix(frontend): declare Umi peer dependencies explicitly'
          git push origin HEAD:refactor/split-admin-module-and-coverage-r1
