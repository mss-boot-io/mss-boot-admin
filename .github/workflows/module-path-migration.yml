name: One-time framework module path migration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/module-path-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mss-boot-admin-module-path-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout monorepo branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rewrite framework module path and monorepo documentation
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          old = "github.com/mss-boot-io/mss-boot"
          new = "github.com/mss-boot-io/mss-boot-admin/mss-boot"
          framework_version = "v0.8.0"
          skip_roots = {".git", "vendor", "docs", "web", "aigc"}

          # Match the former module only at a real Go-module boundary. This must
          # not match the target repository path, whose next character is '-'.
          old_module_pattern = re.compile(
              re.escape(old) + r"(?=$|[/@\s\"'])"
          )

          active_files: list[Path] = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in skip_roots for part in path.parts):
                  continue
              if path.suffix != ".go" and path.name != "go.mod":
                  continue
              active_files.append(path)
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = old_module_pattern.sub(new, text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          root_go_mod = Path("go.mod")
          root_text = root_go_mod.read_text(encoding="utf-8")
          expected_root_module = "module github.com/mss-boot-io/mss-boot-admin\n"
          if not root_text.startswith(expected_root_module):
              raise SystemExit(
                  "root module path changed unexpectedly; refusing to commit migration"
              )

          root_text, replacements = re.subn(
              rf"(?m)^(\s*){re.escape(new)}\s+v[^\s]+(\s*(?://.*)?)$",
              rf"\1{new} {framework_version}\2",
              root_text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("failed to normalize the root framework requirement")
          if re.search(rf"(?m)^\s*replace\s+{re.escape(new)}\b", root_text):
              raise SystemExit("a permanent local replace directive is not allowed")
          root_go_mod.write_text(root_text, encoding="utf-8")

          framework_go_mod = Path("mss-boot/go.mod")
          framework_text = framework_go_mod.read_text(encoding="utf-8")
          expected_framework_module = f"module {new}\n"
          if not framework_text.startswith(expected_framework_module):
              raise SystemExit("framework module path was not migrated correctly")

          # The new nested module tag does not exist until after this PR merges.
          # Workspace mode does not require a checksum for another workspace
          # module, so remove only the obsolete standalone-module checksums.
          root_go_sum = Path("go.sum")
          sum_lines = root_go_sum.read_text(encoding="utf-8").splitlines()
          sum_lines = [line for line in sum_lines if not line.startswith(old + " ")]
          root_go_sum.write_text("\n".join(sum_lines) + "\n", encoding="utf-8")

          makefile = Path("Makefile")
          make_text = makefile.read_text(encoding="utf-8")
          old_deps = "deps:\n\tGOWORK=off go mod download\n"
          new_deps = "deps:\n\tgo list -deps ./... >/dev/null\n"
          if old_deps not in make_text:
              raise SystemExit("unexpected root deps target in Makefile")
          makefile.write_text(
              make_text.replace(old_deps, new_deps, 1), encoding="utf-8"
          )

          def replace_required(path: Path, old_text: str, new_text: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old_text not in text:
                  raise SystemExit(
                      f"expected text not found in {path}: {old_text[:80]!r}"
                  )
              path.write_text(text.replace(old_text, new_text, 1), encoding="utf-8")

          readme = Path("README.md")
          replace_required(
              readme,
              """## Project address
          [Backend project](https://github.com/mss-boot-io/mss-boot-admin)
          [Front-end project](https://github.com/mss-boot-io/mss-boot-admin-antd)
          """,
              """## Repository layout

          | Path | Component |
          | --- | --- |
          | `/` | Go admin backend |
          | `mss-boot/` | Reusable Go framework module |
          | `web/antd/` | React + Ant Design frontend |
          | `docs/` | Dumi documentation site |

          All active development now happens in this repository. The former standalone repositories are retained only as migration history and compatibility references.
          """,
          )
          replace_required(
              readme,
              """### 1. Download the project
          ```shell
          # Download the backend project
          git clone https://github.com/mss-boot-io/mss-boot-admin.git
          # Download the front-end project
          git clone https://github.com/mss-boot-io/mss-boot-admin-antd.git
          ```""",
              """### 1. Download the monorepo
          ```shell
          git clone https://github.com/mss-boot-io/mss-boot-admin.git
          cd mss-boot-admin
          ```""",
          )
          replace_required(readme, "cd mss-boot-admin-antd", "cd web/antd")

          readme_zh = Path("README.zh-CN.md")
          replace_required(
              readme_zh,
              """## 项目地址
          [后端项目](https://github.com/mss-boot-io/mss-boot-admin)
          [前端项目](https://github.com/mss-boot-io/mss-boot-admin-antd)
          """,
              """## 仓库结构

          | 路径 | 组件 |
          | --- | --- |
          | `/` | Go 管理后台后端 |
          | `mss-boot/` | 可复用 Go 框架模块 |
          | `web/antd/` | React + Ant Design 前端 |
          | `docs/` | Dumi 文档站点 |

          后续所有有效开发统一在本仓库进行，原有独立仓库仅保留为迁移历史与兼容性参考。
          """,
          )
          replace_required(
              readme_zh,
              """### 1. 下载项目
          ```shell
          # 下载后端项目
          git clone https://github.com/mss-boot-io/mss-boot-admin.git
          # 下载前端项目
          git clone https://github.com/mss-boot-io/mss-boot-admin-antd.git
          ```""",
              """### 1. 下载单体仓库
          ```shell
          git clone https://github.com/mss-boot-io/mss-boot-admin.git
          cd mss-boot-admin
          ```""",
          )
          replace_required(readme_zh, "cd mss-boot-admin-antd", "cd web/antd")

          framework_readme = Path("mss-boot/README.md")
          framework_readme_text = framework_readme.read_text(encoding="utf-8")
          framework_readme_text = framework_readme_text.replace(
              "go get github.com/mss-boot-io/mss-boot@v0.7.3",
              f"go get {new}@{framework_version}",
          )
          framework_readme_text = old_module_pattern.sub(
              new, framework_readme_text
          )
          framework_readme.write_text(framework_readme_text, encoding="utf-8")

          framework_readme_zh = Path("mss-boot/README.Zh-cn.md")
          framework_readme_zh_text = framework_readme_zh.read_text(encoding="utf-8")
          framework_readme_zh_text = framework_readme_zh_text.replace(
              "go get github.com/mss-boot-io/mss-boot@v0.7.3",
              f"go get {new}@{framework_version}",
          )
          framework_readme_zh.write_text(
              framework_readme_zh_text, encoding="utf-8"
          )

          monorepo_guide = """# Monorepo guide

          ## Layout

          | Path | Purpose |
          | --- | --- |
          | `/` | `github.com/mss-boot-io/mss-boot-admin`, the Go admin backend |
          | `mss-boot/` | `github.com/mss-boot-io/mss-boot-admin/mss-boot`, the reusable Go framework |
          | `web/antd/` | React + Ant Design frontend |
          | `docs/` | Dumi documentation site |

          `go.work` activates the backend and framework modules together. Do not add a permanent local `replace` directive to either published `go.mod`; workspace mode is the source of truth for repository-local development.

          ## Common commands

          ```shell
          make deps-all
          make test-all
          make web-install web-lint web-test web-build
          make docs-install docs-build
          ```

          ## Release tags

          - Backend application: `vX.Y.Z`
          - Framework module: `mss-boot/vX.Y.Z`
          - Ant Design frontend: `web/antd/vX.Y.Z`
          - Documentation: built and deployed from `main`

          The first framework release after consolidation is `mss-boot/v0.8.0`. For a coordinated release, publish the framework tag before the backend tag so the backend's `go.mod` requirement is available outside workspace mode.

          ## Workflow location

          Only workflows under the repository-root `.github/workflows/` directory are active. Workflow files preserved inside imported component directories are historical source snapshots and are not executed by GitHub Actions.

          ## Migration boundary

          See `MONOREPO_IMPORTS.md` for the exact source repositories and imported commit revisions. After this migration is merged and production verification succeeds, the three former standalone repositories should be marked deprecated and archived rather than deleted, preserving issues, releases, tags, and external links.
          """
          Path("MONOREPO.md").write_text(
              "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in monorepo_guide.splitlines()
              )
              + "\n",
              encoding="utf-8",
          )

          # Verify that no live Go source or module manifest still references the
          # old framework module, while the root module remains untouched.
          leftovers: list[str] = []
          for path in active_files:
              text = path.read_text(encoding="utf-8")
              if old_module_pattern.search(text):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit(
                  "old framework module references remain in: " + ", ".join(leftovers)
              )
          PY

          git diff --name-only -z -- '*.go' | xargs -0 -r gofmt -w

      - name: Commit migration before validation
        run: |
          set -euo pipefail
          rm -f .github/workflows/module-path-migration.yml
          git add -A
          git commit -m "refactor: migrate framework to monorepo module path"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Validate committed Go workspace
        run: |
          set -euo pipefail
          test "$(go env GOWORK)" = "${GITHUB_WORKSPACE}/go.work"
          make deps-all
          make test-all
          go work vendor
