name: Framework Release

on:
  push:
    tags:
      - 'mss-boot/v*.*.*'

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mss-boot/go.mod
          cache: true
          cache-dependency-path: mss-boot/go.sum

      - name: Resolve framework version
        id: version
        run: |
          set -euo pipefail

          validate_release_version() {
            local value="$1"
            local unprefixed
            local core
            local prerelease
            local identifier
            local identifiers

            [[ "${value}" == v* ]] || return 1
            unprefixed="${value#v}"
            core="${unprefixed%%-*}"
            [[ "${core}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || return 1
            if [[ "${unprefixed}" != *-* ]]; then
              return 0
            fi
            prerelease="${unprefixed#*-}"
            [[ -n "${prerelease}" ]] || return 1
            [[ "${prerelease}" != .* && "${prerelease}" != *. && "${prerelease}" != *..* ]] || return 1
            IFS='.' read -r -a identifiers <<< "${prerelease}"
            for identifier in "${identifiers[@]}"; do
              [[ "${identifier}" =~ ^[0-9A-Za-z-]+$ ]] || return 1
              if [[ "${identifier}" =~ ^[0-9]+$ && "${identifier}" =~ ^0[0-9]+$ ]]; then
                return 1
              fi
            done
          }

          version="${GITHUB_REF_NAME#mss-boot/}"
          if ! validate_release_version "${version}"; then
            echo "Invalid framework tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          resolved_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if [[ "${resolved_commit}" != "${GITHUB_SHA}" ]]; then
            echo "framework tag resolves to ${resolved_commit}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify merged-main release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/verify_release_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --tag "${GITHUB_REF_NAME}" \
            --policy .mss/release-policy.yaml

      - name: Enforce reviewed public release target
        env:
          FRAMEWORK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/release/check_release_policy.py \
            --component framework \
            --version "${FRAMEWORK_VERSION}" \
            --tag "${GITHUB_REF_NAME}"

      - name: Require selected pre-framework readiness attestation
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMEWORK_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_READINESS_RUN_ID: ${{ vars.RELEASE_READINESS_RUN_ID }}
        run: |
          set -euo pipefail
          bash tools/release/verify_readiness_run.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${RELEASE_READINESS_RUN_ID}" \
            --target-version "${FRAMEWORK_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --phase pre-framework \
            --policy .mss/release-policy.yaml

      - name: Refuse mutation of an existing public component release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if release_json="$(gh release view "${GITHUB_REF_NAME}" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<< "${release_json}")" != "true" ]]; then
              echo "release ${GITHUB_REF_NAME} is already public; refusing to mutate it" >&2
              exit 1
            fi
          fi

      - name: Verify final Framework and Admin checksum parity
        id: candidate-checksums
        env:
          FRAMEWORK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          checksum_json="$(
            python3 tools/release/verify_framework_admin_checksum.py \
              --version "${FRAMEWORK_VERSION}"
          )"
          framework_sum="$(jq -er '.sum | select(type == "string" and startswith("h1:"))' <<< "${checksum_json}")"
          framework_go_mod_sum="$(jq -er '.goModSum | select(type == "string" and startswith("h1:"))' <<< "${checksum_json}")"
          admin_sum="$(jq -er '.adminSum | select(type == "string" and startswith("h1:"))' <<< "${checksum_json}")"
          admin_go_mod_sum="$(jq -er '.adminGoModSum | select(type == "string" and startswith("h1:"))' <<< "${checksum_json}")"
          {
            echo "framework_sum=${framework_sum}"
            echo "framework_go_mod_sum=${framework_go_mod_sum}"
            echo "admin_sum=${admin_sum}"
            echo "admin_go_mod_sum=${admin_go_mod_sum}"
          } >> "${GITHUB_OUTPUT}"
          printf '%s\n' \
            "Framework Module Sum: ${framework_sum}" \
            "Framework GoModSum: ${framework_go_mod_sum}" \
            "Admin Module Sum: ${admin_sum}" \
            "Admin GoModSum: ${admin_go_mod_sum}"

      - name: Test framework module
        working-directory: mss-boot
        env:
          GOWORK: 'off'
        run: |
          go mod download
          go test ./...
          go vet ./...

      - name: Probe the published module from a clean external workspace
        env:
          FRAMEWORK_VERSION: ${{ steps.version.outputs.version }}
          FRAMEWORK_SUM: ${{ steps.candidate-checksums.outputs.framework_sum }}
          FRAMEWORK_GO_MOD_SUM: ${{ steps.candidate-checksums.outputs.framework_go_mod_sum }}
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "${probe_dir}"' EXIT
          module="github.com/mss-boot-io/mss-boot-admin/mss-boot"
          download_json="$(
            cd "${probe_dir}"
            GOWORK=off GOPROXY=direct go mod init example.com/mss-framework-release-probe >/dev/null
            GOWORK=off GOPROXY=direct go mod download -json "${module}@${FRAMEWORK_VERSION}"
          )"
          jq -e \
            --arg module "${module}" \
            --arg version "${FRAMEWORK_VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            --arg sum "${FRAMEWORK_SUM}" \
            --arg go_mod_sum "${FRAMEWORK_GO_MOD_SUM}" \
            '.Path == $module and .Version == $version and .Origin.Hash == $commit and .Sum == $sum and .GoModSum == $go_mod_sum' \
            <<< "${download_json}" >/dev/null
          cat > "${probe_dir}/main.go" <<'EOF'
          package main

          import (
            "fmt"

            "github.com/mss-boot-io/mss-boot-admin/mss-boot/pkg/enum"
          )

          func main() {
            if enum.Enabled.String() != "enabled" {
              panic("unexpected framework enum contract")
            }
            fmt.Println(enum.Enabled)
          }
          EOF
          (
            cd "${probe_dir}"
            GOWORK=off go mod edit -require="${module}@${FRAMEWORK_VERSION}"
            GOWORK=off GOPROXY=direct go mod tidy
            GOWORK=off GOPROXY=direct go build ./...
          )

      - name: Prepare component-scoped release notes
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          FRAMEWORK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          previous_tag=""
          while IFS= read -r candidate; do
            if [[ "${candidate}" == "${GITHUB_REF_NAME}" ]]; then
              continue
            fi
            if [[ "${candidate}" =~ ^mss-boot/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              previous_tag="${candidate}"
              break
            fi
          done < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')

          notes_file="${RUNNER_TEMP}/framework-release-notes.md"
          api_args=(
            --method POST
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f "tag_name=${GITHUB_REF_NAME}"
            -f "target_commitish=${GITHUB_SHA}"
          )
          if [[ -n "${previous_tag}" ]]; then
            api_args+=(-f "previous_tag_name=${previous_tag}")
          fi
          gh api "${api_args[@]}" --jq .body > "${notes_file}"
          {
            echo
            echo '## Install'
            echo
            echo '```shell'
            echo "go get github.com/mss-boot-io/mss-boot-admin/mss-boot@${FRAMEWORK_VERSION}"
            echo '```'
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo 'The release workflow resolved this version from a clean external module with `GOWORK=off` and compiled a minimal consumer before publication.'
          } >> "${notes_file}"
          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Publish framework release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: mss-boot ${{ steps.version.outputs.version }}
          body_path: ${{ steps.release-notes.outputs.path }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: false
