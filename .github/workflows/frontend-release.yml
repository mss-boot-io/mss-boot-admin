name: Frontend Release

on:
  push:
    tags:
      - 'web/antd/v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mss-boot-admin-antd

defaults:
  run:
    working-directory: web/antd

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#web/antd/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build for local runtime
        run: pnpm build:local
      - name: Pack local runtime dist
        run: tar -czvf dist-local.tar.gz dist
      - name: Build production dist
        run: |
          rm -rf dist
          rm -rf config/config.prod.*
          pnpm build
          pnpm bundle:check
      - name: Pack production dist
        run: tar -czvf dist.tar.gz dist
      - name: Smoke-test production delivery
        run: pnpm delivery:smoke
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist-release
          path: web/antd/dist
      - name: Upsert GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="mss-boot-admin-antd ${VERSION}"
          body="$(mktemp)"
          cat > "${body}" <<EOF
          ## Pull image
          \`\`\`shell
          docker pull ghcr.io/${IMAGE_NAME}:${VERSION}
          \`\`\`
          EOF

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${title}" --notes-file "${body}" --draft=false --prerelease=false
          else
            gh release create "${tag}" --verify-tag --title "${title}" --notes-file "${body}"
          fi

          gh release upload "${tag}" dist.tar.gz dist-local.tar.gz --clobber
      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=,format=long
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: web/antd
          file: web/antd/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
