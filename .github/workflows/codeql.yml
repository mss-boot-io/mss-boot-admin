name: CodeQL

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: "37 20 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/component-scope.yml

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            scopes: '["shared"]'
          - language: go
            build-mode: autobuild
            scopes: '["shared","admin","framework"]'
          - language: javascript-typescript
            build-mode: none
            scopes: '["shared","web"]'
    steps:
      - name: Skip analysis outside the changed component
        if: ${{ !contains(fromJSON(matrix.scopes), needs.scope.outputs.scope) }}
        run: echo 'This CodeQL language is outside the changed component scope.'

      - name: Checkout
        if: ${{ contains(fromJSON(matrix.scopes), needs.scope.outputs.scope) }}
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: ${{ contains(fromJSON(matrix.scopes), needs.scope.outputs.scope) }}
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        if: ${{ contains(fromJSON(matrix.scopes), needs.scope.outputs.scope) }}
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
