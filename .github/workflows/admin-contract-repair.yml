name: One-shot admin contract repair

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-admin-contract-repair
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1
          fetch-depth: 0

      - name: Repair Blueprint, generator, and Doctor contracts
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root_module = 'github.com/mss-boot-io/mss-boot-admin'

          generator_test = Path('internal/mss/generator/generator_test.go')
          text = generator_test.read_text(encoding='utf-8')
          text = text.replace('.mss/admin/modules/supplier.yaml', '.mss/modules/supplier.yaml')
          generator_test.write_text(text, encoding='utf-8')

          plan_test = Path('internal/mss/blueprint/plan_test.go')
          text = plan_test.read_text(encoding='utf-8')
          text = text.replace('    - main.go\n', '    - admin/go.mod\n    - admin/main.go\n')
          text = text.replace(
              '"go.work":   []byte("go 1.26.0\\n\\nuse (\\n\\t.\\n\\t./mss-boot\\n)\\n"),',
              '"go.work":   []byte("go 1.26.0\\n\\nuse (\\n\\t.\\n\\t./admin\\n\\t./mss-boot\\n)\\n"),',
          )
          if '"admin/go.mod"' not in text:
              text = text.replace(
                  '"admin/main.go":   []byte(',
                  '"admin/go.mod": []byte("module ' + root_module + '/admin\\n\\ngo 1.26.0\\n\\nrequire ' + root_module + '/mss-boot v0.8.0\\n\\nreplace ' + root_module + '/mss-boot v0.8.0 => ../mss-boot\\n"),\n\t\t"admin/main.go":   []byte(',
              )
          text = text.replace(root_module + '/internal/example', root_module + '/admin/internal/example')
          text = text.replace('    backend: .\n', '    backend: admin\n')
          text = text.replace(
              '    module: ' + root_module + '\n    frameworkModule:',
              '    module: ' + root_module + '/admin\n    frameworkModule:',
          )
          assertion = 'assertContains(t, filepath.Join(destination, "admin", "go.mod"), "module github.com/acme/customer-admin/admin")'
          if assertion not in text:
              text = text.replace(
                  'assertContains(t, filepath.Join(destination, "go.mod"), "module github.com/acme/customer-admin")',
                  'assertContains(t, filepath.Join(destination, "go.mod"), "module github.com/acme/customer-admin")\n\t' + assertion,
              )
          text = text.replace('github.com/acme/customer-admin/internal/example', 'github.com/acme/customer-admin/admin/internal/example')
          plan_test.write_text(text, encoding='utf-8')

          workspace_test = Path('internal/mss/blueprint/workspace_test.go')
          text = workspace_test.read_text(encoding='utf-8')
          text = text.replace(
              'module github.com/mss-boot-io/mss-boot-admin\n\ngo 1.26.0\n\nrequire github.com/mss-boot-io/mss-boot-admin/mss-boot v0.8.0',
              'module github.com/mss-boot-io/mss-boot-admin\n\ngo 1.26.0',
          )
          text = text.replace('\t.\n\t./mss-boot\n', '\t.\n\t./admin\n\t./mss-boot\n')
          if 'writeFixtureFile(t, root, "admin/go.mod"' not in text:
              text = text.replace(
                  'writeFixtureFile(t, root, "admin/main.go",',
                  'writeFixtureFile(t, root, "admin/go.mod", `module github.com/mss-boot-io/mss-boot-admin/admin\n\ngo 1.26.0\n\nrequire github.com/mss-boot-io/mss-boot-admin/mss-boot v0.8.0\n\nreplace github.com/mss-boot-io/mss-boot-admin/mss-boot v0.8.0 => ../mss-boot\n`)\n\twriteFixtureFile(t, root, "admin/main.go",',
              )
          text = text.replace(
              'filepath.Join(destination, "go.mod"),\n\t\t"require github.com/acme/workspace-admin/mss-boot v0.8.0",',
              'filepath.Join(destination, "admin", "go.mod"),\n\t\t"require github.com/acme/workspace-admin/mss-boot v0.8.0",',
          )
          text = text.replace(
              'exec.Command("go", "list", "./...")',
              'exec.Command("go", "list", "./...", "./admin/...", "./mss-boot/...")',
          )
          workspace_test.write_text(text, encoding='utf-8')

          doctor = Path('internal/mss/doctor/doctor.go')
          text = doctor.read_text(encoding='utf-8')
          text = text.replace(
              'fileCheck(projectContext.Root, "go.mod", true),\n\t\t\tfileCheck(projectContext.Root, "go.work", true),',
              'fileCheck(projectContext.Root, "admin/go.mod", true),\n\t\t\tfileCheck(projectContext.Root, "admin/go.sum", true),\n\t\t\tfileCheck(projectContext.Root, "go.work", true),',
          )
          doctor.write_text(text, encoding='utf-8')

          doctor_test = Path('internal/mss/doctor/doctor_test.go')
          if doctor_test.exists():
              text = doctor_test.read_text(encoding='utf-8').replace('file:go.mod', 'file:admin/go.mod')
              doctor_test.write_text(text, encoding='utf-8')
          PY
          gofmt -w internal/mss/generator/generator_test.go internal/mss/blueprint/*.go internal/mss/doctor/*.go

      - name: Commit repaired contracts
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/mss
          if git diff --cached --quiet; then
            echo 'contracts already repaired'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'fix(agent): align blueprints and generators with admin module'
          git push origin HEAD:refactor/split-admin-module-and-coverage-r1
