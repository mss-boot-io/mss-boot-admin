name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'v*.*.*'
      - 'mss-boot/v*.*.*'
    paths-ignore:
      - 'docs/**'
      - 'web/antd/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'web/antd/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  issues: write
  packages: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            mss-boot/go.sum
            cmd/tools/pr/go.sum

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Install dependencies
        run: make deps-all

      - name: Unit tests
        run: make test-all

      - name: Framework race tests
        run: make test-framework-race

      - name: Framework vet
        run: make vet-framework

      - name: Verify framework module metadata
        run: make tidy-framework-check

      - name: Convert coverage report to table
        run: |
          go tool cover -func=coverage.out \
            | tail -n +2 \
            | awk '{print "|",$1,"|",$3,"|"}' \
            > coverage_table.md

      - name: Comment on PR with coverage table
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: cmd/tools/pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          COVERAGE_FILE: ../../../coverage_table.md
          GOWORK: 'off'
        run: |
          go mod tidy
          go run main.go

      - name: Build backend
        run: make build

      - name: Vendor workspace
        run: go work vendor

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=long,enable=true,priority=100

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
