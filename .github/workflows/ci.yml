name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'web/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
      - '**/*.md'
      - '.github/workflows/agent-native-ci.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/frontend-v6-ci.yml'
      - '.github/workflows/swagger.yml'
  pull_request:
    branches:
      - main
    # Branch protection requires the admin-ci context. Keep pull requests
    # unfiltered so GitHub always creates that required check.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOTOOLCHAIN: local

jobs:
  scope:
    uses: ./.github/workflows/component-scope.yml

  test:
    name: admin-test
    needs: scope
    if: needs.scope.outputs.scope == 'admin' || needs.scope.outputs.scope == 'shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      pull-requests: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: admin/go.mod
          cache: true
          cache-dependency-path: |
            admin/go.sum
            mss-boot/go.sum
            go.work.sum

      - name: Test coverage policy tooling
        run: python3 -m unittest scripts/test_check_go_coverage.py

      - name: Test coordinated Admin module with atomic coverage
        working-directory: admin
        run: >-
          go test -shuffle=on -count=1 -covermode=atomic -coverpkg=./...
          -coverprofile="${RUNNER_TEMP}/admin.coverage.out" ./...

      - name: Enforce Admin coverage policy
        run: >-
          python3 scripts/check-go-coverage.py
          --profile "${RUNNER_TEMP}/admin.coverage.out"
          --policy .mss/coverage.json
          --component admin
          --summary

      - name: Convert Admin coverage report to table
        if: github.event_name == 'pull_request'
        run: |
          go tool cover -func="${RUNNER_TEMP}/admin.coverage.out" \
            | tail -n +2 \
            | awk '{print "|",$1,"|",$3,"|"}' \
            > admin_coverage_table.md

      - name: Comment on PR with Admin coverage
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          comment="${RUNNER_TEMP}/admin-coverage-comment.md"
          {
            echo '| Field | Coverage |'
            echo '| --- | --- |'
            cat admin_coverage_table.md
          } > "${comment}"
          jq -n --rawfile body "${comment}" '{body: $body}' \
            | gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                --method POST \
                --input - >/dev/null

      - name: Upload Admin coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: admin-coverage
          path: ${{ runner.temp }}/admin.coverage.out
          if-no-files-found: error
          retention-days: 14

  race:
    name: admin-race
    needs: scope
    if: needs.scope.outputs.scope == 'admin' || needs.scope.outputs.scope == 'shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: admin/go.mod
          cache: true
          cache-dependency-path: |
            admin/go.sum
            mss-boot/go.sum

      - name: Race-test coordinated Admin module
        working-directory: admin
        run: go test -race -shuffle=on -count=1 ./...

  static-and-module:
    name: admin-static-and-module
    needs: scope
    if: needs.scope.outputs.scope == 'admin' || needs.scope.outputs.scope == 'shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: admin/go.mod
          cache: true
          cache-dependency-path: |
            admin/go.sum
            mss-boot/go.sum

      - name: Vet Admin module
        working-directory: admin
        run: go vet ./...

      - name: Verify Admin module metadata
        run: bash tools/ci/verify-admin-module-metadata.sh

      - name: Reject actual reverse Admin dependencies
        run: |
          set -euo pipefail
          admin_prefix='github.com/mss-boot-io/mss-boot-admin/admin'
          if GOWORK=off go list -deps ./... | grep -E "^${admin_prefix}(/|$)"; then
            echo 'Agent/Foundation module must not depend on Admin packages' >&2
            exit 1
          fi
          if (cd mss-boot && GOWORK=off go list -deps ./...) | grep -E "^${admin_prefix}(/|$)"; then
            echo 'mss-boot must not depend on Admin packages' >&2
            exit 1
          fi

  compatibility:
    name: admin-mss-boot-compatibility
    needs: scope
    if: >-
      needs.scope.outputs.scope == 'admin' ||
      needs.scope.outputs.scope == 'framework' ||
      needs.scope.outputs.scope == 'shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: admin/go.mod
          cache: true
          cache-dependency-path: |
            admin/go.sum
            mss-boot/go.sum
            go.work.sum

      - name: Verify workspace compatibility contract
        run: go test -count=1 ./admin/compatibility

      - name: Verify repository-external Admin consumer
        run: bash tools/compatibility/test-admin-external-consumer.sh

      - name: Verify workspace module graph
        run: |
          go list -m all > "${RUNNER_TEMP}/workspace-modules.txt"
          grep -F 'github.com/mss-boot-io/mss-boot-admin/admin' "${RUNNER_TEMP}/workspace-modules.txt"
          grep -F 'github.com/mss-boot-io/mss-boot-admin/mss-boot' "${RUNNER_TEMP}/workspace-modules.txt"

  compile:
    name: admin-build
    needs: scope
    if: needs.scope.outputs.scope == 'admin' || needs.scope.outputs.scope == 'shared'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: admin/go.mod
          cache: true
          cache-dependency-path: |
            admin/go.sum
            mss-boot/go.sum

      - name: Build coordinated Admin binary
        working-directory: admin
        env:
          BINARY: ${{ runner.temp }}/mss-boot-admin
        run: |
          CGO_ENABLED=0 go build -trimpath -o "${BINARY}" .
          "${BINARY}" --help >/dev/null
          "${BINARY}" server --help >/dev/null
          "${BINARY}" migrate --help >/dev/null

  build:
    # Use a repository-unique required context; several unrelated workflows
    # also expose a generic "build" job and must not satisfy Admin CI.
    name: admin-ci
    if: ${{ always() }}
    needs:
      - scope
      - test
      - race
      - static-and-module
      - compatibility
      - compile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Admin check to pass
        env:
          COMPONENT_SCOPE: ${{ needs.scope.outputs.scope }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RACE_RESULT: ${{ needs.race.result }}
          STATIC_RESULT: ${{ needs.static-and-module.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          echo "scope=${SCOPE_RESULT}"
          echo "component-scope=${COMPONENT_SCOPE}"
          echo "test=${TEST_RESULT}"
          echo "race=${RACE_RESULT}"
          echo "static-and-module=${STATIC_RESULT}"
          echo "compatibility=${COMPATIBILITY_RESULT}"
          echo "compile=${COMPILE_RESULT}"
          test "${SCOPE_RESULT}" = "success"
          case "${COMPONENT_SCOPE}" in
            admin|shared)
              test "${TEST_RESULT}" = "success"
              test "${RACE_RESULT}" = "success"
              test "${STATIC_RESULT}" = "success"
              test "${COMPATIBILITY_RESULT}" = "success"
              test "${COMPILE_RESULT}" = "success"
              ;;
            framework)
              test "${TEST_RESULT}" = "skipped"
              test "${RACE_RESULT}" = "skipped"
              test "${STATIC_RESULT}" = "skipped"
              test "${COMPATIBILITY_RESULT}" = "success"
              test "${COMPILE_RESULT}" = "skipped"
              ;;
            docs|web)
              test "${TEST_RESULT}" = "skipped"
              test "${RACE_RESULT}" = "skipped"
              test "${STATIC_RESULT}" = "skipped"
              test "${COMPATIBILITY_RESULT}" = "skipped"
              test "${COMPILE_RESULT}" = "skipped"
              ;;
            *)
              echo "unsupported component scope: ${COMPONENT_SCOPE}" >&2
              exit 1
              ;;
          esac
