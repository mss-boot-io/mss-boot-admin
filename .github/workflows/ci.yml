name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - 'web/antd/**'
      - '.mss/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
      - '**/*.md'
      - '.github/workflows/agent-native-ci.yml'
      - '.github/workflows/container.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/mss-boot-ci.yml'
      - '.github/workflows/swagger.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'web/antd/**'
      - '.mss/**'
      - '.agents/**'
      - '.codex/**'
      - '.cursor/**'
      - '**/*.md'
      - '.github/workflows/agent-native-ci.yml'
      - '.github/workflows/container.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/mss-boot-ci.yml'
      - '.github/workflows/swagger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: admin-test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
      pull-requests: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            mss-boot/go.sum
            cmd/tools/pr/go.sum

      - name: Test admin backend
        run: go test -coverprofile=coverage.out ./...

      - name: Convert coverage report to table
        if: github.event_name == 'pull_request'
        run: |
          go tool cover -func=coverage.out \
            | tail -n +2 \
            | awk '{print "|",$1,"|",$3,"|"}' \
            > coverage_table.md

      - name: Comment on PR with coverage table
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: cmd/tools/pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          COVERAGE_FILE: ../../../coverage_table.md
          GOWORK: 'off'
        run: go run -mod=readonly .

  compile:
    name: admin-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            mss-boot/go.sum

      - name: Build admin backend
        run: CGO_ENABLED=0 go build -trimpath -o admin main.go

  build:
    # Keep this job name stable for the existing required check: CI / build.
    name: build
    if: ${{ always() }}
    needs:
      - test
      - compile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require admin validation to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          echo "test=${TEST_RESULT}"
          echo "compile=${COMPILE_RESULT}"
          test "${TEST_RESULT}" = "success"
          test "${COMPILE_RESULT}" = "success"
