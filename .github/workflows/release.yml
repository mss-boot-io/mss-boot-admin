name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GOTOOLCHAIN: local

jobs:
  foundation-compatibility:
    uses: ./.github/workflows/foundation-compatibility.yml

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Go dependencies
        run: make deps-all

      - name: Verify independent Admin module
        run: make verify-admin

      - name: Verify independent framework module
        run: make verify-framework

      - name: Verify Agent module and contracts
        run: |
          set -euo pipefail
          make test-agent
          go run ./cmd/mss doctor --strict --component agent --format json
          go run ./cmd/mss doctor --strict --component backend --format json
          go run ./cmd/mss skills validate --format json
          go run ./cmd/mss spec validate .mss/modules/example-supplier.yaml --format json
          go run ./cmd/mss spec validate .mss/features/example-supplier-onboarding.yaml --format json
          go run ./cmd/mss feature plan .mss/features/example-supplier-onboarding.yaml --format json
          go run ./cmd/mss eval run --all --format json

  backend-build:
    needs:
      - test
      - foundation-compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: admin/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Build Admin runtime and Agent tools
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          package="mss-boot-admin-${GOOS}-${GOARCH}"
          suffix=""
          if [[ "${GOOS}" == "windows" ]]; then
            suffix=".exe"
          fi

          mkdir -p "${package}/config" "${package}/foundation"
          go build -trimpath -o "${package}/admin${suffix}" ./admin
          GOWORK=off go build -trimpath -o "${package}/mss${suffix}" ./cmd/mss
          GOWORK=off go build -trimpath -o "${package}/mss-mcp${suffix}" ./cmd/mss-mcp

          cp -a admin/config/*.yml "${package}/config/"
          cp AGENTS.md CLAUDE.md README.md README.zh-CN.md "${package}/"
          cp admin/README.md "${package}/ADMIN.md"
          cp -a .mss/schemas .mss/blueprints "${package}/foundation/"
          cp -a .agents/skills "${package}/foundation/skills"
          cp .codex/README.md "${package}/foundation/CODEX.md"
          cp -a docs/docs/agent "${package}/foundation/docs"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: mss-boot-admin-${{ matrix.os }}-${{ matrix.arch }}
          path: mss-boot-admin-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local frontend
        run: pnpm build:local

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/antd/dist
          if-no-files-found: error

  release:
    needs:
      - backend-build
      - frontend-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Assemble release packages
        run: |
          set -euo pipefail
          test -d frontend-dist
          for dir in \
            mss-boot-admin-linux-amd64 \
            mss-boot-admin-linux-arm64 \
            mss-boot-admin-darwin-amd64 \
            mss-boot-admin-darwin-arm64 \
            mss-boot-admin-windows-amd64 \
            mss-boot-admin-windows-arm64; do
            test -d "${dir}"
            rm -rf "${dir}/dist"
            cp -a frontend-dist "${dir}/dist"
            zip -r "${dir}.zip" "${dir}"
          done

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            mss-boot-admin-linux-amd64.zip
            mss-boot-admin-linux-arm64.zip
            mss-boot-admin-darwin-amd64.zip
            mss-boot-admin-darwin-arm64.zip
            mss-boot-admin-windows-amd64.zip
            mss-boot-admin-windows-arm64.zip
          prerelease: false
          body: |
            ## Runtime image

            ```shell
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            ## Runtime and Agent-native tools

            Every platform archive contains the independent Admin runtime (`admin`), Agent tools (`mss` and `mss-mcp`), runtime configuration, and the published contracts, Skills, Blueprints, and Agent documentation.

            `mss new app` must run from a checked-out Foundation source tree because the Blueprint renders Git-tracked source files. `mss upgrade` runs from a trusted target Foundation checkout against a downstream repository and is gated by the release compatibility workflow.
