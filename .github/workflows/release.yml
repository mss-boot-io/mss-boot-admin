name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && format('Root Release publish {0}', inputs.version) || github.event_name == 'workflow_dispatch' && format('Root Release candidate {0}', inputs.version) || format('Root Release {0}', github.ref_name) }}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version used for artifact metadata
        required: true
        type: string
      feature_freeze_confirmed:
        description: Confirm the target version is feature-frozen and concentrated validation may start
        required: true
        default: false
        type: boolean
      publish:
        description: Publish the GitHub Release after all artifacts and the matching image are ready
        required: true
        default: false
        type: boolean
      manual_evidence_complete:
        description: Confirm restore rehearsal, OAuth revocation, secret scan, external GOWORK=off module probe, and release approval are attached
        required: true
        default: false
        type: boolean
      evidence_url:
        description: Repository issue URL containing the sanitized manual release evidence
        required: false
        type: string
      readiness_run_id:
        description: Exact pre-root release-readiness workflow run ID required for publication
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: foundation-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GOTOOLCHAIN: local

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      evidence_url: ${{ steps.release.outputs.evidence_url }}
    steps:
      - name: Checkout release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .mss/release-policy.yaml
            tools/release/check_release_policy.py

      - name: Resolve and validate release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_FEATURE_FREEZE_CONFIRMED: ${{ inputs.feature_freeze_confirmed }}
          INPUT_MANUAL_EVIDENCE_COMPLETE: ${{ inputs.manual_evidence_complete }}
          INPUT_EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          set -euo pipefail

          validate_release_version() {
            local value="$1"
            local unprefixed
            local core
            local prerelease
            local identifier
            local identifiers

            [[ "${value}" == v* ]] || return 1
            unprefixed="${value#v}"
            core="${unprefixed%%-*}"
            [[ "${core}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || return 1
            if [[ "${unprefixed}" != *-* ]]; then
              return 0
            fi
            prerelease="${unprefixed#*-}"
            [[ -n "${prerelease}" ]] || return 1
            [[ "${prerelease}" != .* && "${prerelease}" != *. && "${prerelease}" != *..* ]] || return 1
            IFS='.' read -r -a identifiers <<< "${prerelease}"
            for identifier in "${identifiers[@]}"; do
              [[ "${identifier}" =~ ^[0-9A-Za-z-]+$ ]] || return 1
              if [[ "${identifier}" =~ ^[0-9]+$ && "${identifier}" =~ ^0[0-9]+$ ]]; then
                return 1
              fi
            done
          }

          version="${GITHUB_REF_NAME}"
          publish=false
          evidence_url=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
            publish="${INPUT_PUBLISH}"
            evidence_url="${INPUT_EVIDENCE_URL}"
            if [[ "${INPUT_FEATURE_FREEZE_CONFIRMED}" != "true" ]]; then
              echo "manual release work starts only after feature freeze is confirmed" >&2
              exit 1
            fi
          fi
          if ! validate_release_version "${version}"; then
            echo "invalid release version: ${version}" >&2
            exit 1
          fi
          if [[ "${publish}" != "true" && "${publish}" != "false" ]]; then
            echo "publish must be true or false" >&2
            exit 1
          fi
          policy_intent=qualify
          if [[ "${GITHUB_REF_TYPE}" == "tag" || "${publish}" == "true" ]]; then
            policy_intent=publish
          fi
          python3 tools/release/check_release_policy.py \
            --component root \
            --version "${version}" \
            --tag "${version}" \
            --intent "${policy_intent}"
          if [[ "${publish}" == "true" ]]; then
            if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${version}" ]]; then
              echo "publishing requires workflow_dispatch from the exact ${version} tag" >&2
              exit 1
            fi
            if [[ "${INPUT_MANUAL_EVIDENCE_COMPLETE}" != "true" ]]; then
              echo "manual release evidence must be confirmed before publication" >&2
              exit 1
            fi
            evidence_pattern="^https://github.com/${GITHUB_REPOSITORY}/issues/[0-9]+$"
            if [[ ! "${evidence_url}" =~ ${evidence_pattern} ]]; then
              echo "evidence_url must be an issue in ${GITHUB_REPOSITORY}" >&2
              exit 1
            fi
          fi
          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=${version}"
            echo "commit=${GITHUB_SHA}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
            echo "evidence_url=${evidence_url}"
          } >> "${GITHUB_OUTPUT}"

  release-evidence:
    needs: metadata
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Checkout release source
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify merged-main release source
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 tools/release/verify_release_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --tag "${RELEASE_VERSION}" \
            --policy .mss/release-policy.yaml

      - name: Setup Go for the external framework probe
        if: needs.metadata.outputs.publish == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.6
          cache: false

      - name: Setup Node for the public Admin Web probe
        if: needs.metadata.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@mss-boot-io'

      - name: Require selected pre-root readiness attestation
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          INPUT_READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
          RELEASE_READINESS_RUN_ID: ${{ vars.RELEASE_READINESS_RUN_ID }}
        run: |
          set -euo pipefail
          readiness_run_id="${INPUT_READINESS_RUN_ID:-${RELEASE_READINESS_RUN_ID}}"
          bash tools/release/verify_readiness_run.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${readiness_run_id}" \
            --target-version "${RELEASE_VERSION}" \
            --commit "${RELEASE_COMMIT}" \
            --phase pre-root \
            --policy .mss/release-policy.yaml

      - name: Require successful exact-commit release evidence
        if: needs.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_EVIDENCE_URL: ${{ needs.metadata.outputs.evidence_url }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag_name="$1"
            local object_type
            local object_sha
            local tag_object
            local depth=0

            tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}")"
            object_type="$(jq -r '.object.type' <<< "${tag_object}")"
            object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            while [[ "${object_type}" == "tag" ]]; do
              depth=$((depth + 1))
              if [[ "${depth}" -gt 5 ]]; then
                echo "tag ${tag_name} has too many annotation levels" >&2
                return 1
              fi
              tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "${tag_object}")"
              object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            done
            if [[ "${object_type}" != "commit" || ! "${object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "tag ${tag_name} does not resolve to a commit" >&2
              return 1
            fi
            printf '%s\n' "${object_sha}"
          }

          root_commit="$(resolve_tag_commit "${RELEASE_VERSION}")"
          framework_commit="$(resolve_tag_commit "mss-boot/${RELEASE_VERSION}")"
          admin_commit="$(resolve_tag_commit "admin/${RELEASE_VERSION}")"
          frontend_commit="$(resolve_tag_commit "web/antd-v6/${RELEASE_VERSION}")"
          if [[ "${root_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "root tag ${RELEASE_VERSION} resolves to ${root_commit}, not ${RELEASE_COMMIT}" >&2
            exit 1
          fi
          if [[ "${framework_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "framework tag mss-boot/${RELEASE_VERSION} resolves to ${framework_commit}, not ${RELEASE_COMMIT}" >&2
            exit 1
          fi
          if [[ "${admin_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "Admin tag admin/${RELEASE_VERSION} resolves to ${admin_commit}, not ${RELEASE_COMMIT}" >&2
            exit 1
          fi
          if [[ "${frontend_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "frontend tag web/antd-v6/${RELEASE_VERSION} resolves to ${frontend_commit}, not ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          required_framework_version="$(
            cd "${GITHUB_WORKSPACE}/admin"
            GOWORK=off go mod edit -json |
              jq -r '.Require[] | select(.Path == "github.com/mss-boot-io/mss-boot-admin/mss-boot") | .Version'
          )"
          if [[ "${required_framework_version}" != "${RELEASE_VERSION}" ]]; then
            echo "admin/go.mod requires mss-boot ${required_framework_version}, not ${RELEASE_VERSION}" >&2
            exit 1
          fi

          evidence_number="${RELEASE_EVIDENCE_URL##*/}"
          evidence_issue="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${evidence_number}")"
          if ! jq -e \
            '.pull_request == null and ((.body // "") | length > 0)' \
            <<< "${evidence_issue}" >/dev/null; then
            echo "manual evidence URL must resolve to a non-empty repository issue" >&2
            exit 1
          fi

          expected_component_prerelease=false
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            expected_component_prerelease=true
          fi
          for component_tag in \
            "mss-boot/${RELEASE_VERSION}" \
            "admin/${RELEASE_VERSION}" \
            "web/antd-v6/${RELEASE_VERSION}"; do
            component_release="$(gh release view "${component_tag}" --json tagName,isDraft,isPrerelease)"
            if [[ "$(jq -r '.tagName' <<< "${component_release}")" != "${component_tag}" ]]; then
              echo "component release tag identity does not match ${component_tag}" >&2
              exit 1
            fi
            if [[ "$(jq -r '.isDraft' <<< "${component_release}")" != "false" ]]; then
              echo "component release ${component_tag} is missing or still a draft" >&2
              exit 1
            fi
            if [[ "$(jq -r '.isPrerelease' <<< "${component_release}")" != "${expected_component_prerelease}" ]]; then
              echo "component release ${component_tag} prerelease state does not match ${RELEASE_VERSION}" >&2
              exit 1
            fi
          done

          while IFS='|' read -r workflow component_ref; do
            workflow_path=".github/workflows/${workflow}"
            runs="$(gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f head_sha="${RELEASE_COMMIT}" \
              -f status=completed \
              -f per_page=20)"
            successes="$(jq \
              --arg commit "${RELEASE_COMMIT}" \
              --arg component_ref "${component_ref}" \
              --arg workflow_path "${workflow_path}" \
              '[.workflow_runs[] | select(
                .event == "push" and
                .head_branch == $component_ref and
                .head_sha == $commit and
                .path == $workflow_path and
                .conclusion == "success"
              )] | length' <<< "${runs}")"
            if [[ "${successes}" -lt 1 ]]; then
              echo "no successful ${workflow} run exists for exact tag ${component_ref} at ${RELEASE_COMMIT}" >&2
              exit 1
            fi
          done <<EOF
          framework-release.yml|mss-boot/${RELEASE_VERSION}
          admin-release.yml|admin/${RELEASE_VERSION}
          frontend-v6-release.yml|web/antd-v6/${RELEASE_VERSION}
          EOF

          for workflow in \
            v0.7-upgrade-integration.yml \
            theme-settings-integration.yml; do
            workflow_path=".github/workflows/${workflow}"
            runs="$(gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
              -f head_sha="${RELEASE_COMMIT}" \
              -f status=completed \
              -f per_page=20)"
            successes="$(jq \
              --arg workflow_path "${workflow_path}" \
              '[.workflow_runs[] | select(
                .path == $workflow_path and .conclusion == "success"
              )] | length' <<< "${runs}")"
            if [[ "${successes}" -lt 1 ]]; then
              echo "no successful ${workflow} run exists for ${RELEASE_COMMIT}" >&2
              exit 1
            fi
          done

          probe_dir="$(mktemp -d)"
          trap 'rm -rf "${probe_dir}"' EXIT
          module="github.com/mss-boot-io/mss-boot-admin/mss-boot"
          module_version="${RELEASE_VERSION}"
          download_json="$(
            cd "${probe_dir}"
            GOWORK=off GOPROXY=direct go mod init example.com/mss-release-probe >/dev/null
            GOWORK=off GOPROXY=direct go mod download -json "${module}@${module_version}"
          )"
          jq -e \
            --arg module "${module}" \
            --arg version "${module_version}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.Path == $module and .Version == $version and .Origin.Hash == $commit and (.Sum | startswith("h1:"))' \
            <<< "${download_json}" >/dev/null
          cat > "${probe_dir}/main.go" <<'EOF'
          package main

          import (
            "fmt"

            "github.com/mss-boot-io/mss-boot-admin/mss-boot/pkg/enum"
          )

          func main() {
            if enum.Enabled.String() != "enabled" {
              panic("unexpected framework enum contract")
            }
            fmt.Println(enum.Enabled)
          }
          EOF
          (
            cd "${probe_dir}"
            GOWORK=off go mod edit -require="${module}@${module_version}"
            GOWORK=off GOPROXY=direct go mod tidy
            GOWORK=off GOPROXY=direct go build ./...
          )

          admin_probe_dir="$(mktemp -d)"
          trap 'rm -rf "${probe_dir}" "${admin_probe_dir}"' EXIT
          admin_module="github.com/mss-boot-io/mss-boot-admin/admin"
          admin_download_json="$(
            cd "${admin_probe_dir}"
            GOWORK=off GOPROXY=direct go mod init example.com/mss-admin-root-release-probe >/dev/null
            GOWORK=off GOPROXY=direct go mod download -json "${admin_module}@${RELEASE_VERSION}"
          )"
          jq -e \
            --arg module "${admin_module}" \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.Path == $module and .Version == $version and .Origin.Hash == $commit and (.Sum | startswith("h1:"))' \
            <<< "${admin_download_json}" >/dev/null
          cat > "${admin_probe_dir}/main.go" <<'EOF'
          package main

          import adminapp "github.com/mss-boot-io/mss-boot-admin/admin/app"

          func main() {
            if _, err := adminapp.New(); err != nil {
              panic(err)
            }
          }
          EOF
          (
            cd "${admin_probe_dir}"
            GOWORK=off go mod edit -require="${admin_module}@${RELEASE_VERSION}"
            GOWORK=off GOPROXY=direct go mod tidy
            GOWORK=off GOPROXY=direct go test ./...
            GOWORK=off GOPROXY=direct go build ./...
          )

          npm_metadata="$(npm view \
            "@mss-boot-io/admin-web@${RELEASE_VERSION#v}" \
            version gitHead dist.integrity --json \
            --registry=https://npm.pkg.github.com)"
          jq -e \
            --arg version "${RELEASE_VERSION#v}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.version == $version and .gitHead == $commit and
             (."dist.integrity" | startswith("sha512-"))' \
            <<< "${npm_metadata}" >/dev/null
          package_record="$(
            gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/npm/admin-web"
          )"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            '.name == "admin-web" and .package_type == "npm" and
             .visibility == "public" and
             (.repository.full_name == $repository)' \
            <<< "${package_record}" >/dev/null

  foundation-compatibility:
    needs: metadata
    uses: ./.github/workflows/foundation-compatibility.yml

  test:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 # 7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install Go dependencies
        run: make deps-all

      - name: Verify root release workflow contract
        run: python3 -m unittest tools/release/test_root_release_workflow.py

      - name: Verify independent Admin module
        run: make verify-admin

      - name: Verify independent framework module
        run: make verify-framework

      - name: Verify Agent module and contracts
        run: |
          set -euo pipefail
          make test-agent
          go run ./cmd/mss doctor --strict --component agent --format json
          go run ./cmd/mss doctor --strict --component backend --format json
          go run ./cmd/mss skills validate --format json
          go run ./cmd/mss spec validate .mss/modules/example-supplier.yaml --format json
          go run ./cmd/mss spec validate .mss/features/example-supplier-onboarding.yaml --format json
          go run ./cmd/mss feature plan .mss/features/example-supplier-onboarding.yaml --format json
          git diff --exit-code
          git diff --cached --exit-code
          go run ./cmd/mss eval run --all --format json

  backend-build:
    needs:
      - metadata
      - test
      - foundation-compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: admin/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Build Admin runtime and Agent tools
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          package="mss-boot-admin-${GOOS}-${GOARCH}"
          suffix=""
          if [[ "${GOOS}" == "windows" ]]; then
            suffix=".exe"
          fi
          release_timestamp="$(git show -s --format=%cI "${RELEASE_COMMIT}")"
          [[ "${release_timestamp}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$ ]]

          mkdir -p "${package}/config" "${package}/foundation"
          admin_ldflags="-s -w -X github.com/mss-boot-io/mss-boot-admin/admin/pkg.Version=${RELEASE_VERSION} -X github.com/mss-boot-io/mss-boot-admin/admin/pkg.Commit=${RELEASE_COMMIT}"
          agent_ldflags="-s -w -X github.com/mss-boot-io/mss-boot-admin/internal/mss/buildinfo.Version=${RELEASE_VERSION} -X github.com/mss-boot-io/mss-boot-admin/internal/mss/buildinfo.Commit=${RELEASE_COMMIT} -X github.com/mss-boot-io/mss-boot-admin/internal/mss/buildinfo.Timestamp=${release_timestamp}"
          go build -trimpath -ldflags "${admin_ldflags}" -o "${package}/admin${suffix}" ./admin
          GOWORK=off go build -trimpath -ldflags "${agent_ldflags}" -o "${package}/mss${suffix}" ./cmd/mss
          GOWORK=off go build -trimpath -ldflags "${agent_ldflags}" -o "${package}/mss-mcp${suffix}" ./cmd/mss-mcp

          {
            echo "version=${RELEASE_VERSION}"
            echo "commit=${RELEASE_COMMIT}"
            echo "timestamp=${release_timestamp}"
          } > "${package}/BUILD-INFO"

          cp -a admin/config/*.yml "${package}/config/"
          cp AGENTS.md CLAUDE.md LICENSE README.md README.zh-CN.md "${package}/"
          cp admin/README.md "${package}/ADMIN.md"
          cp -a .mss/schemas .mss/blueprints "${package}/foundation/"
          cp -a .agents/skills "${package}/foundation/skills"
          cp .codex/README.md "${package}/foundation/CODEX.md"
          cp -a docs/docs/agent "${package}/foundation/docs"

          if [[ "${GOOS}/${GOARCH}" == "linux/amd64" ]]; then
            for command in admin mss mss-mcp; do
              output="$("${package}/${command}" --version)"
              [[ "${output}" == *"${RELEASE_VERSION}"* ]]
              [[ "${output}" == *"${RELEASE_COMMIT}"* ]]
            done
            for command in mss mss-mcp; do
              output="$("${package}/${command}" --version)"
              [[ "${output}" == *"${release_timestamp}"* ]]
            done
          fi

      - name: Verify portable runtime artifact paths
        run: >-
          python3 tools/release/check_portable_paths.py
          mss-boot-admin-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mss-boot-admin-${{ matrix.os }}-${{ matrix.arch }}
          path: mss-boot-admin-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error

  frontend-build:
    needs: metadata
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/antd-v6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/antd-v6/pnpm-lock.yaml

      - name: Install frozen V6 dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Enforce V6 dependency policy
        run: |
          pnpm run deps:check
          pnpm run audit:release

      - name: Build same-origin primary V6 frontend
        run: pnpm run build:release

      - name: Embed and verify primary V6 release identity
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          jq -n \
            --arg application 'mss-boot-admin-antd-v6' \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '{application: $application, version: $version, commit: $commit}' > dist/release.json
          jq -e \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.application == "mss-boot-admin-antd-v6" and .version == $version and .commit == $commit' \
            dist/release.json >/dev/null

      - name: Smoke-test primary V6 delivery
        run: pnpm run delivery:smoke

      - name: Package and verify portable primary V6 artifact
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          python3 ../../tools/release/check_portable_paths.py dist
          {
            echo 'application=mss-boot-admin-antd-v6'
            echo "version=${RELEASE_VERSION}"
            echo "commit=${RELEASE_COMMIT}"
          } > FRONTEND-V6-BUILD-INFO
          tar --create --gzip --file dist-v6.tar.gz dist
          sha256sum dist-v6.tar.gz FRONTEND-V6-BUILD-INFO > SHA256SUMS.frontend-v6
          python3 ../../tools/release/check_portable_paths.py \
            dist-v6.tar.gz \
            FRONTEND-V6-BUILD-INFO \
            SHA256SUMS.frontend-v6

      - name: Pack exact Admin Web candidate for tool smoke
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          candidate_root="$(mktemp -d)"
          trap 'rm -rf "${candidate_root}"' EXIT
          candidate_output="${GITHUB_WORKSPACE}/web/antd-v6/admin-web-candidate"
          mkdir -p "${candidate_root}/source" "${candidate_output}"
          git -C ../.. -c core.autocrlf=false archive \
            --format=tar \
            "${RELEASE_COMMIT}:web/antd-v6" \
            | tar -xf - -C "${candidate_root}/source"
          python3 - \
            "${candidate_root}/source/package.json" \
            "${RELEASE_VERSION#v}" \
            "${RELEASE_COMMIT}" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1]).resolve()
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("name") != "@mss-boot-io/admin-web" or manifest.get("private") is True:
              raise SystemExit("Admin Web candidate source has an unexpected identity")
          manifest["version"] = sys.argv[2]
          manifest["gitHead"] = sys.argv[3]
          path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "${candidate_root}/source"
            pnpm pack --pack-destination "${candidate_output}" >/dev/null
          )
          mapfile -t candidate_tarballs < <(
            find "${candidate_output}" -maxdepth 1 -type f -name '*.tgz' -print
          )
          [[ ${#candidate_tarballs[@]} -eq 1 ]]
          install -m 0644 \
            "${candidate_tarballs[0]}" \
            "${GITHUB_WORKSPACE}/web/antd-v6/admin-web-candidate.tgz"
          tar -xOf admin-web-candidate.tgz package/package.json \
            | jq -e \
                --arg version "${RELEASE_VERSION#v}" \
                --arg commit "${RELEASE_COMMIT}" \
                '.name == "@mss-boot-io/admin-web" and
                 .version == $version and .gitHead == $commit' \
            >/dev/null

      - name: Upload primary V6 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-v6-dist
          path: |
            web/antd-v6/dist-v6.tar.gz
            web/antd-v6/FRONTEND-V6-BUILD-INFO
            web/antd-v6/SHA256SUMS.frontend-v6
            web/antd-v6/admin-web-candidate.tgz
          if-no-files-found: error

  release:
    needs:
      - metadata
      - release-evidence
      - backend-build
      - frontend-build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release validation tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            tools/install
            tools/release

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Assemble release packages
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
          release_timestamp="$(git show -s --format=%cI "${RELEASE_COMMIT}")"
          source_date_epoch="$(git show -s --format=%ct "${RELEASE_COMMIT}")"
          [[ "${release_timestamp}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$ ]]
          [[ "${source_date_epoch}" =~ ^[0-9]+$ ]]
          test -d frontend-v6-dist
          (
            cd frontend-v6-dist
            sha256sum --check SHA256SUMS.frontend-v6
          )
          python3 tools/release/check_portable_paths.py \
            frontend-v6-dist/dist-v6.tar.gz \
            frontend-v6-dist/FRONTEND-V6-BUILD-INFO \
            frontend-v6-dist/SHA256SUMS.frontend-v6
          mkdir frontend-v6-extracted
          tar --extract --gzip \
            --file frontend-v6-dist/dist-v6.tar.gz \
            --directory frontend-v6-extracted
          python3 tools/release/check_portable_paths.py frontend-v6-extracted/dist
          jq -e \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.application == "mss-boot-admin-antd-v6" and .version == $version and .commit == $commit' \
            frontend-v6-extracted/dist/release.json >/dev/null
          admin_web_candidate="frontend-v6-dist/admin-web-candidate.tgz"
          test -f "${admin_web_candidate}"
          tar -xOf "${admin_web_candidate}" package/package.json \
            | jq -e \
                --arg version "${RELEASE_VERSION#v}" \
                --arg commit "${RELEASE_COMMIT}" \
                '.name == "@mss-boot-io/admin-web" and
                 .version == $version and .gitHead == $commit' \
            >/dev/null

          runtime_dirs=(
            mss-boot-admin-linux-amd64
            mss-boot-admin-linux-arm64
            mss-boot-admin-darwin-amd64
            mss-boot-admin-darwin-arm64
            mss-boot-admin-windows-amd64
            mss-boot-admin-windows-arm64
          )
          reference_build_info="${runtime_dirs[0]}/BUILD-INFO"
          reference_license="${runtime_dirs[0]}/LICENSE"
          grep -Fx "version=${RELEASE_VERSION}" "${reference_build_info}" >/dev/null
          grep -Fx "commit=${RELEASE_COMMIT}" "${reference_build_info}" >/dev/null
          grep -Fx "timestamp=${release_timestamp}" "${reference_build_info}" >/dev/null
          [[ "$(wc -l < "${reference_build_info}")" -eq 3 ]]

          for dir in "${runtime_dirs[@]}"; do
            test -d "${dir}"
            test -f "${dir}/LICENSE"
            cmp -- "${reference_build_info}" "${dir}/BUILD-INFO"
            cmp -- "${reference_license}" "${dir}/LICENSE"
            rm -rf "${dir}/dist"
            cp -a frontend-v6-extracted/dist "${dir}/dist"
            case "${dir}" in
              mss-boot-admin-linux-*|mss-boot-admin-darwin-*)
                chmod 0755 "${dir}/admin" "${dir}/mss" "${dir}/mss-mcp"
                ;;
            esac
            zip -qr "${dir}.zip" "${dir}"
          done
          python3 tools/release/check_portable_paths.py mss-boot-admin-*.zip

          mkdir tool-staging
          tool_assets=(
            "mss-tools-${RELEASE_VERSION}-linux-amd64.tar.gz"
            "mss-tools-${RELEASE_VERSION}-linux-arm64.tar.gz"
            "mss-tools-${RELEASE_VERSION}-darwin-amd64.tar.gz"
            "mss-tools-${RELEASE_VERSION}-darwin-arm64.tar.gz"
            "mss-tools-${RELEASE_VERSION}-windows-amd64.zip"
            "mss-tools-${RELEASE_VERSION}-windows-arm64.zip"
          )
          for dir in "${runtime_dirs[@]}"; do
            platform_arch="${dir#mss-boot-admin-}"
            stage="tool-staging/${platform_arch}"
            mkdir "${stage}"
            cp "${dir}/BUILD-INFO" "${dir}/LICENSE" "${stage}/"
            case "${platform_arch}" in
              windows-*)
                cp "${dir}/mss.exe" "${dir}/mss-mcp.exe" "${stage}/"
                chmod 0644 "${stage}/BUILD-INFO" "${stage}/LICENSE"
                chmod 0755 "${stage}/mss.exe" "${stage}/mss-mcp.exe"
                touch --date="@${source_date_epoch}" "${stage}"/*
                archive_path="${PWD}/mss-tools-${RELEASE_VERSION}-${platform_arch}.zip"
                (
                  cd "${stage}"
                  TZ=UTC zip -X -q "${archive_path}" \
                    BUILD-INFO LICENSE mss.exe mss-mcp.exe
                )
                ;;
              linux-*|darwin-*)
                cp "${dir}/mss" "${dir}/mss-mcp" "${stage}/"
                chmod 0644 "${stage}/BUILD-INFO" "${stage}/LICENSE"
                chmod 0755 "${stage}/mss" "${stage}/mss-mcp"
                tar \
                  --sort=name \
                  --format=gnu \
                  --owner=0 \
                  --group=0 \
                  --numeric-owner \
                  --mtime="@${source_date_epoch}" \
                  --directory="${stage}" \
                  --create \
                  --file=- \
                  BUILD-INFO LICENSE mss mss-mcp \
                  | gzip -n > "mss-tools-${RELEASE_VERSION}-${platform_arch}.tar.gz"
                ;;
              *)
                echo "unsupported tool platform: ${platform_arch}" >&2
                exit 1
                ;;
            esac
          done

          expected_unix_entries=$'BUILD-INFO\nLICENSE\nmss\nmss-mcp'
          for archive in mss-tools-${RELEASE_VERSION}-{linux,darwin}-{amd64,arm64}.tar.gz; do
            actual_entries="$(tar -tzf "${archive}" | sed 's#^\./##' | LC_ALL=C sort)"
            [[ "${actual_entries}" == "${expected_unix_entries}" ]]
          done
          expected_windows_entries=$'BUILD-INFO\nLICENSE\nmss-mcp.exe\nmss.exe'
          for archive in mss-tools-${RELEASE_VERSION}-windows-{amd64,arm64}.zip; do
            actual_entries="$(unzip -Z1 "${archive}" | sed 's#^\./##' | LC_ALL=C sort)"
            [[ "${actual_entries}" == "${expected_windows_entries}" ]]
          done

          install -m 0755 tools/install/install-mss.sh install-mss.sh
          install -m 0644 tools/install/install-mss.ps1 install-mss.ps1
          grep -Fx "readonly DEFAULT_VERSION=\"${RELEASE_VERSION}\"" install-mss.sh >/dev/null
          grep -Fx "    [string]\$Version = '${RELEASE_VERSION}'," install-mss.ps1 >/dev/null
          bash -n install-mss.sh
          python3 tools/release/check_portable_paths.py \
            "${tool_assets[@]}" install-mss.sh install-mss.ps1

          smoke_dir="$(mktemp -d)"
          registry_pid=""
          cleanup_smoke() {
            local status=$?
            trap - EXIT HUP INT TERM
            if [[ -n "${registry_pid}" ]]; then
              kill "${registry_pid}" >/dev/null 2>&1 || true
              wait "${registry_pid}" >/dev/null 2>&1 || true
            fi
            rm -rf "${smoke_dir}"
            exit "${status}"
          }
          trap cleanup_smoke EXIT HUP INT TERM
          for archive in \
            mss-boot-admin-linux-amd64 \
            mss-boot-admin-linux-arm64 \
            mss-boot-admin-darwin-amd64 \
            mss-boot-admin-darwin-arm64; do
            mkdir -p "${smoke_dir}/${archive}"
            unzip -q "${archive}.zip" -d "${smoke_dir}/${archive}"
            for command in admin mss mss-mcp; do
              test -x "${smoke_dir}/${archive}/${archive}/${command}"
            done
          done
          for command in admin mss mss-mcp; do
            output="$("${smoke_dir}/mss-boot-admin-linux-amd64/mss-boot-admin-linux-amd64/${command}" --version)"
            [[ "${output}" == *"${RELEASE_VERSION}"* ]]
            [[ "${output}" == *"${RELEASE_COMMIT}"* ]]
          done
          mkdir "${smoke_dir}/tools"
          tar -xzf "mss-tools-${RELEASE_VERSION}-linux-amd64.tar.gz" \
            -C "${smoke_dir}/tools"
          cmp -- "${reference_build_info}" "${smoke_dir}/tools/BUILD-INFO"
          for command in mss mss-mcp; do
            output="$("${smoke_dir}/tools/${command}" --version)"
            [[ "${output}" == *"${RELEASE_VERSION}"* ]]
            [[ "${output}" == *"${RELEASE_COMMIT}"* ]]
            [[ "${output}" == *"${release_timestamp}"* ]]
          done
          registry_ready="${smoke_dir}/registry-url"
          registry_log="${smoke_dir}/registry.log"
          python3 - \
            "${admin_web_candidate}" \
            "${RELEASE_VERSION#v}" \
            "${registry_ready}" \
            >"${registry_log}" 2>&1 <<'PY' &
          from hashlib import sha512
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import base64
          import json
          from pathlib import Path
          import sys
          from urllib.parse import unquote, urlsplit

          tarball = Path(sys.argv[1]).resolve()
          version = sys.argv[2]
          ready = Path(sys.argv[3]).resolve()
          package_name = "@mss-boot-io/admin-web"
          integrity = "sha512-" + base64.b64encode(
              sha512(tarball.read_bytes()).digest()
          ).decode("ascii")
          metadata_path = f"/{package_name}/{version}"
          tarball_path = f"/{package_name}/-/admin-web-{version}.tgz"

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  path = unquote(urlsplit(self.path).path)
                  if path == metadata_path:
                      payload = json.dumps(
                          {
                              "name": package_name,
                              "version": version,
                              "dist": {
                                  "integrity": integrity,
                                  "tarball": (
                                      f"http://127.0.0.1:{self.server.server_port}"
                                      f"{tarball_path}"
                                  ),
                              },
                          },
                          separators=(",", ":"),
                      ).encode("utf-8")
                  elif path == tarball_path:
                      payload = tarball.read_bytes()
                  else:
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, _format, *_args):
                  return

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          ready.write_text(
              f"http://127.0.0.1:{server.server_port}\n",
              encoding="utf-8",
          )
          server.serve_forever()
          PY
          registry_pid=$!
          for _ in $(seq 1 100); do
            [[ -s "${registry_ready}" ]] && break
            kill -0 "${registry_pid}" >/dev/null 2>&1 || {
              sed -n '1,120p' "${registry_log}" >&2
              echo "Admin Web candidate registry exited before readiness" >&2
              exit 1
            }
            sleep 0.05
          done
          [[ -s "${registry_ready}" ]]
          registry_url="$(<"${registry_ready}")"
          mkdir "${smoke_dir}/empty"
          (
            cd "${smoke_dir}/empty"
            "${smoke_dir}/tools/mss" new app release-smoke \
              --display-name "Release Smoke Administration" \
              --module example.com/release-smoke \
              --repository example/release-smoke \
              --destination "${smoke_dir}/release-smoke" \
              --contributor-npm-registry "${registry_url}" \
              --write \
              --git-init \
              --format json \
              > "${smoke_dir}/release-smoke.json"
          )
          jq -e '.success == true and .dryRun == false' "${smoke_dir}/release-smoke.json" >/dev/null
          test -f "${smoke_dir}/release-smoke/go.mod"
          test -f "${smoke_dir}/release-smoke/go.sum"
          test -f "${smoke_dir}/release-smoke/web/pnpm-lock.yaml"
          ! grep -R '__MSS_' "${smoke_dir}/release-smoke" --exclude-dir=.git
          sha256sum mss-boot-admin-*.zip > SHA256SUMS
          sha256sum "${tool_assets[@]}" install-mss.sh install-mss.ps1 \
            > "SHA256SUMS.tools-${RELEASE_VERSION}"
          [[ "$(wc -l < SHA256SUMS)" -eq 6 ]]
          [[ "$(wc -l < "SHA256SUMS.tools-${RELEASE_VERSION}")" -eq 8 ]]
          sha256sum --check SHA256SUMS
          sha256sum --check "SHA256SUMS.tools-${RELEASE_VERSION}"

      - name: Upload assembled packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-packages-${{ needs.metadata.outputs.version }}
          path: |
            mss-boot-admin-*.zip
            SHA256SUMS
            mss-tools-*.tar.gz
            mss-tools-*.zip
            SHA256SUMS.tools-*
            install-mss.sh
            install-mss.ps1
          if-no-files-found: error
          retention-days: 7

      - name: Log into the runtime registry
        if: needs.metadata.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the matching runtime image
        if: needs.metadata.outputs.publish == 'true'
        id: image
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION}"
          for attempt in $(seq 1 60); do
            if docker pull "${image}" >/dev/null 2>&1; then
              image_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
              image_commit="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
              repo_digest="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "${image}")"
              if [[ "${image_version}" == "${RELEASE_VERSION}" && "${image_commit}" == "${RELEASE_COMMIT}" && "${repo_digest}" == *@sha256:* ]]; then
                runtime_output="$(docker run --rm "${repo_digest}" --version)"
                if [[ "${runtime_output}" != *"${RELEASE_VERSION}"* || "${runtime_output}" != *"${RELEASE_COMMIT}"* ]]; then
                  echo "runtime image identity did not match ${RELEASE_VERSION}/${RELEASE_COMMIT}" >&2
                  exit 1
                fi
                echo "digest=${repo_digest##*@}" >> "${GITHUB_OUTPUT}"
                echo "image=${image}" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
            echo "waiting for ${image} built from ${RELEASE_COMMIT} (attempt ${attempt}/60)"
            sleep 20
          done
          echo "matching runtime image was not available before the release deadline" >&2
          exit 1

      - name: Prepare deterministic root release notes
        if: needs.metadata.outputs.publish == 'true'
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_EVIDENCE_URL: ${{ needs.metadata.outputs.evidence_url }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          previous_tag=""
          while IFS= read -r candidate; do
            if [[ "${candidate}" == "${RELEASE_VERSION}" ]]; then
              continue
            fi
            if [[ "${candidate}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              previous_tag="${candidate}"
              break
            fi
          done < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')

          notes_file="${RUNNER_TEMP}/root-release-notes.md"
          api_args=(
            --method POST
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f "tag_name=${RELEASE_VERSION}"
            -f "target_commitish=${RELEASE_COMMIT}"
          )
          if [[ -n "${previous_tag}" ]]; then
            api_args+=(-f "previous_tag_name=${previous_tag}")
          fi
          gh api "${api_args[@]}" --jq .body > "${notes_file}"
          {
            echo
            echo '## Runtime image'
            echo
            echo '```shell'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION}"
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
            echo
            echo "Image digest: \`${IMAGE_DIGEST}\`"
            echo
            echo "Source commit: \`${RELEASE_COMMIT}\`"
            echo
            echo "Manual release evidence: ${RELEASE_EVIDENCE_URL}"
            echo
            echo '## Package-first runtime and tools'
            echo
            echo 'The six full platform archives contain the independent Admin runtime (`admin`), runtime configuration, frontend assets, and the published contracts, Skills, Blueprints, and Agent documentation.'
            echo
            echo 'Install the versioned `mss` and `mss-mcp` commands with the attached `install-mss.sh` or `install-mss.ps1`. Each installer verifies `SHA256SUMS.tools-*` before replacing either command.'
            echo
            echo '`mss new app` and `mss upgrade` use the versioned Foundation Blueprint embedded in the installed tool, so application development starts from published packages without a Foundation source checkout.'
          } >> "${notes_file}"
          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Stage, verify, and publish GitHub release atomically
        if: needs.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          RELEASE_NOTES: ${{ steps.release-notes.outputs.path }}
        run: |
          set -euo pipefail
          title="mss-boot-admin ${RELEASE_VERSION}"
          assets=(
            mss-boot-admin-linux-amd64.zip
            mss-boot-admin-linux-arm64.zip
            mss-boot-admin-darwin-amd64.zip
            mss-boot-admin-darwin-arm64.zip
            mss-boot-admin-windows-amd64.zip
            mss-boot-admin-windows-arm64.zip
            SHA256SUMS
            "mss-tools-${RELEASE_VERSION}-linux-amd64.tar.gz"
            "mss-tools-${RELEASE_VERSION}-linux-arm64.tar.gz"
            "mss-tools-${RELEASE_VERSION}-darwin-amd64.tar.gz"
            "mss-tools-${RELEASE_VERSION}-darwin-arm64.tar.gz"
            "mss-tools-${RELEASE_VERSION}-windows-amd64.zip"
            "mss-tools-${RELEASE_VERSION}-windows-arm64.zip"
            "SHA256SUMS.tools-${RELEASE_VERSION}"
            install-mss.sh
            install-mss.ps1
          )
          sha256sum --check SHA256SUMS
          sha256sum --check "SHA256SUMS.tools-${RELEASE_VERSION}"

          if release_json="$(gh release view "${RELEASE_VERSION}" --json isDraft,assets 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<< "${release_json}")" != "true" ]]; then
              echo "release ${RELEASE_VERSION} is already public; refusing to mutate it" >&2
              exit 1
            fi
            gh release edit "${RELEASE_VERSION}" \
              --title "${title}" \
              --notes-file "${RELEASE_NOTES}" \
              --draft=true \
              --prerelease="${RELEASE_PRERELEASE}"
          else
            release_flags=(--draft)
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${RELEASE_VERSION}" \
              --verify-tag \
              --target "${RELEASE_COMMIT}" \
              --title "${title}" \
              --notes-file "${RELEASE_NOTES}" \
              "${release_flags[@]}"
          fi

          gh release upload "${RELEASE_VERSION}" "${assets[@]}" --clobber
          release_json="$(gh release view "${RELEASE_VERSION}" --json isDraft,assets)"
          expected_names="$(printf '%s\n' "${assets[@]}" | jq -R . | jq -cs 'sort')"
          actual_names="$(jq -c '[.assets[].name] | sort' <<< "${release_json}")"
          if [[ "${actual_names}" != "${expected_names}" ]]; then
            echo "release draft assets do not match the expected set" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            local_size="$(stat --format='%s' "${asset}")"
            remote_size="$(jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .size' <<< "${release_json}")"
            if [[ -z "${remote_size}" || "${remote_size}" != "${local_size}" || "${remote_size}" -le 0 ]]; then
              echo "release asset ${asset} failed size verification" >&2
              exit 1
            fi
          done

          release_latest=true
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_latest=false
          fi
          gh release edit "${RELEASE_VERSION}" \
            --title "${title}" \
            --notes-file "${RELEASE_NOTES}" \
            --draft=false \
            --prerelease="${RELEASE_PRERELEASE}" \
            --latest="${release_latest}"
