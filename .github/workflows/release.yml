name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7
      - name: Install dependencies
        run: make deps-all
      - name: Unit tests
        run: make test-all

  backend-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Build backend
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          output=admin
          if [[ "${GOOS}" == "windows" ]]; then
            output=admin.exe
          fi
          go build -trimpath -o "${output}" .
      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: admin-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            admin
            admin.exe
            public
            config/*.yml
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build local frontend
        run: pnpm build:local
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/antd/dist
          if-no-files-found: error

  release:
    needs:
      - backend-build
      - frontend-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Assemble release packages
        run: |
          set -euo pipefail
          test -d frontend-dist
          for dir in admin-linux-amd64 admin-linux-arm64 admin-darwin-amd64 admin-darwin-arm64 admin-windows-amd64 admin-windows-arm64; do
            test -d "${dir}"
            rm -rf "${dir}/dist"
            cp -a frontend-dist "${dir}/dist"
            zip -r "${dir}.zip" "${dir}"
          done

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            admin-linux-amd64.zip
            admin-linux-arm64.zip
            admin-darwin-amd64.zip
            admin-darwin-arm64.zip
            admin-windows-amd64.zip
            admin-windows-arm64.zip
          prerelease: false
          body: |
            ## Pull image
            ```shell
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```
