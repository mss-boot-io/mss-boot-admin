name: Frontend Cloudflare Deployment

on:
  workflow_call:
    inputs:
      env:
        description: Environment
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        description: Cloudflare API token
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    concurrency:
      group: cloudflare-frontend-${{ inputs.env }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            web/antd/workers-site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build:${{ inputs.env }}
      - name: Install Workers Site dependencies
        working-directory: web/antd/workers-site
        run: pnpm install --frozen-lockfile
      - name: Prepare Workers Site bundle
        run: |
          cp dist/index.html dist/404.html
          cp -r workers-site dist/
      - name: Deploy
        if: ${{ inputs.env == 'alpha' || inputs.env == 'beta' || inputs.env == 'prod' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          environment: ${{ inputs.env }}
          workingDirectory: web/antd
