name: One-time security dependency upgrade v2

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/security-dependency-upgrade-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-dependency-upgrade-v2
  cancel-in-progress: true

jobs:
  upgrade-commit-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Upgrade vulnerable dependencies
        run: |
          set -euo pipefail
          framework='github.com/mss-boot-io/mss-boot-admin/mss-boot'

          GOWORK=off go mod edit -replace="${framework}@v0.8.0=./mss-boot"
          trap 'GOWORK=off go mod edit -dropreplace="${framework}@v0.8.0"' EXIT

          GOWORK=off go get github.com/google/go-github/v88@v88.0.0
          GOWORK=off go get google.golang.org/grpc@v1.82.1
          GOWORK=off go get golang.org/x/text@v0.39.0
          GOWORK=off go mod tidy

          GOWORK=off go mod edit -dropreplace="${framework}@v0.8.0"
          trap - EXIT

          (
            cd mss-boot
            GOWORK=off go get google.golang.org/grpc@v1.82.1
            GOWORK=off go get golang.org/x/text@v0.39.0
            GOWORK=off go mod tidy
          )

          if grep -R --line-number --fixed-strings 'github.com/google/go-github/v41' \
            --include='*.go' --include='go.mod' --exclude-dir=.git .; then
            echo 'go-github/v41 references remain after migration' >&2
            exit 1
          fi
          if grep -qE '^replace[[:space:]]+.*mss-boot' go.mod; then
            echo 'temporary nested-module replace leaked into root go.mod' >&2
            exit 1
          fi

      - name: Commit dependency graph before verification
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/security-dependency-upgrade.yml \
            .github/workflows/security-dependency-upgrade-v2.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(security): upgrade vulnerable Go dependencies"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Test root application
        run: go test ./...

      - name: Test framework module
        working-directory: mss-boot
        env:
          GOWORK: "off"
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root application
        run: govulncheck ./...

      - name: Scan nested modules
        run: |
          set -euo pipefail
          for dir in mss-boot cmd/tools/pr compose/consul compose/kafka; do
            echo "Scanning ${dir}"
            (cd "${dir}" && GOWORK=off govulncheck ./...)
          done
