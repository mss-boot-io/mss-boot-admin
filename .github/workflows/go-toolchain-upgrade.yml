name: One-time Go toolchain security upgrade

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/go-toolchain-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: go-toolchain-security-upgrade
  cancel-in-progress: true

jobs:
  upgrade-commit-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup fixed Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Upgrade every Go module and workspace baseline
        run: |
          set -euo pipefail

          GOWORK=off go mod edit -go=1.26.5
          go work edit -go=1.26.5

          for dir in mss-boot cmd/tools/pr compose/consul compose/kafka; do
            (cd "${dir}" && GOWORK=off go mod edit -go=1.26.5)
          done

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.mss/project.yaml')
          text = path.read_text(encoding='utf-8')
          old = '    goVersion: "1.26"\n'
          new = '    goVersion: "1.26.5"\n'
          if old not in text and new not in text:
              raise SystemExit('unexpected .mss project Go version')
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit toolchain baseline before verification
        run: |
          set -euo pipefail
          rm -f .github/workflows/go-toolchain-upgrade.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(security): require Go 1.26.5"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Verify active Go version
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.5"

      - name: Test root application
        run: go test ./...

      - name: Test framework module
        working-directory: mss-boot
        env:
          GOWORK: "off"
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root application
        run: govulncheck ./...

      - name: Scan nested modules
        run: |
          set -euo pipefail
          for dir in mss-boot cmd/tools/pr compose/consul compose/kafka; do
            echo "Scanning ${dir}"
            (cd "${dir}" && GOWORK=off govulncheck ./...)
          done
