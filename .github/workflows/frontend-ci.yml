name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/antd/**'
      - 'admin/modules/**/module.yaml'
      - 'templates/module/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/antd/**'
      - 'admin/modules/**/module.yaml'
      - 'templates/module/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  dependency-contract:
    name: dependency-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            web/antd/workers-site/pnpm-lock.yaml

      - name: Verify pinned toolchain
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = '9.15.9'
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major !== 22) process.exit(1)"

      - name: Install frontend graph from the frozen lockfile
        run: >-
          pnpm install
          --frozen-lockfile
          --ignore-scripts
          --strict-peer-dependencies
          --prefer-offline

      - name: Install Workers Site graph from the frozen lockfile
        run: >-
          pnpm --dir workers-site install
          --frozen-lockfile
          --ignore-scripts
          --strict-peer-dependencies
          --prefer-offline

      - name: Verify dependency graph health
        run: |
          set -euo pipefail
          pnpm list --depth 0
          pnpm --dir workers-site list --depth 0
          pnpm dedupe --check \
            --config.ignore-scripts=true \
            --config.strict-peer-dependencies=false
          pnpm audit --prod --audit-level high
          pnpm audit --audit-level critical
          pnpm --dir workers-site audit --prod --audit-level high

      - name: Require install and dedupe to leave manifests unchanged
        run: >-
          git diff --exit-code --
          package.json
          pnpm-lock.yaml
          .npmrc
          workers-site/package.json
          workers-site/pnpm-lock.yaml

  quality:
    name: quality
    needs: dependency-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml

      - name: Install dependencies
        run: >-
          pnpm install
          --frozen-lockfile
          --ignore-scripts
          --strict-peer-dependencies
          --prefer-offline

      - name: Generate Umi type surfaces
        run: pnpm run setup

      - name: Lint JavaScript and TypeScript
        run: pnpm lint:js

      - name: Check formatted dependency and configuration surfaces
        run: pnpm lint:prettier

      - name: Type-check frontend
        run: pnpm tsc

      - name: Run frontend tests
        run: pnpm test:ci

  compile:
    name: frontend-build
    needs: dependency-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml

      - name: Install dependencies
        run: >-
          pnpm install
          --frozen-lockfile
          --ignore-scripts
          --strict-peer-dependencies
          --prefer-offline

      - name: Generate Umi build surfaces
        run: pnpm run setup

      - name: Build frontend
        run: pnpm build:local

      - name: Enforce bundle budgets
        run: pnpm bundle:check

      - name: Smoke-test production delivery
        run: pnpm delivery:smoke

  build:
    # Preserve the historical required check: Frontend CI / build.
    name: build
    if: ${{ always() }}
    needs:
      - dependency-contract
      - quality
      - compile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every frontend check to pass
        env:
          DEPENDENCY_RESULT: ${{ needs.dependency-contract.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          echo "dependency-contract=${DEPENDENCY_RESULT}"
          echo "quality=${QUALITY_RESULT}"
          echo "compile=${COMPILE_RESULT}"
          test "${DEPENDENCY_RESULT}" = "success"
          test "${QUALITY_RESULT}" = "success"
          test "${COMPILE_RESULT}" = "success"
