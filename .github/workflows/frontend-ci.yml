name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/antd/**'
      - 'admin/modules/**/module.yaml'
      - 'templates/module/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/antd/**'
      - 'admin/modules/**/module.yaml'
      - 'templates/module/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  dependency-remediation:
    name: dependency-remediation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1
          fetch-depth: 0

      - name: Detect completed remediation
        id: guard
        run: |
          if [[ -f web/antd/pnpm-workspace.yaml ]] && \
             ! grep -q 'umi-presets-pro' web/antd/package.json; then
            echo 'done=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'done=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup pnpm
        if: steps.guard.outputs.done != 'true'
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        if: steps.guard.outputs.done != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            web/antd/workers-site/pnpm-lock.yaml

      - name: Rewrite dependency and test contracts
        if: steps.guard.outputs.done != 'true'
        run: python3 scripts/remediate_web_deps.py

      - name: Generate strict shared lockfile
        if: steps.guard.outputs.done != 'true'
        working-directory: web/antd
        run: |
          set -euxo pipefail
          rm -rf node_modules workers-site/node_modules .umi .umi-test
          pnpm install --lockfile-only --ignore-scripts --strict-peer-dependencies
          pnpm dedupe
          rm -rf node_modules workers-site/node_modules
          pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies --prefer-offline

      - name: Validate dependency health and frontend behavior
        if: steps.guard.outputs.done != 'true'
        working-directory: web/antd
        run: |
          set -euxo pipefail
          pnpm setup
          pnpm list --depth 0
          pnpm --filter @mss-boot-admin/workers-site list --depth 0
          pnpm dedupe --check
          pnpm audit --prod --audit-level high
          pnpm lint:js
          pnpm tsc
          timeout 240s pnpm test:ci
          pnpm build:local
          git diff --check

      - name: Commit converged frontend dependency graph
        if: steps.guard.outputs.done != 'true'
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A web/antd
          git diff --cached --stat
          git commit -m 'build(frontend): converge dependency graph and lockfile'
          git push origin HEAD:refactor/split-admin-module-and-coverage-r1

  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint JavaScript and TypeScript
        run: pnpm lint:js

      - name: Type-check frontend
        run: pnpm tsc

      - name: Run frontend tests
        run: pnpm test -- --runInBand

  compile:
    name: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build frontend
        run: pnpm build:local

  build:
    # Preserve the historical required check: Frontend CI / build.
    name: build
    if: ${{ always() }}
    needs:
      - quality
      - compile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every frontend check to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          echo "quality=${QUALITY_RESULT}"
          echo "compile=${COMPILE_RESULT}"
          test "${QUALITY_RESULT}" = "success"
          test "${COMPILE_RESULT}" = "success"
