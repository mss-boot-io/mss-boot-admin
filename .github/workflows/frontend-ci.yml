name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/antd/**'
      - 'modules/**/module.yaml'
      - 'templates/module/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/antd/**'
      - 'modules/**/module.yaml'
      - 'templates/module/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint JavaScript and TypeScript
        run: pnpm lint:js

      - name: Type-check frontend
        run: pnpm tsc

      - name: Run frontend tests
        run: pnpm test -- --runInBand

  compile:
    name: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web/antd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/antd/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build frontend
        run: pnpm build:local

  build:
    # Preserve the historical required check: Frontend CI / build.
    name: build
    if: ${{ always() }}
    needs:
      - quality
      - compile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every frontend check to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          echo "quality=${QUALITY_RESULT}"
          echo "compile=${COMPILE_RESULT}"
          test "${QUALITY_RESULT}" = "success"
          test "${COMPILE_RESULT}" = "success"
