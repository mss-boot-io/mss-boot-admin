name: Foundation Compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream-generation-and-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Initialize compatibility paths
        run: |
          echo "DOWNSTREAM=${RUNNER_TEMP}/mss-compatibility-admin" >> "${GITHUB_ENV}"
          echo "NEXT_FOUNDATION=${RUNNER_TEMP}/mss-foundation-next" >> "${GITHUB_ENV}"
          echo "CONFLICT_FOUNDATION=${RUNNER_TEMP}/mss-foundation-conflict" >> "${GITHUB_ENV}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Build traceable Foundation tools
        run: |
          set -euo pipefail
          foundation_commit="$(git rev-parse HEAD^{commit})"
          generator_version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          policy = Path('.mss/release-policy.yaml').read_text(encoding='utf-8')
          match = re.search(r'^\s*nextPublicVersion:\s*v?([^\s]+)\s*$', policy, re.MULTILINE)
          if not match:
              raise SystemExit('nextPublicVersion is missing from the release policy')
          print(match.group(1))
          PY
          )"
          blueprint_version="$(python3 - <<'PY'
          import re
          from pathlib import Path

          blueprint = Path('.mss/blueprints/management-system.yaml').read_text(encoding='utf-8')
          match = re.search(r'(?m)^  version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$', blueprint)
          if not match:
              raise SystemExit('Blueprint metadata.version must be a stable semantic version')
          print(match.group(1))
          PY
          )"
          if [[ ! "${foundation_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Foundation commit is not a full SHA: ${foundation_commit}" >&2
            exit 1
          fi
          if [[ -z "${generator_version}" ]]; then
            echo "Generator version is empty." >&2
            exit 1
          fi
          if [[ -z "${blueprint_version}" ]]; then
            echo "Blueprint version is empty." >&2
            exit 1
          fi
          ldflags="-X github.com/mss-boot-io/mss-boot-admin/internal/mss/buildinfo.Version=${generator_version} -X github.com/mss-boot-io/mss-boot-admin/internal/mss/buildinfo.Commit=${foundation_commit}"
          go build -trimpath -ldflags "${ldflags}" -o "${RUNNER_TEMP}/mss-current" ./cmd/mss
          go build -trimpath -ldflags "${ldflags}" -o "${RUNNER_TEMP}/mss-mcp-current" ./cmd/mss-mcp
          "${RUNNER_TEMP}/mss-current" --version
          "${RUNNER_TEMP}/mss-mcp-current" -version
          echo "CURRENT_FOUNDATION_COMMIT=${foundation_commit}" >> "${GITHUB_ENV}"
          echo "CURRENT_BLUEPRINT_VERSION=${blueprint_version}" >> "${GITHUB_ENV}"
          echo "GENERATOR_VERSION=${generator_version}" >> "${GITHUB_ENV}"

      - name: Configure Git identity
        run: |
          git config --global user.name "mss-foundation-ci"
          git config --global user.email "mss-foundation-ci@users.noreply.github.com"

      - name: Test Blueprint and upgrade engines
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          go test \
            ./internal/mss/blueprint \
            ./internal/mss/feature \
            ./internal/mss/spec \
            ./internal/mss/mcp \
            ./internal/mss/eval \
            ./internal/mss/app

      - name: Start temporary Admin Web metadata registry
        run: |
          set -euo pipefail
          registry_ready="${RUNNER_TEMP}/foundation-compatibility-registry-url"
          registry_log="${RUNNER_TEMP}/foundation-compatibility-registry.log"
          rm -f "${registry_ready}" "${registry_log}"
          python3 - "${registry_ready}" "${GENERATOR_VERSION}" >"${registry_log}" 2>&1 <<'PY' &
          from hashlib import sha512
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import base64
          import json
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote, urlsplit

          ready = Path(sys.argv[1])
          package_name = '@mss-boot-io/admin-web'
          version = sys.argv[2].removeprefix('v')
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit(f'invalid compatibility Admin Web version: {version}')
          integrity = 'sha512-' + base64.b64encode(
              sha512(f'foundation-compatibility-admin-web-{version}'.encode('utf-8')).digest()
          ).decode('ascii')

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  path = unquote(urlsplit(self.path).path)
                  if path != f'/{package_name}/{version}':
                      self.send_error(404)
                      return
                  payload = json.dumps({
                      'name': package_name,
                      'version': version,
                      'dist': {'integrity': integrity},
                  }, separators=(',', ':')).encode('utf-8')
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, _format, *_args):
                  return

          server = ThreadingHTTPServer(('127.0.0.1', 0), Handler)
          ready.write_text(f'http://127.0.0.1:{server.server_port}\n', encoding='utf-8')
          server.serve_forever()
          PY
          registry_pid=$!
          cleanup_failed_start() {
            kill "${registry_pid}" >/dev/null 2>&1 || true
            wait "${registry_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup_failed_start EXIT
          for _ in $(seq 1 100); do
            [[ -s "${registry_ready}" ]] && break
            kill -0 "${registry_pid}" >/dev/null 2>&1 || {
              sed -n '1,120p' "${registry_log}" >&2
              exit 1
            }
            sleep 0.05
          done
          [[ -s "${registry_ready}" ]] || {
            echo "temporary compatibility registry did not become ready" >&2
            exit 1
          }
          registry_url=$(<"${registry_ready}")
          echo "COMPATIBILITY_FRONTEND_REGISTRY_URL=${registry_url}" >> "${GITHUB_ENV}"
          echo "COMPATIBILITY_FRONTEND_REGISTRY_PID=${registry_pid}" >> "${GITHUB_ENV}"
          echo "COMPATIBILITY_FRONTEND_REGISTRY_READY=${registry_ready}" >> "${GITHUB_ENV}"
          trap - EXIT

      - name: Generate a standalone downstream repository
        run: |
          set -euo pipefail
          rm -rf "${DOWNSTREAM}"
          "${RUNNER_TEMP}/mss-current" new app compatibility-admin \
            --display-name "Compatibility Administration" \
            --module github.com/example/compatibility-admin \
            --repository example/compatibility-admin \
            --destination "${DOWNSTREAM}" \
            --foundation "${GITHUB_WORKSPACE}" \
            --contributor-npm-registry "${COMPATIBILITY_FRONTEND_REGISTRY_URL}" \
            --write \
            --git-init \
            --format json \
            > "${RUNNER_TEMP}/new-app.json"

          git -C "${DOWNSTREAM}" add -A
          git -C "${DOWNSTREAM}" commit -m "chore: record generated foundation baseline"

      - name: Validate generated downstream modules and tooling
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/mss-current" --root "${DOWNSTREAM}" context --format json > "${RUNNER_TEMP}/downstream-context.json"
          "${RUNNER_TEMP}/mss-current" --root "${DOWNSTREAM}" doctor --strict --component agent --format json > "${RUNNER_TEMP}/downstream-agent-doctor.json"
          "${RUNNER_TEMP}/mss-current" --root "${DOWNSTREAM}" doctor --strict --component backend --format json > "${RUNNER_TEMP}/downstream-admin-doctor.json"
          "${RUNNER_TEMP}/mss-current" --root "${DOWNSTREAM}" upgrade status --format json > "${RUNNER_TEMP}/downstream-status.json"
          printf '%s\n' '{"jsonrpc":"2.0","id":"status","method":"tools/call","params":{"name":"mss_get_blueprint_status","arguments":{}}}' \
            | "${RUNNER_TEMP}/mss-mcp-current" -root "${DOWNSTREAM}" \
            > "${RUNNER_TEMP}/downstream-mcp-status.json"
          (
            cd "${DOWNSTREAM}"
            export GOWORK=off
            cp go.mod "${RUNNER_TEMP}/downstream-go.mod.before-validation"
            if [[ -f go.sum ]]; then
              cp go.sum "${RUNNER_TEMP}/downstream-go.sum.before-validation"
              had_go_sum=1
            else
              had_go_sum=0
            fi
            go mod edit \
              -replace=github.com/mss-boot-io/mss-boot-admin/admin="${GITHUB_WORKSPACE}/admin" \
              -replace=github.com/mss-boot-io/mss-boot-admin/mss-boot="${GITHUB_WORKSPACE}/mss-boot"
            go mod tidy
            go test -shuffle=on -count=1 ./...
            go vet ./...
            go build -trimpath -o "${RUNNER_TEMP}/compatibility-admin-server" ./cmd/server
            "${RUNNER_TEMP}/compatibility-admin-server" --help >/dev/null
            cp "${RUNNER_TEMP}/downstream-go.mod.before-validation" go.mod
            if [[ ${had_go_sum} -eq 1 ]]; then
              cp "${RUNNER_TEMP}/downstream-go.sum.before-validation" go.sum
            else
              rm -f go.sum
            fi
          )

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          generated = json.loads((temp / 'new-app.json').read_text())
          status = json.loads((temp / 'downstream-status.json').read_text())
          doctor = json.loads((temp / 'downstream-agent-doctor.json').read_text())
          context = json.loads((temp / 'downstream-context.json').read_text())
          rpc = json.loads((temp / 'downstream-mcp-status.json').read_text())
          if rpc['result'].get('isError'):
              raise SystemExit(f"MCP status failed: {rpc['result']}")
          mcp_status = rpc['result']['structuredContent']
          snapshot_checks = [check for check in doctor['checks'] if check['id'] == 'snapshot:foundation']
          if len(snapshot_checks) != 1:
              raise SystemExit(f'doctor snapshot check is missing or duplicated: {doctor}')
          doctor_status = snapshot_checks[0].get('snapshot')
          if snapshot_checks[0].get('status') != 'pass' or not snapshot_checks[0].get('required') or not doctor_status:
              raise SystemExit(f'doctor did not require the generated snapshot: {snapshot_checks[0]}')
          if generated['identities'] != status['identities']:
              raise SystemExit('generation plan and installed status identities differ')
          if status != mcp_status or status != doctor_status:
              raise SystemExit('CLI, MCP, and doctor snapshot status differ')
          identities = status['identities']
          records = status['records']
          foundation = identities['foundation']
          blueprint = identities['blueprint']
          generator = identities['generator']
          if foundation.get('version') != os.environ['GENERATOR_VERSION'] or foundation.get('commit') != os.environ['CURRENT_FOUNDATION_COMMIT']:
              raise SystemExit(f'Foundation identity did not come from release policy and exact source: {foundation}')
          if blueprint.get('version') != os.environ['CURRENT_BLUEPRINT_VERSION']:
              raise SystemExit(f'initial Blueprint identity does not match the committed contract: {blueprint}')
          if generator.get('version') != os.environ['GENERATOR_VERSION'] or generator.get('commit') != os.environ['CURRENT_FOUNDATION_COMMIT']:
              raise SystemExit(f'generator build identity was not injected: {generator}')
          project_baseline = context['project']['spec']['foundationVersion']
          if project_baseline in {foundation['version'], blueprint['version'], generator['version']}:
              raise SystemExit('project.foundationVersion was conflated with an independent initial identity')
          for label, value in {
              'Blueprint digest': blueprint.get('sha256', ''),
              'snapshot digest': identities.get('snapshot', {}).get('sha256', ''),
              'lock digest': records.get('lockSha256', ''),
          }.items():
              if len(value) != 64 or any(character not in '0123456789abcdef' for character in value):
                  raise SystemExit(f'{label} is not an exact SHA-256 digest: {value}')
          PY

      - name: Create a deterministic next foundation revision
        run: |
          set -euo pipefail
          rm -rf "${NEXT_FOUNDATION}"
          foundation_commit="$(git rev-parse HEAD)"
          git clone --no-hardlinks --no-checkout . "${NEXT_FOUNDATION}"
          git -C "${NEXT_FOUNDATION}" checkout --detach "${foundation_commit}"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["NEXT_FOUNDATION"])

          blueprint = root / ".mss/blueprints/management-system.yaml"
          text = blueprint.read_text(encoding="utf-8")
          match = re.search(r'(?m)^(  version: )(([0-9]+)\.([0-9]+)\.([0-9]+))\s*$', text)
          if not match:
              raise SystemExit("expected a stable semantic Blueprint version")
          next_blueprint = f"{match.group(3)}.{match.group(4)}.{int(match.group(5)) + 1}-ci"
          text = text[:match.start(2)] + next_blueprint + text[match.end(2):]
          blueprint.write_text(text, encoding="utf-8")

          project = root / "templates/application/.mss/project.yaml"
          text = project.read_text(encoding="utf-8")
          match = re.search(r'(?m)^(  foundationVersion: )(([0-9]+)\.([0-9]+)\.([0-9]+)(?:-[^\s]+)?)\s*$', text)
          if not match:
              raise SystemExit("project foundationVersion is not a semantic baseline")
          next_project_baseline = f"{match.group(3)}.{match.group(4)}.{int(match.group(5)) + 1}-project-ci"
          text = text[:match.start(2)] + next_project_baseline + text[match.end(2):]
          project.write_text(text, encoding="utf-8")

          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"NEXT_BLUEPRINT_VERSION={next_blueprint}\n")
              env.write(f"NEXT_PROJECT_BASELINE_VERSION={next_project_baseline}\n")

          probe = root / "templates/application/config/foundation-compatibility-probe.md"
          probe.write_text("# Foundation compatibility probe\n\nGenerated by the compatibility pipeline fixture.\n", encoding="utf-8")

          updated = root / "templates/application/config/README.md"
          updated.write_text(
              updated.read_text(encoding="utf-8") + "\nFoundation compatibility update fixture.\n",
              encoding="utf-8",
          )

          removed = root / "templates/application/web/src/business/README.md"
          if not removed.exists():
              raise SystemExit("expected managed removal fixture is missing")
          removed.unlink()
          PY

          git -C "${NEXT_FOUNDATION}" add -A
          git -C "${NEXT_FOUNDATION}" commit -m "test: create next foundation fixture"

      - name: Build traceable next-Foundation tools
        run: |
          set -euo pipefail
          next_commit="$(git -C "${NEXT_FOUNDATION}" rev-parse HEAD^{commit})"
          if [[ ! "${next_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Next Foundation commit is not a full SHA: ${next_commit}" >&2
            exit 1
          fi
          ldflags="-X github.com/mss-boot-io/mss-boot-admin/internal/mss/buildinfo.Version=${GENERATOR_VERSION} -X github.com/mss-boot-io/mss-boot-admin/internal/mss/buildinfo.Commit=${next_commit}"
          (
            cd "${NEXT_FOUNDATION}"
            go build -trimpath -ldflags "${ldflags}" -o "${RUNNER_TEMP}/mss-next" ./cmd/mss
            go build -trimpath -ldflags "${ldflags}" -o "${RUNNER_TEMP}/mss-mcp-next" ./cmd/mss-mcp
          )
          "${RUNNER_TEMP}/mss-next" --version
          "${RUNNER_TEMP}/mss-mcp-next" -version
          echo "NEXT_FOUNDATION_COMMIT=${next_commit}" >> "${GITHUB_ENV}"

      - name: Add downstream-only Admin customizations
        run: |
          set -euo pipefail
          printf '\n# Downstream custom policy\n' >> "${DOWNSTREAM}/AGENTS.md"
          mkdir -p "${DOWNSTREAM}/internal/modules/customer-extension"
          cat > "${DOWNSTREAM}/internal/modules/customer-extension/custom.go" <<'EOF'
          package customerextension

          const Preserved = true
          EOF
          git -C "${DOWNSTREAM}" add -A
          git -C "${DOWNSTREAM}" commit -m "feat: add downstream Admin customizations"

      - name: Plan the next foundation upgrade
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/mss-next" \
            --root "${DOWNSTREAM}" \
            upgrade plan \
            --foundation "${NEXT_FOUNDATION}" \
            --contributor-npm-registry "${COMPATIBILITY_FRONTEND_REGISTRY_URL}" \
            --format json \
            > "${RUNNER_TEMP}/upgrade-plan.json"
          printf '%s\n' "{\"jsonrpc\":\"2.0\",\"id\":\"upgrade-plan\",\"method\":\"tools/call\",\"params\":{\"name\":\"mss_plan_foundation_upgrade\",\"arguments\":{\"foundationRoot\":\"${NEXT_FOUNDATION}\"}}}" \
            | "${RUNNER_TEMP}/mss-mcp-next" \
                -root "${DOWNSTREAM}" \
                -contributor-npm-registry "${COMPATIBILITY_FRONTEND_REGISTRY_URL}" \
            > "${RUNNER_TEMP}/mcp-upgrade-plan.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "upgrade-plan.json").read_text())
          rpc = json.loads((Path(os.environ["RUNNER_TEMP"]) / "mcp-upgrade-plan.json").read_text())
          if not plan.get("success") or not plan.get("dryRun"):
              raise SystemExit(f"upgrade plan is not a successful dry-run: {plan}")
          if rpc["result"].get("isError"):
              raise SystemExit(f"MCP upgrade plan failed: {rpc['result']}")
          mcp_plan = rpc["result"]["structuredContent"]
          if plan["application"]["module"] != "github.com/example/compatibility-admin":
              raise SystemExit(f"CLI upgrade did not recover the root module from the snapshot: {plan['application']}")
          if mcp_plan["application"] != plan["application"] or mcp_plan["toIdentities"] != plan["toIdentities"]:
              raise SystemExit("CLI and MCP upgrade plans disagree on application or target identities")
          actions = {change["action"] for change in plan["changes"]}
          required = {"create", "update", "delete", "preserve"}
          missing = required - actions
          if missing:
              raise SystemExit(f"upgrade plan is missing actions: {sorted(missing)}")
          PY

      - name: Apply and verify the next foundation upgrade
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/mss-next" \
            --root "${DOWNSTREAM}" \
            upgrade apply \
            --foundation "${NEXT_FOUNDATION}" \
            --contributor-npm-registry "${COMPATIBILITY_FRONTEND_REGISTRY_URL}" \
            --yes \
            --format json \
            > "${RUNNER_TEMP}/upgrade-apply.json"

          grep -q "# Downstream custom policy" "${DOWNSTREAM}/AGENTS.md"
          test -f "${DOWNSTREAM}/internal/modules/customer-extension/custom.go"
          grep -q "foundationVersion: ${NEXT_PROJECT_BASELINE_VERSION}" "${DOWNSTREAM}/.mss/project.yaml"
          test -f "${DOWNSTREAM}/config/foundation-compatibility-probe.md"
          grep -q "Foundation compatibility update fixture" "${DOWNSTREAM}/config/README.md"
          test ! -e "${DOWNSTREAM}/web/src/business/README.md"

          "${RUNNER_TEMP}/mss-next" --root "${DOWNSTREAM}" upgrade status --format json > "${RUNNER_TEMP}/upgrade-status.json"
          "${RUNNER_TEMP}/mss-next" --root "${DOWNSTREAM}" doctor --strict --component agent --format json > "${RUNNER_TEMP}/upgraded-agent-doctor.json"
          printf '%s\n' '{"jsonrpc":"2.0","id":"status","method":"tools/call","params":{"name":"mss_get_blueprint_status","arguments":{}}}' \
            | "${RUNNER_TEMP}/mss-mcp-next" -root "${DOWNSTREAM}" \
            > "${RUNNER_TEMP}/upgraded-mcp-status.json"
          (
            cd "${DOWNSTREAM}"
            "${RUNNER_TEMP}/mss-next" --root "${DOWNSTREAM}" context --format json > "${RUNNER_TEMP}/upgraded-context.json"
            export GOWORK=off
            cp go.mod "${RUNNER_TEMP}/upgraded-go.mod.before-validation"
            if [[ -f go.sum ]]; then
              cp go.sum "${RUNNER_TEMP}/upgraded-go.sum.before-validation"
              had_go_sum=1
            else
              had_go_sum=0
            fi
            go mod edit \
              -replace=github.com/mss-boot-io/mss-boot-admin/admin="${NEXT_FOUNDATION}/admin" \
              -replace=github.com/mss-boot-io/mss-boot-admin/mss-boot="${NEXT_FOUNDATION}/mss-boot"
            go mod tidy
            go test -shuffle=on -count=1 ./...
            go vet ./...
            go build -trimpath -o "${RUNNER_TEMP}/upgraded-compatibility-admin-server" ./cmd/server
            "${RUNNER_TEMP}/upgraded-compatibility-admin-server" --help >/dev/null
            cp "${RUNNER_TEMP}/upgraded-go.mod.before-validation" go.mod
            if [[ ${had_go_sum} -eq 1 ]]; then
              cp "${RUNNER_TEMP}/upgraded-go.sum.before-validation" go.sum
            else
              rm -f go.sum
            fi
          )

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          status = json.loads((temp / "upgrade-status.json").read_text())
          applied = json.loads((temp / "upgrade-apply.json").read_text())
          doctor = json.loads((temp / "upgraded-agent-doctor.json").read_text())
          rpc = json.loads((temp / "upgraded-mcp-status.json").read_text())
          if rpc["result"].get("isError"):
              raise SystemExit(f"MCP upgraded status failed: {rpc['result']}")
          mcp_status = rpc["result"]["structuredContent"]
          snapshot_checks = [check for check in doctor["checks"] if check["id"] == "snapshot:foundation"]
          if len(snapshot_checks) != 1 or snapshot_checks[0].get("status") != "pass" or not snapshot_checks[0].get("required"):
              raise SystemExit(f"doctor did not require the upgraded snapshot: {snapshot_checks}")
          doctor_status = snapshot_checks[0].get("snapshot")
          if status != mcp_status or status != doctor_status:
              raise SystemExit("upgraded CLI, MCP, and doctor snapshot status differ")
          if status.get("blueprintVersion") != os.environ["NEXT_BLUEPRINT_VERSION"]:
              raise SystemExit(f"unexpected installed Blueprint version: {status}")
          identities = status.get("identities", {})
          records = status.get("records", {})
          if identities != applied.get("toIdentities"):
              raise SystemExit("applied target identities differ from installed status")
          if identities.get("foundation", {}).get("commit") != os.environ["NEXT_FOUNDATION_COMMIT"]:
              raise SystemExit(f"Foundation commit is not exact: {identities}")
          if identities.get("foundation", {}).get("version") != os.environ["GENERATOR_VERSION"]:
              raise SystemExit(f"Foundation release identity did not come from release policy: {identities}")
          if identities.get("blueprint", {}).get("version") != os.environ["NEXT_BLUEPRINT_VERSION"]:
              raise SystemExit(f"Blueprint identity is not independently versioned: {identities}")
          generator = identities.get("generator", {})
          if generator.get("version") != os.environ["GENERATOR_VERSION"] or generator.get("commit") != os.environ["NEXT_FOUNDATION_COMMIT"]:
              raise SystemExit(f"generator build identity is not exact: {generator}")
          if os.environ["NEXT_PROJECT_BASELINE_VERSION"] in {
              identities["foundation"]["version"],
              identities["blueprint"]["version"],
              generator["version"],
          }:
              raise SystemExit("project.foundationVersion was conflated with an independent runtime identity")
          if status.get("foundationCommit") != identities["foundation"]["commit"] or status.get("generatorCommit") != generator["commit"]:
              raise SystemExit(f"flat compatibility metadata contradicts identities: {status}")
          for label, value in {
              "Blueprint digest": identities.get("blueprint", {}).get("sha256", ""),
              "snapshot digest": identities.get("snapshot", {}).get("sha256", ""),
              "lock digest": records.get("lockSha256", ""),
          }.items():
              if len(value) != 64 or any(character not in "0123456789abcdef" for character in value):
                  raise SystemExit(f"{label} is not an exact SHA-256 digest: {value}")
          PY

          git -C "${DOWNSTREAM}" add -A
          git -C "${DOWNSTREAM}" commit -m "chore: apply next foundation fixture"

      - name: Create concurrent Admin changes and require a conflict
        run: |
          set -euo pipefail
          rm -rf "${CONFLICT_FOUNDATION}"
          next_commit="$(git -C "${NEXT_FOUNDATION}" rev-parse HEAD)"
          git clone --no-hardlinks --no-checkout "${NEXT_FOUNDATION}" "${CONFLICT_FOUNDATION}"
          git -C "${CONFLICT_FOUNDATION}" checkout --detach "${next_commit}"

          printf '\nconst FoundationConflictProbe = true\n' >> "${CONFLICT_FOUNDATION}/templates/application/cmd/server/main.go.tmpl"
          git -C "${CONFLICT_FOUNDATION}" add templates/application/cmd/server/main.go.tmpl
          git -C "${CONFLICT_FOUNDATION}" commit -m "test: change foundation Admin entrypoint"

          printf '\nconst DownstreamConflictProbe = true\n' >> "${DOWNSTREAM}/cmd/server/main.go"
          cp "${DOWNSTREAM}/cmd/server/main.go" "${RUNNER_TEMP}/downstream-admin-main-before-conflict.go"

          set +e
          "${RUNNER_TEMP}/mss-next" \
            --root "${DOWNSTREAM}" \
            upgrade plan \
            --foundation "${CONFLICT_FOUNDATION}" \
            --contributor-npm-registry "${COMPATIBILITY_FRONTEND_REGISTRY_URL}" \
            --format json \
            > "${RUNNER_TEMP}/upgrade-conflict.json"
          plan_exit=$?
          set -e
          if [[ ${plan_exit} -ne 0 ]]; then
            echo "A conflict plan must be returned as structured output without an execution failure." >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "upgrade-conflict.json").read_text())
          if plan.get("success"):
              raise SystemExit("concurrent changes did not produce a failed plan")
          conflicts = [change for change in plan["changes"] if change["action"] == "conflict"]
          if not any(change["path"] == "cmd/server/main.go" for change in conflicts):
              raise SystemExit(f"cmd/server/main.go conflict is missing: {conflicts}")
          PY

          if "${RUNNER_TEMP}/mss-next" \
              --root "${DOWNSTREAM}" \
              upgrade apply \
              --foundation "${CONFLICT_FOUNDATION}" \
              --contributor-npm-registry "${COMPATIBILITY_FRONTEND_REGISTRY_URL}" \
              --yes \
              --format json \
              > "${RUNNER_TEMP}/unexpected-conflict-apply.json"; then
            echo "Conflict apply unexpectedly succeeded." >&2
            exit 1
          fi

          cmp "${DOWNSTREAM}/cmd/server/main.go" "${RUNNER_TEMP}/downstream-admin-main-before-conflict.go"

      - name: Stop temporary Admin Web metadata registry
        if: always()
        run: |
          set -euo pipefail
          registry_pid="${COMPATIBILITY_FRONTEND_REGISTRY_PID:-}"
          registry_ready="${COMPATIBILITY_FRONTEND_REGISTRY_READY:-}"
          if [[ -n "${registry_pid}" ]]; then
            [[ "${registry_pid}" =~ ^[0-9]+$ ]] || {
              echo "invalid compatibility registry PID: ${registry_pid}" >&2
              exit 1
            }
            if ! kill -0 "${registry_pid}" >/dev/null 2>&1; then
              echo "temporary compatibility registry already stopped"
              exit 0
            fi
            [[ -n "${registry_ready}" && -r "/proc/${registry_pid}/cmdline" ]] || {
              echo "cannot verify compatibility registry process identity" >&2
              exit 1
            }
            tr '\0' '\n' < "/proc/${registry_pid}/cmdline" | grep -Fqx -- "${registry_ready}" || {
              echo "refusing to stop a process that is not the compatibility registry" >&2
              exit 1
            }
            kill "${registry_pid}" >/dev/null 2>&1 || true
            for _ in $(seq 1 50); do
              kill -0 "${registry_pid}" >/dev/null 2>&1 || exit 0
              sleep 0.1
            done
            echo "temporary compatibility registry did not stop" >&2
            exit 1
          fi

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: foundation-compatibility-evidence
          path: |
            ${{ runner.temp }}/new-app.json
            ${{ runner.temp }}/downstream-context.json
            ${{ runner.temp }}/downstream-agent-doctor.json
            ${{ runner.temp }}/downstream-admin-doctor.json
            ${{ runner.temp }}/downstream-status.json
            ${{ runner.temp }}/downstream-mcp-status.json
            ${{ runner.temp }}/upgrade-plan.json
            ${{ runner.temp }}/mcp-upgrade-plan.json
            ${{ runner.temp }}/upgrade-apply.json
            ${{ runner.temp }}/upgrade-status.json
            ${{ runner.temp }}/upgraded-agent-doctor.json
            ${{ runner.temp }}/upgraded-mcp-status.json
            ${{ runner.temp }}/upgraded-context.json
            ${{ runner.temp }}/upgrade-conflict.json
          if-no-files-found: warn
          retention-days: 14
