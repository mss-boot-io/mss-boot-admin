name: Foundation Compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream-generation-and-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout foundation
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Initialize compatibility paths
        run: |
          echo "DOWNSTREAM=${RUNNER_TEMP}/mss-compatibility-admin" >> "${GITHUB_ENV}"
          echo "NEXT_FOUNDATION=${RUNNER_TEMP}/mss-foundation-next" >> "${GITHUB_ENV}"
          echo "CONFLICT_FOUNDATION=${RUNNER_TEMP}/mss-foundation-conflict" >> "${GITHUB_ENV}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure Git identity
        run: |
          git config --global user.name "mss-foundation-ci"
          git config --global user.email "mss-foundation-ci@users.noreply.github.com"

      - name: Test Blueprint and upgrade engines
        run: |
          set -euo pipefail
          go test \
            ./internal/mss/blueprint \
            ./internal/mss/feature \
            ./internal/mss/spec \
            ./internal/mss/mcp \
            ./internal/mss/eval \
            ./internal/mss/app

      - name: Generate a standalone downstream repository
        run: |
          set -euo pipefail
          rm -rf "${DOWNSTREAM}"
          go run ./cmd/mss new app compatibility-admin \
            --display-name "Compatibility Administration" \
            --module github.com/example/compatibility-admin \
            --repository example/compatibility-admin \
            --destination "${DOWNSTREAM}" \
            --write \
            --git-init \
            --format json \
            > "${RUNNER_TEMP}/new-app.json"

          git -C "${DOWNSTREAM}" add -A
          git -C "${DOWNSTREAM}" commit -m "chore: record generated foundation baseline"

      - name: Validate generated downstream tooling
        run: |
          set -euo pipefail
          (
            cd "${DOWNSTREAM}"
            go run ./cmd/mss context --format json > "${RUNNER_TEMP}/downstream-context.json"
            go run ./cmd/mss skills validate --format json > "${RUNNER_TEMP}/downstream-skills.json"
            go test ./internal/mss/... ./cmd/mss/... ./cmd/mss-mcp/... ./modules/runtime/...
          )

      - name: Create a deterministic next foundation revision
        run: |
          set -euo pipefail
          rm -rf "${NEXT_FOUNDATION}"
          foundation_commit="$(git rev-parse HEAD)"
          git clone --no-hardlinks --no-checkout . "${NEXT_FOUNDATION}"
          git -C "${NEXT_FOUNDATION}" checkout --detach "${foundation_commit}"

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["NEXT_FOUNDATION"])

          blueprint = root / ".mss/blueprints/management-system.yaml"
          text = blueprint.read_text(encoding="utf-8")
          if "version: 0.1.0" not in text:
              raise SystemExit("unexpected Blueprint version")
          blueprint.write_text(text.replace("version: 0.1.0", "version: 0.1.1-ci", 1), encoding="utf-8")

          project = root / ".mss/project.yaml"
          text = project.read_text(encoding="utf-8")
          if "foundationVersion: 0.1.0" not in text:
              raise SystemExit("unexpected foundationVersion")
          project.write_text(text.replace("foundationVersion: 0.1.0", "foundationVersion: 0.1.1-ci", 1), encoding="utf-8")

          probe = root / "docs/docs/agent/foundation-compatibility-probe.md"
          probe.write_text("# Foundation compatibility probe\n\nGenerated by the compatibility pipeline fixture.\n", encoding="utf-8")

          removed = root / "docs/docs/agent/architecture.md"
          if not removed.exists():
              raise SystemExit("expected managed removal fixture is missing")
          removed.unlink()
          PY

          git -C "${NEXT_FOUNDATION}" add -A
          git -C "${NEXT_FOUNDATION}" commit -m "test: create next foundation fixture"

      - name: Add downstream-only customizations
        run: |
          set -euo pipefail
          printf '\n# Downstream custom policy\n' >> "${DOWNSTREAM}/AGENTS.md"
          mkdir -p "${DOWNSTREAM}/modules/customer-extension"
          cat > "${DOWNSTREAM}/modules/customer-extension/custom.go" <<'EOF'
          package customerextension

          const Preserved = true
          EOF
          git -C "${DOWNSTREAM}" add -A
          git -C "${DOWNSTREAM}" commit -m "feat: add downstream customizations"

      - name: Plan the next foundation upgrade
        run: |
          set -euo pipefail
          (
            cd "${NEXT_FOUNDATION}"
            go run ./cmd/mss \
              --root "${DOWNSTREAM}" \
              upgrade plan \
              --foundation "${NEXT_FOUNDATION}" \
              --format json \
              > "${RUNNER_TEMP}/upgrade-plan.json"
          )

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "upgrade-plan.json").read_text())
          if not plan.get("success") or not plan.get("dryRun"):
              raise SystemExit(f"upgrade plan is not a successful dry-run: {plan}")
          actions = {change["action"] for change in plan["changes"]}
          required = {"create", "update", "delete", "preserve"}
          missing = required - actions
          if missing:
              raise SystemExit(f"upgrade plan is missing actions: {sorted(missing)}")
          PY

      - name: Apply and verify the next foundation upgrade
        run: |
          set -euo pipefail
          (
            cd "${NEXT_FOUNDATION}"
            go run ./cmd/mss \
              --root "${DOWNSTREAM}" \
              upgrade apply \
              --foundation "${NEXT_FOUNDATION}" \
              --yes \
              --format json \
              > "${RUNNER_TEMP}/upgrade-apply.json"
          )

          grep -q "# Downstream custom policy" "${DOWNSTREAM}/AGENTS.md"
          test -f "${DOWNSTREAM}/modules/customer-extension/custom.go"
          grep -q "foundationVersion: 0.1.1-ci" "${DOWNSTREAM}/.mss/project.yaml"
          test -f "${DOWNSTREAM}/docs/docs/agent/foundation-compatibility-probe.md"
          test ! -e "${DOWNSTREAM}/docs/docs/agent/architecture.md"

          (
            cd "${DOWNSTREAM}"
            go run ./cmd/mss upgrade status --format json > "${RUNNER_TEMP}/upgrade-status.json"
            go run ./cmd/mss context --format json > "${RUNNER_TEMP}/upgraded-context.json"
            go run ./cmd/mss skills validate --format json > "${RUNNER_TEMP}/upgraded-skills.json"
            go test ./internal/mss/... ./cmd/mss/... ./cmd/mss-mcp/... ./modules/runtime/...
          )

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = json.loads((Path(os.environ["RUNNER_TEMP"]) / "upgrade-status.json").read_text())
          if status.get("blueprintVersion") != "0.1.1-ci":
              raise SystemExit(f"unexpected installed Blueprint version: {status}")
          if not status.get("foundationCommit"):
              raise SystemExit(f"foundation commit is missing: {status}")
          PY

          git -C "${DOWNSTREAM}" add -A
          git -C "${DOWNSTREAM}" commit -m "chore: apply next foundation fixture"

      - name: Create concurrent changes and require a conflict
        run: |
          set -euo pipefail
          rm -rf "${CONFLICT_FOUNDATION}"
          next_commit="$(git -C "${NEXT_FOUNDATION}" rev-parse HEAD)"
          git clone --no-hardlinks --no-checkout "${NEXT_FOUNDATION}" "${CONFLICT_FOUNDATION}"
          git -C "${CONFLICT_FOUNDATION}" checkout --detach "${next_commit}"

          printf '\nconst FoundationConflictProbe = true\n' >> "${CONFLICT_FOUNDATION}/main.go"
          git -C "${CONFLICT_FOUNDATION}" add main.go
          git -C "${CONFLICT_FOUNDATION}" commit -m "test: change foundation main"

          printf '\nconst DownstreamConflictProbe = true\n' >> "${DOWNSTREAM}/main.go"
          cp "${DOWNSTREAM}/main.go" "${RUNNER_TEMP}/downstream-main-before-conflict.go"

          set +e
          (
            cd "${CONFLICT_FOUNDATION}"
            go run ./cmd/mss \
              --root "${DOWNSTREAM}" \
              upgrade plan \
              --foundation "${CONFLICT_FOUNDATION}" \
              --format json \
              > "${RUNNER_TEMP}/upgrade-conflict.json"
          )
          plan_exit=$?
          set -e
          if [[ ${plan_exit} -ne 0 ]]; then
            echo "A conflict plan must be returned as structured output without an execution failure." >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "upgrade-conflict.json").read_text())
          if plan.get("success"):
              raise SystemExit("concurrent changes did not produce a failed plan")
          conflicts = [change for change in plan["changes"] if change["action"] == "conflict"]
          if not any(change["path"] == "main.go" for change in conflicts):
              raise SystemExit(f"main.go conflict is missing: {conflicts}")
          PY

          if (
            cd "${CONFLICT_FOUNDATION}" &&
            go run ./cmd/mss \
              --root "${DOWNSTREAM}" \
              upgrade apply \
              --foundation "${CONFLICT_FOUNDATION}" \
              --yes \
              --format json \
              > "${RUNNER_TEMP}/unexpected-conflict-apply.json"
          ); then
            echo "Conflict apply unexpectedly succeeded." >&2
            exit 1
          fi

          cmp "${DOWNSTREAM}/main.go" "${RUNNER_TEMP}/downstream-main-before-conflict.go"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-compatibility-evidence
          path: |
            ${{ runner.temp }}/new-app.json
            ${{ runner.temp }}/downstream-context.json
            ${{ runner.temp }}/downstream-skills.json
            ${{ runner.temp }}/upgrade-plan.json
            ${{ runner.temp }}/upgrade-apply.json
            ${{ runner.temp }}/upgrade-status.json
            ${{ runner.temp }}/upgraded-context.json
            ${{ runner.temp }}/upgraded-skills.json
            ${{ runner.temp }}/upgrade-conflict.json
          if-no-files-found: warn
          retention-days: 14
