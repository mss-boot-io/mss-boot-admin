name: One-shot web dependency repair

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-web-dependency-repair
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: refactor/split-admin-module-and-coverage-r1
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/antd/pnpm-lock.yaml
            web/antd/workers-site/pnpm-lock.yaml

      - name: Rewrite manifests, mock types, and Umi configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          package_path = Path('web/antd/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['private'] = True
          package['packageManager'] = 'pnpm@9.15.9'
          package['engines'] = {'node': '>=22.0.0', 'pnpm': '>=9.0.0 <10'}
          package.pop('lint-staged', None)

          scripts = package.setdefault('scripts', {})
          for name in (
              'deploy', 'gh-pages', 'lint-staged', 'openapi', 'postinstall',
              'prepare', 'record', 'serve',
          ):
              scripts.pop(name, None)
          scripts['setup'] = 'max setup'
          scripts['test'] = 'jest --runInBand'
          scripts['test:ci'] = 'jest --runInBand --detectOpenHandles'
          scripts['test:update'] = 'jest --runInBand -u'
          scripts['lint:prettier'] = (
              'prettier --check '
              '"package.json" "config/**/*.ts" "src/**/*.{ts,tsx}" '
              '"mock/**/*.ts" "workers-site/package.json"'
          )
          scripts['prettier'] = (
              'prettier --write '
              '"package.json" "config/**/*.ts" "src/**/*.{ts,tsx}" '
              '"mock/**/*.ts" "workers-site/package.json"'
          )

          dependencies = package.setdefault('dependencies', {})
          for name in ('braft-editor', 'immutable'):
              dependencies.pop(name, None)
          dependencies.update({
              '@ant-design/charts': '2.6.7',
              '@ant-design/icons': '4.8.1',
              '@ant-design/pro-components': '2.8.10',
              '@ant-design/use-emotion-css': '1.0.4',
              '@umijs/route-utils': '2.2.2',
              'ahooks': '3.9.7',
              'antd': '5.12.1',
              'classnames': '2.5.1',
              'lodash': '4.18.1',
              'moment': '2.30.1',
              'omit.js': '2.0.2',
              'rc-menu': '9.16.1',
              'rc-util': '5.44.4',
              'react': '18.3.1',
              'react-dom': '18.3.1',
              'react-helmet-async': '3.0.0',
              'react-quill-new': '3.8.3',
              'uuid': '14.0.1',
          })

          dev_dependencies = package.setdefault('devDependencies', {})
          for name in (
              '@types/classnames', '@types/express', '@types/react-helmet',
              'express', 'gh-pages', 'husky', 'lint-staged',
              'swagger-ui-dist', 'umi-presets-pro', 'webpack',
          ):
              dev_dependencies.pop(name, None)
          dev_dependencies.update({
              '@playwright/test': '1.62.1',
              '@testing-library/react': '15.0.7',
              '@types/jest': '29.5.14',
              '@types/lodash': '4.17.25',
              '@types/react': '18.3.31',
              '@types/react-dom': '18.3.7',
              '@umijs/lint': '4.7.0',
              '@umijs/max': '4.7.0',
              'cross-env': '10.1.0',
              'eslint': '8.57.1',
              'jest': '29.7.0',
              'jest-environment-jsdom': '29.7.0',
              'less': '4.6.4',
              'less-loader': '12.3.3',
              'prettier': '2.8.8',
              'ts-node': '10.9.2',
              'typescript': '4.9.5',
          })

          package['pnpm'] = {
              'overrides': {
                  '@remix-run/router': '1.23.3',
                  '@umijs/bundler-utoopack>less-loader': '12.3.3',
                  '@tootallnate/once': '2.0.1',
                  'body-parser@1.20.5': '1.20.6',
                  'brace-expansion@1.1.15': '1.1.18',
                  'brace-expansion@2.1.1': '2.1.4',
                  'braces': '3.0.3',
                  'cross-spawn': '7.0.6',
                  'diff@4.0.2': '4.0.4',
                  'es5-ext@0.10.62': '0.10.64',
                  'fast-uri': '3.1.5',
                  'flatted': '3.4.2',
                  'form-data': '4.0.6',
                  'hono': '4.12.34',
                  'js-yaml': '4.3.0',
                  'micromatch': '4.0.8',
                  'minimatch@3.1.2': '3.1.4',
                  'minimatch@8.0.4': '8.0.6',
                  'path-to-regexp@1.7.0': '1.9.0',
                  'postcss': '8.5.23',
                  'qs': '6.15.2',
                  'send': '0.19.2',
                  'svgo@2.8.2': '2.8.3',
                  'ws': '8.21.0',
              },
              'peerDependencyRules': {
                  'allowedVersions': {
                      '@types/react': '18.3.31',
                      'dva-core': '2.0.4',
                      'react': '18.3.1',
                      'react-dom': '18.3.1',
                      'stylelint': '13.13.1',
                  },
              },
          }
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          config_path = Path('web/antd/config/config.ts')
          config = config_path.read_text(encoding='utf-8')
          config = config.replace("import path from 'path';\n", '')
          config = re.sub(
              r'\n  //================ pro 插件配置 =================.*?\n  mfsu:',
              '\n  mfsu:',
              config,
              flags=re.DOTALL,
          )
          config = config.replace('  requestRecord: {},\n', '')
          config_path.write_text(config, encoding='utf-8')

          mock_types = Path('web/antd/mock/types.ts')
          mock_types.write_text(
              "export interface MockRequest {\n"
              "  body: Record<string, string>;\n"
              "}\n\n"
              "export interface MockResponse {\n"
              "  json: (body: unknown) => MockResponse;\n"
              "  send: (body: unknown) => MockResponse;\n"
              "  status: (code: number) => MockResponse;\n"
              "}\n",
              encoding='utf-8',
          )
          for name in ('role.ts', 'user.ts', 'notices.ts'):
              path = Path('web/antd/mock') / name
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  "import { Request, Response } from 'express';",
                  "import type { MockRequest as Request, MockResponse as Response } from './types';",
              )
              path.write_text(text, encoding='utf-8')

          npmrc = Path('web/antd/.npmrc')
          npmrc.write_text(
              'auto-install-peers=true\n'
              'dedupe-peer-dependents=true\n'
              'engine-strict=true\n'
              'resolution-mode=highest\n'
              'save-exact=true\n'
              'strict-peer-dependencies=true\n',
              encoding='utf-8',
          )

          worker_path = Path('web/antd/workers-site/package.json')
          worker = json.loads(worker_path.read_text(encoding='utf-8'))
          worker['private'] = True
          worker['packageManager'] = 'pnpm@9.15.9'
          worker['engines'] = {'node': '>=22.0.0', 'pnpm': '>=9.0.0 <10'}
          worker_path.write_text(
              json.dumps(worker, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Assert removed dependency chains have no source imports
        working-directory: web/antd
        run: |
          set -euo pipefail
          if grep -R --line-number \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            -E "braft-editor|from ['\"]immutable['\"]|from ['\"]express['\"]|umi-presets-pro" \
            src config mock \
            --exclude-dir=node_modules --exclude-dir=dist; then
            echo 'Legacy dependency source usage remains after migration' >&2
            exit 1
          fi

      - name: Regenerate and deduplicate frontend lockfile
        working-directory: web/antd
        run: |
          set -euxo pipefail
          rm -rf node_modules .umi
          pnpm install --lockfile-only --strict-peer-dependencies
          pnpm dedupe
          pnpm dlx update-browserslist-db@latest
          pnpm install --lockfile-only --strict-peer-dependencies

      - name: Upgrade and lock Workers Site dependency
        working-directory: web/antd/workers-site
        run: |
          set -euxo pipefail
          rm -rf node_modules
          pnpm add --save-exact @cloudflare/kv-asset-handler@latest
          pnpm install --lockfile-only --strict-peer-dependencies

      - name: Verify frozen strict installs have no lifecycle side effects
        run: |
          set -euxo pipefail
          before="$(git status --porcelain=v1)"
          rm -rf web/antd/node_modules web/antd/.umi web/antd/workers-site/node_modules
          pnpm --dir web/antd install \
            --frozen-lockfile \
            --ignore-scripts \
            --strict-peer-dependencies \
            --prefer-offline
          pnpm --dir web/antd/workers-site install \
            --frozen-lockfile \
            --ignore-scripts \
            --strict-peer-dependencies \
            --prefer-offline
          after="$(git status --porcelain=v1)"
          test "${before}" = "${after}"

      - name: Generate Umi files explicitly
        working-directory: web/antd
        run: pnpm setup

      - name: Validate dependency graph and security policy
        working-directory: web/antd
        run: |
          set -euxo pipefail
          pnpm list --depth Infinity >/dev/null
          pnpm dedupe --check
          pnpm audit --prod --audit-level high
          pnpm audit --audit-level critical
          pnpm --dir workers-site audit --prod --audit-level high

      - name: Validate frontend quality and build
        working-directory: web/antd
        run: |
          set -euxo pipefail
          pnpm lint:js
          pnpm lint:prettier
          pnpm tsc
          timeout 300s pnpm test:ci
          pnpm build:local

      - name: Check repository drift
        run: |
          set -euxo pipefail
          git diff --check

      - name: Commit repaired frontend dependencies
        run: |
          set -euxo pipefail
          rm -rf web/antd/node_modules web/antd/.umi web/antd/dist web/antd/workers-site/node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            web/antd/.npmrc \
            web/antd/package.json \
            web/antd/pnpm-lock.yaml \
            web/antd/config/config.ts \
            web/antd/mock/types.ts \
            web/antd/mock/role.ts \
            web/antd/mock/user.ts \
            web/antd/mock/notices.ts \
            web/antd/workers-site/package.json \
            web/antd/workers-site/pnpm-lock.yaml
          git diff --cached --stat
          git commit -m 'build(frontend): make dependency graph deterministic'
          git push origin HEAD:refactor/split-admin-module-and-coverage-r1
