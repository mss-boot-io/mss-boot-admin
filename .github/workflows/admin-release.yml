name: Admin Go Module Release

on:
  push:
    tags:
      - 'admin/v*.*.*'

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-auto
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Require authorized release operator
        env:
          RELEASE_ACTOR_LOGIN: lwnmengjing
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" || "${GITHUB_TRIGGERING_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" ]]; then
            echo "release operations must be initiated and triggered by ${RELEASE_ACTOR_LOGIN}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve immutable Admin module identity
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#admin/}"
          test "${version}" != "${GITHUB_REF_NAME}"
          resolved_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${resolved_commit}" = "${GITHUB_SHA}"
          prerelease=false
          if [[ "${version}" == *-* ]]; then prerelease=true; fi
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify merged-main release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/verify_release_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --tag "${GITHUB_REF_NAME}" \
            --policy .mss/release-policy.yaml

      - name: Enforce coordinated Admin Distribution target
        env:
          ADMIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 tools/release/check_release_policy.py \
            --component admin \
            --version "${ADMIN_VERSION}" \
            --tag "${GITHUB_REF_NAME}"

      - name: Reconcile existing public Admin release
        id: release-state
        env:
          ADMIN_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if release_json="$(gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft,isPrerelease 2>/dev/null)"; then
            jq -e \
              --arg tag "${GITHUB_REF_NAME}" \
              --argjson prerelease "${ADMIN_PRERELEASE}" \
              '.tagName == $tag and .isPrerelease == $prerelease' \
              <<< "${release_json}" >/dev/null
            echo "public=$(jq -r '.isDraft == false' <<< "${release_json}")" >> "${GITHUB_OUTPUT}"
          else
            echo 'public=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Require the already-published matching Framework release
        env:
          ADMIN_VERSION: ${{ steps.version.outputs.version }}
          ADMIN_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          framework_tag="mss-boot/${ADMIN_VERSION}"
          framework_commit="$(git rev-parse "${framework_tag}^{commit}")"
          if [[ "${framework_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Framework tag ${framework_tag} resolves to ${framework_commit}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          framework_release="$(
            gh release view "${framework_tag}" \
              --json tagName,isDraft,isPrerelease
          )"
          jq -e \
            --arg tag "${framework_tag}" \
            --argjson prerelease "${ADMIN_PRERELEASE}" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' \
            <<< "${framework_release}" >/dev/null

      - name: Setup Go for the public Framework boundary
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: admin/go.mod
          cache: false

      - name: Resolve and test the exact public Framework
        working-directory: admin
        env:
          ADMIN_VERSION: ${{ steps.version.outputs.version }}
          GOFLAGS: -mod=readonly
          GOCACHE: ${{ runner.temp }}/public-framework-gocache
          GOMODCACHE: ${{ runner.temp }}/public-framework-modcache
          GONOSUMDB: ''
          GONOPROXY: ''
          GOPRIVATE: ''
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOWORK: 'off'
        run: |
          set -euo pipefail
          framework_module='github.com/mss-boot-io/mss-boot-admin/mss-boot'
          resolved="$(go mod download -json "${framework_module}@${ADMIN_VERSION}")"
          jq -e \
            --arg module "${framework_module}" \
            --arg version "${ADMIN_VERSION}" \
            '.Path == $module and .Version == $version and
             (.Sum | startswith("h1:")) and (.GoModSum | startswith("h1:")) and
             (.Error == null)' \
            <<< "${resolved}" >/dev/null
          go test ./app ./business

      - name: Prepare component-scoped release notes
        id: release-notes
        env:
          ADMIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/admin-release-notes.md"
          : > "${notes_file}"
          {
            echo "# Admin Go Module ${ADMIN_VERSION}"
            echo
            echo '## Install'
            echo
            echo '```shell'
            echo "go get github.com/mss-boot-io/mss-boot-admin/admin@${ADMIN_VERSION}"
            echo '```'
            echo
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo
            echo 'Broad quality verification was completed locally on the exact clean merged-main commit. This release also resolved and tested the matching public Framework with GOWORK=off before publication.'
          } >> "${notes_file}"
          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable Admin module release
        if: steps.release-state.outputs.public != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Admin Go Module ${{ steps.version.outputs.version }}
          body_path: ${{ steps.release-notes.outputs.path }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: false
