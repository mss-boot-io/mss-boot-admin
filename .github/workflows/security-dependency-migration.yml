name: One-time Go security dependency migration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/security-dependency-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mss-boot-admin-security-dependency-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: codex/monorepo-integration

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Start Redis
        uses: supercharge/redis-github-action@1.8.1
        with:
          redis-version: 7

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Migrate go-github API
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          old_import = 'github.com/google/go-github/v41/github'
          new_import = 'github.com/google/go-github/v88/github'

          def replace_required(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          source_files = [Path('pkg/git.go'), Path('pkg/gist.go'), Path('pkg/gist_test.go')]
          for path in source_files:
              text = path.read_text(encoding='utf-8')
              if old_import not in text:
                  raise SystemExit(f'expected old import not found in {path}')
              path.write_text(text.replace(old_import, new_import), encoding='utf-8')

          gist = Path('pkg/gist.go')
          replace_required(gist, '\t"net/http"\n', '')
          replace_required(gist, '\t"golang.org/x/oauth2"\n', '')
          replace_required(
              gist,
              '''\tctx := context.Background()
          \tvar tc *http.Client
          \tif accessToken != "" {
          \t\tts := oauth2.StaticTokenSource(
          \t\t\t&oauth2.Token{AccessToken: accessToken},
          \t\t)
          \t\ttc = oauth2.NewClient(ctx, ts)
          \t}

          \tclient := github.NewClient(tc)
          \treturn gistClone(ctx, client, id, dir)
          ''',
              '''\tctx := context.Background()
          \tvar opts []github.ClientOptionsFunc
          \tif accessToken != "" {
          \t\topts = append(opts, github.WithAuthToken(accessToken))
          \t}

          \tclient, err := github.NewClient(opts...)
          \tif err != nil {
          \t\treturn err
          \t}
          \treturn gistClone(ctx, client, id, dir)
          ''',
          )

          git_file = Path('pkg/git.go')
          replace_required(git_file, '\t"golang.org/x/oauth2"\n', '')
          replace_required(
              git_file,
              '''\tctx := context.Background()
          \tts := oauth2.StaticTokenSource(&oauth2.Token{AccessToken: token})
          \ttc := oauth2.NewClient(ctx, ts)
          \tclient := github.NewClient(tc)

          \tr := &github.Repository{Name: &name, Private: &private, Description: &description}
          ''',
              '''\tctx := context.Background()
          \tclient, err := github.NewClient(github.WithAuthToken(token))
          \tif err != nil {
          \t\treturn nil, err
          \t}

          \tr := &github.Repository{Name: &name, Private: &private, Description: &description}
          ''',
          )
          replace_required(
              git_file,
              '''\tts := oauth2.StaticTokenSource(&oauth2.Token{AccessToken: token})
          \ttc := oauth2.NewClient(ctx, ts)
          \tclient := github.NewClient(tc)

          \tbranches, _, err := client.Repositories.ListBranches(ctx, organization, name, &github.BranchListOptions{
          ''',
              '''\tclient, err := github.NewClient(github.WithAuthToken(token))
          \tif err != nil {
          \t\treturn nil, err
          \t}

          \tbranches, _, err := client.Repositories.ListBranches(ctx, organization, name, &github.BranchListOptions{
          ''',
          )

          gist_test = Path('pkg/gist_test.go')
          replace_required(gist_test, '\t"net/url"\n', '')
          replace_required(
              gist_test,
              '''\tclient := github.NewClient(server.Client())
          \tbaseURL, err := url.Parse(server.URL + "/")
          \tif err != nil {
          \t\tt.Fatalf("parse test server url: %v", err)
          \t}
          \tclient.BaseURL = baseURL
          ''',
              '''\tbaseURL := server.URL + "/"
          \tclient, err := github.NewClient(
          \t\tgithub.WithHTTPClient(server.Client()),
          \t\tgithub.WithURLs(&baseURL, nil),
          \t)
          \tif err != nil {
          \t\tt.Fatalf("create GitHub client: %v", err)
          \t}
          ''',
          )
          PY
          gofmt -w pkg/git.go pkg/gist.go pkg/gist_test.go

      - name: Upgrade root application dependencies
        run: |
          set -euo pipefail
          framework='github.com/mss-boot-io/mss-boot-admin/mss-boot'

          # The first nested-module tag is intentionally published only after
          # this PR merges. Add a temporary root-module bridge so module-editing
          # commands can resolve the framework with workspace mode disabled.
          GOWORK=off go mod edit -replace="${framework}@v0.8.0=./mss-boot"
          trap 'GOWORK=off go mod edit -dropreplace="${framework}@v0.8.0"' EXIT

          GOWORK=off go get github.com/google/go-github/v88@v88.0.0
          GOWORK=off go get google.golang.org/grpc@v1.82.1
          GOWORK=off go get golang.org/x/text@v0.39.0
          GOWORK=off go mod tidy

          GOWORK=off go mod edit -dropreplace="${framework}@v0.8.0"
          trap - EXIT

          if grep -R --line-number --fixed-strings 'github.com/google/go-github/v41' \
            --include='*.go' --include='go.mod' --exclude-dir=.git .; then
            echo 'old go-github/v41 references remain' >&2
            exit 1
          fi
          if grep -q '^replace .*mss-boot' go.mod; then
            echo 'temporary framework replace leaked into go.mod' >&2
            exit 1
          fi

      - name: Upgrade framework dependencies
        working-directory: mss-boot
        env:
          GOWORK: 'off'
        run: |
          set -euo pipefail
          go get google.golang.org/grpc@v1.82.1
          go get golang.org/x/text@v0.39.0
          go mod tidy

      - name: Test Go workspace
        run: |
          set -euo pipefail
          make deps-all
          make test-all
          go work vendor

      - name: Scan root application
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Scan framework module
        working-directory: mss-boot
        env:
          GOWORK: 'off'
        run: govulncheck ./...

      - name: Commit verified dependency migration
        run: |
          set -euo pipefail
          rm -f .github/workflows/security-dependency-migration.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(security): upgrade vulnerable Go dependencies'
          git push origin HEAD:codex/monorepo-integration
