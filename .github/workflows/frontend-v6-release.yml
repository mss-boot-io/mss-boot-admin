name: Frontend v6 Release

on:
  push:
    tags:
      - 'web/antd-v6/v*.*.*'

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mss-boot-admin-antd-v6

defaults:
  run:
    working-directory: web/antd-v6

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: release-v6
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve immutable v6 release identity
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#web/antd-v6/}"
          test "${version}" != "${GITHUB_REF_NAME}"
          resolved_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          test "${resolved_commit}" = "${GITHUB_SHA}"
          prerelease=false
          if [[ "${version}" == *-* ]]; then prerelease=true; fi
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify merged-main release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../../tools/release/verify_release_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --tag "${GITHUB_REF_NAME}" \
            --policy ../../.mss/release-policy.yaml

      - name: Enforce reviewed v6 release target
        env:
          FRONTEND_V6_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 ../../tools/release/check_release_policy.py \
            --policy ../../.mss/release-policy.yaml \
            --component frontend \
            --version "${FRONTEND_V6_VERSION}" \
            --tag "${GITHUB_REF_NAME}"

      - name: Require selected readiness attestation
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_V6_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_READINESS_RUN_ID: ${{ vars.RELEASE_READINESS_RUN_ID }}
        run: |
          bash ../../tools/release/verify_readiness_run.sh \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${RELEASE_READINESS_RUN_ID}" \
            --target-version "${FRONTEND_V6_VERSION}" \
            --commit "${GITHUB_SHA}" \
            --phase pre-framework \
            --policy ../../.mss/release-policy.yaml

      - name: Require the already-published matching Admin release
        env:
          FRONTEND_V6_VERSION: ${{ steps.version.outputs.version }}
          FRONTEND_V6_PRERELEASE: ${{ steps.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          admin_tag="admin/${FRONTEND_V6_VERSION}"
          admin_commit="$(git rev-parse "${admin_tag}^{commit}")"
          if [[ "${admin_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Admin tag ${admin_tag} resolves to ${admin_commit}, not ${GITHUB_SHA}" >&2
            exit 1
          fi
          admin_release="$(
            gh release view "${admin_tag}" \
              --json tagName,isDraft,isPrerelease
          )"
          jq -e \
            --arg tag "${admin_tag}" \
            --argjson prerelease "${FRONTEND_V6_PRERELEASE}" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' \
            <<< "${admin_release}" >/dev/null

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/antd-v6/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@mss-boot-io'

      - name: Install frozen v6 dependency graph
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Verify dependency and quality gates
        run: |
          pnpm run deps:check
          pnpm run audit:release
          pnpm run lint
          pnpm run test:ci

      - name: Qualify browser permission and parity behavior
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e

      - name: Build same-origin v6 release
        run: pnpm run build:release

      - name: Embed and verify v6 artifact identity
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq -n \
            --arg application 'mss-boot-admin-antd-v6' \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            '{application: $application, version: $version, commit: $commit}' > dist/release.json
          jq -e \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            '.application == "mss-boot-admin-antd-v6" and .version == $version and .commit == $commit' \
            dist/release.json >/dev/null
          {
            echo 'application=mss-boot-admin-antd-v6'
            echo "version=${RELEASE_VERSION}"
            echo "commit=${GITHUB_SHA}"
          } > FRONTEND-V6-BUILD-INFO
          source_epoch="$(git show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@${source_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --create \
            --gzip \
            --file dist-v6.tar.gz \
            dist
          sha256sum dist-v6.tar.gz FRONTEND-V6-BUILD-INFO > SHA256SUMS.frontend-v6
          python3 ../../tools/release/check_portable_paths.py \
            dist \
            dist-v6.tar.gz \
            FRONTEND-V6-BUILD-INFO \
            SHA256SUMS.frontend-v6

      - name: Smoke-test v6 production delivery
        run: pnpm run delivery:smoke

      - name: Inject and qualify the Admin Distribution package version
        env:
          ADMIN_WEB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          unprefixed_version="${ADMIN_WEB_VERSION#v}"
          test "${unprefixed_version}" != "${ADMIN_WEB_VERSION}"
          export UNPREFIXED_VERSION="${unprefixed_version}"
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (manifest.name !== '@mss-boot-io/admin-web') {
            throw new Error(`unexpected package name: ${manifest.name}`);
          }
          if (manifest.private === true) {
            throw new Error('Admin Web package remains private');
          }
          manifest.version = process.env.UNPREFIXED_VERSION;
          manifest.gitHead = process.env.GITHUB_SHA;
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          package_dir="${RUNNER_TEMP}/admin-web-release-package"
          mkdir -p "${package_dir}"
          pnpm pack --pack-destination "${package_dir}" >/dev/null
          mapfile -t tarballs < <(find "${package_dir}" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          created="$(date -u -d "$(git show -s --format=%cI HEAD)" '+%Y-%m-%dT%H:%M:%SZ')"
          pnpm list --prod --json --depth Infinity > "${package_dir}/pnpm-tree.json"
          python3 ../../tools/release/verify_admin_web_package.py \
            --tarball "${tarball}" \
            --expected-name '@mss-boot-io/admin-web' \
            --expected-version "${unprefixed_version}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --output "${package_dir}/admin-web-package.json"
          python3 ../../tools/release/generate_admin_web_sbom.py \
            --dependency-tree "${package_dir}/pnpm-tree.json" \
            --package-evidence "${package_dir}/admin-web-package.json" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --created "${created}" \
            --output "${package_dir}/admin-web.spdx.json"
          rm -f "${package_dir}/pnpm-tree.json"
          (
            cd "${package_dir}"
            sha256sum -- *.tgz admin-web-package.json admin-web.spdx.json \
              > SHA256SUMS.admin-web
            sha256sum --check SHA256SUMS.admin-web
          )
          python3 ../../tools/release/check_portable_paths.py \
            "${tarball}" \
            "${package_dir}/admin-web-package.json" \
            "${package_dir}/admin-web.spdx.json" \
            "${package_dir}/SHA256SUMS.admin-web"

      - name: Require GitHub Packages authority and reconcile version identity
        id: npm-version
        env:
          ADMIN_WEB_VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo 'GITHUB_TOKEN package authority is required; refusing to downgrade publication to a local-only success.' >&2
            exit 1
          fi
          unprefixed_version="${ADMIN_WEB_VERSION#v}"
          error_file="${RUNNER_TEMP}/github-packages-view-error.log"
          if published_integrity="$(
            npm view "@mss-boot-io/admin-web@${unprefixed_version}" \
              dist.integrity --json \
              --registry=https://npm.pkg.github.com \
              2> "${error_file}" | jq -er '.'
          )"; then
            expected_integrity="$(
              jq -er '.artifact.integrity' \
                "${RUNNER_TEMP}/admin-web-release-package/admin-web-package.json"
            )"
            if [[ "${published_integrity}" != "${expected_integrity}" ]]; then
              echo "the existing npm version has different immutable content" >&2
              exit 1
            fi
            echo 'publish=false' >> "${GITHUB_OUTPUT}"
            rm -f "${error_file}"
            exit 0
          fi
          if ! grep -q 'E404' "${error_file}"; then
            echo 'GitHub Packages availability check failed without an authoritative not-found response' >&2
            sed -E 's#(//registry[^:]*:)(_authToken=)?[^[:space:]]+#\1[REDACTED]#g' "${error_file}" >&2
            exit 1
          fi
          echo 'publish=true' >> "${GITHUB_OUTPUT}"
          rm -f "${error_file}"

      - name: Attest Admin Web package provenance
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: ${{ runner.temp }}/admin-web-release-package/*.tgz

      - name: Upload Admin Web package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: admin-web-package-release
          path: |
            ${{ runner.temp }}/admin-web-release-package/*.tgz
            ${{ runner.temp }}/admin-web-release-package/admin-web-package.json
            ${{ runner.temp }}/admin-web-release-package/admin-web.spdx.json
            ${{ runner.temp }}/admin-web-release-package/SHA256SUMS.admin-web
          if-no-files-found: error

      - name: Upload v6 build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-v6-dist-release
          path: |
            web/antd-v6/dist-v6.tar.gz
            web/antd-v6/FRONTEND-V6-BUILD-INFO
            web/antd-v6/SHA256SUMS.frontend-v6
          if-no-files-found: error

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Inspect immutable v6 image publication state
        id: image-state
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image_repository="${REGISTRY}/${IMAGE_NAME}"
          version_ref="${image_repository}:${VERSION}"
          commit_ref="${image_repository}:${GITHUB_SHA}"
          error_file="${RUNNER_TEMP}/image-inspect-error.log"

          if version_manifest="$(
            docker buildx imagetools inspect "${version_ref}" \
              --format '{{json .Manifest}}' 2> "${error_file}"
          )"; then
            digest="$(jq -er '.digest' <<< "${version_manifest}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            commit_manifest="$(
              docker buildx imagetools inspect "${commit_ref}" \
                --format '{{json .Manifest}}'
            )"
            if [[ "$(jq -er '.digest' <<< "${commit_manifest}")" != "${digest}" ]]; then
              echo "immutable version and commit image tags resolve to different digests" >&2
              exit 1
            fi
            {
              echo 'exists=true'
              echo "digest=${digest}"
            } >> "${GITHUB_OUTPUT}"
            rm -f "${error_file}"
            exit 0
          fi

          if ! grep -Eqi 'manifest unknown|not found|name_unknown' "${error_file}"; then
            echo 'registry inspection failed without an authoritative not-found response' >&2
            sed -E 's#(https?://)[^/@[:space:]]+@#\1[REDACTED]@#g' "${error_file}" >&2
            exit 1
          fi
          rm -f "${error_file}"
          if docker buildx imagetools inspect "${commit_ref}" \
            --format '{{json .Manifest}}' > /dev/null 2> "${error_file}"; then
            echo "commit image tag exists while version tag is absent; refusing to overwrite it" >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found|name_unknown' "${error_file}"; then
            echo 'commit-tag inspection failed without an authoritative not-found response' >&2
            sed -E 's#(https?://)[^/@[:space:]]+@#\1[REDACTED]@#g' "${error_file}" >&2
            exit 1
          fi
          rm -f "${error_file}"
          echo 'exists=false' >> "${GITHUB_OUTPUT}"

      - name: Extract v6 Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=,format=long

      - name: Build and push v6 Docker image
        id: build
        if: steps.image-state.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: web/antd-v6
          file: web/antd-v6/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=mss-boot-admin-antd-v6
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Verify published v6 image identity
        id: image
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.image-state.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-${BUILD_DIGEST}}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_repository="${REGISTRY}/${IMAGE_NAME}"
          version_ref="${image_repository}:${VERSION}"
          commit_ref="${image_repository}:${GITHUB_SHA}"
          version_manifest="$(
            docker buildx imagetools inspect "${version_ref}" \
              --format '{{json .Manifest}}'
          )"
          commit_manifest="$(
            docker buildx imagetools inspect "${commit_ref}" \
              --format '{{json .Manifest}}'
          )"
          jq -e \
            --arg digest "${digest}" \
            '.digest == $digest and
             ([.manifests[] | select(
               .platform.os == "linux" and .platform.architecture == "amd64"
             )] | length) == 1 and
             ([.manifests[] | select(
               .platform.os == "linux" and .platform.architecture == "arm64"
             )] | length) == 1' \
            <<< "${version_manifest}" >/dev/null
          test "$(jq -er '.digest' <<< "${commit_manifest}")" = "${digest}"

          container_id=''
          cleanup_container() {
            if [[ -n "${container_id}" ]]; then
              docker rm -f "${container_id}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_container EXIT
          for architecture in amd64 arm64; do
            platform_digest="$(
              jq -er --arg architecture "${architecture}" '
                .manifests[]
                | select(
                    .platform.os == "linux" and
                    .platform.architecture == $architecture
                  )
                | .digest
              ' <<< "${version_manifest}"
            )"
            [[ "${platform_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            platform_image="${image_repository}@${platform_digest}"
            container_id="$(docker create --platform "linux/${architecture}" "${platform_image}")"
            test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.title" }}' "${container_id}")" = 'mss-boot-admin-antd-v6'
            test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${container_id}")" = "${VERSION}"
            test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${container_id}")" = "${GITHUB_SHA}"
            release_file="${RUNNER_TEMP}/release-${architecture}.json"
            docker cp \
              "${container_id}:/usr/share/nginx/html/release.json" \
              "${release_file}"
            jq -e \
              --arg version "${VERSION}" \
              --arg commit "${GITHUB_SHA}" \
              '.application == "mss-boot-admin-antd-v6" and
               .version == $version and .commit == $commit' \
              "${release_file}" >/dev/null
            docker rm "${container_id}" >/dev/null
            container_id=''
          done
          trap - EXIT
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable Admin Web package to GitHub Packages
        if: steps.npm-version.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find "${RUNNER_TEMP}/admin-web-release-package" \
            -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" \
            --registry=https://npm.pkg.github.com

      - name: Verify GitHub Packages identity and repository binding
        env:
          ADMIN_WEB_VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unprefixed_version="${ADMIN_WEB_VERSION#v}"
          expected_integrity="$(
            jq -er '.artifact.integrity' \
              "${RUNNER_TEMP}/admin-web-release-package/admin-web-package.json"
          )"
          package_metadata="$(
            npm view "@mss-boot-io/admin-web@${unprefixed_version}" \
              version gitHead dist.integrity --json \
              --registry=https://npm.pkg.github.com
          )"
          jq -e \
            --arg version "${unprefixed_version}" \
            --arg commit "${GITHUB_SHA}" \
            --arg integrity "${expected_integrity}" \
            '.version == $version and .gitHead == $commit and
             ."dist.integrity" == $integrity' \
            <<< "${package_metadata}" >/dev/null
          package_record="$(
            gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/npm/admin-web"
          )"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            '.name == "admin-web" and .package_type == "npm" and
             (.visibility == "private" or .visibility == "public") and
             (.repository.full_name == $repository)' \
            <<< "${package_record}" >/dev/null

      - name: Publish immutable v6 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="mss-boot-admin-antd-v6 ${VERSION}"
          body="$(mktemp)"
          existing_assets_dir=''
          cleanup_release_files() {
            rm -f "${body}"
            if [[ -n "${existing_assets_dir}" ]]; then
              rm -rf "${existing_assets_dir}"
            fi
          }
          trap cleanup_release_files EXIT
          {
            echo '## Pull the independent v6 image'
            echo
            echo '```shell'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
            echo
            echo "Image digest: \`${IMAGE_DIGEST}\`"
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo 'Rollback selects only a preceding qualified V6 image and matching backend release.'
          } > "${body}"
          mapfile -t package_tarballs < <(find "${RUNNER_TEMP}/admin-web-release-package" \
            -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#package_tarballs[@]}" -eq 1
          assets=(
            dist-v6.tar.gz
            FRONTEND-V6-BUILD-INFO
            SHA256SUMS.frontend-v6
            "${package_tarballs[0]}"
            "${RUNNER_TEMP}/admin-web-release-package/admin-web-package.json"
            "${RUNNER_TEMP}/admin-web-release-package/admin-web.spdx.json"
            "${RUNNER_TEMP}/admin-web-release-package/SHA256SUMS.admin-web"
          )
          sha256sum --check SHA256SUMS.frontend-v6
          (
            cd "${RUNNER_TEMP}/admin-web-release-package"
            sha256sum --check SHA256SUMS.admin-web
          )
          expected_names="$({
            for asset in "${assets[@]}"; do basename -- "${asset}"; done
          } | jq -R . | jq -cs 'sort')"
          release_error="${RUNNER_TEMP}/github-release-view-error.log"
          if release_json="$(
            gh release view "${tag}" \
              --json tagName,isDraft,isPrerelease,name,body,assets \
              2> "${release_error}"
          )"; then
            rm -f "${release_error}"
            jq -e \
              --arg tag "${tag}" \
              --arg title "${title}" \
              --argjson prerelease "${PRERELEASE}" \
              '.tagName == $tag and .name == $title and
               .isPrerelease == $prerelease' \
              <<< "${release_json}" >/dev/null
            if [[ "$(jq -r '.isDraft' <<< "${release_json}")" == 'false' ]]; then
              expected_body="$(< "${body}")"
              actual_body="$(jq -r '.body' <<< "${release_json}")"
              test "${actual_body}" = "${expected_body}"
              actual_names="$(jq -c '[.assets[].name] | sort' <<< "${release_json}")"
              test "${actual_names}" = "${expected_names}"
              existing_assets_dir="$(mktemp -d)"
              gh release download "${tag}" --dir "${existing_assets_dir}"
              for asset in "${assets[@]}"; do
                cmp -- \
                  "${asset}" \
                  "${existing_assets_dir}/$(basename -- "${asset}")"
              done
              exit 0
            fi
          else
            if ! grep -Eqi 'release not found|HTTP 404|Not Found' "${release_error}"; then
              echo 'GitHub Release inspection failed without an authoritative not-found response' >&2
              sed -E 's#(https?://)[^/@[:space:]]+@#\1[REDACTED]@#g' "${release_error}" >&2
              exit 1
            fi
            rm -f "${release_error}"
            release_flags=()
            if [[ "${PRERELEASE}" == 'true' ]]; then release_flags+=(--prerelease); fi
            gh release create \
              "${tag}" \
              --verify-tag \
              --draft \
              --title "${title}" \
              --notes-file "${body}" \
              "${release_flags[@]}"
          fi

          gh release upload "${tag}" "${assets[@]}" --clobber
          release_json="$(gh release view "${tag}" --json isDraft,assets)"
          test "$(jq -r '.isDraft' <<< "${release_json}")" = 'true'
          actual_names="$(jq -c '[.assets[].name] | sort' <<< "${release_json}")"
          test "${actual_names}" = "${expected_names}"
          gh release edit \
            "${tag}" \
            --title "${title}" \
            --notes-file "${body}" \
            --draft=false \
            --prerelease="${PRERELEASE}" \
            --latest=false

      - name: Update the mutable stable v6 image alias last
        if: steps.version.outputs.prerelease == 'false'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_repository="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create \
            --tag "${image_repository}:latest" \
            "${image_repository}@${IMAGE_DIGEST}"
          latest_manifest="$(
            docker buildx imagetools inspect "${image_repository}:latest" \
              --format '{{json .Manifest}}'
          )"
          test "$(jq -er '.digest' <<< "${latest_manifest}")" = "${IMAGE_DIGEST}"
