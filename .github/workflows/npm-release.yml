name: Official npm Release
run-name: Official npm stable promotion ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reconciled vX.Y.Z version to promote from its Root tag
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read
  pull-requests: read

concurrency:
  group: official-npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: publish-existing-admin-web-tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: npm-auto
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Require authorized release operator
        env:
          RELEASE_ACTOR_LOGIN: lwnmengjing
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" || "${GITHUB_TRIGGERING_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" ]]; then
            echo "release operations must be initiated and triggered by ${RELEASE_ACTOR_LOGIN}" >&2
            exit 1
          fi

      - name: Validate exact root tag identity
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != 'workflow_dispatch' || "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo 'official npm stable promotion must be dispatched from the exact Root tag' >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'root tag must be an exact stable vX.Y.Z value' >&2
            exit 1
          fi
          if [[ "${REQUESTED_VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo 'requested stable promotion version must equal the selected Root tag' >&2
            exit 1
          fi
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'workflow provenance must be one full lowercase Git SHA' >&2
            exit 1
          fi
          {
            echo "RELEASE_VERSION=${GITHUB_REF_NAME}"
            echo "RELEASE_COMMIT=${GITHUB_SHA}"
            echo "UNPREFIXED_VERSION=${GITHUB_REF_NAME#v}"
          } >> "${GITHUB_ENV}"
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify merged-main release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          python3 tools/release/verify_release_source.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${RELEASE_COMMIT}" \
            --tag "${RELEASE_VERSION}" \
            --source-mode promotion \
            --policy .mss/release-policy.yaml
          python3 tools/release/check_release_policy.py \
            --policy .mss/release-policy.yaml \
            --component frontend \
            --version "${RELEASE_VERSION}" \
            --tag "web/antd-v6/${RELEASE_VERSION}" \
            --intent publish

      - name: Require reviewed stable promotion and complete candidate ledger
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_main="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          [[ "${remote_main}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "+${remote_main}:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "${remote_main}"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" origin/main

          promotion_policy="${RUNNER_TEMP}/stable-promotion-policy.yaml"
          git show origin/main:.mss/release-policy.yaml > "${promotion_policy}"
          python3 tools/release/check_release_policy.py \
            --policy "${promotion_policy}" \
            --component npm \
            --version "${RELEASE_VERSION}" \
            --tag "@mss-boot-io/admin-web@${UNPREFIXED_VERSION}" \
            --intent promote \
            --commit "${RELEASE_COMMIT}"
          python3 tools/release/check_release_policy.py \
            --policy "${promotion_policy}" \
            --component root \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_VERSION}" \
            --intent promote \
            --commit "${RELEASE_COMMIT}"

          current_stable="$(
            python3 - "${promotion_policy}" <<'PY'
          from pathlib import Path
          import sys
          from tools.release.check_release_policy import load_policy
          print(load_policy(Path(sys.argv[1]))["currentStableVersion"])
          PY
          )"
          [[ "${current_stable}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "${current_stable}" == "${RELEASE_VERSION}" ]]; then
            echo 'stable promotion must precede the final current-stable policy reconciliation' >&2
            exit 1
          fi
          echo "current-stable=${current_stable}" >> "${GITHUB_OUTPUT}"
          echo "CURRENT_STABLE_VERSION=${current_stable}" >> "${GITHUB_ENV}"

          resolve_tag_commit() {
            local tag_name="$1"
            local object_type
            local object_sha
            local tag_object
            local depth=0
            tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}")"
            object_type="$(jq -r '.object.type' <<< "${tag_object}")"
            object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            while [[ "${object_type}" == 'tag' ]]; do
              depth=$((depth + 1))
              test "${depth}" -le 5
              tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "${tag_object}")"
              object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            done
            test "${object_type}" = 'commit'
            [[ "${object_sha}" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "${object_sha}"
          }

          release_tags=(
            "mss-boot/${RELEASE_VERSION}"
            "admin/${RELEASE_VERSION}"
            "web/antd-v6/${RELEASE_VERSION}"
            "${RELEASE_VERSION}"
            "docs/${RELEASE_VERSION}"
          )
          for release_tag in "${release_tags[@]}"; do
            test "$(resolve_tag_commit "${release_tag}")" = "${RELEASE_COMMIT}"
            release_json="$(
              gh release view "${release_tag}" \
                --json tagName,targetCommitish,isDraft,isPrerelease
            )"
            jq -e \
              --arg tag "${release_tag}" \
              --arg commit "${RELEASE_COMMIT}" \
              '.tagName == $tag and .targetCommitish == $commit and
               .isDraft == false and .isPrerelease == false' \
              <<< "${release_json}" >/dev/null
          done

          current_latest="$(
            gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
          )"
          case "${current_latest}" in
            "${current_stable}"|"${RELEASE_VERSION}") ;;
            *)
              echo "GitHub Latest ${current_latest} matches neither reviewed current stable ${current_stable} nor exact promotion target ${RELEASE_VERSION}" >&2
              exit 1
              ;;
          esac
          echo "GITHUB_LATEST_VERSION=${current_latest}" >> "${GITHUB_ENV}"

          docs_identity="${RUNNER_TEMP}/production-docs-release.json"
          curl --fail --location --silent --show-error \
            --output "${docs_identity}" \
            'https://docs.mss-boot-io.top/release.json'
          jq -e \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.application == "mss-boot-docs" and
             .version == $version and .commit == $commit' \
            "${docs_identity}" >/dev/null

      - name: Require the exact frontend release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local tag_name="$1"
            local object_type
            local object_sha
            local tag_object
            local depth=0

            tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}")"
            object_type="$(jq -r '.object.type' <<< "${tag_object}")"
            object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            while [[ "${object_type}" == 'tag' ]]; do
              depth=$((depth + 1))
              if [[ "${depth}" -gt 5 ]]; then
                echo "tag ${tag_name} has too many annotation levels" >&2
                return 1
              fi
              tag_object="$(gh api "/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "${tag_object}")"
              object_sha="$(jq -r '.object.sha' <<< "${tag_object}")"
            done
            if [[ "${object_type}" != 'commit' || ! "${object_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "tag ${tag_name} does not resolve to one commit" >&2
              return 1
            fi
            printf '%s\n' "${object_sha}"
          }

          frontend_tag="web/antd-v6/${RELEASE_VERSION}"
          if ! tag_commit="$(resolve_tag_commit "${frontend_tag}" 2>/dev/null)"; then
            echo "required frontend tag ${frontend_tag} is not available" >&2
            exit 1
          fi
          if [[ "${tag_commit}" != "${RELEASE_COMMIT}" ]]; then
            echo "tag ${frontend_tag} resolves to ${tag_commit}, not ${RELEASE_COMMIT}" >&2
            exit 1
          fi
          if ! frontend_release="$(gh release view "${frontend_tag}" --json tagName,isDraft,isPrerelease 2>/dev/null)"; then
            echo "required frontend release ${frontend_tag} is not public" >&2
            exit 1
          fi
          jq -e \
            --arg tag "${frontend_tag}" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false' \
            <<< "${frontend_release}" >/dev/null || {
              echo "frontend release ${frontend_tag} has conflicting immutable identity" >&2
              exit 1
            }

      - name: Setup Go 1.27 toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: admin/go.mod
          cache: false

      - name: Verify exact public Go modules
        run: |
          set -euo pipefail
          for module in \
            github.com/mss-boot-io/mss-boot-admin/mss-boot \
            github.com/mss-boot-io/mss-boot-admin/admin; do
            metadata="$(
              GOWORK=off GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
                go list -m -json "${module}@${RELEASE_VERSION}"
            )"
            jq -e \
              --arg module "${module}" \
              --arg version "${RELEASE_VERSION}" \
              '.Path == $module and .Version == $version' \
              <<< "${metadata}" >/dev/null
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log into GHCR for read-only reconciliation
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact Root and Admin Web image aliases
        run: |
          set -euo pipefail
          images=(
            "ghcr.io/${GITHUB_REPOSITORY}"
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/mss-boot-admin-antd-v6"
          )
          for image in "${images[@]}"; do
            safe_name="$(printf '%s' "${image}" | tr '/:' '--')"
            version_manifest="${RUNNER_TEMP}/${safe_name}-version.json"
            commit_manifest="${RUNNER_TEMP}/${safe_name}-commit.json"
            docker buildx imagetools inspect --raw \
              "${image}:${RELEASE_VERSION}" > "${version_manifest}"
            docker buildx imagetools inspect --raw \
              "${image}:${RELEASE_COMMIT}" > "${commit_manifest}"
            cmp -- "${version_manifest}" "${commit_manifest}"
            jq -e '
              ([.manifests[] | select(
                .platform.os == "linux" and .platform.architecture == "amd64"
              )] | length) == 1 and
              ([.manifests[] | select(
                .platform.os == "linux" and .platform.architecture == "arm64"
              )] | length) == 1
            ' "${version_manifest}" >/dev/null
          done

      - name: Download and verify existing frontend package assets
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          frontend_tag="web/antd-v6/${RELEASE_VERSION}"
          package_dir="${RUNNER_TEMP}/official-npm-package"
          mkdir -p "${package_dir}"
          release_json="$(gh release view "${frontend_tag}" --json assets)"
          jq -e '
            ([.assets[].name | select(endswith(".tgz"))] | length) == 1 and
            ([.assets[].name | select(. == "admin-web-package.json")] | length) == 1 and
            ([.assets[].name | select(. == "admin-web.spdx.json")] | length) == 1 and
            ([.assets[].name | select(. == "SHA256SUMS.admin-web")] | length) == 1
          ' <<< "${release_json}" >/dev/null
          gh release download "${frontend_tag}" \
            --dir "${package_dir}" \
            --pattern '*.tgz' \
            --pattern 'admin-web-package.json' \
            --pattern 'admin-web.spdx.json' \
            --pattern 'SHA256SUMS.admin-web'
          mapfile -t tarballs < <(find "${package_dir}" -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"

          expected_names="$(
            printf '%s\n' \
              "$(basename -- "${tarball}")" \
              admin-web-package.json \
              admin-web.spdx.json | sort
          )"
          actual_names="$(
            awk 'NF == 2 { name=$2; sub(/^\*/, "", name); print name }' \
              "${package_dir}/SHA256SUMS.admin-web" | sort
          )"
          test "${actual_names}" = "${expected_names}"
          (
            cd "${package_dir}"
            sha256sum --strict --check SHA256SUMS.admin-web
          )

          python3 tools/release/verify_admin_web_package.py \
            --tarball "${tarball}" \
            --expected-name '@mss-boot-io/admin-web' \
            --expected-version "${UNPREFIXED_VERSION}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-commit "${RELEASE_COMMIT}" \
            --output "${package_dir}/qualified-admin-web-package.json"
          cmp -- \
            "${package_dir}/qualified-admin-web-package.json" \
            "${package_dir}/admin-web-package.json"
          jq -e \
            --arg version "${UNPREFIXED_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.spdxVersion == "SPDX-2.3" and
             .packages[0].name == "@mss-boot-io/admin-web" and
             .packages[0].versionInfo == $version and
             (.documentComment | contains($commit))' \
            "${package_dir}/admin-web.spdx.json" >/dev/null
          {
            echo "tarball=${tarball}"
            echo "evidence=${package_dir}/admin-web-package.json"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install a trusted-publishing capable npm CLI
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.0
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              process.exit(1);
            }
          ' "${npm_version}"

      - name: Verify GitHub Packages has the identical package
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          PACKAGE_EVIDENCE: ${{ steps.package.outputs.evidence }}
        run: |
          set -euo pipefail
          package='@mss-boot-io/admin-web'
          npmrc="${RUNNER_TEMP}/github-packages.npmrc"
          github_tarball="${RUNNER_TEMP}/github-packages-admin-web.tgz"
          printf '%s\n' \
            '@mss-boot-io:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "${npmrc}"
          chmod 600 "${npmrc}"
          metadata="$(
            NPM_CONFIG_USERCONFIG="${npmrc}" npm view \
              "${package}@${UNPREFIXED_VERSION}" \
              version gitHead dist.integrity dist.tarball --json \
              --registry=https://npm.pkg.github.com
          )"
          expected_integrity="$(jq -er '.artifact.integrity' "${PACKAGE_EVIDENCE}")"
          jq -e \
            --arg version "${UNPREFIXED_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            --arg integrity "${expected_integrity}" \
            '.version == $version and .gitHead == $commit and
             ."dist.integrity" == $integrity and
             (."dist.tarball" | type == "string" and length > 0)' \
            <<< "${metadata}" >/dev/null
          mirror_dist_tag="$(printf '%s' "release-${UNPREFIXED_VERSION}" | tr '[:upper:].' '[:lower:]-')"
          tagged_version="$(
            NPM_CONFIG_USERCONFIG="${npmrc}" npm view \
              "${package}" "dist-tags.${mirror_dist_tag}" --json \
              --registry=https://npm.pkg.github.com | jq -er '.'
          )"
          test "${tagged_version}" = "${UNPREFIXED_VERSION}"
          github_tarball_url="$(jq -er '."dist.tarball"' <<< "${metadata}")"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            --output "${github_tarball}" \
            "${github_tarball_url}"
          cmp -- "${PACKAGE_TARBALL}" "${github_tarball}"
          package_record="$(
            gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/npm/admin-web"
          )"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            '.name == "admin-web" and .package_type == "npm" and
             .repository.full_name == $repository' \
            <<< "${package_record}" >/dev/null
          rm -f "${npmrc}"

      - name: Require current stable npm alias before promotion
        id: npm-tag
        run: |
          set -euo pipefail
          package='@mss-boot-io/admin-web'
          selected_tag=latest
          expected_latest="${UNPREFIXED_VERSION}"
          error_file="${RUNNER_TEMP}/npmjs-latest-error.log"
          if ! current_latest="$(
            npm view "${package}" dist-tags.latest --json \
              --registry=https://registry.npmjs.org \
              2> "${error_file}" | jq -er '.'
          )"; then
            if ! grep -Eqi 'E404|404 Not Found' "${error_file}"; then
              echo 'npmjs latest lookup failed without an authoritative E404' >&2
              exit 1
            fi
            echo 'official npm package must already have the reviewed current-stable alias' >&2
            exit 1
          fi
          rm -f "${error_file}"
          reviewed_latest="${CURRENT_STABLE_VERSION#v}"
          case "${GITHUB_LATEST_VERSION}:${current_latest}" in
            "${CURRENT_STABLE_VERSION}:${reviewed_latest}"|\
            "${CURRENT_STABLE_VERSION}:${UNPREFIXED_VERSION}"|\
            "${RELEASE_VERSION}:${UNPREFIXED_VERSION}") ;;
            "${RELEASE_VERSION}:${reviewed_latest}")
              echo 'GitHub Latest cannot advance before npmjs latest' >&2
              exit 1
              ;;
            *)
              echo "unsupported stable alias state: GitHub=${GITHUB_LATEST_VERSION}, npm=${current_latest}" >&2
              exit 1
              ;;
          esac
          {
            echo "dist-tag=${selected_tag}"
            echo "expected-latest=${expected_latest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Reconcile immutable npmjs publication state
        id: npmjs
        env:
          PACKAGE_EVIDENCE: ${{ steps.package.outputs.evidence }}
        run: |
          set -euo pipefail
          package='@mss-boot-io/admin-web'
          error_file="${RUNNER_TEMP}/npmjs-view-error.log"
          expected_integrity="$(jq -er '.artifact.integrity' "${PACKAGE_EVIDENCE}")"
          if metadata="$(
            npm view "${package}@${UNPREFIXED_VERSION}" \
              version gitHead dist.integrity --json \
              --registry=https://registry.npmjs.org \
              2> "${error_file}"
          )"; then
            rm -f "${error_file}"
            jq -e \
              --arg version "${UNPREFIXED_VERSION}" \
              --arg commit "${RELEASE_COMMIT}" \
              --arg integrity "${expected_integrity}" \
              '.version == $version and .gitHead == $commit and
               ."dist.integrity" == $integrity' \
              <<< "${metadata}" >/dev/null
            {
              echo 'publish=false'
              echo 'package_absent=false'
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! grep -Eqi 'E404|404 Not Found' "${error_file}"; then
            echo 'npmjs availability check failed without an authoritative E404' >&2
            exit 1
          fi
          rm -f "${error_file}"

          package_error_file="${RUNNER_TEMP}/npmjs-package-view-error.log"
          package_absent=false
          if npm view "${package}@*" name --json \
              --registry=https://registry.npmjs.org \
              2> "${package_error_file}" | jq -e --arg package "${package}" '
                if type == "string" then . == $package
                elif type == "array" then length > 0 and all(.[]; . == $package)
                else false
                end
              ' >/dev/null; then
            rm -f "${package_error_file}"
          else
            if ! grep -Eqi 'E404|404 Not Found' "${package_error_file}"; then
              echo 'npmjs package existence check failed without an authoritative E404' >&2
              exit 1
            fi
            rm -f "${package_error_file}"
            package_absent=true
          fi
          {
            echo 'publish=true'
            echo "package_absent=${package_absent}"
          } >> "${GITHUB_OUTPUT}"

      - name: Publish the existing tarball to official npm
        if: steps.npmjs.outputs.publish == 'true'
        env:
          PACKAGE_ABSENT: ${{ steps.npmjs.outputs.package_absent }}
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_DIST_TAG: ${{ steps.npm-tag.outputs.dist-tag }}
        run: |
          set -euo pipefail
          case "${PACKAGE_ABSENT}" in
            true|false) ;;
            *) echo 'npmjs package existence was not authoritatively classified' >&2; exit 1 ;;
          esac
          case "${NPM_DIST_TAG}" in
            latest) ;;
            *) echo "unsupported npm dist-tag: ${NPM_DIST_TAG}" >&2; exit 1 ;;
          esac
          if [[ "${PACKAGE_ABSENT}" == 'true' ]]; then
            echo 'the first npmjs package creation requires a separately reviewed one-time bootstrap; the automatic tag workflow is trusted-publishing only' >&2
            exit 1
          fi
          unset NPM_TOKEN NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish "${PACKAGE_TARBALL}" \
            --access public \
            --tag "${NPM_DIST_TAG}" \
            --provenance \
            --registry=https://registry.npmjs.org

      - name: Verify npmjs integrity provenance and immutable identity
        env:
          PACKAGE_TARBALL: ${{ steps.package.outputs.tarball }}
          PACKAGE_EVIDENCE: ${{ steps.package.outputs.evidence }}
          EXPECTED_LATEST: ${{ steps.npm-tag.outputs.expected-latest }}
        run: |
          set -euo pipefail
          package='@mss-boot-io/admin-web'
          expected_integrity="$(jq -er '.artifact.integrity' "${PACKAGE_EVIDENCE}")"
          published_tarball="${RUNNER_TEMP}/npmjs-published-admin-web.tgz"
          metadata=''
          converged=false
          for attempt in $(seq 1 24); do
            echo "npmjs verification attempt ${attempt}/24"
            if metadata="$(
              npm view "${package}@${UNPREFIXED_VERSION}" \
                version gitHead dist.integrity dist.tarball dist.attestations --json \
                --registry=https://registry.npmjs.org 2>/dev/null
            )"; then
              if ! jq -e \
                --arg version "${UNPREFIXED_VERSION}" \
                --arg commit "${RELEASE_COMMIT}" \
                --arg integrity "${expected_integrity}" \
                '.version == $version and .gitHead == $commit and
                 ."dist.integrity" == $integrity and
                 ."dist.attestations".provenance.predicateType ==
                   "https://slsa.dev/provenance/v1" and
                 (."dist.attestations".url | type == "string" and length > 0) and
                 (."dist.tarball" | type == "string" and length > 0)' \
                <<< "${metadata}" >/dev/null; then
                echo 'npmjs returned immutable package metadata that does not match the release asset' >&2
                exit 1
              fi
              latest="$(
                npm view "${package}" dist-tags.latest --json \
                  --registry=https://registry.npmjs.org 2>/dev/null | jq -er '.'
              )" || latest=''
              if [[ "${latest}" == "${EXPECTED_LATEST}" ]]; then
                tarball_url="$(jq -er '."dist.tarball"' <<< "${metadata}")"
                if curl --fail --location --silent --show-error \
                  --output "${published_tarball}" \
                  "${tarball_url}" && \
                  cmp -- "${PACKAGE_TARBALL}" "${published_tarball}"; then
                  converged=true
                  break
                fi
              fi
            fi
            if [[ "${attempt}" == '24' ]]; then
              break
            fi
            sleep 5
          done
          if [[ "${converged}" != 'true' ]]; then
            echo 'npmjs package identity did not converge after bounded verification' >&2
            exit 1
          fi

  promote-github:
    name: promote-github-root-latest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-auto
    permissions:
      actions: read
      contents: write
    steps:
      - name: Require authorized release operator
        env:
          RELEASE_ACTOR_LOGIN: lwnmengjing
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" || "${GITHUB_TRIGGERING_ACTOR}" != "${RELEASE_ACTOR_LOGIN}" ]]; then
            echo "release operations must be initiated and triggered by ${RELEASE_ACTOR_LOGIN}" >&2
            exit 1
          fi

      - name: Validate exact completed npm promotion
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != 'workflow_dispatch' || "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo 'GitHub stable alias promotion must run from the exact Root tag' >&2
            exit 1
          fi
          test "${GITHUB_REF_NAME}" = "${RELEASE_VERSION}"
          test "${GITHUB_SHA}" = "${RELEASE_COMMIT}"
          package='@mss-boot-io/admin-web'
          unprefixed_version="${RELEASE_VERSION#v}"
          metadata="$(
            npm view "${package}@${unprefixed_version}" \
              version gitHead dist.integrity dist.attestations --json \
              --registry=https://registry.npmjs.org
          )"
          jq -e \
            --arg version "${unprefixed_version}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.version == $version and .gitHead == $commit and
             (."dist.integrity" | type == "string" and length > 0) and
             ."dist.attestations".provenance.predicateType ==
               "https://slsa.dev/provenance/v1"' \
            <<< "${metadata}" >/dev/null
          test "$(
            npm view "${package}" dist-tags.latest --json \
              --registry=https://registry.npmjs.org | jq -er '.'
          )" = "${unprefixed_version}"

      - name: Promote exact Root release to GitHub Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          release_json="$(
            gh release view "${RELEASE_VERSION}" \
              --json tagName,targetCommitish,isDraft,isPrerelease
          )"
          jq -e \
            --arg tag "${RELEASE_VERSION}" \
            --arg commit "${RELEASE_COMMIT}" \
            '.tagName == $tag and .targetCommitish == $commit and
             .isDraft == false and .isPrerelease == false' \
            <<< "${release_json}" >/dev/null
          gh release edit "${RELEASE_VERSION}" --latest=true
          test "$(
            gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name
          )" = "${RELEASE_VERSION}"
