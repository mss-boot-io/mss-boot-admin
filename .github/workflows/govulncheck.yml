name: govulncheck

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govulncheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root application
        run: govulncheck ./...

  nested-modules:
    name: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - mss-boot
          - cmd/tools/pr
          - compose/consul
          - compose/kafka
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan nested module
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: govulncheck ./...

  required-status:
    # Keep this exact job name for the existing main-branch required check.
    # It aggregates every module scan, so the compatibility context is not a bypass.
    name: govulncheck
    needs:
      - root
      - nested-modules
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every vulnerability scan to pass
        env:
          ROOT_RESULT: ${{ needs.root.result }}
          NESTED_RESULT: ${{ needs.nested-modules.result }}
        run: |
          echo "root=${ROOT_RESULT}"
          echo "nested-modules=${NESTED_RESULT}"
          test "${ROOT_RESULT}" = "success"
          test "${NESTED_RESULT}" = "success"
