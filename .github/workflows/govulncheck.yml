name: govulncheck

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    name: Root application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan root application
        run: govulncheck ./...

  nested-modules:
    name: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - mss-boot
          - cmd/tools/pr
          - compose/consul
          - compose/kafka
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan nested module
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: govulncheck ./...
