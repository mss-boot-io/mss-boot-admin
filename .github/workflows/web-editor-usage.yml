name: One-shot web source usage inventory

on:
  push:
    branches:
      - refactor/split-admin-module-and-coverage-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inventory legacy dependency usage
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/web-source-usage"
          {
            echo '# braft-editor and immutable imports'
            grep -R --line-number --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
              -E "braft-editor|from ['\"]immutable['\"]|require\(['\"]immutable['\"]\)" web/antd \
              --exclude-dir=node_modules --exclude-dir=dist --exclude='pnpm-lock.yaml' || true
            echo
            echo '# Rich text component imports and JSX use'
            grep -R --line-number --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
              -E "MssBoot/Editor|RichTextEditor|<Editor|EditorState|toHTML\(|toRAW\(" web/antd \
              --exclude-dir=node_modules --exclude-dir=dist || true
            echo
            echo '# Express imports'
            grep -R --line-number --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
              -E "from ['\"]express['\"]|require\(['\"]express['\"]\)" web/antd \
              --exclude-dir=node_modules --exclude-dir=dist || true
          } | tee "${RUNNER_TEMP}/web-source-usage/usage.txt"

      - name: Upload usage inventory
        uses: actions/upload-artifact@v7
        with:
          name: web-source-usage
          path: ${{ runner.temp }}/web-source-usage/usage.txt
          if-no-files-found: error
          retention-days: 3
