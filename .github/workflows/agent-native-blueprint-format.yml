name: One-time Blueprint Formatting and Validation

on:
  push:
    branches:
      - codex/agent-native-foundation
    paths:
      - '.github/workflows/agent-native-blueprint-format.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-native-blueprint-format
  cancel-in-progress: false

jobs:
  format-commit-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: codex/agent-native-foundation
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply upgrade safety refinements
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("internal/mss/blueprint/upgrade.go")
          text = path.read_text(encoding="utf-8")

          old_identity = '''\toptions.Application = normalizeApplication(options.Application)
          \tif options.Application.Name == "" {
          \t\toptions.Application.Name = oldManifest.Metadata.Project
          \t}
          \tif options.Application.Module == "" {
          \t\toptions.Application.Module = oldManifest.Metadata.Module
          \t}
          \tif options.Application.Repository == "" {
          \t\toptions.Application.Repository = oldManifest.Metadata.Repository
          \t}
          \toptions.Application = normalizeApplication(options.Application)
          '''
          new_identity = '''\tif options.Application.Name == "" {
          \t\toptions.Application.Name = oldManifest.Metadata.Project
          \t}
          \tif options.Application.Module == "" {
          \t\toptions.Application.Module = oldManifest.Metadata.Module
          \t}
          \tif options.Application.Repository == "" {
          \t\toptions.Application.Repository = oldManifest.Metadata.Repository
          \t}
          \toptions.Application = normalizeApplication(options.Application)
          '''
          if old_identity not in text:
              raise SystemExit("expected application identity block was not found")
          text = text.replace(old_identity, new_identity, 1)

          pattern = re.compile(
              r"func applyUpgrade\(root string, plan UpgradePlan, desired map\[string\]desiredFile\) error \{.*?\n\}\n\n// JSON returns stable indented JSON\.",
              re.S,
          )
          replacement = r'''func applyUpgrade(root string, plan UpgradePlan, desired map[string]desiredFile) error {
          	var manifestChange *UpgradeChange
          	for index := range plan.Changes {
          		change := plan.Changes[index]
          		if strings.HasSuffix(change.Path, "blueprint-manifest.json") &&
          			(change.Action == ActionCreate || change.Action == ActionUpdate) {
          			copy := change
          			manifestChange = &copy
          			continue
          		}
          		if err := applyUpgradeChange(root, change, desired); err != nil {
          			return err
          		}
          	}
          	// The new baseline is committed only after every managed file operation
          	// succeeds. A partial write can therefore never claim a completed upgrade.
          	if manifestChange != nil {
          		if err := applyUpgradeChange(root, *manifestChange, desired); err != nil {
          			return err
          		}
          	}
          	return nil
          }

          func applyUpgradeChange(root string, change UpgradeChange, desired map[string]desiredFile) error {
          	switch change.Action {
          	case ActionCreate, ActionUpdate:
          		file, exists := desired[change.Path]
          		if !exists {
          			return fmt.Errorf("upgrade plan requires missing desired file %s", change.Path)
          		}
          		target := filepath.Join(root, filepath.FromSlash(change.Path))
          		if err := os.MkdirAll(filepath.Dir(target), 0o755); err != nil {
          			return fmt.Errorf("create upgrade parent for %s: %w", change.Path, err)
          		}
          		if err := writeAtomic(target, file.Data, file.Mode); err != nil {
          			return fmt.Errorf("write upgraded file %s: %w", change.Path, err)
          		}
          	case ActionDelete:
          		target := filepath.Join(root, filepath.FromSlash(change.Path))
          		if err := os.Remove(target); err != nil && !errors.Is(err, os.ErrNotExist) {
          			return fmt.Errorf("delete obsolete managed file %s: %w", change.Path, err)
          		}
          		removeEmptyParents(root, filepath.Dir(target))
          	case ActionUnchanged, ActionPreserve:
          		return nil
          	case ActionConflict:
          		return errors.New("refusing to apply an upgrade plan containing conflicts")
          	default:
          		return fmt.Errorf("unsupported upgrade action %q", change.Action)
          	}
          	return nil
          }

          // JSON returns stable indented JSON.'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("expected applyUpgrade function was not found")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and commit before validation
        run: |
          set -euo pipefail
          gofmt -w \
            cmd/mss \
            cmd/mss-mcp \
            internal/mss \
            modules/runtime \
            modules/all \
            main.go \
            cmd/migrate/migrate.go
          rm -f .github/workflows/agent-native-blueprint-format.yml
          git add -A
          git diff --cached --check
          git commit -m "style: format and harden Blueprint infrastructure"
          git push origin HEAD:codex/agent-native-foundation

      - name: Test Blueprint and upgrade packages after commit
        run: go test ./internal/mss/blueprint ./internal/mss/app ./internal/mss/eval ./internal/mss/mcp

      - name: Dry-run a complete downstream application
        run: |
          go run ./cmd/mss new app ci-admin \
            --module github.com/example/ci-admin \
            --repository example/ci-admin \
            --format json > /tmp/mss-new-app-plan.json

      - name: Write and compile a generated downstream application
        run: |
          rm -rf /tmp/mss-ci-admin
          go run ./cmd/mss new app ci-admin \
            --module github.com/example/ci-admin \
            --repository example/ci-admin \
            --destination /tmp/mss-ci-admin \
            --write \
            --format json > /tmp/mss-new-app-write.json
          go run ./cmd/mss --root /tmp/mss-ci-admin context --format json > /tmp/mss-downstream-context.json
          (
            cd /tmp/mss-ci-admin
            go test ./internal/mss/... ./cmd/mss/... ./cmd/mss-mcp/...
          )

      - name: Upload Blueprint validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-native-blueprint-validation
          path: |
            /tmp/mss-new-app-plan.json
            /tmp/mss-new-app-write.json
            /tmp/mss-downstream-context.json
          if-no-files-found: warn
          retention-days: 7
