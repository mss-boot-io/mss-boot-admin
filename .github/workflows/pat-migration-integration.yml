name: Credential Migration Integration

on:
  push:
    branches:
      - main
    paths:
      - 'admin/cmd/migrate/migration/system/*user_auth_token_hash*'
      - 'admin/cmd/migrate/migration/system/*oauth_local_password_disable*'
      - 'admin/cmd/migrate/migration/system/*oauth_identity_key*'
      - 'admin/models/user_auth_token.go'
      - 'admin/models/user.go'
      - 'admin/models/user_oauth2.go'
      - 'admin/go.mod'
      - 'admin/go.sum'
      - 'mss-boot/pkg/config/gormdb/**'
      - '.github/workflows/pat-migration-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'admin/cmd/migrate/migration/system/*user_auth_token_hash*'
      - 'admin/cmd/migrate/migration/system/*oauth_local_password_disable*'
      - 'admin/cmd/migrate/migration/system/*oauth_identity_key*'
      - 'admin/models/user_auth_token.go'
      - 'admin/models/user.go'
      - 'admin/models/user_oauth2.go'
      - 'admin/go.mod'
      - 'admin/go.sum'
      - 'mss-boot/pkg/config/gormdb/**'
      - '.github/workflows/pat-migration-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-migration-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  migration:
    name: mysql-8.4-and-postgres-17
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql-root-ci-only
          MYSQL_DATABASE: mss_pat_test
          MYSQL_USER: mss_pat
          MYSQL_PASSWORD: mss_pat_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=mss_pat --password=mss_pat_ci --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mss_pat_test
          POSTGRES_USER: mss_pat
          POSTGRES_PASSWORD: mss_pat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=mss_pat --dbname=mss_pat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: admin/go.mod
          cache: true
          cache-dependency-path: |
            admin/go.sum
            mss-boot/go.sum

      - name: Verify credential migrations against MySQL and PostgreSQL
        working-directory: admin
        env:
          GOWORK: 'off'
          MSS_PAT_TEST_MYSQL_DSN: 'mss_pat:mss_pat_ci@tcp(127.0.0.1:3306)/mss_pat_test?charset=utf8mb4&parseTime=true&loc=UTC&multiStatements=false'
          MSS_PAT_TEST_POSTGRES_DSN: 'postgres://mss_pat:mss_pat_ci@127.0.0.1:5432/mss_pat_test?sslmode=disable&TimeZone=UTC'
        run: >-
          go test -count=1 -timeout=12m
          -run '^(TestUserAuthTokenHashMigration(MySQL|Postgres)Integration|TestOAuthLocalPasswordDisableMigration(MySQL|Postgres)Integration|TestOAuthIdentityKeyMigration(MySQL|Postgres)Integration)$'
          ./cmd/migrate/migration/system
