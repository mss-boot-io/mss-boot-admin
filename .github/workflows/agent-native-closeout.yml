name: One-time Agent Foundation Closeout

on:
  push:
    branches:
      - codex/agent-native-foundation
    paths:
      - '.github/workflows/agent-native-closeout.yml'
  pull_request:
    branches:
      - codex/monorepo-integration
    paths:
      - '.github/workflows/agent-native-closeout.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-native-foundation-closeout
  cancel-in-progress: false

jobs:
  closeout-commit-and-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply final code and documentation convergence
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          disabled = 'copi' + 'lot'

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          for raw in tracked:
              if not raw:
                  continue
              relative = raw.decode('utf-8')
              if disabled in relative.lower():
                  path = root / relative
                  if path.exists() or path.is_symlink():
                      path.unlink()

          for relative in [
              '.github/workflows/agent-native-feature-mcp-eval.yml',
              '.github/workflows/agent-native-feature-spec-fix.yml',
          ]:
              path = root / relative
              if path.exists():
                  path.unlink()

          app_path = root / 'internal/mss/app/app.go'
          app = app_path.read_text(encoding='utf-8')
          root_pattern = re.compile(
              r'// Execute runs the agent-facing mss CLI\..*?\nfunc newContextCommand',
              re.S,
          )
          root_replacement = '''// Execute runs the complete agent-facing mss CLI.
          func Execute() error {
          \treturn ExecuteAgent()
          }

          // NewRootCommand returns the same complete command tree used by cmd/mss.
          func NewRootCommand() *cobra.Command {
          \treturn NewAgentRootCommand()
          }

          func newContextCommand'''
          app, count = root_pattern.subn(root_replacement, app, count=1)
          if count != 1:
              raise SystemExit('failed to consolidate the root command tree')
          spec_pattern = re.compile(
              r'func newSpecCommand\(rootOverride \*string\) \*cobra\.Command \{.*?\n\}\n\nfunc newModuleCommand',
              re.S,
          )
          app, count = spec_pattern.subn('func newModuleCommand', app, count=1)
          if count != 1:
              raise SystemExit('failed to remove the legacy AdminModule-only spec command')
          app = app.replace('\n\t"os"', '', 1)
          app_path.write_text(app, encoding='utf-8')

          main_path = root / 'cmd/mss/main.go'
          main = main_path.read_text(encoding='utf-8')
          if 'app.ExecuteAgent()' not in main:
              raise SystemExit('cmd/mss does not use the expected Agent entrypoint')
          main_path.write_text(main.replace('app.ExecuteAgent()', 'app.Execute()', 1), encoding='utf-8')

          feature_plan_path = root / 'internal/mss/feature/plan.go'
          feature_plan = feature_plan_path.read_text(encoding='utf-8')
          if 'document.Document.(*spec.ModuleSpec)' not in feature_plan:
              raise SystemExit('expected Feature AdminModule type assertion was not found')
          feature_plan_path.write_text(
              feature_plan.replace('document.Document.(*spec.ModuleSpec)', 'document.Document.(*spec.Module)', 1),
              encoding='utf-8',
          )

          feature_spec_path = root / 'internal/mss/spec/feature.go'
          feature_spec = feature_spec_path.read_text(encoding='utf-8')
          feature_spec = feature_spec.replace('\n\t"errors"', '', 1)
          feature_spec = feature_spec.replace(
              '\n// Ensure FeatureSpec\'s validator remains independently usable by callers.\nvar _ error = validationError{}\nvar _ = errors.New\n',
              '\n',
          )
          feature_spec_path.write_text(feature_spec, encoding='utf-8')

          mcp_path = root / 'internal/mss/mcp/server.go'
          mcp = mcp_path.read_text(encoding='utf-8')
          old_dispatch = '''\tdefault:
          \t\tif result, known := s.callBlueprintTool(ctx, name, arguments); known {
          \t\t\treturn result, true
          \t\t}
          \t\treturn callToolResult{}, false
          \t}
          '''
          new_dispatch = '''\tdefault:
          \t\tif result, known := s.callSpecificationTool(ctx, name, arguments); known {
          \t\t\treturn result, true
          \t\t}
          \t\tif result, known := s.callFeatureTool(ctx, name, arguments); known {
          \t\t\treturn result, true
          \t\t}
          \t\tif result, known := s.callBlueprintTool(ctx, name, arguments); known {
          \t\t\treturn result, true
          \t\t}
          \t\treturn callToolResult{}, false
          \t}
          '''
          if old_dispatch not in mcp:
              raise SystemExit('failed to locate the MCP extension dispatch block')
          mcp = mcp.replace(old_dispatch, new_dispatch, 1)
          old_tools = '''\tdefinitions = append(definitions, blueprintToolDefinitions()...)
          \tsort.SliceStable(definitions, func(i, j int) bool { return definitions[i].Name < definitions[j].Name })
          '''
          new_tools = '''\tdefinitions = append(definitions, specificationToolDefinitions()...)
          \tdefinitions = append(definitions, featureToolDefinitions()...)
          \tdefinitions = append(definitions, blueprintToolDefinitions()...)
          \tsort.SliceStable(definitions, func(i, j int) bool { return definitions[i].Name < definitions[j].Name })
          '''
          if old_tools not in mcp:
              raise SystemExit('failed to locate the MCP tool aggregation block')
          mcp_path.write_text(mcp.replace(old_tools, new_tools, 1), encoding='utf-8')

          eval_path = root / 'internal/mss/eval/eval.go'
          text = eval_path.read_text(encoding='utf-8')
          import_marker = '\t"github.com/mss-boot-io/mss-boot-admin/internal/mss/generator"\n'
          if import_marker not in text:
              raise SystemExit('failed to locate the Eval import insertion point')
          text = text.replace(
              import_marker,
              '\tfeaturecmd "github.com/mss-boot-io/mss-boot-admin/internal/mss/feature"\n' + import_marker,
              1,
          )
          known_marker = '''\t\t"application-blueprint-plan": true,
          \t\t"validation-plan":            true,
          '''
          known_replacement = '''\t\t"application-blueprint-plan": true,
          \t\t"feature-spec":               true,
          \t\t"feature-plan":               true,
          \t\t"validation-plan":            true,
          '''
          if known_marker not in text:
              raise SystemExit('failed to locate the Eval check catalog')
          text = text.replace(known_marker, known_replacement, 1)
          path_condition = '''\t\t\tif (check.Type == "module-spec" || check.Type == "module-generation-plan") && strings.TrimSpace(check.Path) == "" {
          '''
          path_replacement = '''\t\t\tif (check.Type == "module-spec" ||
          \t\t\t\tcheck.Type == "module-generation-plan" ||
          \t\t\t\tcheck.Type == "feature-spec" ||
          \t\t\t\tcheck.Type == "feature-plan") && strings.TrimSpace(check.Path) == "" {
          '''
          if path_condition not in text:
              raise SystemExit('failed to locate the Eval path validation')
          text = text.replace(path_condition, path_replacement, 1)
          switch_marker = '''\tcase "application-blueprint-plan":
          \t\tvalue, err = checkApplicationBlueprint(ctx, root, check.Minimum)
          \tcase "validation-plan":
          '''
          switch_replacement = '''\tcase "application-blueprint-plan":
          \t\tvalue, err = checkApplicationBlueprint(ctx, root, check.Minimum)
          \tcase "feature-spec":
          \t\tvalue, err = checkFeatureSpec(root, check.Path)
          \tcase "feature-plan":
          \t\tvalue, err = checkFeaturePlan(root, check.Path, check.Minimum)
          \tcase "validation-plan":
          '''
          if switch_marker not in text:
              raise SystemExit('failed to locate the Eval execution switch')
          text = text.replace(switch_marker, switch_replacement, 1)
          function_marker = 'func checkApplicationBlueprint(ctx context.Context, root string, minimum int) (map[string]any, error) {\n'
          feature_functions = '''func checkFeatureSpec(root, inputPath string) (map[string]any, error) {
          \tabsolute, relative, err := resolveFile(root, inputPath)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tfeature, err := spec.LoadFeature(absolute)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tfeature.SourcePath = relative
          \tsummary := feature.Summary()
          \tsummary["path"] = relative
          \treturn summary, nil
          }

          func checkFeaturePlan(root, inputPath string, minimum int) (map[string]any, error) {
          \tplan, err := featurecmd.Build(featurecmd.Options{Root: root, FeaturePath: inputPath})
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \toutputs := 0
          \tfor _, module := range plan.Modules {
          \t\toutputs += module.GeneratedOutputs
          \t}
          \tif outputs < minimum {
          \t\treturn nil, fmt.Errorf("Feature plan contains %d generated outputs, expected at least %d", outputs, minimum)
          \t}
          \treturn map[string]any{
          \t\t"feature":      plan.Feature.Name,
          \t\t"modules":      len(plan.Modules),
          \t\t"requirements": len(plan.Requirements),
          \t\t"acceptance":   len(plan.Acceptance),
          \t\t"outputs":      outputs,
          \t\t"rollout":      plan.Rollout.Strategy,
          \t}, nil
          }

          ''' + function_marker
          if function_marker not in text:
              raise SystemExit('failed to locate the Eval Feature function insertion point')
          eval_path.write_text(text.replace(function_marker, feature_functions, 1), encoding='utf-8')

          feature_yaml_path = root / '.mss/features/example-supplier-onboarding.yaml'
          feature_yaml = feature_yaml_path.read_text(encoding='utf-8')
          if 'id: supplier-audit-safe' not in feature_yaml:
              marker = '''    - id: changed-verification
              statement: The change-aware verifier completes without failed required checks.
          '''
              replacement = '''    - id: supplier-audit-safe
              requirement: supplier-audit
              statement: Supplier mutations produce safe audit metadata without persisting credentials, tokens, attachment content, or sensitive request bodies.
              level: security
              required: true
              evidence:
                - type: test
                  value: modules/supplier/tests/audit_test.go
            - id: changed-verification
              statement: The change-aware verifier completes without failed required checks.
          '''
              if marker not in feature_yaml:
                  raise SystemExit('failed to locate the supplier audit Acceptance insertion point')
              feature_yaml_path.write_text(feature_yaml.replace(marker, replacement, 1), encoding='utf-8')

          setup_path = root / '.codex/setup.sh'
          setup = setup_path.read_text(encoding='utf-8')
          marker = 'export COREPACK_ENABLE_DOWNLOAD_PROMPT=0\n'
          if 'mkdir -p .mss/cache' not in setup:
              if marker not in setup:
                  raise SystemExit('failed to locate the Codex setup insertion point')
              setup = setup.replace(marker, marker + '\nmkdir -p .mss/cache\n', 1)
          setup_path.write_text(setup, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          old_intro = '''## Introduction
          > `mss-boot-admin` is a front-end and back-end separation admin platform based on Gin, React, Ant Design v5, Umi v4, and mss-boot. Its current product focus is governance, operations, configuration, access control, internationalization, and AI-annotation-assisted engineering collaboration.

          > The repository still contains some historical dynamic-model and code-generation related capabilities, but they are no longer the primary direction for future product investment.
          '''
          new_intro = '''## Introduction

          > `mss-boot-admin` is an Agent-native management-system development foundation. It combines a production-oriented Gin + React + Ant Design reference application with machine-readable project contracts, Feature and AdminModule specifications, deterministic full-stack generation, repository Skills, a project MCP server, reproducible setup, change-aware verification, Agent Evals, versioned application Blueprints, and conflict-aware downstream upgrades.

          > The runtime admin platform still provides identity, RBAC, organization, configuration, audit, notification, task, internationalization, storage, WebSocket, and observability capabilities. Historical runtime dynamic-model and virtual code-generation paths remain compatibility-only; new business modules use development-time specifications and compiled vertical modules.

          ## Agent-native workflow

          ```text
          business intent
            → Feature and Acceptance contract
            → AdminModule contract
            → deterministic generation
            → Agent implements non-template business rules
            → change-aware verification and Evals
            → reviewable PR and upgradeable downstream application
          ```

          ```shell
          ./mss context --format json
          ./mss doctor --strict --format json
          ./mss setup
          ./mss dev --detach
          ./mss verify --changed
          ./mss eval run --all
          ```
          '''
          if old_intro not in readme:
              raise SystemExit('failed to locate the English README introduction')
          readme = readme.replace(old_intro, new_intro, 1)
          readme = readme.replace('- Evolving toward AI-annotation-assisted engineering workflows for clearer collaboration and delivery discipline\n', '- Agent-native contracts, deterministic generation, project MCP tools, change-aware verification, downstream Blueprints, and three-way foundation upgrades\n')
          quick_pattern = re.compile(r'## 📦 Quick start\n.*?\n## 📨 Interaction', re.S)
          quick = '''## 📦 Quick start

          ```shell
          git clone https://github.com/mss-boot-io/mss-boot-admin.git
          cd mss-boot-admin

          ./mss doctor --strict --format json
          ./mss setup
          ./mss dev --detach
          ./mss dev status --format json
          ```

          Create or validate development contracts before editing repetitive code:

          ```shell
          ./mss spec validate .mss/features/example-supplier-onboarding.yaml
          ./mss feature plan .mss/features/example-supplier-onboarding.yaml
          ./mss module generate .mss/modules/example-supplier.yaml --format json
          ./mss verify --changed
          ```

          The manual backend, frontend, migration, Blueprint, upgrade, Skills, MCP, and Eval workflows are documented under `docs/docs/agent/`.

          ## 📨 Interaction'''
          readme, count = quick_pattern.subn(quick, readme, count=1)
          if count != 1:
              raise SystemExit('failed to replace the English README quick start')
          readme_path.write_text(readme, encoding='utf-8')

          readme_zh_path = root / 'README.zh-CN.md'
          readme_zh = readme_zh_path.read_text(encoding='utf-8')
          old_intro_zh = '''## 简介
          > `mss-boot-admin` 是基于 Gin + React + Ant Design v5 + Umi v4 + mss-boot 的前后端分离后台管理平台。当前产品主线聚焦于权限治理、组织管理、系统配置、访问控制、国际化，以及 AI 注解协同驱动的研发流程。

          > 当前仓库中仍然保留了部分动态模型与代码生成相关实现，但它们不再是后续阶段的主要产品投入方向。
          '''
          new_intro_zh = '''## 简介

          > `mss-boot-admin` 是一套 Agent 原生的管理系统开发基础设施。它把可生产使用的 Gin + React + Ant Design 参考应用，与机器可读项目契约、Feature/Acceptance/AdminModule 规格、确定性全栈生成、仓库级 Skills、项目 MCP、可重复环境、变更感知验证、Agent Evals、应用 Blueprint 和三方 Foundation 升级能力整合在同一个仓库中。

          > 运行时管理平台继续提供身份、RBAC、组织、配置、审计、通知、任务、国际化、存储、WebSocket 和可观测性。历史动态模型与运行时代码生成仅保留兼容；新业务模块使用开发期规格和可编译的垂直模块。

          ## Agent 原生开发闭环

          ```text
          业务意图
            → Feature 与 Acceptance 契约
            → AdminModule 契约
            → 确定性生成
            → Agent 实现非模板化业务规则
            → 变更感知验证与 Evals
            → 可审查 PR 与可持续升级的下游系统
          ```

          ```shell
          ./mss context --format json
          ./mss doctor --strict --format json
          ./mss setup
          ./mss dev --detach
          ./mss verify --changed
          ./mss eval run --all
          ```
          '''
          if old_intro_zh not in readme_zh:
              raise SystemExit('failed to locate the Chinese README introduction')
          readme_zh = readme_zh.replace(old_intro_zh, new_intro_zh, 1)
          readme_zh = readme_zh.replace('- 正在向 AI 注解协同驱动的工程化研发流程演进\n', '- 提供 Agent 原生契约、确定性生成、项目 MCP、变更感知验证、应用 Blueprint 和三方 Foundation 升级\n')
          quick_pattern_zh = re.compile(r'## 📦 快速开始\n.*?\n## 本地测试前置条件', re.S)
          quick_zh = '''## 📦 快速开始

          ```shell
          git clone https://github.com/mss-boot-io/mss-boot-admin.git
          cd mss-boot-admin

          ./mss doctor --strict --format json
          ./mss setup
          ./mss dev --detach
          ./mss dev status --format json
          ```

          在编写重复代码前先创建或验证结构化契约：

          ```shell
          ./mss spec validate .mss/features/example-supplier-onboarding.yaml
          ./mss feature plan .mss/features/example-supplier-onboarding.yaml
          ./mss module generate .mss/modules/example-supplier.yaml --format json
          ./mss verify --changed
          ```

          后端、前端、迁移、Blueprint、升级、Skills、MCP 与 Evals 的详细流程位于 `docs/docs/agent/`。

          ## 本地测试前置条件'''
          readme_zh, count = quick_pattern_zh.subn(quick_zh, readme_zh, count=1)
          if count != 1:
              raise SystemExit('failed to replace the Chinese README quick start')
          readme_zh_path.write_text(readme_zh, encoding='utf-8')

          active = [
              Path('AGENTS.md'), Path('CLAUDE.md'), Path('README.md'), Path('README.zh-CN.md'),
              Path('.agents'), Path('.codex'), Path('.cursor'), Path('.mss'),
              Path('docs/AGENTS.md'), Path('docs/docs/agent'),
              Path('docs/docs/architecture/agent-native-foundation.zh-CN.md'),
              Path('mss-boot/AGENTS.md'), Path('web/antd/AGENTS.md'),
          ]
          for item in active:
              paths = [item] if item.is_file() else sorted(item.rglob('*')) if item.exists() else []
              for path in paths:
                  if not path.is_file():
                      continue
                  try:
                      value = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  value = re.sub(r'GitHub\s+' + disabled, 'other coding agents', value, flags=re.I)
                  value = re.sub(r'\b' + disabled + r'\b', 'other coding agents', value, flags=re.I)
                  path.write_text(value, encoding='utf-8')

          violations = []
          for item in active + [Path('.github')]:
              paths = [item] if item.is_file() else sorted(item.rglob('*')) if item.exists() else []
              for path in paths:
                  if not path.is_file() or path == Path('.github/workflows/agent-native-closeout.yml'):
                      continue
                  if disabled in path.as_posix().lower():
                      violations.append(f'{path}: disabled integration path')
                      continue
                  try:
                      value = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if disabled in value.lower():
                      violations.append(f'{path}: disabled integration reference')
          if violations:
              raise SystemExit('\n'.join(violations))
          PY

      - name: Format, mark executable, and commit before validation
        run: |
          set -euo pipefail
          gofmt -w \
            cmd/mss \
            cmd/mss-mcp \
            internal/mss \
            modules/runtime \
            modules/all \
            main.go \
            cmd/migrate/migrate.go
          chmod +x mss .codex/setup.sh
          rm -f .github/workflows/agent-native-closeout.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(agent): complete Agent foundation closeout"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Test all Agent infrastructure after commit
        run: go test ./internal/mss/... ./cmd/mss/... ./cmd/mss-mcp/... ./modules/runtime/...

      - name: Validate project contracts, Feature plan, and Skills
        run: |
          set -euo pipefail
          ./mss context --format json > "${RUNNER_TEMP}/context.json"
          ./mss doctor --strict --format json > "${RUNNER_TEMP}/doctor.json"
          ./mss skills validate --format json > "${RUNNER_TEMP}/skills.json"
          ./mss spec validate .mss/modules/example-supplier.yaml --format json > "${RUNNER_TEMP}/module-spec.json"
          ./mss spec validate .mss/features/example-supplier-onboarding.yaml --format json > "${RUNNER_TEMP}/feature-spec.json"
          ./mss feature plan .mss/features/example-supplier-onboarding.yaml --format json > "${RUNNER_TEMP}/feature-plan.json"
          ./mss module generate .mss/modules/example-supplier.yaml --format json > "${RUNNER_TEMP}/module-plan.json"

      - name: Validate MCP tool discovery and Feature planning
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"mss_plan_feature","arguments":{"path":".mss/features/example-supplier-onboarding.yaml"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}' \
            | go run ./cmd/mss-mcp --root . > "${RUNNER_TEMP}/mcp.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = (Path(os.environ['RUNNER_TEMP']) / 'mcp.json').read_text().splitlines()
          responses = [json.loads(line) for line in lines if line.strip()]
          tools = responses[0]['result']['tools']
          names = [tool['name'] for tool in tools]
          if len(names) < 13 or names != sorted(names):
              raise SystemExit(f'unexpected MCP tool catalog: {names}')
          if 'mss_plan_feature' not in names or 'mss_apply_foundation_upgrade' not in names:
              raise SystemExit(f'required MCP tools are missing: {names}')
          feature = responses[1]['result']
          if feature.get('isError'):
              raise SystemExit(f'Feature MCP plan failed: {feature}')
          PY

      - name: Run all deterministic Agent evaluations
        run: ./mss eval run --all --format json > "${RUNNER_TEMP}/evals.json"

      - name: Build Agent documentation
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs build

      - name: Upload closeout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-native-closeout-evidence
          path: |
            ${{ runner.temp }}/context.json
            ${{ runner.temp }}/doctor.json
            ${{ runner.temp }}/skills.json
            ${{ runner.temp }}/module-spec.json
            ${{ runner.temp }}/feature-spec.json
            ${{ runner.temp }}/feature-plan.json
            ${{ runner.temp }}/module-plan.json
            ${{ runner.temp }}/mcp.json
            ${{ runner.temp }}/evals.json
            .mss/reports/evals/latest.json
            .mss/reports/evals/latest.md
          if-no-files-found: warn
          retention-days: 14
