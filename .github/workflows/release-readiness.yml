name: Release Readiness (Bootstrap)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Feature-frozen public release target
        required: true
        type: string
      frozen_commit:
        description: Full commit SHA selected for concentrated validation
        required: true
        type: string
      feature_freeze_confirmed:
        description: Confirm feature and public contract changes are frozen
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ inputs.version }}-${{ inputs.frozen_commit }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  full-verification:
    name: doctor-verify-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bind readiness to the reviewed target and frozen commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
          FEATURE_FREEZE_CONFIRMED: ${{ inputs.feature_freeze_confirmed }}
        run: |
          set -euo pipefail
          if [[ "${FEATURE_FREEZE_CONFIRMED}" != "true" ]]; then
            echo "release readiness is disabled until feature freeze is confirmed" >&2
            exit 1
          fi
          if [[ ! "${FROZEN_COMMIT}" =~ ^[0-9a-f]{40}$ || "${FROZEN_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "frozen_commit must equal the checked-out full commit ${GITHUB_SHA}" >&2
            exit 1
          fi
          python3 tools/release/check_release_policy.py \
            --component root \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_VERSION}" \
            --intent qualify
          mkdir -p .mss/reports
          policy_sha256="$(sha256sum .mss/release-policy.yaml | awk '{print $1}')"
          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg commit "${FROZEN_COMMIT}" \
            --arg policySha256 "${policy_sha256}" \
            '{version: $version, commit: $commit, phase: "checkpoint", profile: "bootstrap-incomplete", publicationAuthority: false, policySha256: $policySha256}' \
            > .mss/reports/release-readiness-metadata.json

          echo "This bootstrap workflow is not publication authority." >> "${GITHUB_STEP_SUMMARY}"
          echo "It must gain the complete v1.1.0 matrix and phase attestation before publicationWorkflowsReady can become true." >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            web/antd/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web/antd install --frozen-lockfile

      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Test release dependency policy helper
        run: node --test tools/security/check-pnpm-audit.test.mjs

      - name: Verify frontend release dependency policy
        run: pnpm --dir web/antd audit:release

      - name: Verify documentation release dependency policy
        run: pnpm --dir docs audit:release

      - name: Build same-origin release frontend
        run: pnpm --dir web/antd build:release

      - name: Smoke-test release frontend delivery
        run: pnpm --dir web/antd delivery:smoke

      - name: Test release safety helpers
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Run strict environment checks
        run: |
          mkdir -p .mss/reports
          go run ./cmd/mss doctor --strict --format json > .mss/reports/release-doctor.json

      - name: Run full repository verification
        run: go run ./cmd/mss verify --all --format json

      - name: Run all agent evaluations
        if: ${{ always() }}
        run: |
          mkdir -p .mss/reports
          go run ./cmd/mss eval run --all --format json > .mss/reports/release-eval.json

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness-${{ github.sha }}
          path: .mss/reports
          if-no-files-found: error
          retention-days: 30
