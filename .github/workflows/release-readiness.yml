name: Release Readiness

on:
  push:
    branches:
      - main
    paths:
      - '.agents/**'
      - '.mss/**'
      - 'admin/**'
      - 'cmd/mss/**'
      - 'cmd/mss-mcp/**'
      - 'docs/**'
      - 'internal/mss/**'
      - 'mss-boot/**'
      - 'modules/**'
      - 'templates/**'
      - 'scripts/**'
      - '.codex/**'
      - 'tools/release/**'
      - 'tools/security/**'
      - 'web/antd/**'
      - '.dockerignore'
      - '.gitattributes'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'Dockerfile'
      - 'Makefile'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/*release*.yml'
      - '.github/workflows/container.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/foundation-compatibility.yml'
      - '.github/workflows/theme-settings-integration.yml'
      - '.github/workflows/v0.7-upgrade-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.agents/**'
      - '.mss/**'
      - 'admin/**'
      - 'cmd/mss/**'
      - 'cmd/mss-mcp/**'
      - 'docs/**'
      - 'internal/mss/**'
      - 'mss-boot/**'
      - 'modules/**'
      - 'templates/**'
      - 'scripts/**'
      - '.codex/**'
      - 'tools/release/**'
      - 'tools/security/**'
      - 'web/antd/**'
      - '.dockerignore'
      - '.gitattributes'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'Dockerfile'
      - 'Makefile'
      - 'README.md'
      - 'README.zh-CN.md'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/*release*.yml'
      - '.github/workflows/container.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/foundation-compatibility.yml'
      - '.github/workflows/theme-settings-integration.yml'
      - '.github/workflows/v0.7-upgrade-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  full-verification:
    name: doctor-verify-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            web/antd/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web/antd install --frozen-lockfile

      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Test release dependency policy helper
        run: node --test tools/security/check-pnpm-audit.test.mjs

      - name: Verify frontend release dependency policy
        run: pnpm --dir web/antd audit:release

      - name: Verify documentation release dependency policy
        run: pnpm --dir docs audit:release

      - name: Build same-origin release frontend
        run: pnpm --dir web/antd build:release

      - name: Smoke-test release frontend delivery
        run: pnpm --dir web/antd delivery:smoke

      - name: Test release safety helpers
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Run strict environment checks
        run: |
          mkdir -p .mss/reports
          go run ./cmd/mss doctor --strict --format json > .mss/reports/release-doctor.json

      - name: Run full repository verification
        run: go run ./cmd/mss verify --all --format json

      - name: Run all agent evaluations
        if: ${{ always() }}
        run: |
          mkdir -p .mss/reports
          go run ./cmd/mss eval run --all --format json > .mss/reports/release-eval.json

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness-${{ github.sha }}
          path: .mss/reports
          if-no-files-found: error
          retention-days: 30
