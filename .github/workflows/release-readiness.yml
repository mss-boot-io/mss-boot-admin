name: Release Readiness (Bootstrap)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Feature-frozen public release target
        required: true
        type: string
      frozen_commit:
        description: Full commit SHA selected for concentrated validation
        required: true
        type: string
      feature_freeze_confirmed:
        description: Confirm feature and public contract changes are frozen
        required: true
        default: false
        type: boolean
      phase:
        description: Exact readiness phase represented by this run
        required: true
        default: checkpoint
        type: choice
        options:
          - checkpoint
          - feature-freeze
          - pre-framework
          - pre-root
      publication_authority:
        description: Confirm this exact pre-framework or pre-root run may authorize publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ inputs.version }}-${{ inputs.frozen_commit }}-${{ inputs.phase }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  full-verification:
    name: doctor-verify-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bind readiness to the reviewed target and frozen commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
          FEATURE_FREEZE_CONFIRMED: ${{ inputs.feature_freeze_confirmed }}
          READINESS_PHASE: ${{ inputs.phase }}
          PUBLICATION_AUTHORITY: ${{ inputs.publication_authority }}
        run: |
          set -euo pipefail
          if [[ "${FEATURE_FREEZE_CONFIRMED}" != "true" ]]; then
            echo "release readiness is disabled until feature freeze is confirmed" >&2
            exit 1
          fi
          if [[ ! "${FROZEN_COMMIT}" =~ ^[0-9a-f]{40}$ || "${FROZEN_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "frozen_commit must equal the checked-out full commit ${GITHUB_SHA}" >&2
            exit 1
          fi
          python3 tools/release/check_release_policy.py \
            --component root \
            --version "${RELEASE_VERSION}" \
            --tag "${RELEASE_VERSION}" \
            --intent qualify
          workflow_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 tools/release/release_readiness_attestation.py create \
            --output "${RUNNER_TEMP}/release-readiness-metadata.json" \
            --policy .mss/release-policy.yaml \
            --target-version "${RELEASE_VERSION}" \
            --commit "${FROZEN_COMMIT}" \
            --phase "${READINESS_PHASE}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-url "${workflow_run_url}" \
            --publication-authority "${PUBLICATION_AUTHORITY}"

          publication_authority="$(jq -r '.publicationAuthority' "${RUNNER_TEMP}/release-readiness-metadata.json")"
          echo "Readiness phase: ${READINESS_PHASE}. Publication authority: ${publication_authority}." >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${publication_authority}" != "true" ]]; then
            echo "This qualification run cannot authorize publication." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            admin/go.sum
            mss-boot/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            web/antd/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web/antd install --frozen-lockfile

      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Test release dependency policy helper
        run: node --test tools/security/check-pnpm-audit.test.mjs

      - name: Verify frontend release dependency policy
        run: pnpm --dir web/antd audit:release

      - name: Verify documentation release dependency policy
        run: pnpm --dir docs audit:release

      - name: Build same-origin release frontend
        run: pnpm --dir web/antd build:release

      - name: Smoke-test release frontend delivery
        run: pnpm --dir web/antd delivery:smoke

      - name: Test release safety helpers
        run: python3 -m unittest discover -s tools/release -p 'test_*.py'

      - name: Run strict environment checks
        run: |
          mkdir -p .mss/reports
          go run ./cmd/mss doctor --strict --format json > .mss/reports/release-doctor.json

      - name: Run full repository verification
        run: go run ./cmd/mss verify --all --format json

      - name: Run all agent evaluations
        if: ${{ always() }}
        run: |
          mkdir -p .mss/reports
          go run ./cmd/mss eval run --all --format json > .mss/reports/release-eval.json

      - name: Finalize exact readiness attestation
        if: ${{ success() }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FROZEN_COMMIT: ${{ inputs.frozen_commit }}
          READINESS_PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          workflow_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 tools/release/release_readiness_attestation.py verify \
            --attestation "${RUNNER_TEMP}/release-readiness-metadata.json" \
            --policy .mss/release-policy.yaml \
            --target-version "${RELEASE_VERSION}" \
            --commit "${FROZEN_COMMIT}" \
            --phase "${READINESS_PHASE}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-url "${workflow_run_url}" \
            --intent qualify
          mkdir -p .mss/reports
          install -m 0644 \
            "${RUNNER_TEMP}/release-readiness-metadata.json" \
            .mss/reports/release-readiness-metadata.json

      - name: Upload exact readiness attestation
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness-attestation-${{ github.run_id }}
          path: .mss/reports/release-readiness-metadata.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness-${{ github.sha }}
          path: .mss/reports
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
