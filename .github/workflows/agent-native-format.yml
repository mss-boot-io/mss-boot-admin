name: One-time Agent Native Formatting

on:
  push:
    branches:
      - codex/agent-native-foundation
    paths:
      - '.github/workflows/agent-native-format.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-native-format-codex-agent-native-foundation
  cancel-in-progress: false

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v7
        with:
          ref: codex/agent-native-foundation
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Format and commit before validation
        run: |
          set -euo pipefail
          gofmt -w \
            cmd/mss \
            cmd/mss-mcp \
            internal/mss \
            modules/runtime \
            modules/all \
            main.go \
            cmd/migrate/migrate.go

          rm -f .github/workflows/agent-native-format.yml
          git add -A
          git diff --cached --check
          git commit -m "style: format agent-native Go sources"
          git push origin HEAD:codex/agent-native-foundation

      - name: Test Agent infrastructure after commit
        run: go test ./internal/mss/... ./cmd/mss/... ./cmd/mss-mcp/... ./modules/runtime/...

      - name: Load project context
        run: go run ./cmd/mss context --format json > /tmp/mss-context.json

      - name: Validate Agent Skills
        run: go run ./cmd/mss skills validate --format json > /tmp/mss-skills.json

      - name: Validate example module specification
        run: go run ./cmd/mss spec validate .mss/modules/example-supplier.yaml --format json > /tmp/mss-spec.json

      - name: Dry-run deterministic module generation
        run: go run ./cmd/mss module generate .mss/modules/example-supplier.yaml --format json > /tmp/mss-generation.json

      - name: Run deterministic Agent evaluations
        run: |
          go run ./cmd/mss eval run \
            mcp-project-tools \
            supplier-module-contract \
            full-verification-plan \
            --format json > /tmp/mss-evals.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-native-format-validation
          path: |
            /tmp/mss-context.json
            /tmp/mss-skills.json
            /tmp/mss-spec.json
            /tmp/mss-generation.json
            /tmp/mss-evals.json
            .mss/reports/evals/latest.json
            .mss/reports/evals/latest.md
          if-no-files-found: warn
          retention-days: 7
